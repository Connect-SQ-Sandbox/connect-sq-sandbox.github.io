<title>desk-web-v2</title>
<style>

  box-sizing: border-box;
}

    Pretendard,

/* styles/connectShell.css */
/* =============================================================
   굿닥 커넥트 웹뷰 — 공통 셸 (디자인 토큰 + 윈도우 셸/사이드내비)
   여러 커넥트 화면(진료항목 등록, 예약 신청 내역 등)이 공유한다.
   - /Users/goodoc/test 프로토타입의 colors_and_type.css(:root)와
     connect.css의 셸 부분을 이식.
   - 전역 누수 방지를 위해 원본 body 레벨 스타일은 .cn-artboard 래퍼로
     한정했고 리셋도 .cn-artboard 하위로 스코프.
   - 클래스 접두사(cn-)가 고유해 다른 페이지와 충돌하지 않음.
   ============================================================= */

/* ---- Design tokens (colors_and_type.css :root, @font-face 제외) ---- */
:root {
  --gray-10:  #F9FAFB;
  --gray-15:  #F4F6F8;
  --gray-20:  #F2F4F6;
  --gray-30:  #E5E8EB;
  --gray-40:  #D1D6DB;
  --gray-50:  #B0B8C1;
  --gray-60:  #8B95A1;
  --gray-70:  #6B7684;
  --gray-80:  #4E5968;
  --gray-90:  #31353F;
  --gray-100: #191F28;

  --blue-30:  #B3D5FF;
  --blue-60:  #0073FA;
  --blue-70:  #0061DB;
  --blue-80:  #0050B5;

  --red-60:   #FA4655;
  --red-70:   #EC3847;
  --red-80:   #D52130;

  --green-70: #41D293;
  --green-80: #1FA972;
  --orange-60:#F79009;

  --white: #FFFFFF;
  --black: #000000;
  --transparent: transparent;

  --alpha-gray-05: rgba(128, 135, 153, 0.05);
  --alpha-gray-10: rgba(128, 135, 153, 0.10);
  --alpha-gray-15: rgba(128, 135, 153, 0.15);
  --alpha-gray-20: rgba(128, 135, 153, 0.20);
  --alpha-gray-40: rgba(128, 135, 153, 0.40);
  --alpha-gray-60: rgba(128, 135, 153, 0.60);

  --alpha-blue-05: rgba(0, 115, 250, 0.05);
  --alpha-blue-10: rgba(0, 115, 250, 0.10);
  --alpha-blue-15: rgba(0, 115, 250, 0.15);
  --alpha-blue-20: rgba(0, 115, 250, 0.20);

  --alpha-red-05: rgba(250, 70, 85, 0.05);
  --alpha-red-10: rgba(250, 70, 85, 0.10);
  --alpha-red-15: rgba(250, 70, 85, 0.15);
  --alpha-red-20: rgba(250, 70, 85, 0.20);

  --shadow-toast: 0 2px 1px rgba(22, 24, 29, 0.02), 0 2px 8px rgba(22, 24, 29, 0.10);
  --shadow-toggle-knob: 0 0 6px rgba(0, 0, 0, 0.25);

  --font-sans: 'Pretendard', 'Pretendard Variable', -apple-system,
    BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}

/* ---- Artboard backdrop (원본 connect.css의 body 스타일을 래퍼로 한정) ---- */
.cn-artboard {
  font-family: var(--font-sans);
  background: #e7e9ee;
  color: var(--gray-100);
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 24px;
}
.cn-artboard *,
.cn-artboard *::before,
.cn-artboard *::after { box-sizing: border-box; }

/* ---- App window (1280 x 832 rounded webview frame) ---- */
.cn-screen {
  width: 1280px;
  min-height: 832px;
  background: var(--white);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 12px 40px rgba(22, 24, 29, 0.12);
  position: relative;
}

/* ---- Title bar (windows-style) ---- */
.cn-titlebar {
  height: 32px;
  background: #f3f3f3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: none;
}
.cn-ci { display: flex; align-items: center; gap: 4px; padding: 0 8px; height: 100%; }
.cn-ci-mark { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
.cn-ci-mark svg { display: block; }
.cn-ci-name { font: 500 13px/16px var(--font-sans); color: rgba(0, 0, 0, 0.9); padding: 0 8px 2px 4px; }
.cn-winctrls { display: flex; height: 100%; }
.cn-winbtn {
  width: 46px; height: 32px;
  border: 0; background: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  color: rgba(0, 0, 0, 0.9); cursor: pointer;
}
.cn-winbtn:hover { background: rgba(0, 0, 0, 0.05); }
.cn-winbtn.close:hover { background: #e81123; color: #fff; }

/* ---- Body: nav + main ---- */
.cn-body { display: flex; align-items: stretch; flex: 1; min-height: 800px; }

/* ---- Side nav (250px) ---- */
.cn-nav { width: 250px; flex: none; background: #f2f4f7; position: relative; display: flex; flex-direction: column; }
.cn-nav-scroll { flex: 1; overflow: auto; }
.cn-nav-group { padding: 8px 0; display: flex; flex-direction: column; }
.cn-nav-header { height: 40px; display: flex; align-items: center; padding: 0 16px; font: 600 14px/20px var(--font-sans); color: rgba(0, 0, 0, 0.9); }
.cn-nav-item {
  height: 40px; width: 100%;
  border: 0; background: transparent;
  display: flex; align-items: center;
  padding: 0 16px; position: relative; cursor: pointer; text-align: left;
}
.cn-nav-item > .cn-nav-label { font: 400 14px/22px var(--font-sans); color: var(--gray-90); flex: 1; }
.cn-nav-item .cn-chevron { width: 12px; height: 12px; color: #808799; flex: none; display: inline-flex; align-items: center; justify-content: center; }
.cn-nav-item.sub { padding-left: 32px; }
.cn-nav-item.sub::before { content: ""; position: absolute; inset: 2px 4px; border-radius: 4px; pointer-events: none; }
.cn-nav-item.active::before { background: var(--alpha-gray-10); }
.cn-nav-item.active .cn-nav-label { color: var(--gray-90); }
.cn-nav-item:not(.active):not(.cn-nav-header):hover::before {
  content: ""; position: absolute; inset: 2px 4px;
  background: rgba(128, 135, 153, 0.06); border-radius: 4px; pointer-events: none;
}
.cn-nav-label-wrap { display: inline-flex; align-items: center; gap: 6px; flex: 1; }
.cn-beta {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 5px; border-radius: 4px;
  background: var(--alpha-blue-10);
  font: 600 12px/18px var(--font-sans);
  color: var(--blue-80, #115fd4);
}
.cn-nav-divider { padding: 4px 0; }
.cn-nav-divider span { display: block; height: 1px; background: var(--gray-30); }
.cn-nav-footer { background: #f2f4f7; padding-bottom: 8px; display: flex; flex-direction: column; }

/* ---- Main frame ---- */
.cn-main { flex: 1; min-width: 0; background: var(--white); display: flex; flex-direction: column; }
.cn-header { padding: 48px 64px 32px; }
.cn-header-title { font: 700 28px/36px var(--font-sans); color: #16181d; }
.cn-header-desc { font: 400 14px/22px var(--font-sans); color: #808799; margin-top: 6px; }


/* styles/prototypeChanges.css */
/* 프로토타입 메타 UI: 실제 Connect 기능이 아니라 정책 변경 추적용 패널 */
.pc-trigger {
  position: fixed; top: 72px; right: 0; z-index: 105;
  height: 40px; padding: 0 12px 0 10px; border: 1px solid var(--gray-30); border-right: 0;
  border-radius: 8px 0 0 8px; background: var(--gray-100); color: var(--white);
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  font: 600 12px/18px var(--font-sans); box-shadow: 0 4px 16px rgba(22,24,29,.14);
}
.pc-trigger:hover { background: var(--gray-90); }
.pc-trigger-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-70); }
.pc-trigger-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: rgba(255,255,255,.16); font: 700 11px/18px var(--font-sans); }

/* 딤 제거: 우측 패널을 비모달로 (열어둔 채 본문 확인·조작 가능) */
.pc-scrim { display: none; }
.pc-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 120; width: 392px;
  background: var(--white); box-shadow: -12px 0 32px rgba(22,24,29,.14);
  display: flex; flex-direction: column; transform: translateX(102%); visibility: hidden;
  transition: transform .2s ease, visibility .2s;
}
.pc-drawer.open { transform: translateX(0); visibility: visible; }
.pc-drawer-head { min-height: 52px; padding: 0 18px; border-bottom: 1px solid var(--gray-20); display: flex; align-items: center; justify-content: space-between; flex: none; }
.pc-eyebrow { font: 700 11px/16px var(--font-sans); letter-spacing: .08em; color: var(--blue-70); }
.pc-close { width: 32px; height: 32px; border-radius: 6px; color: var(--gray-70); font: 400 24px/30px var(--font-sans); cursor: pointer; }
.pc-close:hover, .pc-back:hover { background: var(--gray-10); }
.pc-back { height: 32px; padding: 0 8px; border-radius: 6px; color: var(--gray-80); font: 600 13px/32px var(--font-sans); cursor: pointer; }

.pc-drawer-title-wrap { padding: 22px 20px 16px; flex: none; }
.pc-drawer-title-wrap h2 { margin: 0; font: 700 22px/30px var(--font-sans); color: var(--gray-100); }
.pc-drawer-title-wrap p { margin: 7px 0 0; font: 400 13px/20px var(--font-sans); color: var(--gray-70); }
.pc-planned-filter { margin-top: 16px; padding: 12px 13px; border: 1px solid var(--gray-30); border-radius: 9px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pc-planned-filter > div { min-width: 0; display: flex; flex-direction: column; }
.pc-planned-filter strong { color: var(--gray-90); font: 600 13px/19px var(--font-sans); }
.pc-planned-filter span { color: var(--gray-60); font: 400 11px/17px var(--font-sans); }
.pc-switch { width: 40px; height: 24px; padding: 2px; border-radius: 999px; background: var(--gray-40); cursor: pointer; transition: background .15s; flex: none; }
.pc-switch > span { display: block; width: 20px; height: 20px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 4px rgba(22,24,29,.18); transition: transform .15s; }
.pc-switch.on { background: #f79009; }
.pc-switch.on > span { transform: translateX(16px); }
.pc-planned-notice { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: rgba(247,144,9,.09); color: #9a5800; font: 500 11px/17px var(--font-sans); }
.pc-dev-filter { margin-top: 10px; border-color: rgba(234, 179, 8, .48); background: #fffdf2; }
.pc-dev-notice { margin-top: 8px; padding: 8px 10px; border: 1px solid rgba(234, 179, 8, .35); border-radius: 6px; background: #fff8cf; color: #745300; font: 600 11px/17px var(--font-sans); }
.pc-dev-marker-layer { position: fixed; inset: 0; z-index: 110; pointer-events: none; }
.pc-dev-marker-layer, .pc-dev-marker-layer *, .pc-dev-marker-layer *::before, .pc-dev-marker-layer *::after { box-sizing: border-box; }
.pc-dev-marker-shell { position: fixed; width: 30px; height: 30px; pointer-events: auto; }
.pc-dev-marker {
  position: relative; z-index: 2; width: 30px; height: 30px; border: 2px solid var(--white); border-radius: 50%;
  background: #e0a600; color: var(--white); cursor: help; box-shadow: 0 3px 10px rgba(116,83,0,.30), 0 0 0 2px rgba(224,166,0,.18);
  font: 800 12px/26px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center;
  transition: transform .14s ease, background .14s ease, box-shadow .14s ease;
}
.pc-dev-marker:hover, .pc-dev-marker:focus-visible { background: #c98e00; box-shadow: 0 5px 16px rgba(116,83,0,.38), 0 0 0 3px rgba(224,166,0,.22); outline: none; transform: scale(1.08); }
.pc-dev-marker-tooltip {
  position: absolute; z-index: 1; width: min(350px, calc(100vw - 24px)); max-height: min(420px, calc(100vh - 48px));
  padding: 13px 14px 14px; overflow: auto; border: 1px solid #e4b82f; border-radius: 12px; background: #fffdf1;
  color: #5f4700; box-shadow: 0 12px 32px rgba(72,54,0,.20); visibility: hidden; opacity: 0; pointer-events: none;
  transition: opacity .12s ease, transform .12s ease, visibility .12s;
}
.pc-dev-marker-shell.place-left .pc-dev-marker-tooltip { right: 0; }
.pc-dev-marker-shell.place-right .pc-dev-marker-tooltip { left: 0; }
.pc-dev-marker-shell.place-below .pc-dev-marker-tooltip { top: calc(100% + 9px); transform: translateY(-4px); }
.pc-dev-marker-shell.place-above .pc-dev-marker-tooltip { bottom: calc(100% + 9px); transform: translateY(4px); }
.pc-dev-marker-shell:hover .pc-dev-marker-tooltip,
.pc-dev-marker-shell:focus-within .pc-dev-marker-tooltip { visibility: visible; opacity: 1; pointer-events: auto; transform: translateY(0); }
.pc-dev-marker-tooltip-head { display: grid; grid-template-columns: 26px 1fr; gap: 9px; align-items: start; }
.pc-dev-marker-tooltip-head > span { width: 26px; height: 26px; border-radius: 50%; background: #e0a600; color: var(--white); font: 800 11px/26px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; }
.pc-dev-marker-tooltip-head > div { min-width: 0; display: flex; flex-direction: column; }
.pc-dev-marker-tooltip-head small { color: #9a6b00; font: 700 9px/14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
.pc-dev-marker-tooltip-head strong { margin-top: 1px; color: #4d3900; font: 700 13px/19px var(--font-sans); word-break: keep-all; }
.pc-dev-marker-tooltip ul { margin: 10px 0 0; padding: 9px 0 0 17px; border-top: 1px solid rgba(224,166,0,.24); }
.pc-dev-marker-tooltip li { margin-top: 5px; color: #5f4700; font: 500 11px/18px var(--font-sans); word-break: keep-all; }
.pc-dev-marker-tooltip li:first-child { margin-top: 0; }
.pc-dev-marker-tooltip code { padding: 1px 4px; border-radius: 4px; background: rgba(116,83,0,.10); color: #604700; font: 600 10px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-current-view { display: inline-flex; margin-top: 12px; padding: 5px 9px; border-radius: 6px; background: var(--alpha-blue-10); color: var(--blue-70); font: 600 12px/18px var(--font-sans); }
.pc-scope { margin: 0 20px; padding: 3px; border-radius: 8px; background: var(--gray-20); display: grid; grid-template-columns: 1fr 1fr; flex: none; }
.pc-scope button { height: 34px; border-radius: 6px; color: var(--gray-70); cursor: pointer; font: 600 13px/34px var(--font-sans); }
.pc-scope button span { margin-left: 3px; color: var(--gray-50); }
.pc-scope button.active { background: var(--white); color: var(--gray-100); box-shadow: 0 1px 4px rgba(22,24,29,.08); }

.pc-change-list {
  flex: 1 1 auto; min-height: 0; padding: 16px 20px 28px;
  overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable;
  display: flex; flex-direction: column; gap: 12px;
}
.pc-empty { padding: 40px 12px; text-align: center; color: var(--gray-60); font: 400 13px/20px var(--font-sans); }
.pc-change-card { flex: 0 0 auto; border: 1px solid var(--gray-30); border-radius: 10px; overflow: hidden; background: var(--white); transition: border-color .12s, box-shadow .12s; }
.pc-change-card:hover { border-color: var(--gray-50); box-shadow: 0 4px 16px rgba(22,24,29,.06); }
.pc-change-card.planned { border-color: rgba(247,144,9,.36); background: linear-gradient(180deg, rgba(247,144,9,.035), var(--white) 40%); }
.pc-change-main { width: 100%; padding: 15px 15px 13px; text-align: left; cursor: pointer; }
.pc-change-meta { display: flex; align-items: center; gap: 6px; }
.pc-change-meta time { margin-left: auto; color: var(--gray-60); font: 500 11px/16px var(--font-sans); }
.pc-prd-id { display: inline-flex; padding: 3px 7px; border-radius: 5px; background: var(--alpha-blue-10); color: var(--blue-70); font: 700 11px/16px var(--font-sans); }
.pc-publish, .pc-source-status { display: inline-flex; padding: 3px 7px; border-radius: 5px; font: 600 11px/16px var(--font-sans); }
.pc-publish.baseline, .pc-source-status.review { background: rgba(247,144,9,.10); color: #b25f00; }
.pc-publish.approved, .pc-source-status.approved, .pc-source-status.final { background: rgba(31,169,114,.10); color: var(--green-80); }
.pc-publish.planned, .pc-source-status.draft { background: rgba(247,144,9,.12); color: #9a5800; }
.pc-change-main h3 { margin: 11px 0 12px; font: 700 15px/22px var(--font-sans); color: var(--gray-100); }
.pc-diff { display: grid; grid-template-columns: 35px 1fr; gap: 8px; align-items: start; margin-top: 7px; }
.pc-diff > span { height: 20px; border-radius: 4px; text-align: center; font: 600 11px/20px var(--font-sans); }
.pc-diff p { margin: 0; color: var(--gray-70); font: 400 12px/19px var(--font-sans); }
.pc-diff.before > span { background: var(--gray-20); color: var(--gray-60); }
.pc-diff.after > span { background: var(--alpha-blue-10); color: var(--blue-70); }
.pc-developer-details { margin-top: 12px; padding: 11px 12px; border: 1px solid #e9bd32; border-radius: 7px; background: #fff8cf; color: #5f4700; }
.pc-developer-details-head { display: flex; align-items: center; gap: 7px; }
.pc-developer-details-head > span { padding: 2px 5px; border-radius: 4px; background: #e0a600; color: #fff; font: 800 9px/14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
.pc-developer-details-head strong { font: 700 12px/18px var(--font-sans); }
.pc-developer-details ul { margin: 7px 0 0; padding-left: 17px; }
.pc-developer-details li { margin-top: 4px; font: 500 11px/18px var(--font-sans); word-break: keep-all; }
.pc-developer-details code { padding: 1px 4px; border-radius: 4px; background: rgba(116,83,0,.10); color: #604700; font: 600 10px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-locate-hint { margin-top: 12px; color: var(--blue-70); font: 600 12px/18px var(--font-sans); }
.pc-change-foot { min-height: 40px; padding: 0 12px 0 15px; border-top: 1px solid var(--gray-20); background: var(--gray-10); display: flex; align-items: center; justify-content: space-between; }
.pc-change-foot > span { color: var(--gray-60); font: 500 11px/16px var(--font-sans); }
.pc-change-foot button { height: 28px; padding: 0 8px; border-radius: 5px; color: var(--blue-70); font: 600 12px/28px var(--font-sans); cursor: pointer; }
.pc-change-foot button:hover { background: var(--alpha-blue-10); }
.pc-change-foot button:disabled { color: var(--gray-40); cursor: not-allowed; }

.pc-document-overlay { position: fixed; inset: 0; z-index: 220; padding: 40px; background: rgba(22,24,29,.54); display: flex; align-items: center; justify-content: center; }
.pc-document-modal { width: min(920px, calc(100vw - 48px)); height: min(820px, calc(100vh - 48px)); border-radius: 14px; background: var(--white); box-shadow: 0 24px 80px rgba(22,24,29,.30); overflow: hidden; display: flex; flex-direction: column; }
.pc-document-head { min-height: 104px; padding: 20px 24px; border-bottom: 1px solid var(--gray-20); display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex: none; }
.pc-document-head h2 { margin: 8px 0 0; color: var(--gray-100); font: 700 21px/29px var(--font-sans); }
.pc-document-head p { margin: 3px 0 0; color: var(--gray-60); font: 500 12px/18px var(--font-sans); }
.pc-document-close { flex: none; width: 36px; height: 36px; border-radius: 8px; color: var(--gray-70); font: 400 26px/34px var(--font-sans); cursor: pointer; }
.pc-document-close:hover { background: var(--gray-10); color: var(--gray-100); }
.pc-document-body { padding: 24px 32px 40px; overflow: auto; }
.pc-document-body .pc-summary-source { margin-top: 0; }
.pc-document-body .pc-markdown { max-width: 760px; margin: 24px auto 0; }
.pc-document-body .pc-markdown h1 { font-size: 25px; line-height: 34px; }
.pc-document-body .pc-markdown h2 { margin-top: 28px; font-size: 18px; line-height: 27px; }
.pc-document-body .pc-markdown p, .pc-document-body .pc-md-li { font-size: 14px; line-height: 23px; }

.pc-summary-view { padding: 20px 20px 32px; overflow: auto; }
.pc-summary-meta { display: flex; align-items: center; gap: 7px; }
.pc-summary-release { margin-top: 10px; color: #9a5800; font: 600 12px/18px var(--font-sans); }
.pc-summary-source { margin-top: 10px; padding: 10px 12px; border-radius: 7px; background: var(--gray-10); color: var(--gray-60); font: 500 11px/17px var(--font-sans); word-break: break-all; }
.pc-markdown { margin-top: 18px; }
.pc-markdown h1 { margin: 0 0 16px; color: var(--gray-100); font: 700 21px/29px var(--font-sans); }
.pc-markdown h2 { margin: 22px 0 9px; color: var(--gray-100); font: 700 16px/24px var(--font-sans); }
.pc-markdown h3 { margin: 18px 0 8px; color: var(--gray-90); font: 700 14px/22px var(--font-sans); }
.pc-markdown p { margin: 0; color: var(--gray-70); font: 400 13px/21px var(--font-sans); }
.pc-markdown blockquote { margin: 0 0 16px; padding: 12px 14px; border-left: 3px solid var(--blue-60); background: var(--alpha-blue-05); color: var(--gray-80); font: 500 12px/20px var(--font-sans); }
.pc-markdown code { padding: 2px 5px; border-radius: 4px; background: var(--gray-20); color: var(--gray-80); font: 500 11px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-md-li { display: grid; grid-template-columns: 10px 1fr; gap: 5px; align-items: start; margin-top: 5px; }
.pc-md-li > span { color: var(--blue-60); font: 700 13px/21px var(--font-sans); }
.pc-md-gap { height: 6px; }

.pc-policy-highlight { animation: pc-policy-pulse 2.4s ease; outline: 3px solid var(--blue-60); outline-offset: 4px; border-radius: 8px; }
.pc-planned-row-badge { display: inline-flex; margin-left: 6px; padding: 1px 5px; border-radius: 4px; background: rgba(247,144,9,.12); color: #9a5800; vertical-align: 1px; font: 700 10px/15px var(--font-sans); }
@keyframes pc-policy-pulse {
  0%, 100% { outline-color: transparent; box-shadow: none; }
  15%, 70% { outline-color: var(--blue-60); box-shadow: 0 0 0 8px var(--alpha-blue-10); }
}

@media (max-width: 1100px) {
  .pc-drawer { width: min(392px, calc(100% - 24px)); }
  .pc-scrim { left: 0; }
  .pc-document-overlay { padding: 20px; }
  .pc-document-modal { width: calc(100vw - 40px); height: calc(100vh - 40px); }
  .pc-document-body { padding: 20px 22px 32px; }
}

/* styles/deskWebV2.css */
/* =============================================================
   desk-web-v2 — desk-web v0.20의 deskWeb.css를 복사(접두사 dw- 유지) + v2 전용(접두사 dw2-, 파일 끝)
   desk-web — 데스크 기능 웹 이관 시안 전용 스타일 (접두사 dw-)
   기반: connectShell.css + connectUnified.css(cu-*)를 그대로 재사용하고,
   이 화면에만 필요한 조각(창 무대·트레이·배지·보류 라벨·체험 패널 등)만 추가한다.
   ============================================================= */

/* ---- 창 무대: Windows 바탕화면 모사 없이 창 + 슬림 작업표시줄만 ---- */
.dw-stage{position:relative;flex:1;min-height:0;background:#dfe3ea;overflow:hidden}
.dw-window.cu-client.cn-screen{position:absolute;inset:14px 16px 52px 16px;width:auto;min-height:0;display:flex;flex-direction:column;border:1px solid #c9d3e0;border-radius:8px;box-shadow:0 12px 36px #00245b33,0 2px 6px #00245b22;background:#fff;overflow:hidden;z-index:2}
.dw-stage.max .dw-window.cu-client.cn-screen{inset:0 0 38px 0;border-radius:0;border:0;box-shadow:none}
.dw-mode-tag{font-size:14px;font-weight:700;white-space:nowrap}.dw-mode-tag.linked{color:#1d6fe0}.dw-mode-tag.unlinked{color:#5b6576}
.dw-window .cu-titlebar.cn-titlebar{height:38px;flex-shrink:0;align-items:center;background:linear-gradient(100deg,#eff3f9,#f6f8fb);border-bottom:1px solid #dce3ed}
.dw-window .cu-window-actions{height:38px}
.dw-window .cu-window-actions .cu-icon{height:38px;width:44px;color:#374452;position:relative}
.dw-window .cu-window-actions .cu-icon.close:hover{color:#fff}
.dw-window .cu-body{height:auto;flex:1;min-height:0;overflow:hidden}
.dw-window .cu-main{overscroll-behavior:contain}
.dw-closed{position:absolute;inset:0 0 38px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--g70);font-size:13px;text-align:center;padding:16px}
.dw-closed strong{font-size:16px;color:var(--g100)}

/* ---- 슬림 작업표시줄 + 트레이 ---- */
.dw-taskbar{position:absolute;left:0;right:0;bottom:0;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:#e9f0fa;border-top:1px solid #cfd8e5;font-size:11px;color:#4f6072;z-index:3}
.dw-tray-area{position:relative;display:flex;align-items:center;gap:12px;height:100%}
.dw-tray-btn{position:relative;width:34px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:5px;border:0;background:transparent}
.dw-tray-btn:hover,.dw-tray-btn.selected{background:#ffffffc0}
.cu-connect-icon.dw-ci{width:24px;height:24px;border-radius:5px;box-shadow:none}
.cu-connect-icon.dw-ci img{width:20px}
.dw-closed .cu-connect-icon.dw-ci{width:44px;height:44px;border-radius:9px}
.dw-closed .cu-connect-icon.dw-ci img{width:36px}
.dw-clock{font-size:11px;line-height:15px;text-align:right;white-space:nowrap}
.cu-tray-menu.dw-tray-menu{bottom:42px;right:0;min-width:220px;z-index:40;max-height:calc(100dvh - 56px);max-width:calc(100vw - 16px);overflow:auto;box-sizing:border-box} /* v3.11.32 항목이 늘어 작은 화면에서 넘치지 않게 */
@media(max-width:760px){.cu-tray-menu.dw-tray-menu{left:0;right:auto}} /* 좁은 폭에선 작업표시줄 라벨이 숨어 트레이가 왼쪽에 오므로 메뉴를 왼쪽 기준으로 */
.dw-tray-menu .dw-tray-n{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#FA4655;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;box-sizing:border-box}
.dw-tray-menu .cu-tray-menu-title{display:flex;align-items:center;gap:9px;padding:8px 10px 10px;border-bottom:1px solid var(--g30);margin-bottom:4px}
.dw-tray-menu .cu-tray-menu-title strong{font-size:12px}

/* ---- 보류 라벨·띠 ---- */
.dw-hold{display:inline-flex;align-items:center;margin-left:6px;padding:1px 6px;border-radius:4px;background:#fff4d8;color:#865f17;font-size:11px;font-weight:600;line-height:16px;white-space:nowrap;vertical-align:middle;letter-spacing:0}
.cu-header h1 .dw-hold{font-size:13px;line-height:20px;vertical-align:4px}
.cu-nav-row .dw-hold{font-size:10px;padding:0 4px;margin-left:4px}
.dw-legend{font-size:11px;color:var(--g70);display:flex;align-items:center;gap:2px}
.dw-head-actions{display:flex;align-items:center;gap:6px}

/* ---- 공통 보조 ---- */
.dw-banner{display:flex;align-items:center}
.dw-banner .cu-btn{margin-left:auto;color:#915215;font-size:12px;min-height:28px;padding:4px 8px}
/* v3.11.1 연결 끊김 배너 [새로고침][다시 연결 (모의)] 두 버튼 */
.dw-banner .cu-btn+.cu-btn{margin-left:4px}
.dw-banner .cu-btn svg{width:14px;height:14px;margin-right:4px}
.dw-note{margin:0 0 20px!important}
.dw-muted{color:var(--g60);font-weight:400;font-size:12px}
.dw-fail-hint{display:flex;align-items:center;gap:6px;margin-top:16px!important;font-size:12px;color:#865f17;background:#fff8e6;padding:8px 10px;border-radius:6px}
.dw-fail-hint svg{font-size:14px}
.cu-error{display:flex;align-items:flex-start;gap:6px;margin-top:16px!important}
.cu-error svg{font-size:16px;margin-top:2px}
.dw-warn-note{color:#915215;background:#fff3e3}
.cu-tag.teal{color:#0b7a83;background:#e1f5f6}

/* ---- 스켈레톤 ---- */
.dw-skeleton{border-top:1px solid var(--g30)}
.dw-skeleton>div{display:grid;grid-template-columns:80px 1.2fr 1fr 1.4fr 1fr;gap:20px;padding:20px 12px;border-bottom:1px solid var(--g30)}
.dw-skeleton i{display:block;height:14px;border-radius:4px;background:linear-gradient(90deg,var(--g20),#eef0f4,var(--g20));background-size:200% 100%;animation:dw-shimmer 1s linear infinite}
@keyframes dw-shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.dw-skeleton i{animation:none}}

/* ---- 진료 현황 테이블 ---- */
.dw-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;border-radius:16px;background:#e8f2ff;color:#0061db;font-size:12px;font-weight:500}
.dw-chip button{display:inline-flex;border-radius:50%;padding:2px;color:#0061db}
.dw-chip button:hover{background:#d3e6ff}
.dw-chip svg{font-size:12px}

/* ---- 상세 모달 ---- */
.cu-btn.dw-danger-line{color:#e14352;border-color:#f3c2c7}
.cu-btn.dw-danger-line:hover{background:#fff0f1}

/* ---- 폼 ---- */
.dw-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.dw-form-grid .cu-form-label{margin-top:16px}
.dw-req{color:#e14352;font-weight:600}
.dw-field-err{font-style:normal;font-size:12px;color:#ce3346;font-weight:400}
.dw-doctor-row{display:flex;gap:6px;align-items:center}
.dw-doctor-row input{flex:1}

/* ---- 진료실 ---- */
.dw-room-count{font-style:normal;font-size:12px;color:var(--blue)}
.dw-svc-tags{display:flex;flex-wrap:wrap;gap:6px}

/* ---- 프로그램 환경설정(별도 창 모사) ---- */
.cu-modal.dw-settings{width:560px;border-top:6px solid #dce3ed}
.dw-window-note{font-size:12px;color:var(--g60);background:var(--g10);padding:8px 10px;border-radius:6px}
.dw-key{display:flex;align-items:center;gap:12px;border:1px solid var(--g30);background:var(--g10);border-radius:8px;padding:14px 16px}
.dw-key>svg{font-size:22px;color:var(--g60)}
.dw-key>div{flex:1}
.dw-key strong{font-size:14px}
.dw-key p{font-size:12px;color:var(--g60);margin-top:3px}
.dw-pc{font-size:11px;font-weight:500;color:#0061db;background:#e8f2ff;padding:1px 6px;border-radius:4px;margin-left:6px}

@media(max-width:1100px){.dw-legend{display:none}}
@media(max-width:760px){.dw-window.cu-client.cn-screen{inset:8px 8px 46px 8px}.dw-taskbar-label{display:none}.dw-form-grid{grid-template-columns:1fr}}

/* ---- v0.2: 토스트 톤·체험 설정 위치·기타 QA 반영 ---- */
.dw-block{display:block;margin-top:4px}
.dw-draft-note{margin-right:auto;align-self:center;font-size:12px;color:var(--g60)}
.dw-exp-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px dashed #9aa6b8;border-radius:6px;background:#fff;font-size:12px;font-weight:600;color:var(--g90)}
.dw-exp-btn svg{font-size:15px;color:#6941c6}
.dw-exp-btn b{min-width:16px;height:16px;border-radius:8px;background:#6941c6;color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}
.dw-exp-btn em{font-style:normal;font-size:10px;font-weight:500;color:#6941c6;background:#f1ecff;padding:1px 5px;border-radius:4px}
.dw-exp-btn.open{background:#f1ecff;border-style:solid;border-color:#c7b8f5}
.dw-exp-strip{flex-shrink:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px 18px;padding:8px 24px;background:#f6f3ff;border-bottom:1px dashed #c7b8f5;font-size:12px;color:var(--g90);z-index:5}
.dw-exp-tag{font-size:11px;font-weight:600;color:#6941c6}
.dw-exp-item{display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.dw-exp-strip .dw-exp-reset{margin-left:auto;min-height:28px!important;padding:4px 8px!important;font-size:12px!important;width:auto}
@media(max-width:760px){.dw-exp-btn em{display:none}.dw-exp-strip{padding:8px 12px}}

/* ---- v0.3 ---- */
.dw-exp-item.locked{opacity:.5;cursor:not-allowed}
.dw-exp-lock{font-size:11px;color:#865f17;background:#fff4d8;padding:2px 6px;border-radius:4px}
.dw-exp-note{font-style:normal;font-size:10px;color:#6941c6;background:#fff;border:1px solid #c7b8f5;padding:0 4px;border-radius:4px;margin-left:2px}
.cu-header h1:focus{outline:none}
.cu-header h1:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

/* ===================== v0.4 진료실 영역 ===================== */
.dw-crumb{display:inline-flex;align-items:center;gap:2px;font-size:12px;color:var(--g60);margin-bottom:6px;padding:0}
.dw-crumb:hover{color:var(--blue)}
.dw-crumb svg{font-size:14px}
.dw-mt0{margin-top:0!important;margin-bottom:12px}
.dw-pre{white-space:pre-line}
.dw-red{color:#d74251;font-size:13px}
.dw-full{width:100%}
.dw-link{color:var(--blue);font-size:13px;text-decoration:underline;margin-left:8px;padding:0;background:none}
.dw-mr-auto{margin-right:auto}
.dw-span-all{grid-column:1/-1}
.dw-room-list{display:flex;flex-direction:column;gap:12px}
.dw-room-row{display:flex;align-items:center;gap:16px;width:100%;padding:18px 20px;border:1px solid var(--g30);border-radius:8px;background:#fff;text-align:left}
button.dw-room-row:hover{border-color:var(--blue)}
.dw-rc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dw-rc-main strong{font-size:16px;font-weight:600}
.dw-rc-main small{font-size:12px;color:var(--g60)}
.dw-rc-chev{color:var(--g60)}
.dw-stag{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:16px;padding:3px 7px;border-radius:4px;font-weight:600;background:var(--g20);color:var(--g60)}
.dw-stag i{width:6px;height:6px;border-radius:50%;background:currentColor}
.dw-stag.active{background:#e7f7ed;color:#218955}
.dw-stag.paused{background:#fff0e3;color:#F06500}
.dw-stag.error{background:#fff0f1;color:#d74251}
.dw-stag.off i{display:none}
.dw-order-row{display:flex;align-items:center;gap:8px}
.dw-order-row .dw-room-row{flex:1}
.dw-grip{color:var(--g40);font-size:18px}
.dw-order-btns{display:inline-flex;gap:2px}
.dw-bottom-bar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:24px;padding-top:16px;border-top:1px solid var(--g30)}
.dw-bottom-bar.left{justify-content:flex-start}
.dw-bottom-bar.left .cu-subnote{margin:0 0 0 8px!important}
.dw-bottom-bar.sticky{position:sticky;bottom:0;background:#fff;padding-bottom:12px;z-index:2}
.dw-bottom-bar.sticky>.cu-subnote{margin:0 auto 0 0!important}
.dw-info-box{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:6px;background:#f3f8ff;color:#0050b5;font-size:13px;margin-bottom:16px}
.dw-red-box{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:6px;background:#fff0f1;color:#c8303f;font-size:13px;margin-bottom:12px}
/* 상세 섹션 */
.dw-row-ctl{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.dw-check{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.dw-check input{width:16px;height:16px;margin:0}
.dw-pop-wrap{position:relative;display:inline-flex}
.dw-pop{position:absolute;top:calc(100% + 6px);right:0;z-index:20;background:#fff;border:1px solid var(--g30);border-radius:8px;box-shadow:0 8px 24px #0000001f;padding:8px;min-width:240px}
.dw-select{display:inline-flex;align-items:center;gap:8px;justify-content:space-between;min-width:160px;height:36px;padding:0 10px;border:1px solid var(--g30);border-radius:6px;background:#fff;font-size:13px;color:var(--g90)}
.dw-purpose-pop{min-width:300px}
.dw-pop-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 6px;border-radius:4px}
.dw-pop-item:hover{background:var(--g10)}
.dw-pop-item label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;flex:1}
.dw-pop-item small{font-size:11px;color:var(--g60)}
.dw-pop-add{display:flex;align-items:center;gap:4px;width:100%;padding:10px 6px;border-top:1px solid var(--g20);margin-top:4px;font-size:13px;color:var(--blue)}
.dw-pop-right{right:0}
.dw-pop-opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 10px;border-radius:4px;font-size:13px;color:var(--g90)}
.dw-pop-opt.sel{font-weight:700}
.dw-pop-opt:hover{background:var(--g10)}
.dw-tree{margin:12px 0 0;padding-left:18px;font-size:13px;line-height:24px;color:var(--g90)}
.dw-pause-pop{width:320px;padding:16px}
.dw-pause-pop>strong{font-size:15px}
.dw-pause-pop>p{font-size:12px;color:var(--g60);margin:6px 0 10px}
.dw-pause-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--g20)}
.dw-pause-item.off{opacity:.5}
.dw-pause-item b{display:block;font-size:13px}
.dw-pause-item small{font-size:12px;color:var(--g60)}
.dw-pause-sw{display:inline-flex;border:1px solid var(--g30);border-radius:6px;overflow:hidden}
.dw-pause-sw button{width:34px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--g60)}
.dw-pause-sw button.on{background:var(--blue);color:#fff}
.dw-pause-sw button:last-child.on{background:#F06500}
/* 스케줄 */
.dw-sched-header{flex-wrap:wrap}
.dw-week-nav{display:flex;align-items:center;gap:6px;margin-top:4px}
.dw-week-nav strong{font-size:22px;margin-left:8px}
.dw-week-nav .cu-btn{min-height:32px;padding:4px 10px;font-size:12px}
.dw-save-status{font-size:12px;color:var(--g60);margin-left:10px}
.dw-save-status.fail{color:#d74251}
.dw-grid{border:1px solid var(--g30);border-radius:8px;overflow:hidden;--row:44px}
.dw-grid-head{display:grid;grid-template-columns:56px repeat(7,1fr);border-bottom:1px solid var(--g30);background:#fafbfc}
.dw-dh{padding:8px 6px;font-size:12px;text-align:center;border-left:1px solid var(--g20);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px}
.dw-dh b{font-size:13px}
.dw-dh small{font-size:10px;color:#d74251}
.dw-dh .dw-avail{color:var(--g60)}
.dw-dh.today b{color:#fff;background:var(--blue);border-radius:10px;padding:0 8px}
.dw-dh.hol b{color:#d74251}
.dw-dh.today.hol b{color:#fff}
.dw-dh.past{color:#A8AEBD}
.dw-mini{font-size:10px;color:var(--g70);border:1px solid var(--g30);border-radius:4px;padding:1px 5px;background:#fff}
.dw-mini:hover{border-color:#e14352;color:#e14352}
.dw-grid-body{display:grid;grid-template-columns:56px repeat(7,1fr);max-height:520px;overflow:auto;position:relative}
.dw-hours{display:flex;flex-direction:column}
.dw-hours span{height:44px;font-size:10px;color:var(--g60);text-align:right;padding:2px 6px 0 0;border-bottom:1px solid var(--g20)}
.dw-col{position:relative;border-left:1px solid var(--g20)}
.dw-col.past{background:repeating-linear-gradient(45deg,#fafbfc,#fafbfc 6px,#f4f5f7 6px,#f4f5f7 12px)}
.dw-col.hol{background-color:#fff8f8}
.dw-cell{display:block;width:100%;height:44px;border:0;border-bottom:1px solid var(--g20);background:transparent;padding:0}
.dw-cell:hover{background:#0073fa0d}
.dw-now{position:absolute;left:0;right:0;height:0;border-top:2px solid #FA4655;z-index:2;pointer-events:none}
.dw-block{position:absolute;left:3px;right:3px;border-radius:5px;background:#e6f1ff;border:1px solid #9ec9ff;color:#0050b5;font-size:11px;text-align:left;padding:3px 5px;overflow:hidden;z-index:1;display:flex;flex-direction:column;line-height:14px}
.dw-block small{font-size:10px;color:#3b6fb0}
.dw-block.stopped{background:#f2f4f6;border-color:var(--g40);color:var(--g70)}
.dw-block.past{opacity:.6}
.dw-cell.appt{height:auto;min-height:44px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:2px;padding:2px;cursor:pointer}
.dw-grid.appt .dw-hours span{height:auto;min-height:44px}
.dw-grid.appt .dw-grid-body{grid-auto-rows:auto}
.dw-chip-slot{display:inline-flex;align-items:center;gap:2px;font-size:10px;line-height:14px;padding:1px 4px;border:1px solid;border-radius:4px;color:var(--g90);white-space:nowrap}
.dw-chip-slot.full{opacity:.65}
.dw-chip-slot button{display:inline-flex;padding:0;color:var(--g70)}
.dw-chip-slot button svg{font-size:10px}
.dw-appt-wrap{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.dw-appt-wrap>.dw-bottom-bar{grid-column:1/-1}
.dw-groups{border:1px solid var(--g30);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.dw-groups-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.dw-groups-head small{font-size:11px;color:#6941c6;background:#f1ecff;padding:1px 6px;border-radius:4px}
.dw-group{display:flex;align-items:center;gap:4px;border:1px solid transparent;border-radius:6px}
.dw-group.sel{border-color:var(--blue);background:#f3f8ff}
.dw-group-main{flex:1;display:flex;align-items:center;gap:8px;padding:8px;text-align:left;min-width:0}
.dw-group-main i{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dw-group-main b{display:block;font-size:13px}
.dw-group-main small{display:block;font-size:11px;color:var(--g60)}
.dw-group-main em{font-style:normal;font-size:10px}
.dw-add-group{justify-content:flex-start!important;color:var(--blue)!important}
.dw-appt-main{min-width:0}
.dw-group-card{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--g30);border-radius:6px;margin-top:12px}
.dw-group-card i{width:10px;height:10px;border-radius:50%}
.dw-group-card small{color:var(--g60);font-size:12px;margin-left:auto}
.dw-colors{display:flex;gap:6px;margin-top:8px}
.dw-colors button{width:22px;height:22px;border-radius:50%;border:2px solid transparent}
.dw-colors button.on{border-color:var(--g100);box-shadow:0 0 0 2px #fff inset}
.dw-radio-inline{display:flex;align-items:center;gap:14px;font-size:13px;font-weight:400;margin-top:6px}
.dw-radio-inline>span{width:64px;color:var(--g70)}
.dw-radio-inline label{display:inline-flex;align-items:center;gap:4px}
.dw-adv{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.dw-ack-in{margin-top:14px}
.dw-count-line{font-size:13px;color:var(--g70)}
.dw-time-row{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;flex-wrap:wrap}
.dw-time-row select,.dw-time-row input[type=number],.dw-time-row input[type=date]{min-height:36px;font-size:13px}
.dw-time-row input[type=number]{width:72px}
.dw-limit-row{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:13px}
.dw-limit-row input{width:90px;min-height:34px}
.dw-dow-toggles{display:flex;gap:4px;flex-wrap:wrap}
.dw-dow-toggles button{min-width:36px;height:32px;padding:0 8px;border:1px solid var(--g30);border-radius:6px;font-size:12px;background:#fff;color:var(--g80,#4E5968)}
.dw-dow-toggles button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dw-copy-row{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:14px;flex-wrap:wrap}
.dw-copy-row select{min-height:34px}
.dw-hol-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
/* 운영 설정 */
.dw-op{max-width:820px}
.dw-path-head{display:flex;justify-content:space-between;margin-top:16px;font-size:13px}
.dw-path-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.dw-path-list li{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dw-path-list li input{flex:1;min-height:34px}

/* ===================== v0.4 진료 현황·진료항목 ===================== */
.dw-guide-warn{margin-top:10px;padding:10px 12px;border-radius:6px;background:#fff7ec;font-size:12px;color:#8a5a12}
.dw-guide-warn ul{margin:6px 0 0;padding-left:16px;line-height:19px}
.dw-exp-item select{min-height:26px;font-size:12px;padding:2px 20px 2px 6px}
.dw-exp-judge{font-size:11px;color:#6941c6;background:#fff;border:1px solid #c7b8f5;border-radius:4px;padding:2px 6px}

/* ===================== v0.5 판단 메모(프로토 메타) ===================== */

/* ===================== v0.7 ===================== */
.dw-crash{max-width:520px;margin:120px auto;padding:32px;border:1px solid var(--g30);border-radius:12px;background:#fff;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;font-family:Pretendard,'Apple SD Gothic Neo',sans-serif}
.dw-crash svg{font-size:32px;color:#d74251}
.dw-crash p{font-size:13px;color:#6B7684}
/* 핀: 컨트롤과 겹치지 않게 라벨 위쪽 여백에 띄움, flex 간격으로 밀지 않음 */
/* 체험 띠 1줄 */
.dw-exp-strip{flex-wrap:wrap;gap:6px 14px;padding:6px 16px} /* v3.11.46 펼친 한 줄, 넘치면 줄바꿈 */
.dw-group.orphan{border:1px dashed var(--g40)}
.dw-chip-slot.orphan{border-style:dashed}
@media(max-width:1180px){.dw-exp-judge{display:none}}
/* v0.7 밀도: 체험 띠를 펼쳐도 스크롤 시 진료 현황 6행 이상 */
.dw-window .cu-header.cn-header{padding-top:26px;padding-bottom:16px}
/* 핀: 플렉스 정렬 영향 없이 줄 위쪽 여백에 */

/* ===================== v0.8 진료 현황 첫 화면 밀도 ===================== */
.dw-window .cu-header.cn-header{padding-top:18px;padding-bottom:10px}
.dw-window .cu-header .cn-desc{margin-top:2px;font-size:13px}
.dw-window .cu-header h1{font-size:24px;line-height:32px}
.dw-window .cu-tabs{height:40px}
.dw-window .cu-tabs button{padding-bottom:8px}
.dw-window .cu-filters{margin-top:12px}

/* ===================== v0.10 피그마 진료실 설정(목록·상세) — 값은 figma/baseline.md 참조 ===================== */
.dw-fig-head.cu-header.cn-header{padding:48px 64px 32px!important;align-items:center}
.dw-fig-head h1{font:700 28px/36px Pretendard,'Apple SD Gothic Neo',sans-serif!important;color:#16181D;letter-spacing:0!important}
.dw-fig-content.cu-content{padding:0 64px 80px!important}
.dw-fig-textbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:56px;padding:0 16px;border-radius:4px;font:600 13px/20px Pretendard,sans-serif;color:#5D6474;background:transparent;border:0}
.dw-fig-textbtn:hover{background:rgba(128,135,153,.08)}
.dw-fig-textbtn svg{font-size:16px}
.dw-fig-textbtn.primary{color:#0073FA}
/* 카드 그리드 */
.dw-fig-grid{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.dw-fig-card{flex:1 1 calc(50% - 8px);min-width:300px;max-width:calc(50% - 8px);min-height:150px;display:flex;flex-wrap:wrap;align-content:center;gap:24px 40px;padding:24px;background:#FFFFFF;border:1px solid #E3E6ED;border-radius:8px;text-align:left}
.dw-fig-card:hover{border-color:var(--blue)}
.dw-fig-card-data{flex:1 1 310px;min-width:310px;display:flex;flex-direction:column;gap:4px}
.dw-fig-card-data>strong{font:600 18px/26px Pretendard,sans-serif;color:#16181D}
.dw-fig-detail{display:flex;align-items:center;gap:6px;font:400 14px/22px Pretendard,sans-serif;color:#808799;white-space:nowrap}
.dw-fig-dot{display:inline-block;width:2px;height:2px;border-radius:50%;background:#808799;flex-shrink:0}
.dw-fig-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dw-fig-badge{display:inline-flex;align-items:center;justify-content:center;height:26px;min-width:56px;padding:3px 8px;border-radius:4px;font:600 13px/20px Pretendard,sans-serif;white-space:nowrap}
.dw-fig-badge.on{background:rgba(0,153,110,.08);color:#00855F}
.dw-fig-badge.err{background:rgba(236,56,71,.08);color:#EC3847}
.dw-fig-badge.stop{background:rgba(240,101,0,.08);color:#F06500}
.dw-fig-badge.off{background:rgba(93,100,116,.08);color:#5D6474}
.dw-fig-extra{font-style:normal;font:400 13px/20px Pretendard,sans-serif;color:#808799;margin-left:4px}
/* 상세 헤더 */
.dw-fig-desc{display:flex;align-items:center;gap:8px;margin-top:4px!important;font:400 14px/22px Pretendard,sans-serif;color:#808799}
.dw-fig-desc b{font-weight:600;color:#5D6474}
.dw-fig-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;min-width:64px;padding:0 20px;border:1px solid rgba(128,135,153,.2);border-radius:6px;background:#FFFFFF;font:600 14px/22px Pretendard,sans-serif;color:#5D6474;white-space:nowrap}
.dw-fig-btn:hover:not(:disabled){background:rgba(128,135,153,.05)}
.dw-fig-btn svg{font-size:18px}
.dw-fig-btn.icon{width:40px;min-width:40px;padding:0}
.dw-fig-btn.bold{font-weight:700;min-width:80px}
.dw-fig-btn.danger{color:#EC3847}
.dw-fig-btn.primary{background:#0073FA;border-color:#0073FA;color:#FFFFFF;opacity:.9}

/* 서비스 카드 */
.dw-fig-svc-list{display:flex;flex-direction:column;gap:16px}

.dw-fig-svc-label{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding-right:16px}

.dw-fig-status-tag.err{background:rgba(236,56,71,.08);color:#EC3847}

.dw-fig-svc-body{display:flex;flex-direction:column;gap:12px;padding:8px 0}
.dw-fig-setrow{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:96px;padding:24px;background:#FFFFFF;border:1px solid #E3E6ED;border-radius:8px}

.dw-fig-setrow strong{font:600 16px/24px Pretendard,sans-serif;color:#16181D}
.dw-fig-setrow p{font:400 14px/22px Pretendard,sans-serif;color:#5D6474}
.dw-fig-setrow p.strong{color:#434956}
.dw-fig-seg{display:inline-flex;padding:4px;background:#F2F4F7;border:1px solid #E3E6ED;border-radius:6px}
.dw-fig-seg button{height:32px;padding:0 12px;border-radius:4px;font:600 13px/20px Pretendard,sans-serif;color:#5D6474;background:#F2F4F7}
.dw-fig-seg button.sel{background:#FFFFFF}
.dw-fig-select{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;width:240px;height:40px;padding:9px 16px;border:1px solid #CACED8;border-radius:6px;background:transparent;font:500 14px/22px Pretendard,sans-serif;color:#31353F}
.dw-fig-select svg{font-size:16px}
.dw-fig-select.ro{gap:8px;cursor:default}
.dw-fig-select.ro svg{opacity:.3}
.dw-fig-actions{display:flex;gap:10px;padding-top:8px}
.dw-fig-danger{height:36px;padding:0 16px;border-radius:4px;background:rgba(250,70,85,.1);color:#FA4655;font:600 13px/20px Pretendard,sans-serif;opacity:.9}
.dw-fig-guide{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:54px;padding:0 20px 0 16px;border-radius:8px;margin-bottom:16px}
.dw-fig-svc-body .dw-fig-guide{margin-bottom:0}
.dw-fig-guide>span{display:flex;align-items:center;gap:8px;font:600 14px/22px Pretendard,sans-serif}

.dw-fig-guide>button svg{font-size:16px}
.dw-fig-guide.pos{background:rgba(0,115,250,.05);border:1px solid rgba(0,115,250,.1)}
.dw-fig-guide.pos>span{color:#066AE5}
.dw-fig-guide.neg{background:rgba(250,70,85,.05);border:1px solid rgba(250,70,85,.1)}
.dw-fig-guide.neg>span{color:#EC3847}
.dw-fig-bottom{position:sticky;bottom:0;display:flex;gap:8px;padding:16px 64px;background:#FFFFFF;border-top:1px solid #E3E6ED;z-index:3}
@media(max-width:1100px){.dw-fig-card{max-width:none;flex-basis:100%}.dw-fig-head.cu-header.cn-header{padding:32px 28px 24px!important}.dw-fig-content.cu-content{padding:0 28px 60px!important}.dw-fig-bottom{padding:16px 28px}}
/* 피그마 stroke INSIDE(90 높이) 재현: 테두리 1px만큼 패딩을 줄임 */
.dw-fig-svc{padding:19px 23px}

/* v3.10.5 현행 웹뷰(BoxContainer) 기준: 배지는 이름·상세 아래 왼쪽 정렬(간격 16+24=40), 호버 테두리 GRAY_50 */

/* v3.10.6 현행 subTitle은 한 줄 텍스트라 폭이 모자라면 줄바꿈 — nowrap 해제, 좁은 폭에서 카드 최소 폭 해제 */
.dw-fig-card .dw-fig-detail{display:block;white-space:normal}

.dw-fig-grid{align-items:stretch}
.dw-fig-card{min-width:0}

/* ===================== v0.11 피그마 타이포 우선순위(.cu-app button{font:inherit} 보다 높게) ===================== */
.cu-app .dw-fig-textbtn,.cu-app .dw-fig-danger,.cu-app .dw-fig-seg button,.cu-app .dw-fig-guide>button{font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;font-size:13px;line-height:20px;font-weight:600}
.cu-app .dw-fig-btn{font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;font-size:14px;line-height:22px;font-weight:600}
.cu-app .dw-fig-btn.bold{font-weight:700}
.cu-app .dw-fig-select{font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;font-size:14px;line-height:22px;font-weight:500}
.cu-app .dw-fig-svc-ic,.cu-app .dw-fig-svc-ic svg{color:#434956}
.cu-app .dw-fig-danger:disabled{opacity:.4;cursor:not-allowed}
/* v0.16 운영 설정 메뉴 그룹 */
/* v0.17 진료항목 운영 설정 — 값은 figma baseline 참조 */
.cu-app .dw-io{display:flex;flex-direction:column;font-family:Pretendard,'Apple SD Gothic Neo',sans-serif}
.cu-app .dw-io-card{display:flex;align-items:center;gap:16px;min-height:96px;box-sizing:border-box;padding:23px;background:#fff;border:1px solid #E3E6ED;border-radius:8px} /* INSIDE stroke 보정: 24 - 1 */
.cu-app .dw-io-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cu-app .dw-io-title{font-size:16px;line-height:24px;font-weight:600;color:#16181D;position:relative}
.cu-app .dw-io-desc{margin:0;font-size:14px;line-height:22px;font-weight:400;color:#5D6474}
.cu-app .dw-io-n{font-weight:500;color:#434956}
.cu-app .dw-io-kakao{font-weight:500;color:#066AE5}
.cu-app .dw-io-ctl{display:flex;align-items:center;gap:10px;height:40px;position:relative}
.cu-app .dw-io-status{font-size:14px;line-height:22px;font-weight:600;color:var(--g60)}
.cu-app .dw-io-status.on{color:#066AE5}
.cu-app .dw-io-group{display:flex;flex-direction:column;gap:12px}
.cu-app .dw-io-sec{margin:0;padding-top:48px;font-size:16px;line-height:24px;font-weight:700;color:#31353F;position:relative}
.cu-app .dw-io-banner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:54px;box-sizing:border-box;padding:0 20px 0 16px;background:rgba(128,135,153,.05);border:1px solid rgba(128,135,153,.1);border-radius:8px}
.cu-app .dw-io-banner-msg{display:flex;align-items:center;gap:8px;font-size:14px;line-height:22px;font-weight:600;color:#434956;position:relative}
.cu-app .dw-io-banner-msg svg{width:20px;height:20px;color:#808799;flex-shrink:0}
.cu-app .dw-io-banner-link{display:flex;align-items:center;gap:4px;height:36px;font-family:inherit;font-size:13px;line-height:20px;font-weight:600;color:rgba(0,0,0,.7)}
.cu-app .dw-io-banner-link svg{width:16px;height:16px}
.cu-app .dw-io .cu-toggle.on{background:#0073FA}
.cu-app .dw-io .cu-toggle{border-radius:10px}
.cu-app .dw-io .dw-guide-warn{margin-top:8px}
/* v0.19 진료실 운영 설정 — 값은 figma baseline 참조(행 카드·스위치는 dw-io 공통) */
.cu-app .dw-ro{gap:0}
.cu-app .dw-ro-sec{display:flex;flex-direction:column;gap:12px;padding-bottom:48px}
.cu-app .dw-ro-sec.res{padding-bottom:0}
.cu-app .dw-ro-title{margin:0;font-size:18px;line-height:26px;font-weight:700;color:#16181D}
.cu-app .dw-ro-col{flex-direction:column;align-items:stretch;gap:0}
.cu-app .dw-ro-head{display:flex;align-items:center;gap:16px}
.cu-app .dw-ro-select{width:240px;box-sizing:border-box;justify-content:space-between;gap:12px;padding:9px 16px;border:1px solid #CACED8;border-radius:6px;background:transparent;font-size:14px;line-height:22px;font-weight:500;color:#31353F}
.cu-app .dw-ro-addr{display:flex;gap:32px;padding-top:24px}
.cu-app .dw-ro-addr-item{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.cu-app .dw-ro-addr-item>span{font-size:14px;line-height:22px;font-weight:600;color:#5D6474}
.cu-app .dw-ro-addr-item select{height:40px;padding:0 12px 0 16px;border:1px solid #CACED8;border-radius:6px;background:#fff;font-size:14px;line-height:22px;font-weight:500;color:#31353F;font-family:inherit}
.cu-app .dw-ro-addr-item small{font-size:14px;line-height:22px;font-weight:400;color:#808799}
.cu-app .dw-ro-checks{display:flex;gap:16px}
.cu-app .dw-ro-check{display:inline-flex;align-items:center;gap:8px;min-height:24px;font-size:14px;line-height:22px;font-weight:500;color:#31353F;cursor:pointer}
.cu-app .dw-ro-check input{width:18px;height:18px;margin:0;border-radius:4px;accent-color:#0073FA}
.cu-app .dw-ro-bar{height:64px;box-sizing:border-box;padding:12px 0;border-top:1px solid #E3E6ED;gap:8px;align-items:center}
.cu-app .dw-ro-cancel,.cu-app .dw-ro-save{min-width:80px;height:40px;padding:0 20px;border-radius:6px;font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;font-size:14px;line-height:22px;font-weight:700}
.cu-app .dw-ro-cancel{border:1px solid rgba(128,135,153,.2);background:#fff;color:#5D6474}
.cu-app .dw-ro-save{border:0;background:#0073FA;color:#fff}
.cu-app .dw-ro-save:disabled{background:#CACED8;color:#fff;cursor:not-allowed}
.cu-app .dw-ro-cancel:disabled{opacity:.5}
.cu-app .dw-ro-select,.cu-app .dw-ro-min-in input{height:40px;min-height:40px;padding-top:0;padding-bottom:0} /* INSIDE stroke 보정: py9+22+테두리 → 40 */

/* =============================================================
   v2 전용 (dw2-) — 접수 내역 › 접수 현황 탭의 데스크 대기열·열 편집 패널·드롭다운·셀 복사(v3.3부터 이 범위만 남김)
   시각값은 figma/desk-receipt-table.md(데스크 4.1 접수 정보 테이블) 기준:
   텍스트 #16181d / 보조 #16181d 61% · 강조 #066ae5 · 차례 행 8%(hover 12%) · 행 hover 4% · 행 40 · 헤더 셀 Regular 14/20 · 데이터 SemiBold 14/20
   ============================================================= */
.dw2-page{--t1:#16181d;--t2:rgba(22,24,29,.61);--line:rgba(22,24,29,.16);--line2:rgba(22,24,29,.08);--accent:#066ae5;display:flex;height:100%;min-height:0;position:relative;color:var(--t1)}
.dw2-main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.dw2-head{padding:20px 24px 0;flex-shrink:0}
.dw2-topnav{display:flex;align-items:center;gap:8px;height:40px;padding-top:8px;flex-wrap:wrap}
.dw2-scroll{flex:1;min-height:0;overflow:auto;padding:12px 24px 32px}
.cu-app .dw2-page input:not([type=radio]):not([type=checkbox]),.cu-app .dw2-page select{min-height:32px;height:32px;padding:5px 10px;font-size:14px;border-radius:4px;border-color:var(--line)}
.cu-app .dw2-page textarea{border-radius:4px;border-color:var(--line);padding:6px 10px;min-height:72px;font-size:14px;width:100%;resize:vertical}

/* 아이콘 버튼 32 · 톱니 메뉴 */
.dw2-icon-btn{width:32px;height:32px;border:1px solid var(--line);border-radius:4px;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--t1)}
.dw2-icon-btn svg{font-size:16px}
.dw2-icon-btn.on,.dw2-icon-btn:hover{background:var(--line2)}
.dw2-gear-wrap{position:relative;display:inline-flex}
.dw2-gear-menu{position:absolute!important;top:36px;right:0;left:auto!important;width:201px}

/* 드롭다운 196×32 */
.dw2-dd{position:relative;display:inline-flex}
.dw2-dd-btn{width:196px;height:32px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--t1);font-size:14px}
.dw2-dd-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dw2-dd-btn svg{font-size:14px;color:var(--t2)}
.dw2-dd-btn.open{border-color:var(--accent)}
.dw2-dd-pop{position:absolute;top:36px;left:0;min-width:196px;max-height:320px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px #00000024;padding:4px;z-index:30}
.dw2-dd-pop button{display:block;width:100%;height:40px;padding:0 10px;text-align:left;border-radius:4px;font-size:14px;color:var(--t1);white-space:nowrap}
.dw2-dd-pop button:hover{background:var(--line2)}
.dw2-dd-pop button.sel{background:rgba(6,106,229,.08);font-weight:600}
.dw2-dd-head{font-size:12px;color:var(--t2);padding:8px 10px 4px}

/* 진료실별 테이블 블록 */
.dw2-tbl{margin-bottom:20px;border-radius:4px}
.dw2-tbl.drop-room{outline:2px solid var(--accent);outline-offset:2px}
.dw2-tbl-title{height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:14px;line-height:20px}
.dw2-tbl-title strong{font-weight:600}
.dw2-tbl-scroll{overflow-x:auto;border-top:1px solid var(--line)}
.dw2-grid{border-collapse:collapse;table-layout:fixed;font-size:14px;line-height:20px}
.dw2-grid th{height:40px;padding:0 8px;text-align:left;font-weight:400;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--line2)}
.dw2-grid td{height:40px;padding:0 8px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--line2);position:relative}
.dw2-grid th.c-order,.dw2-grid td.c-order{border-right:1px solid var(--line2);text-align:center}
.dw2-row{cursor:pointer}
.dw2-row:hover{background:rgba(22,24,29,.04)}
.dw2-row.blank{cursor:default}
.dw2-row.selected{background:rgba(6,106,229,.05)}
.dw2-row.dragging{opacity:.4}
.dw2-row[draggable=true]{cursor:grab}
.dw2-row.drop-before td{box-shadow:inset 0 2px 0 var(--accent)}
.dw2-row.drop-after td{box-shadow:inset 0 -2px 0 var(--accent)}
.dw2-row.empty{cursor:default}
.dw2-row.empty:hover{background:none}
.dw2-row.empty td{text-align:center;font-weight:400;color:var(--t2)}
/* v3.11.1 비연동 진료실 0개: 빈 대기열 틀 안 '진료실 만들기' */
.dw2-empty-cta{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:8px}
/* v3.11.2 검수: 빈 행 내용은 표 전체 폭(colSpan)이 아니라 보이는 틀 폭 안에서 가운데 — 스크롤 영역을 컨테이너로 두고 안쪽 래퍼를 sticky + 100cqw */
.dw2-tbl-scroll{container-type:inline-size}
.cu-app .dw2-grid .dw2-row.empty td:has(>.dw2-empty-in){padding-left:0;padding-right:0;overflow:visible}
.dw2-empty-in{position:sticky;left:0;width:100cqw;box-sizing:border-box;padding:0 12px;text-align:center}
/* v3.11.2 실시간 끊김 배너 · 가상 재조회 중 목록 흐림 */
.dw-refetching{opacity:.45;pointer-events:none;transition:opacity .15s}
body:has(.dw-refetching) .dw-portal .cu-modal footer{opacity:.45;pointer-events:none}
.dw2-check{width:16px;height:16px;margin:0;vertical-align:middle;cursor:pointer}
.dw2-check:disabled{cursor:default}
.dw-chart-box{display:inline-flex;align-items:center;vertical-align:middle} /* v3.11.16 목록 차팅 체크박스(내원 체크박스와 같은 dw2-check) */
.dw2-ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* 셀 hover 복사 */
.dw2-cell-copy{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dw2-cell-copy>.dw2-ell{display:block}
/* 피그마: 셀 안 오른쪽 고정 위치(레이아웃을 밀지 않음) */
.dw2-copy-wrap{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:inline-flex;visibility:hidden}
.dw2-row:hover .dw2-copy-wrap,.dw2-copy-wrap.done,.dw2-copy-wrap:focus-within{visibility:visible}
.dw2-copy{width:24px;height:24px;border:1px solid var(--line);border-radius:4px;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--t1);padding:0}
.dw2-copy svg{font-size:14px}
.dw2-tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#2b2e36;color:#fff;font-size:12px;font-weight:400;line-height:18px;padding:6px 8px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}
.dw2-copy:hover+.dw2-tip,.dw2-copy:focus-visible+.dw2-tip,.dw2-copy-wrap.done .dw2-tip{opacity:1}
.dw2-tip.float{position:fixed;bottom:auto;opacity:1;z-index:4000;font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.dw2-grid td:has(.dw2-copy-wrap.done),.dw2-grid td:has(.dw2-copy:hover){overflow:visible}

/* 컨텍스트 메뉴 (Compact) */
.dw2-ctx{position:fixed;z-index:70;min-width:120px;background:#fff;border:1px solid var(--line,rgba(22,24,29,.16));border-radius:6px;box-shadow:0 8px 24px #00000029;padding:4px}
.dw2-ctx button{display:block;width:100%;height:32px;padding:0 10px;text-align:left;border-radius:4px;font-size:14px;color:#16181d;white-space:nowrap}
.dw2-ctx button:hover,.dw2-ctx button:focus-visible{background:rgba(22,24,29,.06);outline:0}

/* 진료실 0개 */
.dw2-noroom{display:flex;flex-direction:column;align-items:center;gap:6px;padding:72px 20px;text-align:center}
.dw2-noroom strong{font-size:16px;line-height:22px;font-weight:600}
.dw2-noroom p{font-size:14px;line-height:20px;color:var(--t2)}
.dw2-noroom.soft{padding:48px 20px}

/* 오른쪽 패널 380 */
.dw2-pane{width:380px;flex-shrink:0;border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0;box-shadow:-6px 0 16px #00000010}
.dw2-pane>header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 20px;border-bottom:1px solid var(--line2);flex-shrink:0}

/* ═════ v3.3 현행 커넥트 웹뷰(receipt-web) 스타일 값 복제 ═════
 * 색: GRAY_10 #F9F9FB · GRAY_20 #F2F4F7 · GRAY_30 #E3E6ED · GRAY_50 #A8AEBD · GRAY_60 #808799 · GRAY_70 #5D6474 · GRAY_90 #31353F · GRAY_100 #16181D
 *     ALPHA_GRAY_20 rgba(128,135,153,.2) · BLUE_60 #0073FA · RED_60 #FA4655
 * 근거: 현행 커넥트 웹뷰의 메뉴·탭·필터·표·행 액션·모달·버튼·태그·토스트·상세 섹션 스타일 값 */
.dw-app{--r-g10:#F9F9FB;--r-g20:#F2F4F7;--r-g30:#E3E6ED;--r-g50:#A8AEBD;--r-g60:#808799;--r-g70:#5D6474;--r-g90:#31353F;--r-g100:#16181D;--r-line:rgba(128,135,153,.2);--r-blue:#0073FA;--r-red:#FA4655;--r-red70:#EC3847;--r-orange60:#FC7D22;--r-red-bg:rgba(236,56,71,.08)} /* v3.11.127 red70·orange60 = goodoc-design --red-70·--orange-60 */
/* 좌측 메뉴(NAV_WIDTH 280 · 섹션 구분선 · 그룹 접기 · beta 배지) */
.dw4-nav{background:var(--r-g20)!important;border-right:1px solid var(--r-g30)}
.dw4-nav .cu-nav-section{padding:9px 16px 11px;margin:0;font-size:14px;font-weight:600;color:#000}
.dw4-nav-sec+.dw4-nav-sec{padding-top:12px;margin-top:12px;border-top:1px solid var(--r-g30)}
.dw4-nav-foot{margin-top:auto;padding-top:12px}
.dw4-group-head{display:flex;align-items:center;justify-content:space-between;width:calc(100% - 8px);padding:7px 12px;margin:2px 4px;font-size:14px;font-weight:700;background:none;border:0;border-radius:4px;cursor:pointer;color:var(--r-g100);text-align:left}
.dw4-group-head>span{display:flex;gap:6px;align-items:center}
.dw4-group-head svg{color:var(--r-g60);transform:rotate(180deg);transition:transform .15s ease}
.dw4-group-head svg.open{transform:rotate(0)}
.dw4-beta{display:inline-flex;align-items:center;padding:1px 6px;font-size:11px;font-weight:600;line-height:1.4;font-style:normal;color:var(--r-blue);background:#E5F2FF;border-radius:4px}
.dw4-nav-item{display:block;width:calc(100% - 8px);padding:7px 12px;margin:0 4px;border-radius:6px;font-size:14px;color:var(--r-g90);text-align:left;background:none;border:0;cursor:pointer}
.dw4-nav-item.indent{padding:7px 28px}
.dw4-nav-item.active{background:var(--r-g30)}
.dw4-nav-item:disabled{cursor:not-allowed;opacity:.5}
.dw4-nav-group+.dw4-nav-group,.dw4-nav-group+.dw4-nav-item{margin-top:2px}
/* 목록 화면(예약 신청 내역 패턴): 탭 + 필터 gap 8, 표까지 gap 24 */
.dw4-list{display:flex;flex-direction:column;gap:24px;color:var(--r-g90)}
.dw4-tabs{display:flex;gap:24px;align-items:center;margin-bottom:-16px}
.dw4-tabs button{height:40px;padding:0;background:none;border:0;cursor:pointer;font-size:18px;line-height:26px;font-weight:500;color:var(--r-g60);white-space:nowrap} /* v3.11.127 피그마 탭 비선택 Medium 18/26 Gray/60 */
.dw4-tabs button.on{font-weight:700;color:var(--r-g100)}
.dw4-filter{border:2px solid var(--r-g30);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px}
.dw4-presets button{display:inline-flex;align-items:center;height:40px;padding:0 16px;border:1px solid var(--r-line);border-radius:6px;background:#fff;font-size:14px;font-weight:500;color:var(--r-g70);white-space:nowrap;cursor:pointer}
.dw4-presets button.on{color:var(--r-g90);border-color:var(--r-g70)}
.dw4-dates{display:grid;grid-template-columns:128px 7px 128px;gap:8px;align-items:center}
.dw4-dates i{font-style:normal;font-size:14px;font-weight:500;color:var(--r-g90);text-align:center}
.cu-app .dw4-filter input,.cu-app .dw4-filter select{height:40px;min-height:40px;padding:0 16px;font-size:14px;font-weight:500;border:1px solid var(--r-g50);border-radius:6px;color:var(--r-g90);background:#fff}
.cu-app .dw4-filter input:disabled{color:var(--r-g60);background:var(--r-g10);border-color:var(--r-g30)}
.cu-app .dw4-filter select{padding-right:32px}
.dw4-q .dw-field-err{font-size:12px}
.dw4-grow{flex:1}
/* 버튼(Button: small 40/radius6/14px 700 · xSmall 36/radius4/13px) */
.dw4-btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:9px 22px;border-radius:6px;font-size:14px;line-height:21px;font-weight:700;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.dw4-btn.xs{min-width:56px;height:36px;padding:8px 16px;font-size:13px;line-height:19.5px;border-radius:4px}
.dw4-btn.act{width:77px;padding:0 20px}
.dw4-btn.primary{color:#fff;background:var(--r-blue)}
.dw4-btn.primary:hover{background:#056BE1}
.dw4-btn.danger{color:#fff;background:var(--r-red)}
.dw4-btn.dark{color:#fff;background:var(--r-g70);border-color:var(--r-g70)}
.dw4-btn.secondary{color:var(--r-g70);background:rgba(128,135,153,.1)}
.dw4-btn.secondary-smooth{color:var(--r-g70);background:rgba(128,135,153,.1)}
.dw4-btn.primary-smooth{color:var(--r-blue);background:rgba(0,115,250,.1)}
.dw4-btn.danger-smooth{color:var(--r-red);background:rgba(250,70,85,.1)}
.dw4-btn.outline{color:var(--r-g70);background:transparent;border-color:var(--r-line)}
.dw4-btn.outline:hover{background:rgba(128,135,153,.05)}
/* 표(DataTable + 예약 신청 표: 테두리 1px ALPHA_GRAY_20 radius 8 · 헤더 13/600 GRAY_60 · 셀 12px · 첫 열 20px · hover GRAY_10) */
.dw4-tbl-wrap{border:1px solid var(--r-line);border-radius:8px;overflow:auto}
.dw4-table{min-width:100%;table-layout:fixed;border-spacing:0;border-collapse:separate;font-size:14px}
.dw4-table th,.dw4-table td{padding:12px;text-align:left;vertical-align:middle;position:relative}
.dw4-table thead th{position:sticky;top:0;z-index:2;background:#fff;padding-top:8px;padding-bottom:8px;font-size:13px;font-weight:600;line-height:1.5;color:var(--r-g60);white-space:nowrap;border-bottom:1px solid var(--r-line)}
.dw4-table th:first-of-type,.dw4-table td:first-of-type{padding-left:20px}
.dw4-table td:first-of-type{text-overflow:clip}
.dw4-table tbody tr{cursor:pointer}
.dw4-table tbody tr:hover{background:var(--r-g10)}
.dw4-table td{color:var(--r-g90);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dw4-table .cu-tag{min-width:48px;justify-content:center}
.dw4-table.item th:nth-child(1),.dw4-table.item th:nth-child(2){text-align:center}.dw4-table.item td:nth-child(1),.dw4-table.item td:nth-child(2){text-align:center}
.dw4-table.item th:nth-child(1){width:84px}.dw4-table.item th:nth-child(2){width:86px}.dw4-table.item th:nth-child(3){width:180px}.dw4-table.item th:nth-child(4){width:190px}.dw4-table.item th:nth-child(5),.dw4-table.item th:nth-child(6){width:131px}
.dw4-table.room th:nth-child(1),.dw4-table.rcp th:nth-child(1){width:86px}.dw4-table.room th:nth-child(2),.dw4-table.rcp th:nth-child(2){width:180px}.dw4-table.room th:nth-child(3),.dw4-table.rcp th:nth-child(3){width:120px}.dw4-table.room th:nth-child(4),.dw4-table.rcp th:nth-child(4){width:131px}.dw4-table.room th:nth-child(5),.dw4-table.rcp th:nth-child(5){width:152px}.dw4-table.room th:nth-child(6),.dw4-table.rcp th:nth-child(6){width:180px}
.dw4-table.room,.dw4-table.rcp,.dw4-table.item{width:max(100%,1000px)}
.dw4-two{display:flex;flex-direction:column;min-width:0}
.dw4-two small{font-size:12px;color:var(--r-g60);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 행 퀵 액션: 0폭 sticky 셀 + hover 때만, 왼쪽 40px 페이드 */
.dw4-table th.dw4-act,.dw4-table td.dw4-act{position:sticky;right:0;width:0;padding:0;overflow:visible;z-index:1}
.dw4-quick{position:absolute;inset:0 0 0 auto;display:flex;gap:6px;align-items:center;padding:0 20px 0 40px;white-space:nowrap;background:linear-gradient(90deg,rgb(249 249 251/0%) 0,var(--r-g10) 40px);visibility:hidden}
.dw4-table tbody tr:hover .dw4-quick{visibility:visible}
.dw4-table tr:hover .dw2-copy-wrap{visibility:visible}
/* 빈 상태(TableEmpty: 아이콘 32 + body1 GRAY_60) */
.dw4-empty td{text-align:center!important;padding:80px 0!important;height:236px;box-sizing:border-box;cursor:default}
.dw4-empty:hover{background:none!important}
.dw4-empty td svg{display:block;margin:0 auto 8px;font-size:32px;color:var(--r-g50)}
.dw4-empty td span{font-size:16px;color:var(--r-g60)}
/* 모달(Modal.WithButton: small 360 · medium 440 · padding 24 · 제목 20/700 · 본문 14/500 GRAY_70 · footer 위 24 · 버튼 gap 8) */
.cu-modal.dw4-m{border-radius:12px;padding:24px;box-sizing:border-box;max-height:calc(100vh - 48px)}
.cu-modal.dw4-m.small{width:360px}
.cu-modal.dw4-m.medium{width:440px}
.cu-modal.dw4-m>header{padding:0}
.cu-modal.dw4-m>header h2{font-size:20px;line-height:1.5;font-weight:700;color:var(--r-g100)}
.cu-modal.dw4-m .cu-modal-body{min-height:0;overflow:auto;flex:1 1 auto;padding:8px 0 0;font-size:14px;font-weight:500;color:var(--r-g70);max-height:calc(100vh - 232px)}
.cu-modal.dw4-m>footer{padding:24px 0 0;border-top:0;display:flex;align-items:center;gap:8px}
.dw4-foot-left{margin-right:auto}
.dw4-radios{gap:8px;margin-top:8px}
/* 상세 섹션(Section: 제목 14/600 GRAY_70 · 카드 1px GRAY_30 radius 8 · Field 라벨 64px 높이 32) */
.dw4-body{display:flex;flex-direction:column;gap:24px}
.dw4-sec{display:flex;flex-direction:column;gap:8px}
.dw4-sec>h3{font-size:14px;font-weight:600;color:var(--r-g70);margin:0}
.dw4-card{border:1px solid var(--r-g30);border-radius:8px;overflow:hidden}
.dw4-pad{padding:16px 20px}
.dw4-fields{display:flex;flex-direction:column}
.dw4-f{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:center;min-height:32px}
.dw4-f>span{font-size:14px;color:var(--r-g60)}
.dw4-f>b{font-size:14px;font-weight:500;color:var(--r-g90);word-break:break-all}
.dw4-when{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;color:var(--r-g90)}
.dw4-when span:last-child{color:var(--r-g60)}
.dw4-memo{margin:0;font-size:14px;color:var(--r-g90);white-space:pre-line}
.dw4-body .dw2-copy-wrap{visibility:visible}
/* 토스트(Toast: 화면 가운데 · information BLUE_60 / error RED_60 · padding 16 24 · radius 8) */
.cu-app .cu-toast.dw4-toast{position:fixed;top:50%;left:50%;bottom:auto;right:auto;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;padding:16px 24px;border-radius:8px;background:var(--r-blue);color:#fff;border:0;font-size:16px;line-height:1.5;font-weight:700;box-shadow:0 2px 1px rgb(22 24 29/2%),0 2px 8px rgb(22 24 29/10%);z-index:200;white-space:pre-line}
.cu-app .cu-toast.dw4-toast.fail{background:var(--r-red)}
/* 접수 현황 탭 안의 데스크 대기열(예외 — 순서 변경 때문에 데스크 4.1 표 유지) */
.dw4-embed .dw2-page{height:auto;min-height:320px}
.dw4-embed .dw2-head{padding:0}
.dw4-embed .dw2-scroll{overflow:visible;padding:12px 0 0}
.dw4-embed .dw2-topnav{height:auto;padding-top:0}
.dw4-kakao>p:first-child{margin-top:0}

.dw-app{--t1:#16181d;--t2:rgba(22,24,29,.61);--line:rgba(22,24,29,.16);--line2:rgba(22,24,29,.08);--accent:#066ae5}

/* 좌측 메뉴 폭 280(현행 NAV_WIDTH) */

.dw4-msel-wrap{position:relative;display:inline-flex}

.dw4-msel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dw4-msel svg{flex:none;color:var(--r-g70)}.cu-app .dw4-msel.open{border-color:var(--r-g70)}
