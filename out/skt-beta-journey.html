<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKT 베타 여정 프로토타입 v4</title>
<!-- 자체완결(외부 요청 0): Pretendard는 로컬 설치 폰트를 사용하고 없으면 system-ui로 대체 -->
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#F2F4F6;font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#0073FA;text-decoration:none}a:hover{color:#0061DB}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:3px}
  @keyframes omFade{from{opacity:0}to{opacity:1}}
  /* password gate */
  #gate{position:fixed;inset:0;z-index:9999;background:#eef1f5;display:flex;align-items:center;justify-content:center;padding:24px}
  #gate .box{width:100%;max-width:340px;background:#fff;border:1px solid #E5E8EB;border-radius:16px;padding:28px 24px;box-shadow:0 10px 40px rgba(17,23,35,.10);display:flex;flex-direction:column;gap:14px;text-align:center}
  #gate .lock{width:44px;height:44px;border-radius:13px;background:rgba(0,115,250,.1);display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:20px}
  #gate h2{margin:0;font:700 16px/1.4 Pretendard,system-ui,sans-serif;color:#191F28}
  #gate p{margin:0;font:400 12.5px/1.6 Pretendard,system-ui,sans-serif;color:#8B95A1;word-break:keep-all}
  #gate input{width:100%;border:1px solid #D1D6DB;border-radius:8px;padding:12px 13px;font:500 14px/1.2 Pretendard,system-ui,sans-serif;color:#191F28;outline:none}
  #gate input:focus{border-color:#0073FA;box-shadow:0 0 0 3px rgba(0,115,250,.12)}
  #gate button{appearance:none;border:none;background:#0073FA;color:#fff;border-radius:8px;padding:12px;font:600 14px/1 Pretendard,system-ui,sans-serif;cursor:pointer}
  #gate button:hover{background:#0061DB}
  #gate .err{min-height:14px;font:500 11.5px/1.2 Pretendard,system-ui,sans-serif;color:#FA4655}
  .hv-jidle:hover{background:#F6F6F6 !important;color:#191F28 !important}
  .hv-toff:hover{background:#F6F6F6 !important}
  .hv-prev:hover{background:#F6F6F6 !important;color:#191F28 !important}
  .hv-next:hover{background:#4F38BD !important}
  .hv-play:hover{background:#F6F6F6 !important}
  .hv-pin:hover{background:rgba(255,153,0,.18) !important}
  .hv-collapse:hover{background:#F6F6F6 !important;color:#191F28 !important}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <div class="lock">🔒</div>
    <h2>SKT 베타 여정 프로토타입</h2>
    <p>내부 검토용 화면입니다.<br>접근 비밀번호를 입력해주세요.</p>
    <input id="gatePw" type="password" placeholder="비밀번호" autocomplete="off" autofocus>
    <div class="err" id="gateErr"></div>
    <button id="gateBtn" type="button">입장</button>
  </div>
</div>
<div id="root"></div>
<script>
"use strict";
/* ==========================================================================
   SKT 베타 여정 프로토타입 v4 — standalone port
   Faithfully reimplements "SKT 베타 여정 프로토타입 v4.dc.html" + "Screen.dc.html"
   (Claude Design project "SKT 협업 베타 유저 플로우").
   The original ran on the Claude Design runtime (support.js + React/Babel via CDN);
   this version is dependency-free vanilla JS. All markup is inline-styled, exactly
   as in the source, so visual output matches 1:1.
   ========================================================================== */

var AUTOPLAY_SPEED = 2; // seconds (source prop default)

var state = { journey: 0, step: 0, closed: false, playing: false };
var timer = null;
var prevStep = null, prevApp = null;

/* ---------- block / note builders (ported from the DC script) ------------- */
function note(tone, title, body, priority) {
  return {
    title: title, body: body, priority: priority || '',
    tScope: tone === 'scope', tCopy: tone === 'copy', tDev: tone === 'dev',
    tData: tone === 'data', tLegal: tone === 'legal'
  };
}
function tTime(text){ return { isTime:true, text:text }; }
function pending(text){ return { isPending:true, text:text }; }
function u(text){ return { isUser:true, text:text }; }
function a(text){ return { isAgent:true, isText:true, text:text }; }
function scr(kind){ var card = kind.indexOf('kakao') === 0; return { isScreen:true, kind:kind, isCard:card, isFull:!card }; }
function st(o){ return Object.assign({ isAgent:true, isStatus:true, rows:[], note:'', tWait:false, tOk:false }, o); }

function hospitals(pick){
  var base = [
    { name:'안양센트럴내과', item:'종합검진 프리미엄', sub:'289,000원 · 1.2km' },
    { name:'평촌더나은의원', item:'기본 건강검진', sub:'148,000원 · 2.4km' },
    { name:'안양365의원', item:'위·대장 내시경 패키지', sub:'상담 후 안내 · 3.1km' }
  ];
  return { isAgent:true, isCards:true, items: base.map(function(h,i){
    return Object.assign({}, h, { badge:'예약 가능', more:true, picked: pick===i, plain: pick!==i });
  })};
}
function slots(sel, closed){
  return {
    isAgent:true, isSlots:true, hasDates:true, caption:'',
    dates: ['10.13 월','10.14 화','10.15 수'].map(function(label,i){ return { label:label, active:i===1, idle:i!==1 }; }),
    times: ['09:00','10:30','14:00'].map(function(label){
      var dead = closed === label;
      return { label:label, sel: !dead && label===sel, idle: !dead && label!==sel, dead:dead };
    })
  };
}
function altSlots(sel){
  return {
    isAgent:true, isSlots:true, hasDates:false, dates:[], caption:'10월 14일 (화) · 남은 시간',
    times: ['11:00','13:30','15:00'].map(function(label){ return { label:label, sel:label===sel, idle:label!==sel, dead:false }; })
  };
}
function form(filled){
  var data = [
    ['이름','김서연','이름을 입력하세요'],
    ['생년월일','1985.03.22','YYYY.MM.DD'],
    ['성별','여성','선택하세요'],
    ['연락처','010-1234-1234','010-0000-0000']
  ];
  return {
    isAgent:true, isForm:true, consent: !!filled, noConsent: !filled,
    fields: data.map(function(row){ return { label:row[0], value:row[1], ph:row[2], filled:!!filled, empty:!filled }; })
  };
}
function detail(){
  return {
    isAgent:true, isDetail:true,
    options: [
      { name:'기본 구성 (정상가)', price:'340,000원' },
      { name:'굿닥 예약가', price:'289,000원' },
      { name:'수면 내시경 추가', price:'+ 60,000원' }
    ]
  };
}

function apptTime(){ return state.closed ? '10월 14일 (화) 11:00' : '10월 14일 (화) 10:30'; }
function timeShort(){ return state.closed ? '11:00' : '10:30'; }

/* ---------- journeys ------------------------------------------------------ */
function sharedCheckup(){
  var t = apptTime();
  var summary = [
    { k:'병원', v:'안양센트럴내과' },
    { k:'항목', v:'종합검진 프리미엄' },
    { k:'일시', v:t },
    { k:'예약번호', v:'GD-2410-88214' }
  ];
  var s = [];
  s.push({ seg:'탐색', app:'A.', title:'진입', blocks:[ tTime('10월 11일 (토) 오후 3:10'), u('건강검진 예약해줘'), a('어느 지역에서 받으실 계획인가요? 희망하는 시기도 알려주세요.') ], notes:[] });
  s.push({
    seg:'탐색', app:'A.', title:'병원 후보 제시',
    blocks:[ u('안양 쪽에서 다음 주 중에'), a('안양 지역 건강검진 가능한 병원이에요.'), hospitals(-1) ],
    notes:[
      note('data','카드 데이터가 두 시스템에 나뉘어 있음','예약 가능 여부는 예약 시스템, 상세·이미지·가격 옵션은 별도 진료항목 시스템에 있음. 두 시스템 간 항목 매핑이 실제로 존재하는지 확인 필요.'),
      note('legal','가격이 옵션별 구조','정상가·할인가·상담가로 나뉘어 카드 표기 규칙이 필요. 할인가 노출은 의료광고 관점 검토 대상이고, ‘상담 후 안내’ 항목은 가격 미표기로 처리해야 함.')
    ]
  });
  s.push({
    seg:'탐색', app:'A.', title:'항목 상세 보기',
    blocks:[ u('첫 번째 병원 상세 보기'), detail() ],
    notes:[ note('dev','앱 상세 화면 재활용이 유리하나 CTA가 끊김','앱에 동일한 항목 상세 화면이 이미 있어 재활용이 유리함. 단 그 화면의 예약 버튼이 현재 동작하지 않아 CTA 연결이 선행 과제.') ]
  });
  s.push({
    seg:'예약', app:'A.', title:'병원 선택',
    blocks:[ u('이 병원으로 할게'), hospitals(0), a('선택하신 병원의 예약 가능한 시간이에요.'), slots(null) ],
    notes:[ note('scope','병원이 사전에 열어둔 슬롯 기준 조회','실시간 잔여 슬롯을 계산하는 다른 예약 유형은 베타 제외. 슬롯을 열어두지 않은 병원은 시간 선택으로 진입할 수 없음.') ]
  });
  s.push({ seg:'예약', app:'A.', title:'시간 선택', blocks:[ u('10월 14일 10:30'), slots('10:30') ], notes:[] });

  if (state.closed) {
    s.push({
      seg:'예약', app:'A.', title:'시간 마감 안내',
      blocks:[ slots(null,'10:30'), a('방금 그 시간이 마감됐어요. 가까운 시간으로 다시 골라주실 수 있나요?'), altSlots(null) ],
      notes:[ note('scope','실패로 끝내지 않고 대안을 즉시 제시','동시 예약으로 슬롯이 마감되는 경우. 실패는 예약 생성 시점에만 확인되므로 응답 자체를 없앨 수 없음 → 대안 시간 재제시가 핵심 패턴.') ]
    });
    s.push({ seg:'예약', app:'A.', title:'대안 시간 선택', blocks:[ u('11:00으로 해줘'), altSlots('11:00') ], notes:[ note('data','재선택 시 동의를 다시 받지 않도록','세션 내 개인정보 동의 상태가 유지되는지 확인 필요.') ] });
  }

  s.push({
    seg:'예약', app:'A.', title:'예약자 정보 + 동의',
    blocks:[ a('예약자 정보를 입력해주세요.'), form(false) ],
    notes:[ note('legal','개인정보 동의 수집 위치 = 이 지점','문안은 굿닥이 제공하고 화면 구현은 SKT가 담당. 제3자 제공과 처리위탁 중 어느 구조인지 확정한 뒤 문안을 작성해야 하므로, 화면에는 법적 구조를 특정하는 표현을 아직 쓰지 않음.') ]
  });
  s.push({
    seg:'예약', app:'A.', title:'요청 접수',
    blocks:[ u('입력 완료'), form(true), st({ title:'예약 요청이 접수됐어요', badge:'병원 확인 대기', tWait:true, rows:summary, note:'병원이 확인하면 알려드릴게요.' }) ],
    notes:[ note('copy','SKT 데모와 가장 큰 차이','굿닥 예약은 즉시 확정이 아니라 병원 확인 후 확정됨. 따라서 “예약 완료”가 아니라 “예약 요청 접수”가 맞음.','협의 1순위') ]
  });
  s.push({ seg:'대기', app:'A.', title:'병원 확인 대기', blocks:[ pending('병원 확인 중…') ], notes:[] });
  s.push({
    seg:'확정', app:'A.', title:'사용자가 물어서 확인',
    blocks:[ tTime('약 1시간 30분 후'), u('예약 확정됐어?'), a('네, 병원에서 확정했어요.'), st({ title:'예약이 확정됐어요', badge:'예약 확정', tOk:true, rows:summary, note:'예약 10분 전에 병원 방문을 준비해주세요.' }) ],
    notes:[
      note('dev','상태 회신 방식 2안 중 선택 필요','1안 — 굿닥 알림톡 발송 후 사용자가 물으면 에이닷이 조회해 답함. 2안 — 에이닷 카드로 자동 회신(상태 전달 연동 개발 필요). 베타는 1안, 2안은 본서비스 목표.'),
      note('scope','1안에서는 대화 경험이 한 번 끊김','확정 소식이 에이닷 밖(알림톡)에서 먼저 도착하고, 에이닷은 사용자가 물어야 답할 수 있음. 이 끊김이 2안을 검토하는 이유.')
    ]
  });
  return s;
}

function journeyA1(){
  var s = sharedCheckup();
  s.push({
    seg:'알림', app:'카카오톡', title:'알림톡 수신',
    blocks:[ tTime('잠시 후'), scr('kakaoConfirm') ],
    notes:[ note('scope','예약 정보 전달은 알림톡 본문이 담당','앱 딥링크를 버튼에 넣는 방식은 이미 실운영 중이라 추가 개발이 최소. 단 카카오 사전 심사 대상이므로 링크 구조는 승인된 형태로 고정하고 파라미터만 동적 처리해야 함.') ]
  });
  s.push({
    seg:'앱', app:'굿닥', title:'병원 상세 진입',
    blocks:[ scr('clinicDetail') ],
    notes:[ note('scope','예약을 마친 사용자의 목적지는 병원 상세','이미 예약한 사람에게 항목 상세의 ‘예약하기’를 보여주면 중복 예약으로 읽히고, 그 버튼은 현재 동작하지도 않음.','핵심') ]
  });
  s.push({
    seg:'앱', app:'굿닥', title:'예약 내역을 열면',
    blocks:[ scr('emptyList') ],
    notes:[ note('dev','로그인이 아니라 귀속이 문제','SKT 경유 예약은 파트너 채널 계정에 붙어 있어, 카카오 로그인을 해도 사용자 계정의 예약이 아님. 이 지점이 A-2를 검토하는 이유.') ]
  });
  s.push({ seg:'알림', app:'카카오톡', title:'리마인드', blocks:[ tTime('10월 14일 (화) 아침'), scr('kakaoRemind') ], notes:[ note('scope','A-1의 리마인드 버튼은 병원 정보까지','예약 상세로 보낼 수 없어 목적지가 병원 정보·길찾기로 제한됨. A-2로 전환하면 같은 자리에서 버튼이 ‘내 예약 보기’로 바뀜.') ] });
  return s;
}

function journeyA2(){
  var s = sharedCheckup();
  s.push({
    seg:'알림', app:'카카오톡', title:'알림톡 수신',
    blocks:[ tTime('잠시 후'), scr('kakaoConfirmClaim') ],
    notes:[ note('scope','본문은 A-1과 동일하고 버튼만 다름','버튼이 ‘내 예약 보기’로 바뀌며, 링크에는 일회성·만료형 토큰만 담음. 알림톡 버튼 URL은 파라미터 동적 치환이 가능해 구조상 성립.') ]
  });
  s.push({
    seg:'앱', app:'굿닥', title:'귀속 안내',
    blocks:[ scr('claim') ],
    notes:[ note('legal','토큰만으로 예약 내용을 노출하지 않음','링크에는 개인정보를 넣지 않고, 로그인 + 연락처 일치 확인을 거친 뒤 공개해 링크 유출 시 타인 예약 노출 위험을 차단.') ]
  });
  s.push({ seg:'앱', app:'굿닥', title:'카카오 로그인', blocks:[ scr('login') ], notes:[ note('data','인증 연락처 조회에 별도 동의가 필요한지 확인','로그인 계정의 인증 연락처를 조회해 예약과 대조하는 처리에 추가 동의 항목이 필요한지 확인 필요.') ] });
  s.push({
    seg:'앱', app:'굿닥', title:'귀속 완료',
    blocks:[ scr('claimed') ],
    notes:[ note('dev','연락처가 일치할 때만 이전','불일치 케이스(가족 번호 입력 등) 처리 정책이 필요하고, 예약 소유자를 파트너 채널 계정에서 회원 계정으로 바꾸는 처리가 가능한지 개발 확인이 필요함.') ]
  });
  s.push({
    seg:'앱', app:'굿닥', title:'예약 내역 표시',
    blocks:[ scr('list') ],
    notes:[
      note('scope','기존 회원 화면을 그대로 재사용','비회원 조회 기능 신설(조회 쿼리·조회번호 체계·비로그인 화면)보다 개발 효율이 좋고, 결과가 단순 조회가 아니라 회원 전환 + 예약 귀속.'),
      note('scope','A-1의 목적지 제약이 해소됨','귀속이 되면 딥링크 목적지를 병원 상세에서 예약 상세로 승격할 수 있음.')
    ]
  });
  s.push({ seg:'알림', app:'카카오톡', title:'리마인드', blocks:[ tTime('10월 14일 (화) 아침'), scr('kakaoRemindClaim') ], notes:[ note('scope','귀속 후에는 리마인드도 예약 상세로 연결','같은 자리에서 버튼만 ‘내 예약 보기’로 달라져, 두 안의 차이가 마지막 단계까지 이어짐.') ] });
  return s;
}

function journeyB(){
  var s = [];

function steps(){
  if (state.journey === 1) return journeyA2();
  if (state.journey === 2) return journeyB();
  return journeyA1();
}

function wrap(){
  if (state.journey === 1) return {
    title:'A-2. 앱 귀속형 · 패스트팔로우',

/* ---------- playback ------------------------------------------------------ */
function play(){
  clearInterval(timer);
  timer = setInterval(function(){
    var total = steps().length;
    if (state.step >= total - 1) { clearInterval(timer); state.playing = false; render(); }
    else { state.step = state.step + 1; render(); }
  }, AUTOPLAY_SPEED * 1000);
  state.playing = true;
}
function stop(){ clearInterval(timer); state.playing = false; }

function rowsHtml(rows, kStyle, vStyle){
  return rows.map(function(r){
    return '<div style="display:flex;align-items:baseline;gap:8px">'+
      '<span style="'+kStyle+'">'+r.k+'</span>'+
      '<span style="'+vStyle+'">'+r.v+'</span></div>';
  }).join('');
}
function tabBarHtml(){
  var items = ['홈','건강관리','내 진료','더보기'].map(function(label){ return { label:label, active:label==='내 진료' }; });
  return '<div style="flex:none;border-top:1px solid #EAEAEA;background:#fff;display:flex;padding:9px 0 11px">'+
    items.map(function(n){
      var icon = n.active
        ? '<span style="width:17px;height:17px;border-radius:5px;background:#191F28;display:block"></span>'
        : '<span style="width:17px;height:17px;border-radius:5px;border:1.5px solid #B0B8C1;display:block"></span>';
      var lab = n.active
        ? '<span style="font:600 9.5px/1 Pretendard,system-ui,sans-serif;color:#191F28">'+n.label+'</span>'
        : '<span style="font:500 9.5px/1 Pretendard,system-ui,sans-serif;color:#B0B8C1">'+n.label+'</span>';
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px">'+icon+lab+'</div>';
    }).join('')+'</div>';
}

      '<div style="max-width:76%;background:#5F45D6;color:#fff;font:400 13px/1.55 Pretendard,system-ui,sans-serif;padding:9px 12px;border-radius:14px 14px 4px 14px;word-break:keep-all">'+b.text+'</div>'+

      '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">'+ agentInnerHtml(b, ctx) +'</div>'+

    return '<div style="padding:0 12px"><div style="height:300px">'+ screenHtml(b.kind, ctx.apptTime, ctx.timeShort) +'</div></div>';
  }

      screenHtml(b.kind, ctx.apptTime, ctx.timeShort) +'</div>';
  }
  return '';
}

/* ---------- render vals (ported) ------------------------------------------ */
function renderVals(){
  var all = steps();
  var step = Math.min(state.step, all.length - 1);
  var cur = all[step];
  var stack = cur.app === 'A.' || cur.app === '카카오톡';

  var blocks = [];
  if (stack) {
    for (var i = 0; i <= step; i++) if (all[i].app === cur.app) blocks = blocks.concat(all[i].blocks);
    var keyOf = function(b){ return b.isSlots ? (b.hasDates ? 'slots' : 'alt') : b.isForm ? 'form' : (b.isCards && b.items.length > 2) ? 'cards' : null; };
    var firstAt = {};
    var outB = [];
    blocks.forEach(function(b){
      var k = keyOf(b);
      if (k == null) { outB.push(b); return; }
      if (firstAt[k] === undefined) { firstAt[k] = outB.length; outB.push(b); }
      else outB[firstAt[k]] = b;
    });
    blocks = outB;
  } else {
    blocks = cur.blocks;
  }

  var segOrder = [];
  all.forEach(function(s, i){
    var g = segOrder[segOrder.length - 1];
    if (!g || g.label !== s.seg) { g = { label:s.seg, dots:[] }; segOrder.push(g); }
    g.dots.push({ cur: i === step, done: i < step, todo: i > step, idx:i });
  });
  var segments = segOrder.map(function(g){
    return { label:g.label, dots:g.dots, on: g.dots.some(function(d){ return d.cur || d.done; }) };
  });

  var notes = cur.notes || [];
  var w = wrap();

  return {
    all: all, step: step, cur: cur, stack: stack,
    journeys: [
      { label:'A-1. 검진 예약 · 알림톡 완결형', tag:'베타', active: state.journey === 0, idx:0 },
      { label:'A-2. 검진 예약 · 앱 귀속형', tag:'패스트팔로우', active: state.journey === 1, idx:1 },
      { label:'B. 비대면진료', tag:'조건부 · 이관형', active: state.journey === 2, idx:2 }
    ],
    toggles: state.journey === 2 ? [] : [
      { label:'예약 시간 마감 케이스', on: state.closed, act:'tclosed' }
    ],
    noToggles: state.journey === 2,
    segments: segments,
    appName: cur.app === 'A.' ? '에이닷' : cur.app,
    appBg: cur.app === '카카오톡' ? '#B2C7D9' : (cur.app === '통화' ? '#191F28' : '#fff'),
    bodyPad: stack ? '14px 12px 20px' : '0',
    blocks: blocks,
    apptTime: apptTime(),
    timeShort: timeShort(),
    stepLabel: (step + 1) + ' / ' + all.length + ' 단계 · ' + cur.app,
    stepTitle: (step + 1) + '. ' + cur.title,
    playing: state.playing,
    atEnd: step >= all.length - 1,
    wrapTitle: w.title, wrapBody: w.body, wrapLimit: w.limit,
    hasNotes: notes.length > 0,
    noNotes: notes.length === 0,
    noteCount: notes.length,
    notes: notes,
    notesOpen: notes.length > 0
  };
}

/* ---------- events (delegated) -------------------------------------------- */
document.getElementById('root').addEventListener('click', function(e){
  var t = e.target;
  while (t && t !== this && !t.getAttribute('data-act')) t = t.parentNode;
  if (!t || t === this) return;
  var act = t.getAttribute('data-act');
  var total = steps().length;
  switch (act) {
    case 'journey': stop(); state.journey = parseInt(t.getAttribute('data-i'), 10); render(); break;
    case 'dot':     stop(); state.step = parseInt(t.getAttribute('data-i'), 10); render(); break;
    case 'tclosed': stop(); state.closed = !state.closed; state.step = Math.min(state.step, 4); render(); break;
    case 'prev':    stop(); state.step = Math.max(0, state.step - 1); render(); break;
    case 'next':    stop(); state.step = Math.min(total - 1, state.step + 1); render(); break;
    case 'play':
      if (state.playing) { stop(); render(); }
      else { if (state.step >= total - 1) state.step = 0; play(); render(); }
      break;
  }
});

    started = true;
    gate.parentNode.removeChild(gate);
    render();
  }
  function tryUnlock(){
    if (input.value === PW) {
      try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
      start();
    } else {
      errEl.textContent = '비밀번호가 올바르지 않습니다.';
      input.value = '';
      input.focus();
    }
  }

  var unlocked = false;
  try { unlocked = sessionStorage.getItem(KEY) === '1'; } catch (e) {}
  if (unlocked) { start(); return; }

  document.getElementById('gateBtn').addEventListener('click', tryUnlock);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryUnlock(); });
  input.focus();
})();
</script>
</body>
</html>
