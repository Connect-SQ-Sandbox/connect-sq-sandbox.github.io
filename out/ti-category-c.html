# KAK-001 \uC815\uCC45 \uC694\uC57D (\uD655\uC815 \uC804 \uC608\uC815 \uD654\uBA74)

> \uC774 \uBB38\uC11C\uB294 \uACF5\uAC1C \uD504\uB85C\uD1A0\uD0C0\uC785\uC5D0\uC11C \uC0AC\uC6A9\uD558\uB294 \uC815\uCC45 \uC694\uC57D\uC785\uB2C8\uB2E4. \uC6D0\uBCF8 PRD \uC804\uCCB4\uB97C \uBCF5\uC81C\uD558\uC9C0 \uC54A\uC73C\uBA70, \uC6D0\uBCF8 \uC815\uCC45\uC744 \uB3C5\uB9BD\uC801\uC73C\uB85C \uC218\uC815\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
> **\uD655\uC815 \uC804 \uAC80\uD1A0 \uB2E8\uACC4\uC785\uB2C8\uB2E4.** \uC544\uB798 \uD654\uBA74\uACFC \uBB38\uAD6C\uB294 \uC2B9\uC778 \uACFC\uC815\uC5D0\uC11C \uBCC0\uACBD\uB420 \uC218 \uC788\uC2B5\uB2C8\uB2E4.

**PRD ID:** \`KAK-001\`

## \uBAA9\uC801

- \uBCD1\uC6D0\uC774 \`\uC608\uC57D \uC790\uB3D9 \uD655\uC815\`\uC744 \uB044\uACE0 \uC6B4\uC601\uD558\uB354\uB77C\uB3C4, \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30\uB85C \uBC1B\uB294 \uC608\uC57D\uC740 \uC790\uB3D9\uC73C\uB85C \uD655\uC815\uB429\uB2C8\uB2E4.
- \uBCD1\uC6D0 \uB2F4\uB2F9\uC790\uAC00 \uC774 \uC608\uC678\uB97C \uBBF8\uB9AC \uC54C\uACE0, \uC2E4\uC81C\uB85C \uC801\uC6A9\uB41C \uC608\uC57D\uC744 \uD654\uBA74\uC5D0\uC11C \uAD6C\uBD84\uD560 \uC218 \uC788\uAC8C \uD569\uB2C8\uB2E4.

## \uC801\uC6A9 \uBC94\uC704

- \uAD00\uB9AC\uC790 \uD654\uBA74(Connect)\uB9CC \uBCC0\uACBD\uD569\uB2C8\uB2E4. \uD658\uC790\uAC00 \uC0AC\uC6A9\uD558\uB294 \uC608\uC57D \uC2E0\uCCAD \uD654\uBA74\uC740 \uBCC0\uACBD\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
- \uC548\uB0B4\uB294 \uC9C4\uB8CC \uC608\uC57D \uC124\uC815\uACFC \uC9C4\uB8CC\uD56D\uBAA9 \uC0C1\uC138 \uB450 \uD654\uBA74\uC5D0\uB9CC \uB123\uC2B5\uB2C8\uB2E4. \uC608\uC57D \uC2E0\uCCAD \uB0B4\uC5ED \uD654\uBA74\uC740 \uC774\uBC88 \uBC94\uC704\uC5D0\uC11C \uBCC0\uACBD\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
- \uAD7F\uB2E5\uC73C\uB85C \uBC1B\uB294 \uC608\uC57D\uC740 \uAE30\uC874\uACFC \uB3D9\uC77C\uD558\uAC8C \uBCD1\uC6D0\uC758 \`\uC608\uC57D \uC790\uB3D9 \uD655\uC815\` \uC124\uC815\uC744 \uB530\uB985\uB2C8\uB2E4.
- \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30\uC5D0\uC11C \uC218\uB3D9 \uD655\uC815\uC774 \uC9C0\uC6D0\uB418\uBA74 \uC608\uC678\uC640 \uAD00\uB828 \uC548\uB0B4\uB97C \uD568\uAED8 \uC81C\uAC70\uD569\uB2C8\uB2E4.

## \uD604\uC7AC \uD504\uB85C\uD1A0\uD0C0\uC785 \uBC18\uC601 \uAE30\uC900

### \uC9C4\uB8CC \uC608\uC57D \uC124\uC815

- \uC548\uB0B4\uB294 \`\uC608\uC57D \uC790\uB3D9 \uD655\uC815\` \uC124\uC815 \uD56D\uBAA9\uC758 **\uBC15\uC2A4 \uC548**\uC5D0 \uB123\uC2B5\uB2C8\uB2E4. \uC81C\uBAA9\xB7\uC124\uBA85\xB7\uD1A0\uAE00 \uD55C \uC904 \uC544\uB798\uC5D0 \uC804\uCCB4 \uD3ED\uC73C\uB85C \uBD99\uC5EC, \uC5B4\uB290 \uC124\uC815\uC758 \uC608\uC678\uC778\uC9C0 \uBD84\uB9AC\uB41C \uBC30\uB108\uBCF4\uB2E4 \uD655\uC2E4\uD558\uAC8C \uC77D\uD788\uB3C4\uB85D \uD569\uB2C8\uB2E4.
- \uC124\uC815\uC774 OFF(\uC218\uB3D9 \uD655\uC815)\uC77C \uB54C \uC548\uB0B4 \uBE14\uB85D\uC744 \uD45C\uC2DC\uD569\uB2C8\uB2E4. \uC81C\uBAA9 \`\uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30\uB85C \uBC1B\uB294 \uC608\uC57D\uC740 \uC790\uB3D9\uC73C\uB85C \uD655\uC815\uB429\uB2C8\uB2E4\`\uC640 \uC138 \uAC1C\uC758 \uC548\uB0B4\uB85C \uAD6C\uC131\uD569\uB2C8\uB2E4. \uC784\uC2DC \uC815\uCC45\uC774\uB77C\uB294 \uC0AC\uC2E4, \uAD7F\uB2E5 \uC608\uC57D\uC758 \uC801\uC6A9 \uBC94\uC704, \uC9C4\uB8CC\uD558\uAE30 \uC5B4\uB824\uC6B4 \uC608\uC57D\uC740 \uC608\uC57D \uC2E0\uCCAD \uB0B4\uC5ED\uC5D0\uC11C \uCDE8\uC18C\uD560 \uC218 \uC788\uB2E4\uB294 \uC548\uB0B4 \uC21C\uC785\uB2C8\uB2E4.
- \uC124\uC815\uC774 ON\uC77C \uB54C\uB294 \uC124\uBA85 \uC544\uB798\uC5D0 \uD55C \uC904\uB9CC \uD45C\uC2DC\uD569\uB2C8\uB2E4. \uBB38\uAD6C\uB294 \`\uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30\uB85C \uBC1B\uB294 \uC608\uC57D\uC740 \uC774 \uC124\uC815\uACFC \uAD00\uACC4\uC5C6\uC774 \uC790\uB3D9\uC73C\uB85C \uD655\uC815\uB429\uB2C8\uB2E4.\`\uC785\uB2C8\uB2E4. OFF\uC77C \uB54C\uB294 \uC548\uB0B4 \uBE14\uB85D\uC774 \uAC19\uC740 \uB0B4\uC6A9\uC744 \uB354 \uC790\uC138\uD788 \uB9D0\uD558\uBBC0\uB85C \uC774 \uD55C \uC904\uC740 \uD45C\uC2DC\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
- \uC548\uB0B4 \uBE14\uB85D\uC740 \uB2EB\uC744 \uC218 \uC5C6\uC73C\uBA70, \uC124\uC815\uC744 \uB2E4\uC2DC ON\uC73C\uB85C \uBC14\uAFB8\uBA74 \uC989\uC2DC \uD55C \uC904 \uC548\uB0B4\uB85C \uBC14\uB01D\uB2C8\uB2E4.
- \uC124\uC815\uC744 ON\uC5D0\uC11C OFF\uB85C \uBC14\uAFB8\uB294 \uC2DC\uC810\uC5D0 \uD655\uC778 \uBAA8\uB2EC\uC744 \uD45C\uC2DC\uD569\uB2C8\uB2E4. \uC9C4\uD589 \uBC84\uD2BC\uC740 \`\uC790\uB3D9 \uD655\uC815 \uB044\uAE30\`\uC774\uBA70, \uCDE8\uC18C\uD558\uBA74 \uC124\uC815\uC740 ON \uC0C1\uD0DC\uB85C \uC720\uC9C0\uB429\uB2C8\uB2E4.
- \uC548\uB0B4 \uD1A4\uC740 \uC624\uB958\uAC00 \uC544\uB2CC \uC8FC\uC758 \uC0AC\uD56D\uC73C\uB85C \uCC98\uB9AC\uD569\uB2C8\uB2E4.

### \uC9C4\uB8CC\uD56D\uBAA9 \uC0C1\uC138

- \uBCD1\uC6D0\uC774 \uC218\uB3D9 \uD655\uC815\uC73C\uB85C \uC6B4\uC601 \uC911\uC77C \uB54C, \`\uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30\uC5D0\uC11C\uB3C4 \uBCF4\uC774\uAE30\` \uD1A0\uAE00\uC758 \uC124\uBA85 \uC601\uC5ED\uC5D0 \`\uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30\uB85C \uBC1B\uB294 \uC608\uC57D\uC740 \uC790\uB3D9\uC73C\uB85C \uD655\uC815\uB429\uB2C8\uB2E4.\`\uB97C \uD55C \uC904\uB85C \uD45C\uC2DC\uD569\uB2C8\uB2E4. \uAD7F\uB2E5 \uC608\uC57D\uC758 \uC801\uC6A9 \uBC94\uC704\uB294 \uBCD1\uC6D0 \uB2E8\uC704 \uC774\uC57C\uAE30\uB77C \uC9C4\uB8CC \uC608\uC57D \uC124\uC815\uC5D0\uC11C\uB9CC \uC548\uB0B4\uD569\uB2C8\uB2E4.
- \uD1A0\uAE00\uC744 \uCF1C\uB294 \uC2DC\uC810\uC5D0\uB294 \uBCC4\uB3C4 \uD655\uC778 \uBAA8\uB2EC\uC744 \uB450\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uD56D\uBAA9\uC744 \uC5EC\uB7EC \uAC1C \uC124\uC815\uD560 \uB54C \uBC18\uBCF5 \uD655\uC778\uC774 \uB418\uC9C0 \uC54A\uB3C4\uB85D \uC124\uBA85 \uBB38\uAD6C\uB85C\uB9CC \uC548\uB0B4\uD569\uB2C8\uB2E4.

## \uBB38\uAD6C \uC6D0\uCE59

- \uC138 \uC9C0\uC810(\uC9C4\uB8CC\uD56D\uBAA9 \uC0C1\uC138 \xB7 \uC9C4\uB8CC \uC608\uC57D \uC124\uC815 \xB7 \uC804\uD658 \uD655\uC778 \uBAA8\uB2EC)\uC774 \uAC19\uC740 \uBB38\uC7A5\uC744 \uC870\uD569\uB9CC \uB2EC\uB9AC\uD574 \uC501\uB2C8\uB2E4. \uD654\uBA74\uB9C8\uB2E4 \uD45C\uD604\uC744 \uBC14\uAFB8\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
- \uACE0\uC815 \uC5B4\uD718 \u2014 \uB300\uC0C1\uC740 \`\uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30\uB85C \uBC1B\uB294 \uC608\uC57D\`, \uB300\uBE44\uB294 \`\uAD7F\uB2E5\uC73C\uB85C \uBC1B\uB294 \uC608\uC57D\`, \uBCD1\uC6D0 \uC124\uC815\uC740 \`\uC218\uB3D9 \uD655\uC815 \uC124\uC815\`, \uACB0\uACFC\uB294 \`\uC790\uB3D9\uC73C\uB85C \uD655\uC815\uB429\uB2C8\uB2E4\`\uC785\uB2C8\uB2E4.
- \uB098\uC5F4 \uC21C\uC11C\uB294 \uD1B5\uBCF4(\uC81C\uBAA9) \u2192 \uC774\uC720 \u2192 \uAD7F\uB2E5 \uC801\uC6A9 \uBC94\uC704 \u2192 \uB300\uCC98\uC785\uB2C8\uB2E4. \uC81C\uBAA9\uC774 \uBCD1\uC6D0 \uC124\uC815\uACFC \uBC18\uB300\uB418\uB294 \uC0AC\uC2E4\uC744 \uC54C\uB9AC\uBBC0\uB85C \uB3C5\uC790\uC758 \uCCAB \uC9C8\uBB38\uC778 \`\uC65C\`\uC5D0 \uBA3C\uC800 \uB2F5\uD558\uACE0, \uB300\uCC98 \uBC29\uBC95\uC744 \uB05D\uC5D0 \uB450\uC5B4 \uB9C8\uC9C0\uB9C9 \uC778\uC0C1\uC774 \uB0A8\uAC8C \uD569\uB2C8\uB2E4.
- \uC815\uBCF4\uB7C9\uC740 \uD654\uBA74 \uC131\uACA9\uC5D0 \uB530\uB985\uB2C8\uB2E4. \uC2A4\uCCD0 \uBCF4\uB294 \uC9C4\uB8CC\uD56D\uBAA9 \uC0C1\uC138\uB294 \uC0AC\uC2E4 \uD55C \uBB38\uC7A5, \uACB0\uC815\uD558\uB294 \uC124\uC815 \uD654\uBA74\uC740 \uC804\uBD80, \uC804\uD658 \uC2DC\uC810\uC758 \uBAA8\uB2EC\uC740 \uC0AC\uC2E4\uACFC \uADFC\uAC70\uB9CC \uB2F4\uC2B5\uB2C8\uB2E4.

## \uB178\uCD9C \uC870\uAC74
