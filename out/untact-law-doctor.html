/* styles/connectShell.css */
/* =============================================================
   굿닥 커넥트 웹뷰 — 공통 셸 (디자인 토큰 + 윈도우 셸/사이드내비)
   여러 커넥트 화면(진료항목 등록, 예약 신청 내역 등)이 공유한다.
   - /Users/goodoc/test 프로토타입의 colors_and_type.css(:root)와
     connect.css의 셸 부분을 이식.
   - 전역 누수 방지를 위해 원본 body 레벨 스타일은 .cn-artboard 래퍼로
     한정했고 리셋도 .cn-artboard 하위로 스코프.
   - 클래스 접두사(cn-)가 고유해 다른 페이지와 충돌하지 않음.
   ============================================================= */

/* ---- Design tokens (colors_and_type.css :root, @font-face 제외) ---- */
:root {
  --gray-10:  #F9FAFB;
  --gray-15:  #F4F6F8;
  --gray-20:  #F2F4F6;
  --gray-30:  #E5E8EB;
  --gray-40:  #D1D6DB;
  --gray-50:  #B0B8C1;
  --gray-60:  #8B95A1;
  --gray-70:  #6B7684;
  --gray-80:  #4E5968;
  --gray-90:  #31353F;
  --gray-100: #191F28;

  --blue-30:  #B3D5FF;
  --blue-60:  #0073FA;
  --blue-70:  #0061DB;
  --blue-80:  #0050B5;

  --red-60:   #FA4655;
  --red-70:   #EC3847;
  --red-80:   #D52130;

  --green-70: #41D293;
  --green-80: #1FA972;
  --orange-60:#F79009;

  --white: #FFFFFF;
  --black: #000000;
  --transparent: transparent;

  --alpha-gray-05: rgba(128, 135, 153, 0.05);
  --alpha-gray-10: rgba(128, 135, 153, 0.10);
  --alpha-gray-15: rgba(128, 135, 153, 0.15);
  --alpha-gray-20: rgba(128, 135, 153, 0.20);
  --alpha-gray-40: rgba(128, 135, 153, 0.40);
  --alpha-gray-60: rgba(128, 135, 153, 0.60);

  --alpha-blue-05: rgba(0, 115, 250, 0.05);
  --alpha-blue-10: rgba(0, 115, 250, 0.10);
  --alpha-blue-15: rgba(0, 115, 250, 0.15);
  --alpha-blue-20: rgba(0, 115, 250, 0.20);

  --alpha-red-05: rgba(250, 70, 85, 0.05);
  --alpha-red-10: rgba(250, 70, 85, 0.10);
  --alpha-red-15: rgba(250, 70, 85, 0.15);
  --alpha-red-20: rgba(250, 70, 85, 0.20);

  --shadow-toast: 0 2px 1px rgba(22, 24, 29, 0.02), 0 2px 8px rgba(22, 24, 29, 0.10);
  --shadow-toggle-knob: 0 0 6px rgba(0, 0, 0, 0.25);

  --font-sans: 'Pretendard', 'Pretendard Variable', -apple-system,
    BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}

/* ---- Artboard backdrop (원본 connect.css의 body 스타일을 래퍼로 한정) ---- */
.cn-artboard {
  font-family: var(--font-sans);
  background: #e7e9ee;
  color: var(--gray-100);
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 24px;
}
.cn-artboard *,
.cn-artboard *::before,
.cn-artboard *::after { box-sizing: border-box; }

/* ---- App window (1280 x 832 rounded webview frame) ---- */
.cn-screen {
  width: 1280px;
  min-height: 832px;
  background: var(--white);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 12px 40px rgba(22, 24, 29, 0.12);
  position: relative;
}

/* ---- Title bar (windows-style) ---- */
.cn-titlebar {
  height: 32px;
  background: #f3f3f3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: none;
}
.cn-ci { display: flex; align-items: center; gap: 4px; padding: 0 8px; height: 100%; }
.cn-ci-mark { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
.cn-ci-mark svg { display: block; }
.cn-ci-name { font: 500 13px/16px var(--font-sans); color: rgba(0, 0, 0, 0.9); padding: 0 8px 2px 4px; }
.cn-winctrls { display: flex; height: 100%; }
.cn-winbtn {
  width: 46px; height: 32px;
  border: 0; background: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  color: rgba(0, 0, 0, 0.9); cursor: pointer;
}
.cn-winbtn:hover { background: rgba(0, 0, 0, 0.05); }
.cn-winbtn.close:hover { background: #e81123; color: #fff; }

/* ---- Body: nav + main ---- */
.cn-body { display: flex; align-items: stretch; flex: 1; min-height: 800px; }

/* ---- Side nav (250px) ---- */
.cn-nav { width: 250px; flex: none; background: #f2f4f7; position: relative; display: flex; flex-direction: column; }
.cn-nav-scroll { flex: 1; overflow: auto; }
.cn-nav-group { padding: 8px 0; display: flex; flex-direction: column; }
.cn-nav-header { height: 40px; display: flex; align-items: center; padding: 0 16px; font: 600 14px/20px var(--font-sans); color: rgba(0, 0, 0, 0.9); }
.cn-nav-item {
  height: 40px; width: 100%;
  border: 0; background: transparent;
  display: flex; align-items: center;
  padding: 0 16px; position: relative; cursor: pointer; text-align: left;
}
.cn-nav-item > .cn-nav-label { font: 400 14px/22px var(--font-sans); color: var(--gray-90); flex: 1; }
.cn-nav-item .cn-chevron { width: 12px; height: 12px; color: #808799; flex: none; display: inline-flex; align-items: center; justify-content: center; }
.cn-nav-item.sub { padding-left: 32px; }
.cn-nav-item.sub::before { content: ""; position: absolute; inset: 2px 4px; border-radius: 4px; pointer-events: none; }
.cn-nav-item.active::before { background: var(--alpha-gray-10); }
.cn-nav-item.active .cn-nav-label { color: var(--gray-90); }
.cn-nav-item:not(.active):not(.cn-nav-header):hover::before {
  content: ""; position: absolute; inset: 2px 4px;
  background: rgba(128, 135, 153, 0.06); border-radius: 4px; pointer-events: none;
}
.cn-nav-label-wrap { display: inline-flex; align-items: center; gap: 6px; flex: 1; }
.cn-beta {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 5px; border-radius: 4px;
  background: var(--alpha-blue-10);
  font: 600 12px/18px var(--font-sans);
  color: var(--blue-80, #115fd4);
}
.cn-nav-divider { padding: 4px 0; }
.cn-nav-divider span { display: block; height: 1px; background: var(--gray-30); }
.cn-nav-footer { background: #f2f4f7; padding-bottom: 8px; display: flex; flex-direction: column; }

/* ---- Main frame ---- */
.cn-main { flex: 1; min-width: 0; background: var(--white); display: flex; flex-direction: column; }
.cn-header { padding: 48px 64px 32px; }
.cn-header-title { font: 700 28px/36px var(--font-sans); color: #16181d; }
.cn-header-desc { font: 400 14px/22px var(--font-sans); color: #808799; margin-top: 6px; }


/* styles/prototypeChanges.css */
/* 프로토타입 메타 UI: 실제 Connect 기능이 아니라 정책 변경 추적용 패널 */
.pc-trigger {
  position: fixed; top: 72px; right: 0; z-index: 105;
  height: 40px; padding: 0 12px 0 10px; border: 1px solid var(--gray-30); border-right: 0;
  border-radius: 8px 0 0 8px; background: var(--gray-100); color: var(--white);
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  font: 600 12px/18px var(--font-sans); box-shadow: 0 4px 16px rgba(22,24,29,.14);
}
.pc-trigger:hover { background: var(--gray-90); }
.pc-trigger-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-70); }
.pc-trigger-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: rgba(255,255,255,.16); font: 700 11px/18px var(--font-sans); }

/* 딤 제거: 우측 패널을 비모달로 (열어둔 채 본문 확인·조작 가능) */
.pc-scrim { display: none; }
.pc-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 120; width: 392px;
  background: var(--white); box-shadow: -12px 0 32px rgba(22,24,29,.14);
  display: flex; flex-direction: column; transform: translateX(102%); visibility: hidden;
  transition: transform .2s ease, visibility .2s;
}
.pc-drawer.open { transform: translateX(0); visibility: visible; }
.pc-drawer-head { min-height: 52px; padding: 0 18px; border-bottom: 1px solid var(--gray-20); display: flex; align-items: center; justify-content: space-between; flex: none; }
.pc-eyebrow { font: 700 11px/16px var(--font-sans); letter-spacing: .08em; color: var(--blue-70); }
.pc-close { width: 32px; height: 32px; border-radius: 6px; color: var(--gray-70); font: 400 24px/30px var(--font-sans); cursor: pointer; }
.pc-close:hover, .pc-back:hover { background: var(--gray-10); }
.pc-back { height: 32px; padding: 0 8px; border-radius: 6px; color: var(--gray-80); font: 600 13px/32px var(--font-sans); cursor: pointer; }

.pc-drawer-title-wrap { padding: 22px 20px 16px; flex: none; }
.pc-drawer-title-wrap h2 { margin: 0; font: 700 22px/30px var(--font-sans); color: var(--gray-100); }
.pc-drawer-title-wrap p { margin: 7px 0 0; font: 400 13px/20px var(--font-sans); color: var(--gray-70); }
.pc-planned-filter { margin-top: 16px; padding: 12px 13px; border: 1px solid var(--gray-30); border-radius: 9px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pc-planned-filter > div { min-width: 0; display: flex; flex-direction: column; }
.pc-planned-filter strong { color: var(--gray-90); font: 600 13px/19px var(--font-sans); }
.pc-planned-filter span { color: var(--gray-60); font: 400 11px/17px var(--font-sans); }
.pc-switch { width: 40px; height: 24px; padding: 2px; border-radius: 999px; background: var(--gray-40); cursor: pointer; transition: background .15s; flex: none; }
.pc-switch > span { display: block; width: 20px; height: 20px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 4px rgba(22,24,29,.18); transition: transform .15s; }
.pc-switch.on { background: #f79009; }
.pc-switch.on > span { transform: translateX(16px); }
.pc-planned-notice { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: rgba(247,144,9,.09); color: #9a5800; font: 500 11px/17px var(--font-sans); }
.pc-dev-filter { margin-top: 10px; border-color: rgba(234, 179, 8, .48); background: #fffdf2; }
.pc-dev-notice { margin-top: 8px; padding: 8px 10px; border: 1px solid rgba(234, 179, 8, .35); border-radius: 6px; background: #fff8cf; color: #745300; font: 600 11px/17px var(--font-sans); }
.pc-dev-marker-layer { position: fixed; inset: 0; z-index: 110; pointer-events: none; }
.pc-dev-marker-layer, .pc-dev-marker-layer *, .pc-dev-marker-layer *::before, .pc-dev-marker-layer *::after { box-sizing: border-box; }
.pc-dev-marker-shell { position: fixed; width: 30px; height: 30px; pointer-events: auto; }
.pc-dev-marker {
  position: relative; z-index: 2; width: 30px; height: 30px; border: 2px solid var(--white); border-radius: 50%;
  background: #e0a600; color: var(--white); cursor: help; box-shadow: 0 3px 10px rgba(116,83,0,.30), 0 0 0 2px rgba(224,166,0,.18);
  font: 800 12px/26px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center;
  transition: transform .14s ease, background .14s ease, box-shadow .14s ease;
}
.pc-dev-marker:hover, .pc-dev-marker:focus-visible { background: #c98e00; box-shadow: 0 5px 16px rgba(116,83,0,.38), 0 0 0 3px rgba(224,166,0,.22); outline: none; transform: scale(1.08); }
.pc-dev-marker-tooltip {
  position: absolute; z-index: 1; width: min(350px, calc(100vw - 24px)); max-height: min(420px, calc(100vh - 48px));
  padding: 13px 14px 14px; overflow: auto; border: 1px solid #e4b82f; border-radius: 12px; background: #fffdf1;
  color: #5f4700; box-shadow: 0 12px 32px rgba(72,54,0,.20); visibility: hidden; opacity: 0; pointer-events: none;
  transition: opacity .12s ease, transform .12s ease, visibility .12s;
}
.pc-dev-marker-shell.place-left .pc-dev-marker-tooltip { right: 0; }
.pc-dev-marker-shell.place-right .pc-dev-marker-tooltip { left: 0; }
.pc-dev-marker-shell.place-below .pc-dev-marker-tooltip { top: calc(100% + 9px); transform: translateY(-4px); }
.pc-dev-marker-shell.place-above .pc-dev-marker-tooltip { bottom: calc(100% + 9px); transform: translateY(4px); }
.pc-dev-marker-shell:hover .pc-dev-marker-tooltip,
.pc-dev-marker-shell:focus-within .pc-dev-marker-tooltip { visibility: visible; opacity: 1; pointer-events: auto; transform: translateY(0); }
.pc-dev-marker-tooltip-head { display: grid; grid-template-columns: 26px 1fr; gap: 9px; align-items: start; }
.pc-dev-marker-tooltip-head > span { width: 26px; height: 26px; border-radius: 50%; background: #e0a600; color: var(--white); font: 800 11px/26px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; }
.pc-dev-marker-tooltip-head > div { min-width: 0; display: flex; flex-direction: column; }
.pc-dev-marker-tooltip-head small { color: #9a6b00; font: 700 9px/14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
.pc-dev-marker-tooltip-head strong { margin-top: 1px; color: #4d3900; font: 700 13px/19px var(--font-sans); word-break: keep-all; }
.pc-dev-marker-tooltip ul { margin: 10px 0 0; padding: 9px 0 0 17px; border-top: 1px solid rgba(224,166,0,.24); }
.pc-dev-marker-tooltip li { margin-top: 5px; color: #5f4700; font: 500 11px/18px var(--font-sans); word-break: keep-all; }
.pc-dev-marker-tooltip li:first-child { margin-top: 0; }
.pc-dev-marker-tooltip code { padding: 1px 4px; border-radius: 4px; background: rgba(116,83,0,.10); color: #604700; font: 600 10px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-current-view { display: inline-flex; margin-top: 12px; padding: 5px 9px; border-radius: 6px; background: var(--alpha-blue-10); color: var(--blue-70); font: 600 12px/18px var(--font-sans); }
.pc-scope { margin: 0 20px; padding: 3px; border-radius: 8px; background: var(--gray-20); display: grid; grid-template-columns: 1fr 1fr; flex: none; }
.pc-scope button { height: 34px; border-radius: 6px; color: var(--gray-70); cursor: pointer; font: 600 13px/34px var(--font-sans); }

.pc-change-list {

  overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable;
  display: flex; flex-direction: column; gap: 12px;
}
.pc-empty { padding: 40px 12px; text-align: center; color: var(--gray-60); font: 400 13px/20px var(--font-sans); }
.pc-change-card { flex: 0 0 auto; border: 1px solid var(--gray-30); border-radius: 10px; overflow: hidden; background: var(--white); transition: border-color .12s, box-shadow .12s; }
.pc-change-card:hover { border-color: var(--gray-50); box-shadow: 0 4px 16px rgba(22,24,29,.06); }
.pc-change-card.planned { border-color: rgba(247,144,9,.36); background: linear-gradient(180deg, rgba(247,144,9,.035), var(--white) 40%); }

.pc-document-body .pc-summary-source { margin-top: 0; }
.pc-document-body .pc-markdown { max-width: 760px; margin: 24px auto 0; }
.pc-document-body .pc-markdown h1 { font-size: 25px; line-height: 34px; }
.pc-document-body .pc-markdown h2 { margin-top: 28px; font-size: 18px; line-height: 27px; }
.pc-document-body .pc-markdown p, .pc-document-body .pc-md-li { font-size: 14px; line-height: 23px; }

.pc-summary-view { padding: 20px 20px 32px; overflow: auto; }
.pc-summary-meta { display: flex; align-items: center; gap: 7px; }
.pc-summary-release { margin-top: 10px; color: #9a5800; font: 600 12px/18px var(--font-sans); }
.pc-summary-source { margin-top: 10px; padding: 10px 12px; border-radius: 7px; background: var(--gray-10); color: var(--gray-60); font: 500 11px/17px var(--font-sans); word-break: break-all; }
.pc-markdown { margin-top: 18px; }
.pc-markdown h1 { margin: 0 0 16px; color: var(--gray-100); font: 700 21px/29px var(--font-sans); }
.pc-markdown h2 { margin: 22px 0 9px; color: var(--gray-100); font: 700 16px/24px var(--font-sans); }
.pc-markdown h3 { margin: 18px 0 8px; color: var(--gray-90); font: 700 14px/22px var(--font-sans); }
.pc-markdown p { margin: 0; color: var(--gray-70); font: 400 13px/21px var(--font-sans); }
.pc-markdown blockquote { margin: 0 0 16px; padding: 12px 14px; border-left: 3px solid var(--blue-60); background: var(--alpha-blue-05); color: var(--gray-80); font: 500 12px/20px var(--font-sans); }
.pc-markdown code { padding: 2px 5px; border-radius: 4px; background: var(--gray-20); color: var(--gray-80); font: 500 11px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-md-li { display: grid; grid-template-columns: 10px 1fr; gap: 5px; align-items: start; margin-top: 5px; }
.pc-md-li > span { color: var(--blue-60); font: 700 13px/21px var(--font-sans); }
.pc-md-gap { height: 6px; }

.pc-policy-highlight { animation: pc-policy-pulse 2.4s ease; outline: 3px solid var(--blue-60); outline-offset: 4px; border-radius: 8px; }
.pc-planned-row-badge { display: inline-flex; margin-left: 6px; padding: 1px 5px; border-radius: 4px; background: rgba(247,144,9,.12); color: #9a5800; vertical-align: 1px; font: 700 10px/15px var(--font-sans); }
@keyframes pc-policy-pulse {
  0%, 100% { outline-color: transparent; box-shadow: none; }
  15%, 70% { outline-color: var(--blue-60); box-shadow: 0 0 0 8px var(--alpha-blue-10); }
}

@media (max-width: 1100px) {
  .pc-drawer { width: min(392px, calc(100% - 24px)); }
  .pc-scrim { left: 0; }
  .pc-document-overlay { padding: 20px; }
  .pc-document-modal { width: calc(100vw - 40px); height: calc(100vh - 40px); }
  .pc-document-body { padding: 20px 22px 32px; }
}


/* styles/untactLawDoctor.css */
/* untact-law-doctor — 굿닥 온라인진료실(의사용) · 제도화 대응
   치수·색은 goodoc-web-platform apps/partners online-clinic(tailwind 클래스) 값을 그대로 옮김. */

.uld-root {
  --gray-10: #f9f9fb;
  --gray-15: #f6f7f9;
  --gray-20: #f2f4f7;
  --gray-30: #e3e6ed;
  --gray-40: #caced8;
  --gray-50: #a8aebd;
  --gray-60: #808799;
  --gray-70: #5d6474;
  --gray-80: #434956;
  --gray-90: #31353f;
  --gray-100: #16181d;
  --blue-10: #f5faff;
  --blue-20: #e5f2ff;
  --blue-60: #0073fa;
  --blue-70: #066ae5;
  --red-10: #fff6f6;
  --red-60: #fa4655;
  --green-60: #12b76a;
  --white: #ffffff;
  --note: #7a4ff0;

  min-height: 100vh;
  background: #d9dce3;
  font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  font-size: 13px;
  line-height: 1.5;
  color: var(--gray-100);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 24px;
  padding: 24px 16px 48px;
  box-sizing: border-box;
}
.uld-root *,
.uld-root *::before,
.uld-root *::after {
  box-sizing: border-box;
}
.uld-root button {
  font-family: inherit;
}

/* ───────── 좌측 상태 패널 (프로토 메타) ───────── */
.uld-panel {
  width: 280px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: sticky;
  top: 24px;
}
.uld-panel-card {
  background: var(--white);
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
}
.uld-panel-title {
  font-size: 16px;
  font-weight: 700;
  line-height: 24px;
  margin: 0 0 4px;
}
.uld-panel-sub {
  font-size: 12px;
  line-height: 18px;
  color: var(--gray-60);
  margin: 0;
  word-break: keep-all;
}
.uld-panel-h {
  font-size: 12px;
  font-weight: 700;
  line-height: 18px;
  color: var(--gray-70);
  margin: 0 0 8px;
}
.uld-panel-result {
  margin: 8px 0 0;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--gray-15);
  font-size: 12px;
  line-height: 18px;
  color: var(--gray-80);
  word-break: keep-all;
}
.uld-jumps {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.uld-jump {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  text-align: left;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  font-size: 13px;
  line-height: 20px;
  color: var(--gray-80);
  cursor: pointer;
}
.uld-jump:hover {
  background: var(--gray-15);
}
.uld-jump.is-on {
  background: var(--blue-10);
  border-color: var(--blue-60);
  color: var(--blue-60);
  font-weight: 600;
}
.uld-badge {
  flex-shrink: 0;
  font-size: 11px;
  line-height: 16px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 4px;
}
.uld-badge.is-new {
  background: #efe9fe;
  color: var(--note);
}
.uld-badge.is-mod {
  background: #fff3e0;
  color: #c26a00;
}
.uld-ctl {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.uld-ctl-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.uld-ctl-label {
  font-size: 12px;
  line-height: 18px;
  font-weight: 600;
  color: var(--gray-70);
}
.uld-seg {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.uld-seg button {
  flex: 1 1 auto;
  min-width: 0;
  padding: 6px 8px;
  border-radius: 6px;
  border: 1px solid var(--gray-30);
  background: var(--white);
  font-size: 12px;
  line-height: 18px;
  color: var(--gray-70);
  cursor: pointer;
  word-break: keep-all;
}
.uld-seg button.is-on {
  border-color: var(--gray-80);
  background: var(--gray-80);
  color: var(--white);
  font-weight: 600;
}
.uld-seg button:disabled {
  color: var(--gray-40);
  background: var(--gray-10);
  cursor: not-allowed;
}
.uld-note {
  font-size: 12px;
  line-height: 18px;
  color: var(--gray-70);
  margin: 0;
  padding-left: 14px;
  word-break: keep-all;
}
.uld-note li {
  list-style: disc;
  margin-bottom: 4px;
}

/* ───────── 온라인진료실 프레임 (partners online-clinic 값) ───────── */
.uld-stage {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}
.uld-stage-cap {
  font-size: 12px;
  line-height: 18px;
  color: var(--gray-70);
}
.uld-frame {
  position: relative;
  width: 1172px;
  min-height: 900px;
  background: #f6f7f9;
  border-radius: 8px;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
  color: #16181d;
  font-size: 14px;
}
.uld-root .is-changed {
  outline: 1.5px dashed var(--note);
  outline-offset: 3px;
}

/* GNB — workspace.tsx */
.uld-gnb {
  background: #fff;
  border-bottom: 1px solid #e3e6ed;
  border-radius: 8px 8px 0 0;
}
.uld-gnb-inner {
  max-width: 1140px;
  margin: 0 auto;
  display: flex;
  align-items: center;
}
.uld-logo {
  display: block;
  margin: 18px 80px 18px 0;
}
.uld-tabs {
  display: flex;
  align-items: stretch;
  gap: 48px;
  padding: 0 24px;
  align-self: stretch;
}
.uld-tabs span {
  display: flex;
  align-items: center;
  min-height: 64px;
  border-bottom: 2px solid transparent;
  font-size: 16px;
  line-height: 150%;
  color: #808799;
}
.uld-tabs span.is-on {
  border-color: #5d6474;
  font-weight: 700;
  color: #16181d;
}
.uld-me-wrap {
  position: relative;
  margin-left: auto;
}
.uld-me {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  font-size: 14px;
  font-weight: 600;
  color: #434956;
  cursor: pointer;
}
.uld-me:hover {
  background: rgba(0, 0, 0, 0.05);
}
.uld-me-caret {
  margin-left: 4px;
}
.uld-avatar {
  position: relative;
  display: inline-flex;
  flex-shrink: 0;
}
.uld-avatar img {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  border: 1px solid rgba(0, 0, 0, 0.05);
  object-fit: cover;
}
.uld-avatar-dot {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 2px solid #fff;
  background: #a8aebd;
}

/* 프로필 메뉴 — profile-menu.tsx */
.uld-menu {
  position: absolute;
  right: 0;
  top: calc(100% - 4px);
  z-index: 40;
  width: 240px;
  border-radius: 8px;
  background: #fff;
  box-shadow: 0 2px 1px rgba(22, 24, 29, 0.02), 0 2px 8px rgba(22, 24, 29, 0.1);
}
.uld-menu-top {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px;
}
.uld-menu-me {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  color: #434956;
}
.uld-menu-chip {
  margin-left: auto;
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(128, 135, 153, 0.1);
  font-size: 12px;
  font-weight: 700;
  color: #5d6474;
}
.uld-menu-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 600;
  line-height: 150%;
  color: #5d6474;
}
.uld-menu-select {
  height: 32px;
  width: 100%;
  padding: 0 12px;
  border: 1px solid #e3e6ed;
  border-radius: 4px;
  background: #fff;
  font-size: 13px;
  font-weight: 600;
  color: #5d6474;
}
.uld-menu-links {
  display: flex;
  flex-direction: column;
  border-top: 1px solid #f2f4f7;
  padding: 8px 16px;
}
.uld-menu-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9.5px 0;
  font-size: 14px;
  font-weight: 600;
  color: #5d6474;
}
.uld-menu-logout {
  display: block;
  border-top: 1px solid #f2f4f7;
  padding: 17.5px 16px;
  font-size: 14px;
  font-weight: 600;
  color: #5d6474;
}

/* 스위치 — Switch.Root h-5 w-9 */
.uld-switch {
  position: relative;
  display: inline-flex;
  align-items: center;
  width: 36px;
  height: 20px;
  padding: 2px;
  border: 0;
  border-radius: 999px;
  background: #e3e6ed;
  cursor: pointer;
  flex-shrink: 0;
}
.uld-switch span {
  display: block;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 6px rgba(0, 0, 0, 0.25);
  transition: transform 0.4s;
}
.uld-switch.is-on {
  background: #0073fa;
}
.uld-switch.is-on span {
  transform: translateX(16px);
}

/* 본문 — main max-w 1140 p-4 */
.uld-main {
  max-width: 1140px;
  margin: 0 auto;
  padding: 0 0 40px;
}
.uld-page-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 32px 0 16px;
}
.uld-page-head h1,
.uld-h2 {
  margin: 0;
  padding: 3px 0;
  font-size: 20px;
  line-height: 150%;
  font-weight: 700;
  color: #434956;
}
.uld-h2 {
  margin: 32px 0 16px;
}
.uld-page-toggles {
  display: flex;
  gap: 12px;
}
.uld-page-toggles span {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  color: #5d6474;
}

/* 표 — treatment-table.tsx */
.uld-thead {
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-size: 13px;
  color: #808799;
}
.uld-thead > span {
  min-width: 0;
  padding: 10px 12px;
  font-weight: 500;
}
.uld-rows {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.uld-row-card {
  border-radius: 8px;
  background: #fff;
  border: 1px solid transparent;
  box-shadow: 0 1px 0 rgba(22, 24, 29, 0.03), 0 2px 4px rgba(22, 24, 29, 0.05);
}
.uld-row-card.is-open {
  border-color: #e3e6ed;
}
.uld-row {
  display: flex;
  align-items: center;
  width: 100%;
  padding: 0 16px;
  border: 0;
  background: transparent;
  text-align: left;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  color: #5d6474;
  cursor: pointer;
}
.uld-cell {
  min-width: 0;
  padding: 10px 12px;
  line-height: 150%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.uld-caret {
  padding: 20px 8px;
  text-align: right;
  transition: transform 0.15s;
}
.uld-caret.is-up {
  transform: rotate(180deg);
}
.uld-name {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.uld-name b {
  font-weight: 700;
  color: #5d6474;
}
.uld-gender {
  position: relative;
  display: inline-flex;
  padding: 4px;
  border-radius: 4px;
}
.uld-gender.is-f {
  background: rgba(241, 82, 130, 0.1);
}
.uld-gender.is-m {
  background: rgba(0, 115, 250, 0.1);
}
.uld-gender img {
  width: 16px;
  height: 16px;
}
.uld-gender-dot {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 2px solid #fff;
  background: #a8aebd;
}

/* 상세 — treatment-details.tsx (bg-white px-8) */
.uld-detail {
  padding: 0 32px;
  text-align: left;
  color: #31353f;
}
.uld-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding: 0 18px 0 24px;
  border: 1px solid;
  border-radius: 8px;
}
.uld-bar-msg {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 16px 0;
}
.uld-bar-msg img {
  width: 28px;
  height: 28px;
}
.uld-bar-msg strong {
  font-size: 16px;
  font-weight: 700;
}
.uld-bar-btns {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

/* 버튼 — packages/ui button.tsx */
.uld-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 40px;
  min-width: 64px;
  padding: 9px 22px;
  border: 0;
  border-radius: 6px;
  font-family: inherit;
  font-size: 14px;
  line-height: 21px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
}
.uld-btn.is-primary {
  background: #0073fa;
  color: #fff;
}
.uld-btn.is-primary:hover {
  background: #056be1;
}
.uld-btn.is-secondary {
  border: 1px solid rgba(128, 135, 153, 0.2);
  background: transparent;
  color: #5d6474;
}
.uld-btn.is-secondary:hover {
  background: rgba(128, 135, 153, 0.05);
}
.uld-btn:disabled,
.uld-btn:disabled:hover {
  background: rgba(128, 135, 153, 0.05);
  color: rgba(128, 135, 153, 0.4);
  cursor: not-allowed;
}
.uld-btn.is-secondary:disabled {
  background: transparent;
  border-color: rgba(128, 135, 153, 0.1);
}
.uld-btn.uld-on-blue {
  border-color: rgba(255, 255, 255, 0.5);
  color: #fff;
}
.uld-btn.uld-on-blue:hover {
  background: rgba(255, 255, 255, 0.1);
}
.uld-bar .uld-btn.is-primary:disabled {
  background: rgba(255, 255, 255, 0.6);
}

/* 접수 전 확인 (신규, 모양 임의) */
.uld-confirm {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 16px;
  padding: 16px 24px;
  border: 1px solid #e3e6ed;
  border-radius: 8px;
}
.uld-confirm-h {
  margin: 0;
  font-size: 14px;
  font-weight: 700;
  color: #434956;
}
.uld-check {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0;
  border: 0;
  background: transparent;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  color: #31353f;
  text-align: left;
  cursor: pointer;
}
.uld-check-box {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border: 1.5px solid #caced8;
  border-radius: 4px;
  background: #fff;
  flex-shrink: 0;
}
.uld-check.is-on .uld-check-box {
  border-color: #0073fa;
  background: #0073fa;
}


/* DetailSection */
.uld-section {
  padding-bottom: 24px;
  color: #31353f;
}
.uld-section-head {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 64px;
}
.uld-section-head h3 {
  margin: 0;
  flex-shrink: 0;
  font-size: 18px;
  font-weight: 700;
}
.uld-identity {
  display: flex;
  align-items: center;
  gap: 4px;
  margin: 0 0 0 8px;
  font-size: 16px;
  font-weight: 600;
  line-height: 150%;
  color: #056be1;
}
.uld-chips {
  display: inline-flex;
  gap: 6px;
}
.uld-chip {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 700;
  line-height: 19px;
}
.uld-chip.is-first {
  background: rgba(0, 115, 250, 0.1);
  color: #0073fa;
}
.uld-chip.is-revisit {
  background: rgba(252, 125, 34, 0.12);
  color: #e86a10;
}
.uld-chip.is-exception {
  background: #efe9fe;
  color: var(--note);
}
.uld-chip.is-family {
  background: rgba(128, 135, 153, 0.1);
  color: #5d6474;
}
.uld-answer {
  margin-bottom: 20px;
  padding: 14px 20px;
  border-radius: 8px;
  background: rgba(252, 125, 34, 0.08);
  font-size: 14px;
  line-height: 150%;
  color: #31353f;
}
.uld-answer p {
  margin: 0;
}
.uld-answer-h {
  margin-bottom: 4px !important;
  font-weight: 700;
  color: #e86a10;
}

/* PatientInformation + SymptomAttachments */
.uld-info {
  display: flex;
  gap: 48px;
}
.uld-dl {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr);
  align-items: center;
  column-gap: 8px;
  row-gap: 24px;
  width: 600px;
  min-width: 0;
  margin: 0;
  font-size: 14px;
  line-height: 150%;
}
.uld-dl dt {
  color: #808799;
}
.uld-dl dd {
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  margin: 0;
  padding: 12px 16px;
  border: 1px solid #f2f4f7;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 500;
  color: #31353f;
}
.uld-dl dd > span:first-child {
  flex: 1;
  min-width: 0;
}
.uld-copy {
  display: inline-flex;
  color: #5d6474;
  opacity: 0.4;
}
.uld-symptom-col {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 24px;
  min-width: 0;
}
.uld-symptom-row {
  display: flex;
  gap: 8px;
}
.uld-symptom-row label {
  width: 88px;
  height: 48px;
  flex-shrink: 0;
  font-size: 14px;
  color: #808799;
}
.uld-symptom {
  position: relative;
  width: 400px;
  max-width: 100%;
  height: 120px;
  padding: 12px 40px 12px 16px;
  border: 1px solid #f2f4f7;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 500;
  color: #31353f;
}
.uld-copy-abs {
  position: absolute;
  top: 12px;
  right: 12px;
}
.uld-photos {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin-top: 2px;
}
.uld-photo {
  position: relative;
  width: 80px;
  height: 80px;
  border-radius: 6px;
  outline: 1px solid rgba(93, 100, 116, 0.2);
  outline-offset: -0.5px;
  background: linear-gradient(135deg, #e5f2ff, #f2f4f7);
}
.uld-photo-dl {
  position: absolute;
  right: 4px;
  bottom: 4px;
  width: 20px;
  height: 20px;
}
.uld-photo-btn {
  margin-left: 34px;
}
.uld-avatar-dot.is-on {
  background: #41d293;
}
.uld-menu-chip.is-on {
  background: rgba(37, 187, 122, 0.1);
  color: #18ac6c;
}
.uld-bar-timer {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  color: #056be1;
}

/* CertificateRequests */
.uld-cert {
  display: grid;
  gap: 8px;
  margin-bottom: 12px;
  font-size: 14px;
}
.uld-cert h4 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
}
.uld-cert > div {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
}
.uld-cert-k {
  font-weight: 700;
  color: #808799;
}
.uld-cert b {
  font-weight: 700;
  color: #16181d;
}
.uld-memo {
  height: 96px;
  padding: 12px 16px;
  border: 1px solid #e3e6ed;
  border-radius: 8px;
  font-size: 14px;
  color: #a8aebd;
}
.uld-cancel-wrap {
  padding: 8px 0 32px;
}
.uld-cancel-reason {
  margin: 0;
  padding: 8px 0 24px;
  font-size: 14px;
  color: #fa4655;
}

/* 다이얼로그 — packages/ui dialog.tsx (max-w-md, small 360) */
.uld-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(22, 24, 29, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.uld-dialog {
  width: 440px;
  max-width: 448px;
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  padding: 20px;
  border: 1px solid #e3e6ed;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
  font-size: 14px;
  color: #16181d;
}
.uld-dialog.is-small {
  width: 360px;
}
.uld-dialog-title {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  white-space: pre-line;
}
.uld-dialog-desc {
  margin: 8px 0 0;
  font-size: 14px;
  line-height: 20px;
  color: #5d6474;
  white-space: pre-line;
  word-break: keep-all;
}
.uld-dialog-body {
  margin-top: 16px;
}
.uld-dialog-btns {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}
.uld-wait {
  display: grid;
  gap: 8px;
  font-size: 14px;
}
.uld-wait select {
  padding: 8px;
  border: 1px solid #e3e6ed;
  border-radius: 4px;
  font-family: inherit;
  font-size: 14px;
}
.uld-radios {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.uld-radio {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 14px;
  line-height: 20px;
  word-break: keep-all;
  cursor: pointer;
}
.uld-radio input {
  margin: 3px 0 0;
  flex-shrink: 0;
}
.uld-radio > span {
  display: flex;
  flex-direction: column;
}
.uld-radio.is-off {
  color: #a8aebd;
  cursor: not-allowed;
}
.uld-radio em {
  font-style: normal;
  font-size: 12px;
  color: #808799;
}
.uld-textarea-wrap {
  display: grid;
  gap: 6px;
}
.uld-textarea-label {
  font-size: 14px;
  font-weight: 600;
}
.uld-textarea-wrap textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #e3e6ed;
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
  resize: vertical;
}
.uld-hint {
  margin: 0;
  font-size: 14px;
  color: #808799;
}
.uld-error {
  margin: 0;
  font-size: 14px;
  color: #fa4655;
}

/* 실거주 증명 첨부 열람 (D8, 신규) */
.uld-proof {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin-bottom: 16px;
  padding: 16px 24px;
  border: 1px solid #e3e6ed;
  border-radius: 8px;
}
.uld-proof-k {
  width: 120px;
  flex-shrink: 0;
  align-self: center;
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: 14px;
  font-weight: 700;
  color: #434956;
}
.uld-proof-k span {
  font-size: 13px;
  font-weight: 500;
  color: #808799;
}
.uld-proof-name {
  font-size: 14px;
  color: #5d6474;
  align-self: center;
}
.uld-confirm-sub {
  margin: -4px 0 0 28px;
  font-size: 13px;
  color: #808799;
}
.uld-consent-fact {
  margin: -8px 0 16px;
  font-size: 13px;
  color: #808799;
}
.uld-proof-none {
  align-self: center;
  font-size: 14px;
  color: #a8aebd;
}
.uld-proof-thumb {
  padding: 0;
  border: 0;
  cursor: zoom-in;
  position: relative;
  width: 80px;
  height: 80px;
  overflow: hidden;
  border-radius: 6px;
  outline: 1px solid rgba(93, 100, 116, 0.2);
  outline-offset: -0.5px;
  background: #fff;
}

/* 가림 처리된 가상 서류 (앱과 같은 표현) */
.uld-doc {
  display: block;
  width: 420px;
  padding: 28px 28px 20px;
  background: #fff;
  font-size: 15px;
  line-height: 22px;
  color: #434956;
  text-align: left;
}
.uld-doc-title {
  display: block;
  text-align: center;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 3px;
  color: #31353f;
  padding-bottom: 12px;
  margin-bottom: 8px;
  border-bottom: 1px solid #e3e6ed;
}
.uld-doc-row {
  display: flex;
  gap: 12px;
  padding: 7px 0;
  border-bottom: 1px dotted #e3e6ed;
}
.uld-doc-k {
  width: 96px;
  flex-shrink: 0;
  color: #808799;
}
.uld-doc-v {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.uld-doc-v .is-keep {
  font-weight: 600;
  color: #16181d;
}
.uld-doc-hide {
  display: inline-block;
  background: #16181d;
  color: transparent;
  border-radius: 2px;
  user-select: none;
}
.uld-doc.is-mini {
  width: 80px;
  height: 80px;
  padding: 6px;
  font-size: 4px;
  line-height: 6px;
  overflow: hidden;
}
.uld-doc.is-mini .uld-doc-title {
  font-size: 5px;
  letter-spacing: 0;
  padding-bottom: 2px;
  margin-bottom: 2px;
}
.uld-doc.is-mini .uld-doc-row {
  gap: 2px;
  padding: 1px 0;
}
.uld-doc.is-mini .uld-doc-k {
  width: 20px;
}

/* 확대 보기 — 현행 document-viewer.tsx ImagePreview */
.uld-viewer {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  padding: 40px;
  background: rgba(22, 24, 29, 0.8);
}
.uld-viewer-main {
  flex: 1;
  min-height: 0;
  max-height: calc(100dvh - 200px);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.uld-viewer-main .uld-doc {
  width: min(720px, calc(100vw - 80px));
  max-height: 100%;
  overflow: hidden;
  font-size: 18px;
  line-height: 28px;
}
.uld-viewer-thumbs {
  display: flex;
  gap: 16px;
}
.uld-viewer-thumb {
  width: 120px;
  height: 120px;
  overflow: hidden;
  border-radius: 6px;
  background: #fff;
  outline: 2.5px solid #0073fa;
  outline-offset: -2px;
}
.uld-viewer-thumb .uld-doc.is-mini {
  width: 120px;
  height: 120px;
}
.uld-viewer-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 6px;
  background: #434956;
  color: #fff;
  display: grid;
  place-content: center;
  padding: 14px;
  opacity: 0.9;
  cursor: pointer;
}
