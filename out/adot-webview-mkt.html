/* styles/connectShell.css */
/* =============================================================
   굿닥 커넥트 웹뷰 — 공통 셸 (디자인 토큰 + 윈도우 셸/사이드내비)
   여러 커넥트 화면(진료항목 등록, 예약 신청 내역 등)이 공유한다.
   - /Users/goodoc/test 프로토타입의 colors_and_type.css(:root)와
     connect.css의 셸 부분을 이식.
   - 전역 누수 방지를 위해 원본 body 레벨 스타일은 .cn-artboard 래퍼로
     한정했고 리셋도 .cn-artboard 하위로 스코프.
   - 클래스 접두사(cn-)가 고유해 다른 페이지와 충돌하지 않음.
   ============================================================= */

/* ---- Design tokens (colors_and_type.css :root, @font-face 제외) ---- */
:root {
  --gray-10:  #F9FAFB;
  --gray-15:  #F4F6F8;
  --gray-20:  #F2F4F6;
  --gray-30:  #E5E8EB;
  --gray-40:  #D1D6DB;
  --gray-50:  #B0B8C1;
  --gray-60:  #8B95A1;
  --gray-70:  #6B7684;
  --gray-80:  #4E5968;
  --gray-90:  #31353F;
  --gray-100: #191F28;

  --blue-30:  #B3D5FF;
  --blue-60:  #0073FA;
  --blue-70:  #0061DB;
  --blue-80:  #0050B5;

  --red-60:   #FA4655;
  --red-70:   #EC3847;
  --red-80:   #D52130;

  --green-70: #41D293;
  --green-80: #1FA972;
  --orange-60:#F79009;

  --white: #FFFFFF;
  --black: #000000;
  --transparent: transparent;

  --alpha-gray-05: rgba(128, 135, 153, 0.05);
  --alpha-gray-10: rgba(128, 135, 153, 0.10);
  --alpha-gray-15: rgba(128, 135, 153, 0.15);
  --alpha-gray-20: rgba(128, 135, 153, 0.20);
  --alpha-gray-40: rgba(128, 135, 153, 0.40);
  --alpha-gray-60: rgba(128, 135, 153, 0.60);

  --alpha-blue-05: rgba(0, 115, 250, 0.05);
  --alpha-blue-10: rgba(0, 115, 250, 0.10);
  --alpha-blue-15: rgba(0, 115, 250, 0.15);
  --alpha-blue-20: rgba(0, 115, 250, 0.20);

  --alpha-red-05: rgba(250, 70, 85, 0.05);
  --alpha-red-10: rgba(250, 70, 85, 0.10);
  --alpha-red-15: rgba(250, 70, 85, 0.15);
  --alpha-red-20: rgba(250, 70, 85, 0.20);

  --shadow-toast: 0 2px 1px rgba(22, 24, 29, 0.02), 0 2px 8px rgba(22, 24, 29, 0.10);
  --shadow-toggle-knob: 0 0 6px rgba(0, 0, 0, 0.25);

  --font-sans: 'Pretendard', 'Pretendard Variable', -apple-system,
    BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}

/* ---- Artboard backdrop (원본 connect.css의 body 스타일을 래퍼로 한정) ---- */
.cn-artboard {
  font-family: var(--font-sans);
  background: #e7e9ee;
  color: var(--gray-100);
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 24px;
}
.cn-artboard *,
.cn-artboard *::before,
.cn-artboard *::after { box-sizing: border-box; }

/* ---- App window (1280 x 832 rounded webview frame) ---- */
.cn-screen {
  width: 1280px;
  min-height: 832px;
  background: var(--white);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 12px 40px rgba(22, 24, 29, 0.12);
  position: relative;
}

/* ---- Title bar (windows-style) ---- */
.cn-titlebar {
  height: 32px;
  background: #f3f3f3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: none;
}
.cn-ci { display: flex; align-items: center; gap: 4px; padding: 0 8px; height: 100%; }
.cn-ci-mark { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
.cn-ci-mark svg { display: block; }
.cn-ci-name { font: 500 13px/16px var(--font-sans); color: rgba(0, 0, 0, 0.9); padding: 0 8px 2px 4px; }
.cn-winctrls { display: flex; height: 100%; }
.cn-winbtn {
  width: 46px; height: 32px;
  border: 0; background: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  color: rgba(0, 0, 0, 0.9); cursor: pointer;
}
.cn-winbtn:hover { background: rgba(0, 0, 0, 0.05); }
.cn-winbtn.close:hover { background: #e81123; color: #fff; }

/* ---- Body: nav + main ---- */
.cn-body { display: flex; align-items: stretch; flex: 1; min-height: 800px; }

/* ---- Side nav (250px) ---- */
.cn-nav { width: 250px; flex: none; background: #f2f4f7; position: relative; display: flex; flex-direction: column; }
.cn-nav-scroll { flex: 1; overflow: auto; }
.cn-nav-group { padding: 8px 0; display: flex; flex-direction: column; }
.cn-nav-header { height: 40px; display: flex; align-items: center; padding: 0 16px; font: 600 14px/20px var(--font-sans); color: rgba(0, 0, 0, 0.9); }
.cn-nav-item {
  height: 40px; width: 100%;
  border: 0; background: transparent;
  display: flex; align-items: center;
  padding: 0 16px; position: relative; cursor: pointer; text-align: left;
}
.cn-nav-item > .cn-nav-label { font: 400 14px/22px var(--font-sans); color: var(--gray-90); flex: 1; }
.cn-nav-item .cn-chevron { width: 12px; height: 12px; color: #808799; flex: none; display: inline-flex; align-items: center; justify-content: center; }
.cn-nav-item.sub { padding-left: 32px; }
.cn-nav-item.sub::before { content: ""; position: absolute; inset: 2px 4px; border-radius: 4px; pointer-events: none; }
.cn-nav-item.active::before { background: var(--alpha-gray-10); }
.cn-nav-item.active .cn-nav-label { color: var(--gray-90); }
.cn-nav-item:not(.active):not(.cn-nav-header):hover::before {
  content: ""; position: absolute; inset: 2px 4px;
  background: rgba(128, 135, 153, 0.06); border-radius: 4px; pointer-events: none;
}
.cn-nav-label-wrap { display: inline-flex; align-items: center; gap: 6px; flex: 1; }
.cn-beta {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 5px; border-radius: 4px;
  background: var(--alpha-blue-10);
  font: 600 12px/18px var(--font-sans);
  color: var(--blue-80, #115fd4);
}
.cn-nav-divider { padding: 4px 0; }
.cn-nav-divider span { display: block; height: 1px; background: var(--gray-30); }
.cn-nav-footer { background: #f2f4f7; padding-bottom: 8px; display: flex; flex-direction: column; }

/* ---- Main frame ---- */
.cn-main { flex: 1; min-width: 0; background: var(--white); display: flex; flex-direction: column; }
.cn-header { padding: 48px 64px 32px; }
.cn-header-title { font: 700 28px/36px var(--font-sans); color: #16181d; }
.cn-header-desc { font: 400 14px/22px var(--font-sans); color: #808799; margin-top: 6px; }


/* styles/prototypeChanges.css */
/* 프로토타입 메타 UI: 실제 Connect 기능이 아니라 정책 변경 추적용 패널 */
.pc-trigger {
  position: fixed; top: 72px; right: 0; z-index: 105;
  height: 40px; padding: 0 12px 0 10px; border: 1px solid var(--gray-30); border-right: 0;
  border-radius: 8px 0 0 8px; background: var(--gray-100); color: var(--white);
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  font: 600 12px/18px var(--font-sans); box-shadow: 0 4px 16px rgba(22,24,29,.14);
}
.pc-trigger:hover { background: var(--gray-90); }
.pc-trigger-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-70); }
.pc-trigger-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: rgba(255,255,255,.16); font: 700 11px/18px var(--font-sans); }

/* 딤 제거: 우측 패널을 비모달로 (열어둔 채 본문 확인·조작 가능) */
.pc-scrim { display: none; }
.pc-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 120; width: 392px;
  background: var(--white); box-shadow: -12px 0 32px rgba(22,24,29,.14);
  display: flex; flex-direction: column; transform: translateX(102%); visibility: hidden;
  transition: transform .2s ease, visibility .2s;
}
.pc-drawer.open { transform: translateX(0); visibility: visible; }
.pc-drawer-head { min-height: 52px; padding: 0 18px; border-bottom: 1px solid var(--gray-20); display: flex; align-items: center; justify-content: space-between; flex: none; }
.pc-eyebrow { font: 700 11px/16px var(--font-sans); letter-spacing: .08em; color: var(--blue-70); }
.pc-close { width: 32px; height: 32px; border-radius: 6px; color: var(--gray-70); font: 400 24px/30px var(--font-sans); cursor: pointer; }
.pc-close:hover, .pc-back:hover { background: var(--gray-10); }
.pc-back { height: 32px; padding: 0 8px; border-radius: 6px; color: var(--gray-80); font: 600 13px/32px var(--font-sans); cursor: pointer; }

.pc-drawer-title-wrap { padding: 22px 20px 16px; flex: none; }
.pc-drawer-title-wrap h2 { margin: 0; font: 700 22px/30px var(--font-sans); color: var(--gray-100); }
.pc-drawer-title-wrap p { margin: 7px 0 0; font: 400 13px/20px var(--font-sans); color: var(--gray-70); }
.pc-planned-filter { margin-top: 16px; padding: 12px 13px; border: 1px solid var(--gray-30); border-radius: 9px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pc-planned-filter > div { min-width: 0; display: flex; flex-direction: column; }
.pc-planned-filter strong { color: var(--gray-90); font: 600 13px/19px var(--font-sans); }
.pc-planned-filter span { color: var(--gray-60); font: 400 11px/17px var(--font-sans); }
.pc-switch { width: 40px; height: 24px; padding: 2px; border-radius: 999px; background: var(--gray-40); cursor: pointer; transition: background .15s; flex: none; }
.pc-switch > span { display: block; width: 20px; height: 20px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 4px rgba(22,24,29,.18); transition: transform .15s; }
.pc-switch.on { background: #f79009; }
.pc-switch.on > span { transform: translateX(16px); }
.pc-planned-notice { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: rgba(247,144,9,.09); color: #9a5800; font: 500 11px/17px var(--font-sans); }
.pc-dev-filter { margin-top: 10px; border-color: rgba(234, 179, 8, .48); background: #fffdf2; }
.pc-dev-notice { margin-top: 8px; padding: 8px 10px; border: 1px solid rgba(234, 179, 8, .35); border-radius: 6px; background: #fff8cf; color: #745300; font: 600 11px/17px var(--font-sans); }
.pc-dev-marker-layer { position: fixed; inset: 0; z-index: 110; pointer-events: none; }
.pc-dev-marker-layer, .pc-dev-marker-layer *, .pc-dev-marker-layer *::before, .pc-dev-marker-layer *::after { box-sizing: border-box; }
.pc-dev-marker-shell { position: fixed; width: 30px; height: 30px; pointer-events: auto; }
.pc-dev-marker {
  position: relative; z-index: 2; width: 30px; height: 30px; border: 2px solid var(--white); border-radius: 50%;
  background: #e0a600; color: var(--white); cursor: help; box-shadow: 0 3px 10px rgba(116,83,0,.30), 0 0 0 2px rgba(224,166,0,.18);
  font: 800 12px/26px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center;
  transition: transform .14s ease, background .14s ease, box-shadow .14s ease;
}
.pc-dev-marker:hover, .pc-dev-marker:focus-visible { background: #c98e00; box-shadow: 0 5px 16px rgba(116,83,0,.38), 0 0 0 3px rgba(224,166,0,.22); outline: none; transform: scale(1.08); }
.pc-dev-marker-tooltip {
  position: absolute; z-index: 1; width: min(350px, calc(100vw - 24px)); max-height: min(420px, calc(100vh - 48px));
  padding: 13px 14px 14px; overflow: auto; border: 1px solid #e4b82f; border-radius: 12px; background: #fffdf1;
  color: #5f4700; box-shadow: 0 12px 32px rgba(72,54,0,.20); visibility: hidden; opacity: 0; pointer-events: none;
  transition: opacity .12s ease, transform .12s ease, visibility .12s;
}
.pc-dev-marker-shell.place-left .pc-dev-marker-tooltip { right: 0; }
.pc-dev-marker-shell.place-right .pc-dev-marker-tooltip { left: 0; }
.pc-dev-marker-shell.place-below .pc-dev-marker-tooltip { top: calc(100% + 9px); transform: translateY(-4px); }
.pc-dev-marker-shell.place-above .pc-dev-marker-tooltip { bottom: calc(100% + 9px); transform: translateY(4px); }
.pc-dev-marker-shell:hover .pc-dev-marker-tooltip,
.pc-dev-marker-shell:focus-within .pc-dev-marker-tooltip { visibility: visible; opacity: 1; pointer-events: auto; transform: translateY(0); }
.pc-dev-marker-tooltip-head { display: grid; grid-template-columns: 26px 1fr; gap: 9px; align-items: start; }
.pc-dev-marker-tooltip-head > span { width: 26px; height: 26px; border-radius: 50%; background: #e0a600; color: var(--white); font: 800 11px/26px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; }
.pc-dev-marker-tooltip-head > div { min-width: 0; display: flex; flex-direction: column; }
.pc-dev-marker-tooltip-head small { color: #9a6b00; font: 700 9px/14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
.pc-dev-marker-tooltip-head strong { margin-top: 1px; color: #4d3900; font: 700 13px/19px var(--font-sans); word-break: keep-all; }
.pc-dev-marker-tooltip ul { margin: 10px 0 0; padding: 9px 0 0 17px; border-top: 1px solid rgba(224,166,0,.24); }
.pc-dev-marker-tooltip li { margin-top: 5px; color: #5f4700; font: 500 11px/18px var(--font-sans); word-break: keep-all; }
.pc-dev-marker-tooltip li:first-child { margin-top: 0; }
.pc-dev-marker-tooltip code { padding: 1px 4px; border-radius: 4px; background: rgba(116,83,0,.10); color: #604700; font: 600 10px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-current-view { display: inline-flex; margin-top: 12px; padding: 5px 9px; border-radius: 6px; background: var(--alpha-blue-10); color: var(--blue-70); font: 600 12px/18px var(--font-sans); }
.pc-scope { margin: 0 20px; padding: 3px; border-radius: 8px; background: var(--gray-20); display: grid; grid-template-columns: 1fr 1fr; flex: none; }
.pc-scope button { height: 34px; border-radius: 6px; color: var(--gray-70); cursor: pointer; font: 600 13px/34px var(--font-sans); }
.pc-scope button span { margin-left: 3px; color: var(--gray-50); }
.pc-scope button.active { background: var(--white); color: var(--gray-100); box-shadow: 0 1px 4px rgba(22,24,29,.08); }

.pc-change-list {
  flex: 1 1 auto; min-height: 0; padding: 16px 20px 28px;
  overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable;
  display: flex; flex-direction: column; gap: 12px;
}
.pc-empty { padding: 40px 12px; text-align: center; color: var(--gray-60); font: 400 13px/20px var(--font-sans); }
.pc-change-card { flex: 0 0 auto; border: 1px solid var(--gray-30); border-radius: 10px; overflow: hidden; background: var(--white); transition: border-color .12s, box-shadow .12s; }
.pc-change-card:hover { border-color: var(--gray-50); box-shadow: 0 4px 16px rgba(22,24,29,.06); }
.pc-change-card.planned { border-color: rgba(247,144,9,.36); background: linear-gradient(180deg, rgba(247,144,9,.035), var(--white) 40%); }
.pc-change-main { width: 100%; padding: 15px 15px 13px; text-align: left; cursor: pointer; }
.pc-change-meta { display: flex; align-items: center; gap: 6px; }
.pc-change-meta time { margin-left: auto; color: var(--gray-60); font: 500 11px/16px var(--font-sans); }
.pc-prd-id { display: inline-flex; padding: 3px 7px; border-radius: 5px; background: var(--alpha-blue-10); color: var(--blue-70); font: 700 11px/16px var(--font-sans); }
.pc-publish, .pc-source-status { display: inline-flex; padding: 3px 7px; border-radius: 5px; font: 600 11px/16px var(--font-sans); }
.pc-publish.baseline, .pc-source-status.review { background: rgba(247,144,9,.10); color: #b25f00; }
.pc-publish.approved, .pc-source-status.approved, .pc-source-status.final { background: rgba(31,169,114,.10); color: var(--green-80); }
.pc-publish.planned, .pc-source-status.draft { background: rgba(247,144,9,.12); color: #9a5800; }
.pc-change-main h3 { margin: 11px 0 12px; font: 700 15px/22px var(--font-sans); color: var(--gray-100); }
.pc-diff { display: grid; grid-template-columns: 35px 1fr; gap: 8px; align-items: start; margin-top: 7px; }
.pc-diff > span { height: 20px; border-radius: 4px; text-align: center; font: 600 11px/20px var(--font-sans); }
.pc-diff p { margin: 0; color: var(--gray-70); font: 400 12px/19px var(--font-sans); }
.pc-diff.before > span { background: var(--gray-20); color: var(--gray-60); }
.pc-diff.after > span { background: var(--alpha-blue-10); color: var(--blue-70); }
.pc-developer-details { margin-top: 12px; padding: 11px 12px; border: 1px solid #e9bd32; border-radius: 7px; background: #fff8cf; color: #5f4700; }
.pc-developer-details-head { display: flex; align-items: center; gap: 7px; }
.pc-developer-details-head > span { padding: 2px 5px; border-radius: 4px; background: #e0a600; color: #fff; font: 800 9px/14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
.pc-developer-details-head strong { font: 700 12px/18px var(--font-sans); }
.pc-developer-details ul { margin: 7px 0 0; padding-left: 17px; }
.pc-developer-details li { margin-top: 4px; font: 500 11px/18px var(--font-sans); word-break: keep-all; }
.pc-developer-details code { padding: 1px 4px; border-radius: 4px; background: rgba(116,83,0,.10); color: #604700; font: 600 10px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-locate-hint { margin-top: 12px; color: var(--blue-70); font: 600 12px/18px var(--font-sans); }
.pc-change-foot { min-height: 40px; padding: 0 12px 0 15px; border-top: 1px solid var(--gray-20); background: var(--gray-10); display: flex; align-items: center; justify-content: space-between; }
.pc-change-foot > span { color: var(--gray-60); font: 500 11px/16px var(--font-sans); }
.pc-change-foot button { height: 28px; padding: 0 8px; border-radius: 5px; color: var(--blue-70); font: 600 12px/28px var(--font-sans); cursor: pointer; }
.pc-change-foot button:hover { background: var(--alpha-blue-10); }
.pc-change-foot button:disabled { color: var(--gray-40); cursor: not-allowed; }

.pc-document-overlay { position: fixed; inset: 0; z-index: 220; padding: 40px; background: rgba(22,24,29,.54); display: flex; align-items: center; justify-content: center; }
.pc-document-modal { width: min(920px, calc(100vw - 48px)); height: min(820px, calc(100vh - 48px)); border-radius: 14px; background: var(--white); box-shadow: 0 24px 80px rgba(22,24,29,.30); overflow: hidden; display: flex; flex-direction: column; }
.pc-document-head { min-height: 104px; padding: 20px 24px; border-bottom: 1px solid var(--gray-20); display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex: none; }
.pc-document-head h2 { margin: 8px 0 0; color: var(--gray-100); font: 700 21px/29px var(--font-sans); }
.pc-document-head p { margin: 3px 0 0; color: var(--gray-60); font: 500 12px/18px var(--font-sans); }
.pc-document-close { flex: none; width: 36px; height: 36px; border-radius: 8px; color: var(--gray-70); font: 400 26px/34px var(--font-sans); cursor: pointer; }
.pc-document-close:hover { background: var(--gray-10); color: var(--gray-100); }
.pc-document-body { padding: 24px 32px 40px; overflow: auto; }
.pc-document-body .pc-summary-source { margin-top: 0; }
.pc-document-body .pc-markdown { max-width: 760px; margin: 24px auto 0; }
.pc-document-body .pc-markdown h1 { font-size: 25px; line-height: 34px; }
.pc-document-body .pc-markdown h2 { margin-top: 28px; font-size: 18px; line-height: 27px; }
.pc-document-body .pc-markdown p, .pc-document-body .pc-md-li { font-size: 14px; line-height: 23px; }

.pc-summary-view { padding: 20px 20px 32px; overflow: auto; }
.pc-summary-meta { display: flex; align-items: center; gap: 7px; }
.pc-summary-release { margin-top: 10px; color: #9a5800; font: 600 12px/18px var(--font-sans); }
.pc-summary-source { margin-top: 10px; padding: 10px 12px; border-radius: 7px; background: var(--gray-10); color: var(--gray-60); font: 500 11px/17px var(--font-sans); word-break: break-all; }
.pc-markdown { margin-top: 18px; }
.pc-markdown h1 { margin: 0 0 16px; color: var(--gray-100); font: 700 21px/29px var(--font-sans); }
.pc-markdown h2 { margin: 22px 0 9px; color: var(--gray-100); font: 700 16px/24px var(--font-sans); }
.pc-markdown h3 { margin: 18px 0 8px; color: var(--gray-90); font: 700 14px/22px var(--font-sans); }
.pc-markdown p { margin: 0; color: var(--gray-70); font: 400 13px/21px var(--font-sans); }
.pc-markdown blockquote { margin: 0 0 16px; padding: 12px 14px; border-left: 3px solid var(--blue-60); background: var(--alpha-blue-05); color: var(--gray-80); font: 500 12px/20px var(--font-sans); }
.pc-markdown code { padding: 2px 5px; border-radius: 4px; background: var(--gray-20); color: var(--gray-80); font: 500 11px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-md-li { display: grid; grid-template-columns: 10px 1fr; gap: 5px; align-items: start; margin-top: 5px; }
.pc-md-li > span { color: var(--blue-60); font: 700 13px/21px var(--font-sans); }
.pc-md-gap { height: 6px; }

.pc-policy-highlight { animation: pc-policy-pulse 2.4s ease; outline: 3px solid var(--blue-60); outline-offset: 4px; border-radius: 8px; }
.pc-planned-row-badge { display: inline-flex; margin-left: 6px; padding: 1px 5px; border-radius: 4px; background: rgba(247,144,9,.12); color: #9a5800; vertical-align: 1px; font: 700 10px/15px var(--font-sans); }
@keyframes pc-policy-pulse {
  0%, 100% { outline-color: transparent; box-shadow: none; }
  15%, 70% { outline-color: var(--blue-60); box-shadow: 0 0 0 8px var(--alpha-blue-10); }
}

@media (max-width: 1100px) {
  .pc-drawer { width: min(392px, calc(100% - 24px)); }
  .pc-scrim { left: 0; }
  .pc-document-overlay { padding: 20px; }
  .pc-document-modal { width: calc(100vw - 40px); height: calc(100vh - 40px); }
  .pc-document-body { padding: 20px 22px 32px; }
}


/* styles/adotWebview.css */
/* =============================================================
   adot-webview — SKT 에이닷 연동 굿닥 "예약 정보 확인" 인앱 웹뷰 케이스 전환형 프로토
   토큰: goodoc-design colors_and_type.css 발췌(피그마 Foundations 이름 1:1). plain CSS, 클래스 aw-*.
   ============================================================= */

.aw-root {
  --gray-10: #F9F9FB; --gray-15: #F6F7F9; --gray-20: #F2F4F7; --gray-30: #E3E6ED;
  --gray-40: #CACED8; --gray-50: #A8AEBD; --gray-60: #808799; --gray-70: #5D6474;
  --gray-80: #434956; --gray-90: #31353F; --gray-100: #16181D;
  --blue-20: #E5F2FF; --blue-30: #D1E8FF; --blue-50: #479DFF; --blue-60: #0073FA; --blue-70: #066AE5; --blue-80: #115FD4;
  --red-50: #FB7480; --red-60: #FA4655; --red-70: #EC3847;
  --green-60: #41D293; --green-70: #24C38C; --green-80: #00B280;
  --orange-30: #FED8BD; --orange-60: #FC7D22; --orange-80: #C2560A; --meta: #7C4DFF; /* orange-80·meta 는 프로토 메타 전용(Foundations 외) */
  --alpha-gray-05: rgba(128,135,153,.05); --alpha-gray-10: rgba(128,135,153,.10);
  --alpha-gray-15: rgba(128,135,153,.15); --alpha-gray-20: rgba(128,135,153,.20);
  --alpha-blue-10: rgba(0,115,250,.10); --alpha-red-10: rgba(250,70,85,.10);
  --alpha-green-20: rgba(37,187,122,.20); --alpha-orange-10: rgba(255,138,61,.12);
  --dim: rgba(22,24,29,.70);           /* 앱 Dim/Darker 70% — 알럿·시트 위 2차 딤 */
  --dim-adot: rgba(22,24,29,.38);      /* 피그잼 에이닷 화면 회색 딤(목업 수준) */
  --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; --radius-xl: 12px; --radius-2xl: 16px; --radius-3xl: 24px;
  --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-family: var(--font-sans);
  color: var(--gray-100);
  font-size: 14px;
  line-height: 1.5;
  word-break: keep-all;
  min-height: 100vh;
  background: var(--gray-20);
  display: grid;
  grid-template-columns: 360px 1fr;
}
.aw-root *, .aw-root *::before, .aw-root *::after { box-sizing: border-box; }
.aw-root button { font-family: inherit; cursor: pointer; }
.aw-root input { font-family: inherit; }

/* ---------- 좌측 케이스 패널 ---------- */
.aw-panel { background: #fff; border-right: 1px solid var(--gray-30); height: 100vh; overflow-y: auto; position: sticky; top: 0; }
.aw-panel-head { padding: 18px 18px 12px; border-bottom: 1px solid var(--gray-20); }
.aw-panel-head h1 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 700; }
.aw-panel-head p { margin: 4px 0 0; font-size: 12px; line-height: 18px; color: var(--gray-60); }
.aw-panel-toggle { display: none; }
.aw-legend { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.aw-group { padding: 6px 12px 2px; }
.aw-group-title { display: flex; width: 100%; align-items: center; gap: 6px; border: none; background: none; font-size: 12px; font-weight: 700; color: var(--gray-70); padding: 6px; cursor: pointer; text-align: left; }
.aw-group-title small { font-weight: 500; color: var(--gray-50); }
.aw-group-title::before { content: '▾'; font-size: 10px; color: var(--gray-50); }
.aw-group.shut .aw-group-title::before { content: '▸'; }
.aw-group.shut .aw-case { display: none; }
.aw-case { display: flex; width: 100%; text-align: left; gap: 8px; align-items: center; padding: 4px 8px; border-radius: var(--radius-md);
  border: 1px solid transparent; background: transparent; color: var(--gray-90); }
.aw-case:hover { background: var(--gray-15); }
.aw-case.on { background: var(--blue-20); border-color: var(--blue-30); }
.aw-case-id { flex: none; min-width: 46px; font-size: 11px; font-weight: 700; color: var(--gray-60); line-height: 20px; font-variant-numeric: tabular-nums; }
.aw-case.on .aw-case-id { color: var(--blue-80); }
.aw-case-body { flex: 1; min-width: 0; }
.aw-case-label { display: block; font-size: 13px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aw-case-badges { display: inline-flex; flex-wrap: wrap; gap: 3px; vertical-align: middle; margin-left: 4px; }

.aw-badge { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: var(--radius-sm); font-size: 10.5px; font-weight: 600; white-space: nowrap; }
.aw-badge.fj { color: var(--blue-80); background: var(--alpha-blue-10); }
.aw-badge.doc { color: var(--gray-80); background: var(--alpha-gray-15); }
.aw-badge.code { color: var(--green-80); background: var(--alpha-green-20); }
.aw-badge.prop { color: var(--orange-80); background: var(--alpha-orange-10); border: 1px dashed var(--orange-60); }

.aw-section { border-top: 1px solid var(--gray-20); padding: 10px 18px; }
.aw-section h2 { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--gray-90); display: flex; align-items: center; gap: 6px; }
.aw-section h2 small { font-weight: 500; color: var(--gray-60); font-size: 11px; }
.aw-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; }
.aw-row-label { font-size: 12px; color: var(--gray-80); line-height: 18px; flex: 1; min-width: 0; }
.aw-row-label em { font-style: normal; color: var(--gray-50); font-size: 11px; display: block; }
.aw-seg { display: inline-flex; padding: 2px; background: var(--gray-20); border-radius: var(--radius-md); gap: 2px; flex: none; }
.aw-seg button { border: none; background: transparent; padding: 4px 8px; font-size: 11.5px; font-weight: 600; color: var(--gray-70); border-radius: var(--radius-sm); white-space: nowrap; }
.aw-seg button.on { background: #fff; color: var(--gray-100); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.aw-switch { width: 34px; height: 20px; border-radius: 10px; background: var(--gray-40); border: none; position: relative; flex: none; }
.aw-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .12s; }
.aw-switch.on { background: var(--blue-60); }
.aw-switch.on::after { left: 16px; }
.aw-note { font-size: 12px; line-height: 18px; color: var(--gray-70); background: var(--gray-15); border-radius: var(--radius-lg); padding: 10px 12px; }
.aw-note b { color: var(--gray-90); }
.aw-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.aw-mini-btn { height: 28px; padding: 0 10px; font-size: 12px; font-weight: 600; border-radius: var(--radius-md); border: 1px solid var(--gray-30); background: #fff; color: var(--gray-80); }
.aw-mini-btn:hover { background: var(--gray-15); }
.aw-select { height: 28px; font-size: 12px; border: 1px solid var(--gray-30); border-radius: var(--radius-md); padding: 0 6px; background: #fff; color: var(--gray-90); max-width: 170px; }

/* ---------- 우측 스테이지 ---------- */
.aw-stage { display: flex; flex-direction: column; align-items: center; padding: 28px 16px 40px; min-width: 0; }
.aw-stage-cap { font-size: 12px; color: var(--gray-70); margin-bottom: 12px; text-align: center; max-width: 520px; }
.aw-stage-cap b { color: var(--gray-100); }
.aw-phone-wrap { position: relative; }
.aw-phone { width: 375px; height: 812px; border-radius: 44px; overflow: hidden; position: relative; background: #fff;
  box-shadow: 0 0 0 10px var(--gray-100), 0 20px 40px rgba(17,23,35,.25); transform-origin: top left; }

/* 에이닷 목업(회색) */
.aw-adot { position: absolute; inset: 0; background: #fff; }
.aw-status { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font-size: 15px; font-weight: 700; color: var(--gray-100); position: relative; z-index: 3; }
.aw-status i { width: 22px; height: 10px; border-radius: 2px; background: var(--gray-100); display: inline-block; }
.aw-adot-head { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--gray-30); }
.aw-adot-head b { font-size: 22px; font-weight: 800; letter-spacing: -.2px; }
.aw-adot-head span { font-size: 13px; font-weight: 700; color: var(--gray-70); }
.aw-adot-chat { padding: 22px 20px; display: flex; flex-direction: column; gap: 10px; }
.aw-adot-chat .t1 { font-size: 14px; font-weight: 700; }
.aw-adot-chat .t2 { font-size: 14px; color: var(--gray-80); }
.aw-adot-chat .card { border: 1px solid var(--gray-30); border-radius: var(--radius-xl); padding: 14px 16px; font-size: 14px; color: var(--gray-80); }
.aw-adot-dim { position: absolute; inset: 0; background: var(--dim-adot); z-index: 4; }
.aw-meta-card { margin: 4px 0 0; border: 1.5px dashed var(--meta); background: rgba(124,77,255,.06); color: var(--gray-90); border-radius: var(--radius-xl); padding: 12px 14px; font-size: 12.5px; line-height: 19px; }
.aw-meta-card b { color: var(--meta); display: block; font-size: 11px; margin-bottom: 2px; }
.aw-meta-card .aw-mini-btn { margin-top: 8px; }

/* 굿닥 웹뷰 컨테이너 */
.aw-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; background: #fff; display: flex; flex-direction: column;
  border-radius: var(--radius-3xl) var(--radius-3xl) 0 0; max-height: calc(100% - 80px); } /* v0.45 명세 3-1: 최대 높이 = 화면 − 80 */
.aw-sheet.kb { bottom: 268px; max-height: calc(100% - 268px - 80px); } /* v0.49 D53: 키보드 표시 시에도 바텀시트 유지 — 키보드(268) 위, 최대 높이 = 화면 − 키보드 − 80(=464). 넘치면 본문만 스크롤 */
.aw-sheet.kb .aw-home { display: none; } /* 홈 인디케이터는 키보드 영역 소관 */
.aw-sheet.kb .aw-foot { padding-bottom: 12px; }
.aw-sheet-head { flex: none; height: 64px; display: flex; align-items: center; gap: 4px; padding: 8px 20px; } /* 피그마 Topbar: 64·구분선 없음 · v0.58 D63 X 닫기 없음 */
.aw-logo { display: inline-flex; align-items: center; gap: 7px; font-size: 20px; line-height: 30px; font-weight: 700; color: var(--blue-60); }
.aw-sheet-head .ttl { font-size: 20px; line-height: 30px; font-weight: 700; color: var(--blue-60); flex: 1; }
.aw-sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px 20px 16px; }
/* v0.45 명세 3-1: 바텀시트 본문 상·하단 스크롤 페이드(높이 20, 흰색→투명). 본문 래퍼에 붙어 본문 가장자리에 고정 */
.aw-sheet-bodywrap { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.aw-sheet-fade { position: absolute; left: 0; right: 0; height: 20px; z-index: 1; pointer-events: none; }
.aw-sheet-fade.top { top: 0; background: linear-gradient(#fff, rgba(255,255,255,0)); }
.aw-sheet-fade.bottom { bottom: 0; background: linear-gradient(rgba(255,255,255,0), #fff); }
.aw-visit-info { font-size: 13px; line-height: 20px; color: var(--gray-70); margin-top: 2px; }
.aw-title { margin: 0; /* D20: 방문자 줄 삭제로 본문 첫 요소 */ font-size: 22px; line-height: 30px; font-weight: 700; color: var(--gray-90); white-space: pre-line; }
.aw-sec { margin-top: 32px; } /* 피그마 워싱: 섹션 간격 32 */
.aw-sec-title { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--gray-90); display: flex; align-items: center; gap: 8px; }
.aw-field { position: relative; flex: 1; min-width: 0; }
/* D20 수정: 예약 정보 블록 */
.aw-info { margin: 24px 0 0; padding: 12px 16px; background: var(--gray-15); border-radius: var(--radius-md); display: grid; grid-template-columns: 80px 1fr; row-gap: 8px; font-size: 14px; line-height: 22px; }
.aw-info dt { color: var(--gray-60); font-weight: 500; }
.aw-info dd { margin: 0; color: var(--gray-90); font-weight: 600; min-width: 0; word-break: keep-all; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; } /* D47: 병원명·예약자명 최대 2줄, 넘으면 말줄임 */
/* D19 수정: 뒷자리 가림 */
.aw-eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border: none; background: none; padding: 0; color: var(--gray-50); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.aw-eye.on { color: var(--gray-80); }
.aw-input { width: 100%; height: 48px; padding: 0 14px; font-size: 16px; color: var(--gray-90); background: #fff; border: 1px solid var(--gray-30); border-radius: var(--radius-lg); outline: none; letter-spacing: .5px; }
.aw-input::placeholder { color: var(--gray-50); letter-spacing: 0; }
.aw-input:focus { border-color: var(--gray-100); }
.aw-input:disabled { background: var(--gray-10); color: var(--gray-60); cursor: not-allowed; }
.aw-consent-all .aw-consent-check { font-weight: 600; color: var(--gray-80); } /* 현행 카카오 body2_600 GRAY_80 */
.aw-consent-check:disabled { opacity: .5; cursor: not-allowed; }
.aw-input.err, .aw-input.err:focus { border-color: var(--red-60); }
.aw-err { margin-top: 8px; font-size: 14px; line-height: 22px; font-weight: 500; color: var(--red-60); }
.aw-consents { margin-top: 8px; }
.aw-consent-item { }
.aw-consent { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
.aw-consent-body-wrap { position: relative; margin: 0 0 12px 28px; }
.aw-consent-body { max-height: 240px; overflow-y: auto; overscroll-behavior: contain; margin: 0; padding: 12px 14px; background: var(--gray-10); border-radius: var(--radius-lg); font-size: 13px; line-height: 21px; color: var(--gray-80); white-space: pre-line; }
.aw-chev { display: inline-flex; vertical-align: -1px; transition: transform .15s; }
.aw-chev.up { transform: rotate(180deg); }
.aw-sheet-body.acc { padding-bottom: 28px; }
.aw-consent-check { flex: none; display: flex; align-items: flex-start; gap: 10px; background: none; border: none; padding: 0; text-align: left; flex: 1; min-width: 0; color: var(--gray-70); font-size: 14px; line-height: 22px; align-items: center; }
.aw-check { flex: none; width: 18px; height: 18px; border-radius: var(--radius-sm); border: 1px solid var(--gray-40); background: #fff; display: inline-flex; align-items: center; justify-content: center; }
.aw-check.on { background: var(--blue-60); border-color: var(--blue-60); }
.aw-check svg { display: block; }
.aw-view { flex: none; color: var(--gray-60); background: none; border: none; padding: 0; display: inline-flex; align-items: center; }
.aw-stack { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }

.aw-foot { flex: none; padding: 12px 20px 0; background: #fff; }
.aw-cta { width: 100%; height: 48px; border-radius: var(--radius-lg); border: none; font-size: 15px; font-weight: 700; color: #fff; background: var(--blue-60); }
.aw-cta:active { background: var(--blue-70); }
.aw-cta:disabled { background: var(--blue-30); color: var(--gray-60); cursor: not-allowed; }
.aw-cta.busy { background: var(--blue-50); color: #fff; cursor: progress; }
.aw-cta.sub { background: var(--gray-20); color: var(--gray-70); }
.aw-foot-help { margin-top: 8px; font-size: 12px; line-height: 18px; text-align: center; color: var(--gray-60); }
.aw-home { height: 34px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; flex: none; }
.aw-home i { width: 134px; height: 5px; border-radius: 3px; background: var(--gray-100); }
.aw-btn-row { display: flex; gap: 8px; }
.aw-btn-row .aw-cta { flex: 1; }

/* 가운데 상태 화면(로딩·진입 에러·안내) */
.aw-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px 24px; min-height: 260px; }
.aw-state-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
.aw-state-icon.gray { background: var(--gray-20); color: var(--gray-60); }
.aw-state-icon.red { background: var(--alpha-red-10); color: var(--red-60); }
.aw-state h3 { margin: 0; font-size: 18px; line-height: 27px; font-weight: 700; color: var(--gray-100); white-space: pre-line; }
.aw-state p { margin: 6px 0 0; font-size: 14px; line-height: 22px; color: var(--gray-70); white-space: pre-line; }
.aw-sheet-body.aw-noaction { padding: 24px 20px 54px; } /* v0.60 D66: 2-5 피그마 Confirm — 상 24·하 54·좌우 20, 버튼·홈 인디케이터 없음 */
.aw-sheet-body.aw-noaction .aw-state { flex: none; min-height: 0; padding: 0; }
.aw-sheet-body.aw-noaction .aw-state-icon { margin-bottom: 16px; }
.aw-sheet-body.aw-noaction .aw-state h3 { font-size: 24px; line-height: 34px; font-weight: 700; color: var(--gray-100); white-space: nowrap; }
.aw-sheet-body.aw-noaction .aw-state p { margin-top: 8px; font-size: 16px; line-height: 24px; font-weight: 400; color: var(--gray-70); }
.aw-state-icon.cancel { width: 56px; height: 56px; padding: 4px; background: none; } /* 피그마 img_cancel 48 + 컨테이너 56 */
.aw-state-icon.cancel .halo { fill: rgba(250,70,85,.2); } /* 피그마 이미지 후광 근사(Red/60 20%) */
.aw-state-icon.cancel .disc { fill: var(--red-60); }
.aw-spinner { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--gray-30); border-top-color: var(--blue-60); animation: aw-spin .8s linear infinite; margin-bottom: 16px; }
/* v0.47 D49: 요청 중 CTA 스피너 — 지름 18, 270° 호(오른쪽 1/4 투명), 글자색과 같음 */
.aw-spin-sm { display: inline-block; box-sizing: border-box; width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: aw-spin .8s linear infinite; vertical-align: -4px; margin-right: 6px; }
@keyframes aw-spin { to { transform: rotate(360deg); } }
.aw-countdown { margin-top: 8px; font-size: 13px; color: var(--gray-60); }

/* 오버레이(시트 위) */
.aw-ov { position: absolute; inset: 0; z-index: 20; background: var(--dim); display: flex; align-items: center; justify-content: center; }
.aw-alert { width: 315px; background: #fff; border-radius: var(--radius-xl); padding: 24px 20px 20px; }
.aw-alert h4 { margin: 0; font-size: 20px; line-height: 30px; font-weight: 700; color: var(--gray-100); }
.aw-alert p { margin: 16px 0 0; font-size: 14px; line-height: 22px; color: var(--gray-60); white-space: pre-line; }
.aw-alert p:first-child { margin-top: 0; } /* 제목 없는 알럿 대비(v0.48부터 모든 알럿에 제목 있음) */
.aw-alert .aw-btn-row { margin-top: 24px; }
.aw-alert .aw-cta { height: 48px; border-radius: var(--radius-md); font-size: 14px; }

/* 숫자 키패드(키보드 시뮬레이션) */

/* 가안·제안 표기 */
.aw-ga { outline: 1px dashed var(--gray-50); outline-offset: 2px; border-radius: 2px; position: relative; }
.aw-ga::after { content: attr(data-tag); position: relative; top: -1px; margin-left: 4px; display: inline-block; padding: 0 3px; font-size: 9.5px; line-height: 14px; font-weight: 700; border-radius: 3px; color: var(--gray-70); background: var(--gray-20); vertical-align: middle; letter-spacing: 0; }
.aw-ga.prop { outline-color: var(--orange-60); }
.aw-ga.prop::after { color: var(--orange-80); background: var(--alpha-orange-10); }
.aw-ga-off .aw-ga { outline: none; }
.aw-ga-off .aw-ga::after { display: none; }

/* ---------- 반응형 ---------- */
@media (max-width: 900px) {
  .aw-root { grid-template-columns: 1fr; }
  .aw-panel { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--gray-30); }
  .aw-panel-toggle { display: inline-flex; margin-top: 10px; }
  .aw-panel.collapsed .aw-panel-rest { display: none; }
  .aw-stage { padding: 20px 16px 32px; }
}

/* 피그마 Extra: 주민번호 섹션 제목 오른쪽 '뒷자리 가리기' 토글 */
.aw-sec-title-x { justify-content: space-between; }

/* 좌측 패널 접기 섹션 */
.aw-section.fold h2 { cursor: pointer; margin-bottom: 4px; }
.aw-section.fold h2::before { content: '▾'; font-size: 10px; color: var(--gray-50); }
.aw-section.fold.shut h2::before { content: '▸'; }
.aw-section.fold.shut > :not(h2) { display: none; }
/* v0.27 복원: 주민번호·키보드 */
.aw-rrn { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.aw-input.aw-input-mask { padding-right: 40px; } /* .aw-input padding 보다 뒤에 와도 이기도록 */
.aw-input.kbfocus { border-color: var(--gray-100); }
.aw-dash { font-size: 18px; font-weight: 700; color: var(--gray-80); flex: none; }
.aw-helper { margin-top: 16px; font-size: 13px; line-height: 20px; color: var(--gray-60); white-space: pre-line; }
/* v0.63 법률 검토 안내 링크·펼침 */
.aw-notice-link { display: inline-flex; align-items: center; margin-top: 8px; padding: 0; border: none; background: none; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--gray-70); cursor: pointer; text-align: left; }
.aw-notice-body { margin-top: 8px; padding: 12px 14px; background: var(--gray-10); border-radius: var(--radius-lg); font-size: 13px; line-height: 20px; color: var(--gray-80); white-space: pre-line; }
.aw-notice-title { font-weight: 600; color: var(--gray-90); margin-bottom: 4px; }
.aw-notice-list { white-space: normal; } /* 피그마: 들여쓰기 없는 "• " 줄 */
.aw-notice-list b { font-weight: 600; }
.aw-notice-chev { display: inline-flex; width: 16px; height: 16px; color: var(--gray-70); transition: transform .2s ease; }
.aw-notice-chev.open { transform: rotate(90deg); }
.aw-kb { position: absolute; left: 0; right: 0; bottom: 0; height: 268px; z-index: 6; background: #D1D4DA; padding: 26px 6px 34px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.aw-kb button { border: none; border-radius: 6px; background: #fff; font-size: 22px; font-weight: 500; color: var(--gray-100); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.aw-kb button.fn { background: transparent; box-shadow: none; font-size: 15px; }
.aw-kb-cap { position: absolute; left: 0; right: 0; bottom: 250px; z-index: 7; text-align: center; font-size: 10.5px; color: var(--gray-60); pointer-events: none; }
.aw-mask-toggle { flex: none; white-space: nowrap; /* v0.50: 좁은 폭에서도 줄어들거나 줄바꿈되지 않게 */ display: inline-flex; align-items: center; gap: 4px; border: none; background: none; padding: 0; font-size: 14px; line-height: 22px; font-weight: 400; color: var(--gray-70); cursor: pointer; }
.aw-mask-toggle svg { color: var(--gray-50); }
.aw-mask-toggle.on svg { color: var(--blue-60); }
.aw-input[readonly] { background: var(--gray-20); color: var(--gray-80); cursor: default; }
.aw-case.sub { margin-left: 20px; width: calc(100% - 20px); }


/* styles/adotWebviewMkt.css */
/* adot-webview-mkt — 원본 adotWebview.css 위에 얹는 추가분(마수동 섹션·에이닷 완료 메시지·앱 설치 유도) */

/* 패널 그룹 제목은 접기 없음 */
.mk-root .aw-group-title { cursor: default; }
.mk-root .aw-group-title::before { content: none; }

/* 이번 분기에서 추가한 영역 표시 */
.mk-added { position: relative; outline: 1.5px dashed var(--meta); outline-offset: 4px; border-radius: var(--radius-md); margin-top: 18px; }
.mk-added::before { content: attr(data-label); position: absolute; top: -13px; right: 0; padding: 0 6px; font-size: 10px; line-height: 16px; font-weight: 700; color: #fff; background: var(--meta); border-radius: var(--radius-sm); z-index: 1; }
.mk-added-off .mk-added { outline: none; }
.mk-added-off .mk-added::before { display: none; }

/* 마수동 섹션 */
.mk-sec { margin-top: 32px; }
.mk-added > .mk-sec { margin-top: 0; }
.mk-mkt-body { font-size: 13px; line-height: 20px; color: var(--gray-80); white-space: normal; }
.mk-mkt-body b { font-weight: 600; }
.mk-mkt-foot { margin-top: 8px; color: var(--gray-60); white-space: pre-line; }
.mk-helper { margin-top: 8px; }

/* 에이닷 완료 메시지 */
.mk-chat-done { padding-bottom: 40px; }
.mk-bubble { border: 1px solid var(--gray-30); border-radius: var(--radius-xl); padding: 16px; background: #fff; display: flex; flex-direction: column; gap: 12px; }
.mk-added > .mk-bubble { margin: 0; }
.mk-bubble-text { font-size: 14px; line-height: 21px; color: var(--gray-90); font-weight: 600; white-space: pre-line; }
.mk-summary { background: var(--gray-10); border-radius: var(--radius-lg); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.mk-summary div { display: flex; gap: 12px; font-size: 13px; line-height: 19px; }
.mk-summary span { width: 44px; flex: none; color: var(--gray-60); }
.mk-summary b { font-weight: 600; color: var(--gray-90); }
.mk-bubble .mk-added { margin-top: 6px; }

/* 굿닥 앱 설치 유도 */
.mk-install { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: var(--radius-lg); background: var(--alpha-blue-10); }
.mk-install-head { display: flex; gap: 10px; align-items: flex-start; }
.mk-install-logo { width: 36px; height: 36px; flex: none; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.mk-install-head b { display: block; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--gray-100); }
.mk-install-head p { margin: 2px 0 0; font-size: 13px; line-height: 19px; color: var(--gray-70); }
.mk-install-btn { height: 40px; border: none; border-radius: var(--radius-md); background: var(--blue-60); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
.mk-install-btn:hover { background: var(--blue-70); }

/* v0.3 에이닷 채팅형 — 에이닷(왼쪽 아바타+말풍선) / 사용자(오른쪽 말풍선) */
.mk-adot { display: flex; flex-direction: column; }
.mk-adot .aw-adot-head { flex: none; }
.mk-chat { flex: 1; min-height: 0; overflow-y: auto; gap: 14px; padding: 18px 16px 24px; background: var(--gray-10); scrollbar-width: none; }
.mk-chat::-webkit-scrollbar { display: none; }
.mk-chat.mk-chat-done { padding-bottom: 40px; }
.mk-msg { display: flex; gap: 8px; }
.mk-msg.me { justify-content: flex-end; }
.mk-avatar { width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--gray-100); color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.mk-msg-col { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: 280px; min-width: 0; }
.mk-name { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--gray-60); }
.mk-say { padding: 10px 14px; background: #fff; border-radius: 4px 18px 18px 18px; font-size: 14px; line-height: 21px; color: var(--gray-90); white-space: pre-line; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.mk-say.me { max-width: 240px; background: var(--blue-60); color: #fff; border-radius: 18px 4px 18px 18px; box-shadow: none; }
.mk-msg-col .mk-bubble { width: 100%; box-sizing: border-box; border: none; border-radius: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.mk-msg-col > .mk-added { width: 100%; margin-top: 10px; outline-offset: 2px; }
.mk-bubble-title { font-size: 14px; line-height: 20px; font-weight: 700; color: var(--gray-100); }

/* v0.4 앱 설치 탭 토스트 — 2초 뒤 사라짐 */
.mk-toast { position: absolute; left: 50%; bottom: 48px; transform: translateX(-50%); z-index: 8; padding: 10px 16px; border-radius: 999px; background: rgba(22,24,29,.88); color: #fff; font-size: 13px; line-height: 19px; font-weight: 600; white-space: nowrap; animation: mk-toast 2s ease forwards; }
@keyframes mk-toast { 0% { opacity: 0; transform: translate(-50%, 8px); } 12% { opacity: 1; transform: translate(-50%, 0); } 85% { opacity: 1; } 100% { opacity: 0; } }

/* v0.5 M2 굿닥 마수동만 받는 화면 */
.mk-only .aw-title { margin-top: 0; }
.mk-only-sub { margin: 8px 0 0; font-size: 15px; line-height: 22px; color: var(--gray-70); white-space: pre-line; }
.mk-only-box { margin-top: 24px; padding: 16px; border-radius: var(--radius-lg); background: var(--gray-10); }
.mk-only-box-title { font-size: 14px; line-height: 20px; font-weight: 700; color: var(--gray-90); }
.mk-only-box dl { margin: 12px 0 0; display: grid; grid-template-columns: 64px 1fr; row-gap: 6px; font-size: 13px; line-height: 19px; }
.mk-only-box dt { color: var(--gray-60); }
.mk-only-box dd { margin: 0; color: var(--gray-90); font-weight: 600; }
.mk-only-box-foot { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--gray-20); font-size: 12.5px; line-height: 18px; color: var(--gray-60); }
.mk-only-foot { display: flex; flex-direction: column; gap: 8px; }
.mk-only-info { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.mk-skip { height: 40px; border: none; background: none; font-size: 14px; font-weight: 500; color: var(--gray-60); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.mk-only-foot { gap: 4px; }
.mk-only-acc { margin-top: 24px; }
.mk-only-row { cursor: pointer; }
.mk-only-acc .aw-consent-body-wrap { margin-left: 0; }
.aw-sheet-body > .mk-added:first-child { margin-top: 0; } /* M2: 헤더~제목 간격을 M1과 같게(16) */
.aw-sheet-body > .mk-added:not(:first-child) { margin-top: 32px; } /* M1: 병원 약관 섹션과 간격 32(원본 섹션 간격) */

/* v0.7 스펙 제거 표시 */
.mk-removed { display: inline-block; margin-left: 6px; padding: 0 6px; font-size: 10.5px; line-height: 18px; font-weight: 700; border-radius: var(--radius-sm); color: var(--red-70); background: var(--alpha-red-10); vertical-align: middle; }

/* v0.10 신청 결과 화면(CONNECT26-1171) — S01 접수 / S03 확정 */
.mk-result { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 56px; }
.mk-result .aw-title { margin-top: 20px; }
.mk-result-ic { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--gray-50); }
.mk-result.ok .mk-result-ic { background: var(--blue-60); }
.mk-result-desc { margin: 10px 0 0; font-size: 15px; line-height: 22px; color: var(--gray-70); white-space: pre-line; }
