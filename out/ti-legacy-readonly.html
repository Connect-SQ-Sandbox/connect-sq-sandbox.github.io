/* ══════════════════════════════════════════════════════════════
   [수정15] 분류 찾기 모달 — 피그마 신안 반영 (18583:1503, 2026-09-08)
   Modal_분류찾기 Case 6종: 추천초기 / 대분류탐색 / 중분류탐색 /
   대분류기타 / 검색결과 / 결과없음. 680 × 685 (검색 72 + 구분선 1 + 본문 612).
   본문은 좌 200 / 우 480. 헤드·푸터·우측 헤드는 신안에서 제거(hidden).
   ══════════════════════════════════════════════════════════════ */

/* 제목·설명·닫기 버튼과 하단 바가 신안에서 빠졌다. 닫기는 Esc·배경 클릭만 남는다. */
.sep-dialog .tc-col-right-head{display:none!important}
/* 검색 영역 680×72 = 상하 16 + 폼 40. 아래 1px 구분선은 .tc-cols 의 border-top. */
.sep-dialog .sep-dialog-search{margin:16px}
.sep-dialog .sep-browser{margin-top:0}
.sep-dialog .tc-cols{border-top:1px solid #f2f4f7}

/* ── 좌측 대분류 200px. 흰 배경, radius 없음.
      선택은 파란 5% 배경 + 좌측 2px 라인(inset shadow 로 넣어 2px 밀림 방지). */
.sep-dialog .tc-col-left,.sep-dialog .sep-browser-left{width:200px;padding:0;background:#fff}
.sep-dialog .sep-category-nav{padding:0;border-top:0}
.sep-dialog .sep-recommend-row{margin:0}
.sep-dialog .sep-tooltip-wrap{right:16px;top:11px}
.sep-dialog .tc-col-c1,.sep-dialog .sep-recommend-row>.tc-col-c1{
  padding:10px 16px;gap:8px;border-radius:0;
  font:500 14px/22px var(--font-sans);color:#31353f;box-shadow:none}
.sep-dialog .tc-col-c1:hover{background:#f9f9fb}
.sep-dialog .tc-col-c1.sel{
  background:rgba(0,115,250,.05);color:#066ae5;font-weight:600;
  box-shadow:inset 2px 0 0 #479dff}
.sep-dialog .tc-col-c1-count{
  min-width:16px;padding:0;border-radius:0;background:none;
  font:500 12px/18px var(--font-sans);color:#808799;text-align:right}
.sep-dialog .tc-col-c1.sel .tc-col-c1-count{background:none;color:#0073fa;font-weight:700}
/* 추천 항목 행은 카운트 없이 도움말 아이콘만 — 아이콘 자리를 카운트 열에 맞춘다. */
.sep-dialog .sep-info-button{width:16px;height:16px;padding:0}

/* ── 우측 480px */
.sep-dialog .tc-col-right{padding:0}

/* ── 결과 행(추천 목록 · 검색 결과 공용). 경로 위 / 이름 아래 / 우측 체크. */
.sep-dialog .sep-results{padding:0}
.sep-dialog .sep-results>button{
  grid-template-columns:1fr auto;column-gap:12px;row-gap:2px;
  padding:12px 16px;border-radius:0;background:#fff}
.sep-dialog .sep-result-path{grid-column:1;font:400 12px/18px var(--font-sans);color:#808799}
.sep-dialog .sep-results strong{font:500 14px/22px var(--font-sans);color:#31353f}
.sep-dialog .sep-results>button:hover{background:#f9f9fb}
.sep-dialog .sep-results>button[aria-pressed="true"]{background:rgba(0,115,250,.05)}
.sep-dialog .sep-results>button[aria-pressed="true"]:hover{background:rgba(0,115,250,.1)}
.sep-dialog .sep-results>button[aria-pressed="true"] strong{color:#066ae5;font-weight:600}

/* 선택/선택됨 텍스트를 체크 아이콘으로 교체. 마스크라 색만 바꿔 상태를 표현한다.
   기본은 숨김, hover 는 회색, 선택은 파랑. */
.sep-dialog .sep-pick{
  grid-column:2;grid-row:1/3;align-self:center;flex-shrink:0;
  width:16px;height:16px;font-size:0;opacity:0;background:#caced8;
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'><path d='M13.5 5.25935L6.3399 11.8687L2.5 8.32415L3.5394 7.19813L6.3399 9.78321L12.4606 4.13333L13.5 5.25935Z' fill='%23000'/></svg>") center/16px 16px no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'><path d='M13.5 5.25935L6.3399 11.8687L2.5 8.32415L3.5394 7.19813L6.3399 9.78321L12.4606 4.13333L13.5 5.25935Z' fill='%23000'/></svg>") center/16px 16px no-repeat}
.sep-dialog .sep-results>button:hover .sep-pick,
.sep-dialog .sep-leaf:hover .sep-pick{opacity:1}
.sep-dialog .sep-results>button[aria-pressed="true"] .sep-pick,
.sep-dialog .sep-leaf.selected .sep-pick{opacity:1;background:#066ae5}

/* ── 중분류 아코디언. 펼침 헤더는 흰 배경 유지, 잎 영역만 회색. */
.sep-dialog .sep-group-toggle.tc-col-c2{
  padding:12px 16px;gap:12px;border-radius:0;border-bottom:1px solid #f2f4f7}
.sep-dialog .sep-group-toggle.expanded{background:#fff}
.sep-dialog .sep-group-toggle:hover{background:#f9f9fb}
.sep-dialog .tc-col-c2-name{font:500 14px/22px var(--font-sans);color:#31353f}
.sep-dialog .tc-tree-hint{margin-top:1px;font:400 12px/18px var(--font-sans);color:#808799}
.sep-dialog .sep-group-count{
  min-width:16px;font:500 12px/18px var(--font-sans);color:#808799;text-align:right}
.sep-dialog .sep-group-toggle svg{width:16px;height:16px;color:#a8aebd}

/* ── 소분류(잎). 좌측 인덴트 라인 대신 회색 블록. */
.sep-dialog .sep-leaves{margin:0;border-left:0;padding-left:0;background:#f9f9fb}
.sep-dialog .sep-leaf{
  padding:10px 16px;border-radius:0;background:transparent;
  font:500 14px/22px var(--font-sans);color:#31353f}
.sep-dialog .sep-leaf:hover{background:rgba(22,24,29,.03)}
.sep-dialog .sep-leaf.selected{background:rgba(0,115,250,.05);color:#066ae5;font-weight:600}
.sep-dialog .sep-leaf>span:last-child{color:transparent;font-size:0}
.sep-dialog .sep-leaf .sep-pick{grid-column:auto;grid-row:auto;color:transparent}

/* ── 결과없음. 아이콘 + 2행 카피, 우측 컬럼 중앙. */
.sep-dialog .sep-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  height:100%;min-height:360px;padding:0;
  font:400 16px/24px var(--font-sans);color:#5d6474;text-align:center}
.sep-dialog .sep-empty p{margin:0}
.sep-dialog .sep-empty-ic{
  width:32px;height:32px;flex-shrink:0;background:#caced8;
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M26.5182 15.3021C26.5182 9.056 21.4732 4 15.2591 4C9.0451 4.00008 4 9.05605 4 15.3021C4.00013 21.548 9.04518 26.6041 15.2591 26.6042C21.4731 26.6042 26.5181 21.548 26.5182 15.3021ZM29.1849 15.3021C29.1848 18.6588 28.0024 21.7388 26.0339 24.1484L30.276 28.3906C30.7967 28.9113 30.7967 29.7553 30.276 30.276C29.7553 30.7967 28.9113 30.7967 28.3906 30.276L24.1589 26.0443C21.7461 28.0578 18.6448 29.2708 15.2591 29.2708C7.56395 29.2708 1.33346 23.0123 1.33333 15.3021C1.33333 7.59179 7.56386 1.33341 15.2591 1.33333C22.9544 1.33333 29.1849 7.59174 29.1849 15.3021Z' fill='%23000'/><path d='M17.7239 11.0572C18.2446 10.5365 19.0886 10.5365 19.6093 11.0572C20.13 11.5779 20.13 12.4219 19.6093 12.9426L17.2187 15.3332L19.6093 17.7239C20.13 18.2446 20.13 19.0886 19.6093 19.6093C19.0886 20.13 18.2446 20.13 17.7239 19.6093L15.3332 17.2187L12.9426 19.6093C12.4219 20.13 11.5779 20.13 11.0572 19.6093C10.5365 19.0886 10.5365 18.2446 11.0572 17.7239L13.4478 15.3332L11.0572 12.9426C10.5365 12.4219 10.5365 11.5779 11.0572 11.0572C11.5779 10.5365 12.4219 10.5365 12.9426 11.0572L15.3332 13.4478L17.7239 11.0572Z' fill='%23000'/></svg>") center/32px 32px no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M26.5182 15.3021C26.5182 9.056 21.4732 4 15.2591 4C9.0451 4.00008 4 9.05605 4 15.3021C4.00013 21.548 9.04518 26.6041 15.2591 26.6042C21.4731 26.6042 26.5181 21.548 26.5182 15.3021ZM29.1849 15.3021C29.1848 18.6588 28.0024 21.7388 26.0339 24.1484L30.276 28.3906C30.7967 28.9113 30.7967 29.7553 30.276 30.276C29.7553 30.7967 28.9113 30.7967 28.3906 30.276L24.1589 26.0443C21.7461 28.0578 18.6448 29.2708 15.2591 29.2708C7.56395 29.2708 1.33346 23.0123 1.33333 15.3021C1.33333 7.59179 7.56386 1.33341 15.2591 1.33333C22.9544 1.33333 29.1849 7.59174 29.1849 15.3021Z' fill='%23000'/><path d='M17.7239 11.0572C18.2446 10.5365 19.0886 10.5365 19.6093 11.0572C20.13 11.5779 20.13 12.4219 19.6093 12.9426L17.2187 15.3332L19.6093 17.7239C20.13 18.2446 20.13 19.0886 19.6093 19.6093C19.0886 20.13 18.2446 20.13 17.7239 19.6093L15.3332 17.2187L12.9426 19.6093C12.4219 20.13 11.5779 20.13 11.0572 19.6093C10.5365 19.0886 10.5365 18.2446 11.0572 17.7239L13.4478 15.3332L11.0572 12.9426C10.5365 12.4219 10.5365 11.5779 11.0572 11.0572C11.5779 10.5365 12.4219 10.5365 12.9426 11.0572L15.3332 13.4478L17.7239 11.0572Z' fill='%23000'/></svg>") center/32px 32px no-repeat}

/* ══════════════════════════════════════════════════════════════
   [수정16] 분류 찾기 모달 — 헤더·푸터 복원 + 라인/컬러 보정
   기준: 피그마 18643:706180 (DS Modal 800×640, 내부 브라우즈 752×454)
   ══════════════════════════════════════════════════════════════ */
/* 모달 800×640, padding 24. 헤더 58 + gap 16 + 본문 454 + gap 24 + 버튼 40. */
.sep-dialog:not(.sep-convert){
  width:800px;height:640px;padding:24px;border:0;border-radius:16px;
  gap:16px;background:#fff}
/* ── 헤더. 신안에서 X 아이콘은 hidden — 하단 닫기 버튼과 중복이라 감춘다. */
.sep-dialog:not(.sep-convert) .sep-dialog-head{
  display:block;padding:0;border-bottom:0;flex-shrink:0}
.sep-dialog:not(.sep-convert) .sep-dialog-head h2{
  margin:0;font:700 20px/30px var(--font-sans);color:#16181d}
.sep-dialog:not(.sep-convert) .sep-dialog-head p{
  margin:4px 0 0;font:500 16px/24px var(--font-sans);color:#808799}
.sep-dialog:not(.sep-convert) .sep-dialog-head>button{display:none}

/* ── 검색 + 좌우 2열을 감싸는 외곽 박스. 신안에서 새로 생긴 라인이다. */
.sep-browse-box{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  border:1px solid rgba(128,135,153,.2);border-radius:8px;overflow:hidden;background:#fff}
/* 검색 인풋은 박스 안쪽에 16px 여백을 두고 자체 테두리를 갖는다. 돋보기는 우측. */
.sep-dialog:not(.sep-convert) .sep-dialog-search{
  margin:16px;height:auto;padding:9px 16px;gap:8px;
  border:1px solid #caced8;border-radius:6px;flex-shrink:0}
.sep-dialog:not(.sep-convert) .sep-dialog-search svg{order:2;width:18px;height:18px}
.sep-dialog:not(.sep-convert) .sep-dialog-search input{order:1;font:500 14px/22px var(--font-sans)}
.sep-dialog:not(.sep-convert) .sep-dialog-search input::placeholder{color:#a8aebd}
/* 검색 아래 1px 구분선은 .tc-cols 의 border-top 이 담당한다. */
.sep-browse-box .tc-cols{margin-top:0;border-top:1px solid #f2f4f7}
.sep-browse-box .tc-col-left{padding:0 0 8px}

/* ── 중분류 행 사이 구분선 제거. 신안은 행 경계선을 쓰지 않는다. */
.sep-dialog .sep-group-toggle.tc-col-c2{border-bottom:0}

/* ── 푸터. 신안은 우측 정렬 [닫기] 하나만 둔다(현재 분류 안내는 제거). */
.sep-dialog:not(.sep-convert) .sep-dialog-foot{
  padding:0;border-top:0;background:none;border-radius:0;
  justify-content:flex-end;flex-shrink:0;
  margin-top:8px}  /* 헤더~본문 16, 본문~버튼 24 (gap 16 + 8) */
.sep-dialog:not(.sep-convert) .sep-dialog-foot>span{display:none}
.sep-dialog:not(.sep-convert) .sep-dialog-foot .tc-cat-btn{
  height:40px;padding:0 16px;border:0;border-radius:8px;background:#f2f4f7;
  font:600 14px/22px var(--font-sans);color:#434956}
.sep-dialog:not(.sep-convert) .sep-dialog-foot .tc-cat-btn:hover{background:#e3e6ed}

/* ══════════════════════════════════════════════════════════════
   [수정17] 소분류 리스트(Leaves) — 상하 라인 추가. (피그마 18612:626204)
   중분류 행에서 구분선을 없앤 대신, 펼친 소분류 블록의 상·하 경계선이
   그 역할을 한다. 배경도 #F9F9FB → #F6F7F9(Gray/15) 로 한 단계 진해졌다.
   ══════════════════════════════════════════════════════════════ */
.sep-dialog .sep-leaves{
  background:#f6f7f9;
  border-top:1px solid #f2f4f7;
  border-bottom:1px solid #f2f4f7}
/* 행 높이 10/16 → 8/16 */
.sep-dialog .sep-leaf{padding:8px 16px}
/* 체크는 24×24 자리를 차지하고 그 안에 16px 아이콘. 비선택은 투명(자리 유지). */
.sep-dialog .sep-leaf .sep-pick{
  width:24px;height:24px;
  -webkit-mask-size:16px 16px;mask-size:16px 16px}

/* ══════════════════════════════════════════════════════════════
   [수정20] 접종형 규격 행에 가격 유형(고정/할인/상담 후 결정) 추가
            + 독감 기본 행의 "기본 가격 · 1회" 제거하고 앞에 "1회" 라벨
   ══════════════════════════════════════════════════════════════ */
/* td 는 table-cell 로 두고 안쪽 래퍼에서 배치한다(td 를 flex 로 만들면 행이 깨진다). */
.tc-cp-table td .tc-vac-cell{
  display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:nowrap}
.tc-vac-cell .rg-select-wrap{flex:0 0 auto;position:relative}
.tc-vac-cell .rg-select{width:104px;height:34px;padding:0 8px 0 10px;font-size:13px;gap:4px}
.tc-vac-cell .rg-select-menu{min-width:116px}
.tc-vac-cell .rg-num{flex:0 1 84px;width:84px;min-width:56px;height:34px;padding:0 8px}
.tc-vac-cell .rg-unit{height:34px;font-size:13px}
.tc-vac-cell .rg-price-arrow{color:#a8aebd;font-size:13px}
.tc-vac-cell .rg-help{white-space:nowrap}

/* 독감 기본 행 — 타이틀 없이 "1회" 를 금액 앞에 둔다(접종형 표의 단위 열과 같은 역할). */
.sep-preset-unit{
  flex:0 0 auto;min-width:44px;
  font:500 14px/22px var(--font-sans);color:#31353f}
/* 타이틀이 빠져 위쪽 여백만 남으므로 박스 패딩을 줄인다. */
.sep-preset-row{padding:12px 16px}

/* ══════════════════════════════════════════════════════════════
   [수정21] 접종형 규격 표 보정 — 드롭다운 잘림 + 정렬을 독감 기준으로
   ══════════════════════════════════════════════════════════════ */
/* (a) 열린 메뉴가 카드에 잘렸다. .tc-cp / .tc-vac-card 의 overflow:hidden 탓이다.
       overflow 를 풀고, 라운드 코너를 채우던 배경 요소에만 개별 radius 를 준다
       (그 둘만 흰색이 아니라 코너 밖으로 삐져나온다). */
.tc-cp{overflow:visible}
.tc-cp>.tc-cp-note{border-radius:10px 10px 0 0}
.tc-cp>.tc-cp-tabs{border-radius:10px 10px 0 0}
.tc-vac-card{overflow:visible}
.tc-vac-card>.tc-vac-head{border-radius:10px 10px 0 0}
.tc-vac-cell .rg-select-menu{width:104px;min-width:104px;z-index:30}

/* (b) 접종료 셀을 좌측 정렬로 — 독감 기본 행과 같은 방식이다.
       우측 정렬이면 할인을 고를 때 기존 필드가 왼쪽으로 밀리는데,
       좌측 정렬이면 새 필드가 우측 여백으로 자란다. */
.tc-cp-table td .tc-vac-cell{justify-content:flex-start}
.tc-vac-card .tc-cp-table th.num{text-align:left}
.tc-vac-card .tc-cp-table th:first-child,
.tc-vac-card .tc-cp-table td:first-child{width:96px;white-space:nowrap}

/* ══════════════════════════════════════════════════════════════
   [수정23] 접종형 표의 이중 테두리 제거. (세화님 지적)
   .tc-cp(바깥) 안에 12px 여백을 두고 .tc-vac-card(안쪽)가 또 테두리를 가졌다.
   카드 헤더를 없앤 뒤로는 안쪽 테두리가 구분할 대상이 없다 — 소분류를 고르면
   제품 카드가 항상 1장이다. 바깥 하나만 프레임으로 쓴다.
   ══════════════════════════════════════════════════════════════ */
.tc-cp>.tc-vac-list{padding:0;gap:0}
.tc-vac-card,.tc-vac-card.on{border:0;border-radius:0;background:transparent}
/* 마지막 행의 하단 선이 .tc-cp 테두리와 겹쳐 이중선이 되는 것 방지 */
.tc-vac-card .tc-cp-table tbody tr:last-child>td{border-bottom:0}
/* 제품이 2장 이상 붙는 경우(대상포진 3종 묶음)에는 카드 사이 경계선이 필요하다 */
.tc-vac-card+.tc-vac-card{border-top:1px solid #f2f4f7}
/* 할인은 필드가 2개라 좁은 폭에서 줄바꿈이 나던 것 — nowrap + 축소 허용으로 한 줄 유지 */
.tc-vac-cell .rg-unit,.tc-vac-cell .rg-price-arrow{flex:0 0 auto;white-space:nowrap}

/* ══════════════════════════════════════════════════════════════
   [트리판] 분류 선택을 모달에서 꺼내 3열 캐스케이드 트리로.
   대분류 → 중분류 → 소분류. 이전 열을 고르면 다음 열이 채워진다.
   최초 상태는 추천 항목(대분류 열 첫 행) — 우측이 추천 목록 한 판이 된다.
   ══════════════════════════════════════════════════════════════ */
.tt-tree{
  display:flex;background:#fff;
  border:1px solid rgba(128,135,153,.2);border-radius:8px;
  /* 폼 폭이 좁아지면(브라우저 1200 미만) 열을 짜부수지 말고 가로 스크롤로 넘긴다 */
  overflow-x:auto;overflow-y:hidden}
.tt-col{
  flex:1 1 0;min-width:152px;display:flex;flex-direction:column;
  border-left:1px solid #f2f4f7}
/* 대분류 이름은 짧고 중분류 이름이 길다(홍역·풍진·볼거리 백신).
   1:1:1 로 나누면 대분류 열이 남고 중분류가 잘리므로 첫 열만 고정한다. */
.tt-col:first-child{border-left:0;flex:0 0 168px;min-width:168px}
.tt-col-wide{flex:2 1 0}
.tt-col-head{
  flex:0 0 auto;padding:8px 16px;background:#f9f9fb;
  border-bottom:1px solid #f2f4f7;
  font:700 11.5px/18px var(--font-sans);color:#a8aebd}
.tt-col-body{flex:1 1 auto;min-height:0;height:300px;overflow-y:auto;padding:4px 0}

.tt-row{
  width:100%;display:flex;align-items:center;gap:8px;
  padding:10px 16px;border:0;background:none;cursor:pointer;text-align:left;
  font:500 14px/22px var(--font-sans);color:#31353f;font-family:var(--font-sans)}
.tt-row:hover{background:#f9f9fb}
.tt-row.sel{
  background:rgba(0,115,250,.05);color:#066ae5;font-weight:600;
  box-shadow:inset 2px 0 0 #479dff}
.tt-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-cnt{
  flex:0 0 auto;min-width:16px;text-align:right;
  font:500 12px/18px var(--font-sans);color:#808799}
.tt-row.sel .tt-cnt{color:#0073fa;font-weight:700}
/* Fm 은 아래쪽 셰브런이라 -90도 돌려 오른쪽으로 세운다 */
.tt-arw{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:16px;height:16px;color:#a8aebd}
.tt-arw svg{width:16px;height:16px;transform:rotate(-90deg)}
.tt-row.sel .tt-arw{color:#479dff}

/* 추천 행 — 경로 위, 제품명 아래 (모달의 결과 행과 같은 구조) */
.tt-row-reco{align-items:flex-start}
.tt-reco-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.tt-path{font:400 12px/18px var(--font-sans);color:#808799}
.tt-row-reco .tt-name{font:500 14px/22px var(--font-sans)}
.tt-row-reco.sel .tt-name{color:#066ae5;font-weight:600}

.tt-empty{padding:28px 16px;font:400 12px/18px var(--font-sans);color:#a8aebd;text-align:center}

/* ── [T7] 트리 위 검색. 결과는 레이어로 띄우고 대·중분류로 묶어 보여준다.
      고르면 값이 잡히고 하단 트리의 세 열도 그 경로로 이동한다. */
.tt-search-wrap{position:relative;margin-bottom:8px}
.tt-search{
  display:flex;align-items:center;gap:8px;padding:9px 16px;
  border:1px solid #caced8;border-radius:6px;background:#fff}
.tt-search:focus-within{border-color:var(--blue-60,#0073fa)}
.tt-search-input{
  flex:1 1 auto;min-width:0;border:0;outline:none;box-shadow:none;background:transparent;
  font:500 14px/22px var(--font-sans);color:#16181d}
.tt-search-input::placeholder{color:#a8aebd}
.tt-search-ic{flex:0 0 auto;display:flex;align-items:center;color:#808799}
.tt-search-ic svg{width:18px;height:18px}
.tt-search-clear{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  width:20px;height:20px;padding:0;border:0;background:none;color:#808799;cursor:pointer}
.tt-search-clear svg{width:16px;height:16px}

.tt-layer{
  position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;
  max-height:320px;overflow-y:auto;padding:4px 0;background:#fff;
  border:1px solid #e3e6ed;border-radius:8px;
  box-shadow:0 2px 1px rgba(22,24,29,.02),0 4px 12px rgba(22,24,29,.12)}
.tt-lgroup{padding:4px 0}
.tt-lgroup+.tt-lgroup{border-top:1px solid #f2f4f7}
.tt-lgroup-head{padding:6px 16px;font:400 12px/18px var(--font-sans);color:#808799}
.tt-litem{
  width:100%;display:block;text-align:left;padding:8px 16px;
  border:0;background:none;cursor:pointer;
  font:500 14px/22px var(--font-sans);color:#31353f;font-family:var(--font-sans)}
.tt-litem:hover{background:#f9f9fb}
.tt-litem.sel{background:rgba(0,115,250,.05);color:#066ae5;font-weight:600}

/* ── [T13] 추천 열도 대·중분류로 묶는다. 경로는 그룹 헤더에 한 번만.
      독감 9종이 "예방접종 › 독감 백신" 을 9번 반복해 목록이 길어졌다.
      검색 레이어(.tt-lgroup)와 같은 문법을 쓴다. */
.tt-rgroup{padding:4px 0}
.tt-rgroup+.tt-rgroup{border-top:1px solid #f2f4f7}
.tt-ghead{padding:6px 16px;font:400 12px/18px var(--font-sans);color:#808799}

/* ── [T14] 이미 이 소분류로 등록된 상품 수 표기. 차단이 아니라 안내다 —
      동일 소분류에 여러 상품을 등록하는 건 정상 사용(별칭이 다른 케이스). */
.tt-reg{
  flex:0 0 auto;padding:2px 6px;border-radius:999px;background:#f2f4f7;
  font:600 11px/16px var(--font-sans);color:#5d6474;white-space:nowrap}
.tt-row.sel .tt-reg{background:rgba(0,115,250,.12);color:#066ae5}
/* 검색 레이어 항목은 이름과 배지를 좌우로 나눈다 */
.tt-litem{display:flex;align-items:center;gap:8px}
.tt-lname{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-litem.sel .tt-reg{background:rgba(0,115,250,.12);color:#066ae5}

/* [T9] 소분류 열 안내 문구를 박스 기준 수직·수평 중앙으로.
   검색 레이어의 결과없음 문구는 높이가 내용에 맞춰지므로 건드리지 않는다. */
.tt-col-body>.tt-empty{
  display:flex;align-items:center;justify-content:center;
  height:100%;padding:16px 20px;box-sizing:border-box}

/* ── [T11] 섹션 타이틀(필수 정보 / 추가 정보)을 카드 박스 밖 위로.
      현재 서비스 폼이 그룹 타이틀을 박스 위에 두는 방식이다.
      타이틀을 가진 카드만 골라(:has) 위쪽 공간을 확보하고,
      타이틀은 absolute 로 카드 상단 바깥에 띄운다. 타이틀 26 + 간격 12 = 38. */
.rg-card:has(>.rg-group-title){position:relative;margin-top:38px}
.rg-card>.rg-group-title{
  position:absolute;left:0;bottom:100%;margin:0 0 12px;padding:0;
  white-space:nowrap}

/* ── [T15] 피그마 컴포넌트 실측값에 맞춤 (t1.0).
      검색바 = Form 10437:243518 / Input 10437:243260 (Size=medium)
      결과·트리 행 = 분류찾기/Row 18584:1518
      그룹 헤더 = 분류찾기/Row_대,중분류 18675:149686
      기등록 배지 = DS Badge 10647:29637 (Tone=Neutral, Size=Small)
      위 규칙들을 덮어쓰는 게 목적이라 style 맨 끝에 둔다. */

/* 검색바 44 → 40. input 이 line-height 를 무시하고 26px 콘텐츠 높이를
   갖는 탓에 padding 9 로는 44 가 되므로 높이를 직접 고정한다. */
.tt-search{height:40px;padding:0 16px}
.tt-search-input{height:22px;color:#31353f}
/* DS Input 의 State=Focus 는 파란 링이 아니라 진회색 테두리다 */
.tt-search:focus-within{border-color:#31353f}

/* 행 40 통일 — 트리 열 42, 검색 결과 38 이었다 */
.tt-row,.tt-litem{padding:9px 16px}
.tt-row:hover,.tt-litem:hover{background:#f6f7f9}
/* DS Row 의 Seleted=True 는 배경 틴트 + 블루 SemiBold 뿐. 좌측 인셋 바는 없다 */
.tt-row.sel{box-shadow:none}
.tt-row.sel:hover,.tt-litem.sel:hover{background:rgba(0,115,250,.1)}

/* 그룹 헤더 30 → 34 */
.tt-lgroup-head,.tt-ghead{padding:8px 16px}

/* 배지는 라벨 없이 숫자만. [T40] 피그마 DS Badge 실측으로 교체 —
   20x20 <b>정사각</b> · radius 3 · 좌우 패딩 0 · Medium 10/14 #434956 ·
   배경 #808799 10%. 앞서 min-width 36 으로 두어 가로로 길쭉했다.
   min-width 로 둬서 세 자리 수는 잘리지 않고 옆으로만 늘어난다.
   행이 선택돼도 배지 색은 그대로다(DS Row 4개 배리언트 전부 Tone=Neutral). */
.tt-reg{
  box-sizing:border-box;flex:0 0 auto;
  min-width:20px;height:20px;padding:1px 0;border-radius:3px;
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(128,135,153,.1);
  font:500 10px/14px var(--font-sans);color:#434956}
.tt-row.sel .tt-reg,.tt-litem.sel .tt-reg{background:rgba(128,135,153,.1);color:#434956}

/* ── [T18] 검색어 없이 포커스하면 검색 가이드를 띄운다(t1.3).
      현재 서비스 진료항목 검색의 "이렇게 검색해 보세요" 를 그대로 유지한다.
      [T21] 에서 피그마 Case=최초진입 실측값으로 교체했다(t1.6).
      제목은 박스 밖 16 Bold, 항목 3개는 회색 박스(#f9f9fb, radius 8) 안에.
      레이어 4 + Con 20 + 제목 24 + gap 10 + 박스 196 + 20 + 4 = 278. */
.tt-gcon{display:flex;flex-direction:column;gap:10px;padding:20px}
.tt-guide-h{margin:0;padding:0;font:700 16px/24px var(--font-sans);color:#31353f}
.tt-gbox{display:flex;flex-direction:column;gap:12px;padding:20px;
  border-radius:8px;background:#f9f9fb}
.tt-gitem{padding:0}
.tt-gdesc{margin:0;font:600 14px/22px var(--font-sans);color:#31353f}
.tt-gex{margin:0;padding-left:15px;font:400 14px/22px var(--font-sans);color:#808799}

/* [T21] 결과없음 — 피그마 분류검색_결과없음 인스턴스 실측(630x100, padding 28/16,
   14 Regular/22 #808799 가운데). 트리 열 안내(.tt-col-body>.tt-empty)는 규칙이
   달라 건드리지 않으므로 레이어 안쪽만 덮어쓴다. */
.tt-layer>.tt-empty{padding:28px 16px;font:400 14px/22px var(--font-sans);color:#808799}

/* ══════════════════════════════════════════════════════════════
   [T36] 유효성 문구 — 피그마 DS Form > Extra 실측
   (진료항목_입력폼_한줄입력 에러 인스턴스 18810:17052 기준)
   입력칸 아래 gap 4 · 높이 18 한 줄. 좌측 에러 · 우측 글자수.
   에러 Medium 12/18 #FA4655 / 글자수 12/18, 현재값만 SemiBold #434956.
   ══════════════════════════════════════════════════════════════ */
.rg-extra{display:flex;align-items:center;gap:8px;margin-top:4px}
.rg-extra .rg-error{margin:0;margin-right:auto}
.rg-extra .rg-counter{margin-top:0;margin-left:auto}
.rg-error{margin:4px 0 0;font:500 12px/18px var(--font-sans);color:#fa4655}
.rg-counter{margin-top:4px;font:500 12px/18px var(--font-sans);color:#808799}
.rg-counter-num{font-weight:600;color:#434956}
/* 가격 금액칸 — 피그마 진료항목_가격정보입력하위(18643:736103) 의
   유효성체크실패=True 배리언트는 에러를 <b>칸별로</b> 붙인다(Form 128x62 = 40+4+18).
   행 전체 아래 한 줄로 깔지 않는다. */
/* 분류 미선택 에러는 카드 직계 자식이라 필드의 24px 거터를 못 받는다.
   피그마 Value=Error 배리언트처럼 필드 안쪽에 맞춘다. */
.rg-card > .rg-error{padding:0 24px;
  /* 카드 gap 이 24 라 그대로 두면 트리에서 28px 떨어진다. DS 는 입력칸→에러 4px
     이므로 24 를 상쇄한다. 카드 gap 을 바꾸면 이 값도 같이 봐야 한다. */
  margin:-20px 0 0}
.rg-num-wrap{display:flex;flex-direction:column;gap:4px;flex:none}
/* 행을 flex-start 로 바꾼 뒤 높이가 없는 요소는 위로 붙는다.
   피그마도 Arrow 를 40 높이 가운데 정렬로 둔다. */
.rg-price-arrow{height:40px;display:flex;align-items:center}
.rg-price-entry>.rg-help{height:40px;display:flex;align-items:center}
.rg-num-wrap .rg-error{margin:0;white-space:pre}
.rg-price-entry{align-items:flex-start}

/* ══════════════════════════════════════════════════════════════
   [T33] 추천 · 접종형 규격 가격 폼 — 피그마 가격정보_입력폼 Case=추천 실측
   (단건 18794:384696 · 복수건 18796:384847)
   행 = 회차 라벨(600 14/22 #31353F) 위, 입력 행 아래. 둘 사이 gap 8.
   행 자체는 테두리 없이 padding 8 / 좌측 24, radius 8.
   입력은 기본 .rg-select(140x40) · .rg-num(128x40) 그대로 쓴다.
   일반 규격은 As-is 동일이라 건드리지 않는다.
   ══════════════════════════════════════════════════════════════ */
/* (a) 독감 추천 — 테두리·바깥 여백을 없애고 라벨을 윗줄로 */
.sep-preset-row{padding:8px 8px 8px 24px;border:0;border-radius:8px;margin:0}
.sep-preset-row .rg-price-fields{gap:8px}
.sep-preset-unit{display:block;flex:none;min-width:0;
  font:600 14px/22px var(--font-sans);color:#31353f}
.sep-preset-row .rg-price-entry{gap:8px}

/* (b) 접종형 — 표(td 2칸)를 같은 스택 행으로 바꾼다.
       마크업은 그대로 두고 표시만 블록으로 돌린다. */
.tc-vac-card .tc-cp-table,
.tc-vac-card .tc-cp-table>tbody,
.tc-vac-card .tc-cp-table>tbody>tr,
.tc-vac-card .tc-cp-table>tbody>tr>td{
  display:block;width:auto;padding:0;border:0;text-align:left;white-space:normal}
.tc-vac-card .tc-cp-table>tbody>tr{padding:8px 8px 8px 0;border-radius:8px}
.tc-vac-card .tc-cp-table>tbody>tr>td:first-child{
  margin-bottom:8px;font:600 14px/22px var(--font-sans);color:#31353f}
.tc-vac-list{gap:0;padding:0 0 8px}
.tc-vac-card+.tc-vac-card{border-top:0}

/* (c) 접종형 입력 축소 오버라이드 해제 — 피그마는 일반 규격과 같은 치수.
       기존 .tc-cp-table td.num .rg-num 이 (0,3,1) 이라 셀렉터를 더 좁게 쓴다. */
.tc-vac-card .tc-cp-table td .tc-vac-cell{gap:8px;justify-content:flex-start}
.tc-vac-card .tc-cp-table td .tc-vac-cell .rg-select{
  width:140px;height:40px;padding:0 12px 0 16px;font-size:14px;gap:12px}
.tc-vac-card .tc-cp-table td .tc-vac-cell .rg-select-menu{width:140px;min-width:140px}
.tc-vac-card .tc-cp-table td .tc-vac-cell .rg-num{
  flex:none;width:128px;min-width:0;height:40px;padding:0 16px;font-size:14px;text-align:right}
.tc-vac-card .tc-cp-table td .tc-vac-cell .rg-unit{height:40px;font-size:14px}
.tc-vac-card .tc-cp-table td .tc-vac-cell .rg-price-arrow{color:#16181d;font-size:14px}

/* (d) 접종형 바깥 박스 제거 — 피그마 Case=추천 은 테두리 없는 흰 영역이다.
       처방형(마운자로 등)의 .tc-cp 는 탭 UI 라 박스를 유지해야 하므로
       접종형 목록을 품은 .tc-cp 만 골라 푼다. */
.tc-cp:has(>.tc-vac-list){border:0;border-radius:0;background:transparent}

/* (e) 상담 후 결정 — 비활성 입력칸. [T47] 에서 일반 규격 행도 쓰게 되어 전역으로 올렸다. */
.rg-num:disabled{
  background:#f6f7f9;border-color:#f2f4f7;color:#808799;cursor:not-allowed}

/* [T29] 가격 초기화 확인 모달 — 피그마 Modal(18775:384554) 실측.
   .sep-dialog 기본 셸(680x620 · 분리된 head/foot · 1px 보더)은 폐기된 분류찾기
   모달용이라 여기서 전부 덮어쓴다. 마크업도 head/foot 클래스를 떼서
   그쪽 레거시 규칙에 닿지 않게 했다. */
.sep-dialog.sep-convert{
  /* height 는 fit-content 여야 한다. dialog::modal 은 UA 가 inset:0 + margin:auto 를
     주므로 auto 면 뷰포트 높이만큼 늘어난다. */
  box-sizing:border-box;width:560px;height:fit-content;
  max-width:calc(100vw - 40px);max-height:calc(100vh - 48px);
  border:0;border-radius:16px;padding:24px;background:#fff;color:#16181d;
  box-shadow:0 8px 24px rgba(22,24,29,.12);overflow:hidden}
.sep-dialog.sep-convert[open]{display:flex;flex-direction:column;gap:24px}
.sep-convert-text{display:flex;flex-direction:column;gap:8px}
.sep-convert-text h2{margin:0;font:700 20px/30px var(--font-sans);color:#16181d}
.sep-convert-body{padding:0;overflow:visible;font:500 16px/24px var(--font-sans);color:#808799}
.sep-convert-body p{margin:0}
.sep-convert-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.sep-mbtn{display:inline-flex;align-items:center;justify-content:center;
  box-sizing:border-box;height:40px;min-width:64px;padding:0 20px;
  border:0;border-radius:6px;cursor:pointer;font:600 14px/22px var(--font-sans)}
.sep-mbtn.cancel{background:rgba(128,135,153,.1);color:#5d6474}
.sep-mbtn.cancel:hover{background:rgba(128,135,153,.18)}
.sep-mbtn.primary{background:#0073fa;color:#fff}
.sep-mbtn.primary:hover{background:#066ae5}


/* styles/tiLegacyReadonly.css */
/* ti-legacy-readonly — 구 버전 상품을 추천 규격으로 다시 입력받기. lr- 접두사만 쓴다.
   트리판 폼 생김새는 tiLegacySpecTree.css(사본)가 맡는다. */

.lr-root { --lr-tb: 96px; --lr-proto: #6b4fd8; min-height: 100vh; background: #fff; }

/* ---------------- 프로토 툴바 (실제 화면 밖) ---------------- */
.lr-toolbar {
  position: sticky; top: 0; z-index: 200; background: #1f2329; color: #e6e8ec;
  padding: 10px 20px; display: flex; flex-direction: column; gap: 8px; font: 500 12px/18px var(--font-sans);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
}
.lr-tb-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.lr-tb-badge { padding: 2px 6px; border-radius: 4px; background: var(--lr-proto); color: #fff; font: 700 10px/16px var(--font-sans); letter-spacing: .06em; }
.lr-tb-title { font: 700 13px/20px var(--font-sans); color: #fff; }
.lr-tb-title em { font-style: normal; font-weight: 500; color: #9aa1ad; margin-left: 6px; }
.lr-tb-sp { flex: 1 1 auto; }
.lr-tb-label { flex: 0 0 40px; color: #9aa1ad; font-weight: 600; }
.lr-tb-state { padding: 2px 8px; border-radius: 10px; background: #2a2f37; color: #b5bcc7; font-weight: 700; }
.lr-tb-state.on { background: #0073fa; color: #fff; }
.lr-tb-btn { height: 28px; padding: 0 10px; border: 1px solid #3a404a; border-radius: 6px; background: #2a2f37; color: #fff; font: 600 12px/1 var(--font-sans); cursor: pointer; }
.lr-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.lr-chip {
  height: 28px; padding: 0 10px; border: 1px solid #3a404a; border-radius: 14px; background: #2a2f37; color: #d7dbe1;
  display: inline-flex; align-items: center; gap: 5px; font: 500 12px/1 var(--font-sans); cursor: pointer; white-space: nowrap;
}
.lr-chip b { color: #fff; font-weight: 700; }
.lr-chip.ok { border-style: dashed; border-color: #41d293; }
.lr-chip.on { background: #fff; border-color: #fff; color: #16181d; }
.lr-chip.on b { color: #0073fa; }
.lr-tb-example { flex: 1 1 320px; min-width: 0; color: #b5bcc7; }
.lr-tb-example b { color: #fff; margin-right: 4px; }

/* ---------------- 카드만 떼어 낸 레이아웃 ---------------- */
.lr-main { min-height: calc(100vh - var(--lr-tb)); }
.lr-main .rg-container { max-width: none; padding: 40px 24px 124px; justify-content: center; }
.lr-main .rg-form { flex: 0 1 720px; max-width: 720px; }
.lr-main .rg-footer { padding: 0 max(24px, calc((100% - 720px) / 2)); }

/* ---------------- 기존 가격 옵션 (read-only) ---------------- */
.rg-field.price > .lr-ro,
.rg-field.price > .lr-slots { margin-left: 24px; }
.lr-ro { margin-bottom: 8px; padding: 12px 16px 8px; border-radius: 8px; background: #f9f9fb; }
.lr-ro-head { display: flex; flex-direction: column; gap: 2px; padding-bottom: 4px; }
.lr-ro-title { font: 600 14px/22px var(--font-sans); color: #31353f; }
.lr-ro .rg-price-row { padding: 8px 0; }
.lr-ro-gutter { display: none; }
.lr-ro .rg-input[readonly] { background: #f2f4f7; border-color: #e3e6ed; color: #434956; cursor: default; }
.lr-ro .rg-input[readonly]::placeholder { color: #a8aebd; }
.lr-ro .rg-input[readonly]:focus { border-color: #e3e6ed; }
.lr-ro .rg-select:disabled { background: #f2f4f7; border-color: #e3e6ed; color: #434956; cursor: default; }
.lr-ro .rg-select:disabled .rg-select-ic { color: #a8aebd; }
.lr-ro .rg-num:disabled { background: #f2f4f7; border-color: #e3e6ed; color: #434956; cursor: default; }
.lr-ro .rg-price-row + .rg-price-row { border-top: 1px solid #eef0f3; border-radius: 0; }

/* ---------------- 추천 규격 행 (트리판 추천 행과 같은 치수) ---------------- */
.lr-slots { display: flex; flex-direction: column; }
.lr-slot { padding: 8px 0; display: flex; flex-direction: column; gap: 8px; }
.lr-slot-label { font: 600 14px/22px var(--font-sans); color: #31353f; }
.lr-group-error { margin: 0; }

/* 토스트 */
.lr-toast {
  position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 400;
  padding: 10px 16px; border-radius: 8px; background: rgba(22, 24, 29, .9); color: #fff; font: 500 13px/20px var(--font-sans);
  max-width: calc(100vw - 32px);
}
