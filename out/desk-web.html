/* styles/connectShell.css */
/* =============================================================
   굿닥 커넥트 웹뷰 — 공통 셸 (디자인 토큰 + 윈도우 셸/사이드내비)
   여러 커넥트 화면(진료항목 등록, 예약 신청 내역 등)이 공유한다.
   - /Users/goodoc/test 프로토타입의 colors_and_type.css(:root)와
     connect.css의 셸 부분을 이식.
   - 전역 누수 방지를 위해 원본 body 레벨 스타일은 .cn-artboard 래퍼로
     한정했고 리셋도 .cn-artboard 하위로 스코프.
   - 클래스 접두사(cn-)가 고유해 다른 페이지와 충돌하지 않음.
   ============================================================= */

/* ---- Design tokens (colors_and_type.css :root, @font-face 제외) ---- */
:root {
  --gray-10:  #F9FAFB;
  --gray-15:  #F4F6F8;
  --gray-20:  #F2F4F6;
  --gray-30:  #E5E8EB;
  --gray-40:  #D1D6DB;
  --gray-50:  #B0B8C1;
  --gray-60:  #8B95A1;
  --gray-70:  #6B7684;
  --gray-80:  #4E5968;
  --gray-90:  #31353F;
  --gray-100: #191F28;

  --blue-30:  #B3D5FF;
  --blue-60:  #0073FA;
  --blue-70:  #0061DB;
  --blue-80:  #0050B5;

  --red-60:   #FA4655;
  --red-70:   #EC3847;
  --red-80:   #D52130;

  --green-70: #41D293;
  --green-80: #1FA972;
  --orange-60:#F79009;

  --white: #FFFFFF;
  --black: #000000;
  --transparent: transparent;

  --alpha-gray-05: rgba(128, 135, 153, 0.05);
  --alpha-gray-10: rgba(128, 135, 153, 0.10);
  --alpha-gray-15: rgba(128, 135, 153, 0.15);
  --alpha-gray-20: rgba(128, 135, 153, 0.20);
  --alpha-gray-40: rgba(128, 135, 153, 0.40);
  --alpha-gray-60: rgba(128, 135, 153, 0.60);

  --alpha-blue-05: rgba(0, 115, 250, 0.05);
  --alpha-blue-10: rgba(0, 115, 250, 0.10);
  --alpha-blue-15: rgba(0, 115, 250, 0.15);
  --alpha-blue-20: rgba(0, 115, 250, 0.20);

  --alpha-red-05: rgba(250, 70, 85, 0.05);
  --alpha-red-10: rgba(250, 70, 85, 0.10);
  --alpha-red-15: rgba(250, 70, 85, 0.15);
  --alpha-red-20: rgba(250, 70, 85, 0.20);

  --shadow-toast: 0 2px 1px rgba(22, 24, 29, 0.02), 0 2px 8px rgba(22, 24, 29, 0.10);
  --shadow-toggle-knob: 0 0 6px rgba(0, 0, 0, 0.25);

  --font-sans: 'Pretendard', 'Pretendard Variable', -apple-system,
    BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}

/* ---- Artboard backdrop (원본 connect.css의 body 스타일을 래퍼로 한정) ---- */
.cn-artboard {
  font-family: var(--font-sans);
  background: #e7e9ee;
  color: var(--gray-100);
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 24px;
}
.cn-artboard *,
.cn-artboard *::before,
.cn-artboard *::after { box-sizing: border-box; }

/* ---- App window (1280 x 832 rounded webview frame) ---- */
.cn-screen {
  width: 1280px;
  min-height: 832px;
  background: var(--white);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 12px 40px rgba(22, 24, 29, 0.12);
  position: relative;
}

/* ---- Title bar (windows-style) ---- */
.cn-titlebar {
  height: 32px;
  background: #f3f3f3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: none;
}
.cn-ci { display: flex; align-items: center; gap: 4px; padding: 0 8px; height: 100%; }
.cn-ci-mark { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
.cn-ci-mark svg { display: block; }
.cn-ci-name { font: 500 13px/16px var(--font-sans); color: rgba(0, 0, 0, 0.9); padding: 0 8px 2px 4px; }
.cn-winctrls { display: flex; height: 100%; }
.cn-winbtn {
  width: 46px; height: 32px;
  border: 0; background: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  color: rgba(0, 0, 0, 0.9); cursor: pointer;
}
.cn-winbtn:hover { background: rgba(0, 0, 0, 0.05); }
.cn-winbtn.close:hover { background: #e81123; color: #fff; }

/* ---- Body: nav + main ---- */
.cn-body { display: flex; align-items: stretch; flex: 1; min-height: 800px; }

/* ---- Side nav (250px) ---- */
.cn-nav { width: 250px; flex: none; background: #f2f4f7; position: relative; display: flex; flex-direction: column; }
.cn-nav-scroll { flex: 1; overflow: auto; }
.cn-nav-group { padding: 8px 0; display: flex; flex-direction: column; }
.cn-nav-header { height: 40px; display: flex; align-items: center; padding: 0 16px; font: 600 14px/20px var(--font-sans); color: rgba(0, 0, 0, 0.9); }
.cn-nav-item {
  height: 40px; width: 100%;
  border: 0; background: transparent;
  display: flex; align-items: center;
  padding: 0 16px; position: relative; cursor: pointer; text-align: left;
}
.cn-nav-item > .cn-nav-label { font: 400 14px/22px var(--font-sans); color: var(--gray-90); flex: 1; }
.cn-nav-item .cn-chevron { width: 12px; height: 12px; color: #808799; flex: none; display: inline-flex; align-items: center; justify-content: center; }
.cn-nav-item.sub { padding-left: 32px; }
.cn-nav-item.sub::before { content: ""; position: absolute; inset: 2px 4px; border-radius: 4px; pointer-events: none; }
.cn-nav-item.active::before { background: var(--alpha-gray-10); }
.cn-nav-item.active .cn-nav-label { color: var(--gray-90); }
.cn-nav-item:not(.active):not(.cn-nav-header):hover::before {
  content: ""; position: absolute; inset: 2px 4px;
  background: rgba(128, 135, 153, 0.06); border-radius: 4px; pointer-events: none;
}
.cn-nav-label-wrap { display: inline-flex; align-items: center; gap: 6px; flex: 1; }
.cn-beta {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 5px; border-radius: 4px;
  background: var(--alpha-blue-10);
  font: 600 12px/18px var(--font-sans);
  color: var(--blue-80, #115fd4);
}
.cn-nav-divider { padding: 4px 0; }
.cn-nav-divider span { display: block; height: 1px; background: var(--gray-30); }
.cn-nav-footer { background: #f2f4f7; padding-bottom: 8px; display: flex; flex-direction: column; }

/* ---- Main frame ---- */
.cn-main { flex: 1; min-width: 0; background: var(--white); display: flex; flex-direction: column; }
.cn-header { padding: 48px 64px 32px; }
.cn-header-title { font: 700 28px/36px var(--font-sans); color: #16181d; }
.cn-header-desc { font: 400 14px/22px var(--font-sans); color: #808799; margin-top: 6px; }


/* styles/prototypeChanges.css */
/* 프로토타입 메타 UI: 실제 Connect 기능이 아니라 정책 변경 추적용 패널 */
.pc-trigger {
  position: fixed; top: 72px; right: 0; z-index: 105;
  height: 40px; padding: 0 12px 0 10px; border: 1px solid var(--gray-30); border-right: 0;
  border-radius: 8px 0 0 8px; background: var(--gray-100); color: var(--white);
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  font: 600 12px/18px var(--font-sans); box-shadow: 0 4px 16px rgba(22,24,29,.14);
}
.pc-trigger:hover { background: var(--gray-90); }
.pc-trigger-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-70); }
.pc-trigger-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: rgba(255,255,255,.16); font: 700 11px/18px var(--font-sans); }

/* 딤 제거: 우측 패널을 비모달로 (열어둔 채 본문 확인·조작 가능) */
.pc-scrim { display: none; }
.pc-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 120; width: 392px;
  background: var(--white); box-shadow: -12px 0 32px rgba(22,24,29,.14);
  display: flex; flex-direction: column; transform: translateX(102%); visibility: hidden;
  transition: transform .2s ease, visibility .2s;
}
.pc-drawer.open { transform: translateX(0); visibility: visible; }
.pc-drawer-head { min-height: 52px; padding: 0 18px; border-bottom: 1px solid var(--gray-20); display: flex; align-items: center; justify-content: space-between; flex: none; }
.pc-eyebrow { font: 700 11px/16px var(--font-sans); letter-spacing: .08em; color: var(--blue-70); }
.pc-close { width: 32px; height: 32px; border-radius: 6px; color: var(--gray-70); font: 400 24px/30px var(--font-sans); cursor: pointer; }
.pc-close:hover, .pc-back:hover { background: var(--gray-10); }
.pc-back { height: 32px; padding: 0 8px; border-radius: 6px; color: var(--gray-80); font: 600 13px/32px var(--font-sans); cursor: pointer; }

.pc-drawer-title-wrap { padding: 22px 20px 16px; flex: none; }
.pc-drawer-title-wrap h2 { margin: 0; font: 700 22px/30px var(--font-sans); color: var(--gray-100); }
.pc-drawer-title-wrap p { margin: 7px 0 0; font: 400 13px/20px var(--font-sans); color: var(--gray-70); }
.pc-planned-filter { margin-top: 16px; padding: 12px 13px; border: 1px solid var(--gray-30); border-radius: 9px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pc-planned-filter > div { min-width: 0; display: flex; flex-direction: column; }
.pc-planned-filter strong { color: var(--gray-90); font: 600 13px/19px var(--font-sans); }
.pc-planned-filter span { color: var(--gray-60); font: 400 11px/17px var(--font-sans); }
.pc-switch { width: 40px; height: 24px; padding: 2px; border-radius: 999px; background: var(--gray-40); cursor: pointer; transition: background .15s; flex: none; }
.pc-switch > span { display: block; width: 20px; height: 20px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 4px rgba(22,24,29,.18); transition: transform .15s; }
.pc-switch.on { background: #f79009; }
.pc-switch.on > span { transform: translateX(16px); }
.pc-planned-notice { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: rgba(247,144,9,.09); color: #9a5800; font: 500 11px/17px var(--font-sans); }
.pc-dev-filter { margin-top: 10px; border-color: rgba(234, 179, 8, .48); background: #fffdf2; }
.pc-dev-notice { margin-top: 8px; padding: 8px 10px; border: 1px solid rgba(234, 179, 8, .35); border-radius: 6px; background: #fff8cf; color: #745300; font: 600 11px/17px var(--font-sans); }
.pc-dev-marker-layer { position: fixed; inset: 0; z-index: 110; pointer-events: none; }
.pc-dev-marker-layer, .pc-dev-marker-layer *, .pc-dev-marker-layer *::before, .pc-dev-marker-layer *::after { box-sizing: border-box; }
.pc-dev-marker-shell { position: fixed; width: 30px; height: 30px; pointer-events: auto; }
.pc-dev-marker {
  position: relative; z-index: 2; width: 30px; height: 30px; border: 2px solid var(--white); border-radius: 50%;
  background: #e0a600; color: var(--white); cursor: help; box-shadow: 0 3px 10px rgba(116,83,0,.30), 0 0 0 2px rgba(224,166,0,.18);
  font: 800 12px/26px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center;
  transition: transform .14s ease, background .14s ease, box-shadow .14s ease;
}
.pc-dev-marker:hover, .pc-dev-marker:focus-visible { background: #c98e00; box-shadow: 0 5px 16px rgba(116,83,0,.38), 0 0 0 3px rgba(224,166,0,.22); outline: none; transform: scale(1.08); }
.pc-dev-marker-tooltip {
  position: absolute; z-index: 1; width: min(350px, calc(100vw - 24px)); max-height: min(420px, calc(100vh - 48px));
  padding: 13px 14px 14px; overflow: auto; border: 1px solid #e4b82f; border-radius: 12px; background: #fffdf1;
  color: #5f4700; box-shadow: 0 12px 32px rgba(72,54,0,.20); visibility: hidden; opacity: 0; pointer-events: none;
  transition: opacity .12s ease, transform .12s ease, visibility .12s;
}
.pc-dev-marker-shell.place-left .pc-dev-marker-tooltip { right: 0; }
.pc-dev-marker-shell.place-right .pc-dev-marker-tooltip { left: 0; }
.pc-dev-marker-shell.place-below .pc-dev-marker-tooltip { top: calc(100% + 9px); transform: translateY(-4px); }
.pc-dev-marker-shell.place-above .pc-dev-marker-tooltip { bottom: calc(100% + 9px); transform: translateY(4px); }
.pc-dev-marker-shell:hover .pc-dev-marker-tooltip,
.pc-dev-marker-shell:focus-within .pc-dev-marker-tooltip { visibility: visible; opacity: 1; pointer-events: auto; transform: translateY(0); }
.pc-dev-marker-tooltip-head { display: grid; grid-template-columns: 26px 1fr; gap: 9px; align-items: start; }
.pc-dev-marker-tooltip-head > span { width: 26px; height: 26px; border-radius: 50%; background: #e0a600; color: var(--white); font: 800 11px/26px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; }
.pc-dev-marker-tooltip-head > div { min-width: 0; display: flex; flex-direction: column; }
.pc-dev-marker-tooltip-head small { color: #9a6b00; font: 700 9px/14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
.pc-dev-marker-tooltip-head strong { margin-top: 1px; color: #4d3900; font: 700 13px/19px var(--font-sans); word-break: keep-all; }
.pc-dev-marker-tooltip ul { margin: 10px 0 0; padding: 9px 0 0 17px; border-top: 1px solid rgba(224,166,0,.24); }
.pc-dev-marker-tooltip li { margin-top: 5px; color: #5f4700; font: 500 11px/18px var(--font-sans); word-break: keep-all; }
.pc-dev-marker-tooltip li:first-child { margin-top: 0; }
.pc-dev-marker-tooltip code { padding: 1px 4px; border-radius: 4px; background: rgba(116,83,0,.10); color: #604700; font: 600 10px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-current-view { display: inline-flex; margin-top: 12px; padding: 5px 9px; border-radius: 6px; background: var(--alpha-blue-10); color: var(--blue-70); font: 600 12px/18px var(--font-sans); }
.pc-scope { margin: 0 20px; padding: 3px; border-radius: 8px; background: var(--gray-20); display: grid; grid-template-columns: 1fr 1fr; flex: none; }
.pc-scope button { height: 34px; border-radius: 6px; color: var(--gray-70); cursor: pointer; font: 600 13px/34px var(--font-sans); }
.pc-scope button span { margin-left: 3px; color: var(--gray-50); }
.pc-scope button.active { background: var(--white); color: var(--gray-100); box-shadow: 0 1px 4px rgba(22,24,29,.08); }

.pc-change-list {
  flex: 1 1 auto; min-height: 0; padding: 16px 20px 28px;
  overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable;
  display: flex; flex-direction: column; gap: 12px;
}
.pc-empty { padding: 40px 12px; text-align: center; color: var(--gray-60); font: 400 13px/20px var(--font-sans); }
.pc-change-card { flex: 0 0 auto; border: 1px solid var(--gray-30); border-radius: 10px; overflow: hidden; background: var(--white); transition: border-color .12s, box-shadow .12s; }
.pc-change-card:hover { border-color: var(--gray-50); box-shadow: 0 4px 16px rgba(22,24,29,.06); }
.pc-change-card.planned { border-color: rgba(247,144,9,.36); background: linear-gradient(180deg, rgba(247,144,9,.035), var(--white) 40%); }
.pc-change-main { width: 100%; padding: 15px 15px 13px; text-align: left; cursor: pointer; }
.pc-change-meta { display: flex; align-items: center; gap: 6px; }
.pc-change-meta time { margin-left: auto; color: var(--gray-60); font: 500 11px/16px var(--font-sans); }
.pc-prd-id { display: inline-flex; padding: 3px 7px; border-radius: 5px; background: var(--alpha-blue-10); color: var(--blue-70); font: 700 11px/16px var(--font-sans); }

.pc-publish.baseline, .pc-source-status.review { background: rgba(247,144,9,.10); color: #b25f00; }

.pc-publish.planned, .pc-source-status.draft { background: rgba(247,144,9,.12); color: #9a5800; }
.pc-change-main h3 { margin: 11px 0 12px; font: 700 15px/22px var(--font-sans); color: var(--gray-100); }
.pc-diff { display: grid; grid-template-columns: 35px 1fr; gap: 8px; align-items: start; margin-top: 7px; }
.pc-diff > span { height: 20px; border-radius: 4px; text-align: center; font: 600 11px/20px var(--font-sans); }
.pc-diff p { margin: 0; color: var(--gray-70); font: 400 12px/19px var(--font-sans); }
.pc-diff.before > span { background: var(--gray-20); color: var(--gray-60); }
.pc-diff.after > span { background: var(--alpha-blue-10); color: var(--blue-70); }
.pc-developer-details { margin-top: 12px; padding: 11px 12px; border: 1px solid #e9bd32; border-radius: 7px; background: #fff8cf; color: #5f4700; }
.pc-developer-details-head { display: flex; align-items: center; gap: 7px; }
.pc-developer-details-head > span { padding: 2px 5px; border-radius: 4px; background: #e0a600; color: #fff; font: 800 9px/14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
.pc-developer-details-head strong { font: 700 12px/18px var(--font-sans); }
.pc-developer-details ul { margin: 7px 0 0; padding-left: 17px; }
.pc-developer-details li { margin-top: 4px; font: 500 11px/18px var(--font-sans); word-break: keep-all; }

.pc-locate-hint { margin-top: 12px; color: var(--blue-70); font: 600 12px/18px var(--font-sans); }
.pc-change-foot { min-height: 40px; padding: 0 12px 0 15px; border-top: 1px solid var(--gray-20); background: var(--gray-10); display: flex; align-items: center; justify-content: space-between; }
.pc-change-foot > span { color: var(--gray-60); font: 500 11px/16px var(--font-sans); }
.pc-change-foot button { height: 28px; padding: 0 8px; border-radius: 5px; color: var(--blue-70); font: 600 12px/28px var(--font-sans); cursor: pointer; }
.pc-change-foot button:hover { background: var(--alpha-blue-10); }
.pc-change-foot button:disabled { color: var(--gray-40); cursor: not-allowed; }

.pc-document-overlay { position: fixed; inset: 0; z-index: 220; padding: 40px; background: rgba(22,24,29,.54); display: flex; align-items: center; justify-content: center; }
.pc-document-modal { width: min(920px, calc(100vw - 48px)); height: min(820px, calc(100vh - 48px)); border-radius: 14px; background: var(--white); box-shadow: 0 24px 80px rgba(22,24,29,.30); overflow: hidden; display: flex; flex-direction: column; }
.pc-document-head { min-height: 104px; padding: 20px 24px; border-bottom: 1px solid var(--gray-20); display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex: none; }
.pc-document-head h2 { margin: 8px 0 0; color: var(--gray-100); font: 700 21px/29px var(--font-sans); }
.pc-document-head p { margin: 3px 0 0; color: var(--gray-60); font: 500 12px/18px var(--font-sans); }
.pc-document-close { flex: none; width: 36px; height: 36px; border-radius: 8px; color: var(--gray-70); font: 400 26px/34px var(--font-sans); cursor: pointer; }
.pc-document-close:hover { background: var(--gray-10); color: var(--gray-100); }
.pc-document-body { padding: 24px 32px 40px; overflow: auto; }
.pc-document-body .pc-summary-source { margin-top: 0; }
.pc-document-body .pc-markdown { max-width: 760px; margin: 24px auto 0; }
.pc-document-body .pc-markdown h1 { font-size: 25px; line-height: 34px; }
.pc-document-body .pc-markdown h2 { margin-top: 28px; font-size: 18px; line-height: 27px; }
.pc-document-body .pc-markdown p, .pc-document-body .pc-md-li { font-size: 14px; line-height: 23px; }

.pc-summary-view { padding: 20px 20px 32px; overflow: auto; }
.pc-summary-meta { display: flex; align-items: center; gap: 7px; }
.pc-summary-release { margin-top: 10px; color: #9a5800; font: 600 12px/18px var(--font-sans); }
.pc-summary-source { margin-top: 10px; padding: 10px 12px; border-radius: 7px; background: var(--gray-10); color: var(--gray-60); font: 500 11px/17px var(--font-sans); word-break: break-all; }
.pc-markdown { margin-top: 18px; }
.pc-markdown h1 { margin: 0 0 16px; color: var(--gray-100); font: 700 21px/29px var(--font-sans); }
.pc-markdown h2 { margin: 22px 0 9px; color: var(--gray-100); font: 700 16px/24px var(--font-sans); }
.pc-markdown h3 { margin: 18px 0 8px; color: var(--gray-90); font: 700 14px/22px var(--font-sans); }
.pc-markdown p { margin: 0; color: var(--gray-70); font: 400 13px/21px var(--font-sans); }
.pc-markdown blockquote { margin: 0 0 16px; padding: 12px 14px; border-left: 3px solid var(--blue-60); background: var(--alpha-blue-05); color: var(--gray-80); font: 500 12px/20px var(--font-sans); }
.pc-markdown code { padding: 2px 5px; border-radius: 4px; background: var(--gray-20); color: var(--gray-80); font: 500 11px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-md-li { display: grid; grid-template-columns: 10px 1fr; gap: 5px; align-items: start; margin-top: 5px; }
.pc-md-li > span { color: var(--blue-60); font: 700 13px/21px var(--font-sans); }
.pc-md-gap { height: 6px; }

.pc-policy-highlight { animation: pc-policy-pulse 2.4s ease; outline: 3px solid var(--blue-60); outline-offset: 4px; border-radius: 8px; }
.pc-planned-row-badge { display: inline-flex; margin-left: 6px; padding: 1px 5px; border-radius: 4px; background: rgba(247,144,9,.12); color: #9a5800; vertical-align: 1px; font: 700 10px/15px var(--font-sans); }
@keyframes pc-policy-pulse {
  0%, 100% { outline-color: transparent; box-shadow: none; }
  15%, 70% { outline-color: var(--blue-60); box-shadow: 0 0 0 8px var(--alpha-blue-10); }
}

@media (max-width: 1100px) {
  .pc-drawer { width: min(392px, calc(100% - 24px)); }
  .pc-scrim { left: 0; }
  .pc-document-overlay { padding: 20px; }
  .pc-document-modal { width: calc(100vw - 40px); height: calc(100vh - 40px); }
  .pc-document-body { padding: 20px 22px 32px; }
}

/* styles/deskWeb.css */
/* =============================================================
   desk-web — 데스크 기능 웹 이관 시안 전용 스타일 (접두사 dw-)
   기반: connectShell.css + connectUnified.css(cu-*)를 그대로 재사용하고,
   이 화면에만 필요한 조각(창 무대·트레이·배지·보류 라벨·체험 패널 등)만 추가한다.
   ============================================================= */

/* ---- 창 무대: Windows 바탕화면 모사 없이 창 + 슬림 작업표시줄만 ---- */
.dw-stage{position:relative;flex:1;min-height:0;background:#dfe3ea;overflow:hidden}
.dw-window.cu-client.cn-screen{position:absolute;inset:14px 16px 52px 16px;width:auto;min-height:0;display:flex;flex-direction:column;border:1px solid #c9d3e0;border-radius:8px;box-shadow:0 12px 36px #00245b33,0 2px 6px #00245b22;background:#fff;overflow:hidden;z-index:2}
.dw-stage.max .dw-window.cu-client.cn-screen{inset:0 0 38px 0;border-radius:0;border:0;box-shadow:none}
.dw-window .cu-titlebar.cn-titlebar{height:38px;flex-shrink:0;align-items:center;background:linear-gradient(100deg,#eff3f9,#f6f8fb);border-bottom:1px solid #dce3ed}
.dw-window .cu-window-actions{height:38px}
.dw-window .cu-window-actions .cu-icon{height:38px;width:44px;color:#374452;position:relative}
.dw-window .cu-window-actions .cu-icon.close:hover{color:#fff}
.dw-window .cu-body{height:auto;flex:1;min-height:0;overflow:hidden}
.dw-window .cu-main{overscroll-behavior:contain}
.dw-window .cu-statusbar{flex-shrink:0}
.dw-window .cu-statusbar>span:nth-child(2){flex:1}
.dw-closed{position:absolute;inset:0 0 38px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--g70);font-size:13px;text-align:center;padding:16px}
.dw-closed strong{font-size:16px;color:var(--g100)}

/* ---- 슬림 작업표시줄 + 트레이 ---- */
.dw-taskbar{position:absolute;left:0;right:0;bottom:0;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:#e9f0fa;border-top:1px solid #cfd8e5;font-size:11px;color:#4f6072;z-index:3}
.dw-tray-area{position:relative;display:flex;align-items:center;gap:12px;height:100%}
.dw-tray-btn{position:relative;width:34px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:5px;border:0;background:transparent}
.dw-tray-btn:hover,.dw-tray-btn.selected{background:#ffffffc0}
.cu-connect-icon.dw-ci{width:24px;height:24px;border-radius:5px;box-shadow:none}
.cu-connect-icon.dw-ci img{width:20px}
.dw-closed .cu-connect-icon.dw-ci{width:44px;height:44px;border-radius:9px}
.dw-closed .cu-connect-icon.dw-ci img{width:36px}
.dw-clock{font-size:11px;line-height:15px;text-align:right;white-space:nowrap}
.cu-tray-menu.dw-tray-menu{bottom:42px;right:0;min-width:220px;z-index:40}
.dw-tray-menu .cu-tray-menu-title{display:flex;align-items:center;gap:9px;padding:8px 10px 10px;border-bottom:1px solid var(--g30);margin-bottom:4px}
.dw-tray-menu .cu-tray-menu-title strong{font-size:12px}

/* ---- 배지 (99+) ---- */
.dw-badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#FA4655;color:#fff;font-size:10px;font-weight:700;line-height:16px;font-style:normal}
.dw-bell .dw-badge{position:absolute;top:5px;left:22px}
.dw-badge.nav{margin-left:auto;min-width:20px;height:18px;font-size:11px;border-radius:9px}
.dw-badge.tray{position:absolute;top:0;right:-2px}
.dw-badge.inline{margin-left:auto}

/* ---- 보류 라벨·띠 ---- */
.dw-hold{display:inline-flex;align-items:center;margin-left:6px;padding:1px 6px;border-radius:4px;background:#fff4d8;color:#865f17;font-size:11px;font-weight:600;line-height:16px;white-space:nowrap;vertical-align:middle;letter-spacing:0}
.cu-header h1 .dw-hold{font-size:13px;line-height:20px;vertical-align:4px}
.cu-nav-row .dw-hold{font-size:10px;padding:0 4px;margin-left:4px}
.dw-hold-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:16px;border:1px dashed #e5c67a;background:#fffbef;border-radius:6px;color:#6f5414;font-size:12px;line-height:18px}
.dw-hold-bar .dw-hold{margin-left:0}
.dw-legend{font-size:11px;color:var(--g70);display:flex;align-items:center;gap:2px}
.dw-head-actions{display:flex;align-items:center;gap:6px}
.dw-hold-inline .dw-hold{margin:0}

/* ---- 공통 보조 ---- */
.dw-banner{display:flex;align-items:center}
.dw-banner .cu-btn{margin-left:auto;color:#915215;font-size:12px;min-height:28px;padding:4px 8px}
.dw-note{margin:0 0 20px!important}
.dw-muted{color:var(--g60);font-weight:400;font-size:12px}
.dw-muted-line{font-size:13px;color:var(--g60)}
.dw-fail-hint{display:flex;align-items:center;gap:6px;margin-top:16px!important;font-size:12px;color:#865f17;background:#fff8e6;padding:8px 10px;border-radius:6px}
.dw-fail-hint svg{font-size:14px}
.cu-error{display:flex;align-items:flex-start;gap:6px;margin-top:16px!important}
.cu-error svg{font-size:16px;margin-top:2px}
.dw-warn-note{color:#915215;background:#fff3e3}
.dw-new{font-style:normal;margin-left:6px;font-size:11px;color:var(--blue);font-weight:600}
.cu-tag.teal{color:#0b7a83;background:#e1f5f6}
.dw-date{min-height:40px;font-size:13px}

/* ---- 스켈레톤 ---- */
.dw-skeleton{border-top:1px solid var(--g30)}
.dw-skeleton>div{display:grid;grid-template-columns:80px 1.2fr 1fr 1.4fr 1fr;gap:20px;padding:20px 12px;border-bottom:1px solid var(--g30)}
.dw-skeleton i{display:block;height:14px;border-radius:4px;background:linear-gradient(90deg,var(--g20),#eef0f4,var(--g20));background-size:200% 100%;animation:dw-shimmer 1s linear infinite}
@keyframes dw-shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.dw-skeleton i{animation:none}}

/* ---- 진료 현황 테이블 ---- */
.dw-table th.dw-visit-th,.dw-table td.dw-visit-td{width:56px;text-align:center}
.dw-visit-td input{width:18px;height:18px;margin:0;cursor:pointer}
.dw-visit-td input:disabled{cursor:default;opacity:1}
.dw-table th:last-child{min-width:56px;width:56px}
.dw-kebab-wrap{position:relative;display:inline-flex}
.dw-kebab{position:absolute;right:0;top:34px;min-width:132px;padding:6px;background:#fff;border:1px solid var(--g30);border-radius:8px;box-shadow:0 8px 24px #0000001f;z-index:10;display:flex;flex-direction:column}
.dw-kebab button{text-align:left;padding:9px 10px;border-radius:4px;font-size:13px;color:var(--g90)}
.dw-kebab button:hover{background:var(--g20)}
.dw-kebab .danger-text{color:#e14352}
.dw-chips{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.dw-chips small{font-size:11px;color:var(--g60)}
.dw-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;border-radius:16px;background:#e8f2ff;color:#0061db;font-size:12px;font-weight:500}
.dw-chip button{display:inline-flex;border-radius:50%;padding:2px;color:#0061db}
.dw-chip button:hover{background:#d3e6ff}
.dw-chip svg{font-size:12px}

/* ===================== v0.4 진료 현황·진료항목 ===================== */
.dw-na{font-size:11px;color:var(--g50)}

.dw-soft-note{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--g30);border-radius:8px;background:var(--g10);font-size:13px;color:var(--g70);margin-bottom:24px}
.dw-soft-note>span{flex:1}
.dw-soft-note .cu-btn{min-height:32px;font-size:12px;padding:4px 10px}
.dw-stat-split{display:block;font-style:normal;font-size:11px;color:var(--g60);margin-top:2px}
.dw-tsec{border:1px solid var(--g30);border-radius:10px;padding:20px 24px 8px;margin-bottom:24px}

.dw-tsub{font-size:14px;margin:18px 0 6px!important}
.dw-guide-warn{margin-top:10px;padding:10px 12px;border-radius:6px;background:#fff7ec;font-size:12px;color:#8a5a12}
.dw-guide-warn ul{margin:6px 0 0;padding-left:16px;line-height:19px}
.dw-kakao-note{font-size:11px;font-weight:400;color:var(--g60);margin-left:10px}
.dw-reason-hint{font-size:11px;color:#6941c6;margin-left:6px}
.dw-exp-item select{min-height:26px;font-size:12px;padding:2px 20px 2px 6px}
.dw-exp-judge{font-size:11px;color:#6941c6;background:#fff;border:1px solid #c7b8f5;border-radius:4px;padding:2px 6px}

/* ===================== v0.5 판단 메모(프로토 메타) ===================== */
.dw-annot-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--g90)}
.dw-notes-btn svg{color:#6941c6}
.dw-pin-anchor{position:relative;display:inline-block;width:0;height:0;vertical-align:top}
.dw-pin{position:absolute;top:-6px;left:3px;width:18px;height:18px;border-radius:50%;background:#7A5AF8;color:#fff!important;font-size:10px;font-weight:700;line-height:18px;text-align:center;padding:0;border:2px solid #fff;box-shadow:0 1px 4px #4b2fa366;z-index:15;cursor:pointer;font-family:inherit}
.dw-pin:focus-visible{outline:2px solid #4b2fa3;outline-offset:1px}
.dw-pin.static{position:static;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.dw-pin-anchor.hi .dw-pin{animation:dw-pin-pulse 1s ease-in-out 3;box-shadow:0 0 0 6px #7a5af855}
@keyframes dw-pin-pulse{50%{transform:scale(1.35)}}
@media(prefers-reduced-motion:reduce){.dw-pin-anchor.hi .dw-pin{animation:none}}
.dw-pin-pop{position:absolute;top:16px;left:-8px;width:320px;z-index:90;display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid #c7b8f5;border-top:3px solid #7A5AF8;border-radius:8px;box-shadow:0 10px 30px #2a1a6633;padding:12px 14px;font-size:12px;line-height:18px;color:var(--g90);text-align:left;font-weight:400;white-space:normal;letter-spacing:0}
.dw-pin-title{font-size:13px;font-weight:700;color:#2a1a66}
.dw-pin-chip{align-self:flex-start;font-style:normal;font-size:10px;font-weight:600;color:#6941c6;background:#f1ecff;padding:1px 6px;border-radius:4px}
.dw-pin-sec{display:block}
.dw-pin-sec i{font-style:normal;font-weight:700;color:#6941c6;margin-right:6px}
.dw-notes{position:fixed;top:96px;right:16px;bottom:60px;width:360px;max-width:calc(100vw - 32px);background:#fff;border:1px solid #c7b8f5;border-radius:10px;box-shadow:0 10px 36px #2a1a6633;z-index:55;display:flex;flex-direction:column}
.dw-notes>header{display:flex;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--g30);background:#f6f3ff;border-radius:10px 10px 0 0}
.dw-notes>header small{display:block;font-size:11px;color:var(--g60);margin-top:4px}
.dw-notes ol{list-style:none;margin:0;padding:6px;overflow:auto}
.dw-notes li button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:6px;text-align:left}
.dw-notes li button:hover{background:#f6f3ff}
.dw-notes li button>span:nth-child(2){flex:1;min-width:0}
.dw-notes li b{display:block;font-size:13px}
.dw-notes li small{display:block;font-size:11px;color:var(--g60)}

/* ===================== v0.6 차트 모드 분기 ===================== */
.dw-op-sub{font-size:13px;margin:18px 0 0!important;color:var(--g90);display:flex;align-items:center}
.dw-off-group .cu-setting-row,.dw-op-row.dw-off{opacity:.55}
.dw-kakao-table td{text-align:center}
.dw-kakao-cell{display:inline-flex;align-items:center;gap:8px}

/* ===================== v0.7 ===================== */
.dw-crash{max-width:520px;margin:120px auto;padding:32px;border:1px solid var(--g30);border-radius:12px;background:#fff;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;font-family:Pretendard,'Apple SD Gothic Neo',sans-serif}
.dw-crash svg{font-size:32px;color:#d74251}
.dw-crash p{font-size:13px;color:#6B7684}
/* 핀: 컨트롤과 겹치지 않게 라벨 위쪽 여백에 띄움, flex 간격으로 밀지 않음 */
.dw-pin{top:-15px;left:-6px}
.dw-row-ctl>.dw-pin-anchor{margin-left:-8px}
.dw-head-actions>.dw-pin-anchor,.dw-subfilter>.dw-pin-anchor{margin-left:-6px}
.cu-tabs>.dw-pin-anchor{margin-left:-24px}

/* 체험 띠 1줄 */
.dw-exp-strip{flex-wrap:nowrap;gap:6px 14px;padding:6px 16px;white-space:nowrap}
.dw-exp-more-wrap{position:relative}
.dw-exp-more{font-size:12px;padding:3px 8px;border:1px solid #c7b8f5;border-radius:4px;background:#fff;color:#4b2fa3;display:inline-flex;align-items:center;gap:4px}
.dw-exp-more b{min-width:16px;height:16px;border-radius:8px;background:#6941c6;color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}
.dw-exp-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:58;display:flex;flex-direction:column;gap:10px;padding:12px;background:#fff;border:1px solid #c7b8f5;border-radius:8px;box-shadow:0 8px 24px #2a1a6633;min-width:240px}
.dw-exp-memo{font-size:11px;color:#865f17;background:#fff4d8;padding:2px 6px;border-radius:4px}
.dw-exp-memo .dw-link{font-size:11px}
.dw-group.orphan{border:1px dashed var(--g40)}
.dw-chip-slot.orphan{border-style:dashed}
@media(max-width:1180px){.dw-exp-judge{display:none}}
/* v0.7 밀도: 체험 띠를 펼쳐도 스크롤 시 진료 현황 6행 이상 */
.dw-window .cu-header.cn-header{padding-top:26px;padding-bottom:16px}
.dw-table td{padding-top:10px;padding-bottom:10px}
.dw-table td .dw-warn-chip{display:inline-flex;margin:2px 0 0 4px;width:auto}
/* 핀: 플렉스 정렬 영향 없이 줄 위쪽 여백에 */
.dw-pin-anchor{align-self:flex-start}
.dw-pin{top:-20px;left:-4px}
.dw-filter-pin>.dw-pin-anchor .dw-pin{top:-22px;left:-12px}
.dw-subfilter>.dw-pin-anchor .dw-pin{top:-16px;left:0}
.dw-table th .dw-pin-anchor .dw-pin{top:-16px;left:0}
.dw-table td{white-space:nowrap}
.dw-table td:nth-last-child(4),.dw-table td:nth-last-child(3){white-space:normal;min-width:120px}
.dw-subfilter>.dw-pin-anchor .dw-pin{top:4px;left:4px}

/* ===================== v0.8 진료 현황 첫 화면 밀도 ===================== */
.dw-ellip-td{max-width:180px}
.dw-ellip{display:block;max-width:180px}
.dw-ellip strong,.dw-ellip small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.dw-same-ic{display:inline-flex;align-items:center;justify-content:center;margin-left:6px;min-width:20px;height:16px;padding:0 4px;border-radius:8px;background:#f1ecff;color:#6941c6;font-size:10px;font-weight:700;vertical-align:1px;cursor:help}
.dw-crowd-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:16px;background:#f6f3ff;color:#4b2fa3;font-size:12px;font-weight:600;cursor:help;white-space:nowrap}
.dw-crowd-chip svg{font-size:14px}
.dw-toolbar-compact{margin:10px 0 6px}
.dw-toolbar-compact>span{margin-right:auto}
.dw-toolbar-compact .dw-subfilter{margin-top:0;margin-right:14px}
.dw-toolbar-hint{display:none!important}
.dw-note-compact{padding:8px 10px!important;margin-bottom:8px!important}
.dw-window .cu-header.cn-header{padding-top:18px;padding-bottom:10px}
.dw-window .cu-header .cn-desc{margin-top:2px;font-size:13px}
.dw-window .cu-header h1{font-size:24px;line-height:32px}
.dw-window .cu-tabs{height:40px}
.dw-window .cu-tabs button{padding-bottom:8px}
.dw-window .cu-filters{margin-top:12px}
.dw-table th{padding-top:9px;padding-bottom:9px}
.dw-table td{padding-top:8px;padding-bottom:8px}
/* 진료 현황: 설명은 제목 툴팁으로, 필터 바는 한 줄 */
.dw-status-head .cn-desc{display:none}
.dw-status-head.cu-header.cn-header{padding-top:16px;padding-bottom:6px;align-items:center}
.dw-window .dw-status-head ~ .cu-content .cu-filters{flex-wrap:nowrap}

.dw-window .dw-status-head ~ .cu-content .cu-filters select{min-width:96px}
.dw-ellip-td,.dw-ellip{max-width:150px}

/* ===================== v0.10 피그마 진료실 설정(목록·상세) — 값은 figma/baseline.md 참조 ===================== */
.dw-fig-head.cu-header.cn-header{padding:48px 64px 32px!important;align-items:center}
.dw-fig-head h1{font:700 28px/36px Pretendard,'Apple SD Gothic Neo',sans-serif!important;color:#16181D;letter-spacing:0!important}
.dw-fig-content.cu-content{padding:0 64px 80px!important}
.dw-fig-textbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:56px;padding:0 16px;border-radius:4px;font:600 13px/20px Pretendard,sans-serif;color:#5D6474;background:transparent;border:0}
.dw-fig-textbtn:hover{background:rgba(128,135,153,.08)}
.dw-fig-textbtn svg{font-size:16px}
.dw-fig-textbtn.primary{color:#0073FA}
/* 카드 그리드 */
.dw-fig-grid{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.dw-fig-card{flex:1 1 calc(50% - 8px);min-width:300px;max-width:calc(50% - 8px);min-height:150px;display:flex;flex-wrap:wrap;align-content:center;gap:24px 40px;padding:24px;background:#FFFFFF;border:1px solid #E3E6ED;border-radius:8px;text-align:left}
.dw-fig-card:hover{border-color:var(--blue)}
.dw-fig-card-data{flex:1 1 310px;min-width:310px;display:flex;flex-direction:column;gap:4px}
.dw-fig-card-data>strong{font:600 18px/26px Pretendard,sans-serif;color:#16181D}
.dw-fig-detail{display:flex;align-items:center;gap:6px;font:400 14px/22px Pretendard,sans-serif;color:#808799;white-space:nowrap}
.dw-fig-dot{display:inline-block;width:2px;height:2px;border-radius:50%;background:#808799;flex-shrink:0}
.dw-fig-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dw-fig-badge{display:inline-flex;align-items:center;justify-content:center;height:26px;min-width:56px;padding:3px 8px;border-radius:4px;font:600 13px/20px Pretendard,sans-serif;white-space:nowrap}
.dw-fig-badge.on{background:rgba(0,153,110,.08);color:#00855F}
.dw-fig-badge.err{background:rgba(236,56,71,.08);color:#EC3847}
.dw-fig-badge.stop{background:rgba(240,101,0,.08);color:#F06500}
.dw-fig-badge.off{background:rgba(93,100,116,.08);color:#5D6474}
.dw-fig-extra{font-style:normal;font:400 13px/20px Pretendard,sans-serif;color:#808799;margin-left:4px}
/* 상세 헤더 */
.dw-fig-desc{display:flex;align-items:center;gap:8px;margin-top:4px!important;font:400 14px/22px Pretendard,sans-serif;color:#808799}
.dw-fig-desc b{font-weight:600;color:#5D6474}
.dw-fig-chip{font:600 12px/18px Pretendard,sans-serif;color:#5D6474;background:rgba(93,100,116,.08);padding:1px 6px;border-radius:4px}
.dw-fig-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;min-width:64px;padding:0 20px;border:1px solid rgba(128,135,153,.2);border-radius:6px;background:#FFFFFF;font:600 14px/22px Pretendard,sans-serif;color:#5D6474;white-space:nowrap}
.dw-fig-btn:hover:not(:disabled){background:rgba(128,135,153,.05)}
.dw-fig-btn svg{font-size:18px}
.dw-fig-btn.icon{width:40px;min-width:40px;padding:0}
.dw-fig-btn.bold{font-weight:700;min-width:80px}
.dw-fig-btn.danger{color:#EC3847}
.dw-fig-btn.primary{background:#0073FA;border-color:#0073FA;color:#FFFFFF;opacity:.9}
.dw-fig-btn.disabled,.dw-fig-btn:disabled{background:rgba(128,135,153,.05);border-color:transparent;color:rgba(128,135,153,.6);opacity:.9;cursor:not-allowed}
.dw-fig-btn.primary:disabled{background:rgba(128,135,153,.05)}
/* 서비스 카드 */
.dw-fig-svc-list{display:flex;flex-direction:column;gap:16px}
.dw-fig-svc{display:flex;flex-direction:column;gap:16px;padding:20px 24px;background:#FFFFFF;border:1px solid #E3E6ED;border-radius:8px}

.dw-fig-svc-label strong{font:600 18px/26px Pretendard,sans-serif;color:#16181D}
.dw-fig-svc-label p{font:400 14px/22px Pretendard,sans-serif;color:#5D6474}
.dw-fig-svc-label p b,.dw-fig-setrow p b{font-weight:500;color:#434956}

.dw-fig-status-tag{display:inline-flex;align-items:center;gap:4px;height:26px;padding:3px 12px 3px 8px;border-radius:4px;font:600 13px/20px Pretendard,sans-serif;white-space:nowrap;flex-shrink:0}
.dw-fig-status-tag i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9;margin:0 3px}
.dw-fig-status-tag.on{background:rgba(0,153,110,.08);color:#00855F}
.dw-fig-status-tag.err{background:rgba(236,56,71,.08);color:#EC3847}
.dw-fig-status-tag.stop{background:rgba(240,101,0,.08);color:#F06500}
.dw-fig-svc-body{display:flex;flex-direction:column;gap:12px;padding:8px 0}

.dw-fig-select{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;width:240px;height:40px;padding:9px 16px;border:1px solid #CACED8;border-radius:6px;background:transparent;font:500 14px/22px Pretendard,sans-serif;color:#31353F}

.dw-fig-guide.neg>span{color:#EC3847}
.dw-fig-sec{font:600 16px/24px Pretendard,sans-serif;color:#16181D;margin:0 0 12px!important;display:flex;align-items:center;gap:8px}
.dw-fig-sec small{font:400 13px/20px Pretendard,sans-serif;color:#808799}
.dw-fig-basic{display:flex;flex-wrap:wrap;gap:12px 40px;padding:16px 24px;background:#FFFFFF;border:1px solid #E3E6ED;border-radius:8px;margin-bottom:28px}
.dw-fig-basic>div{display:flex;flex-direction:column;gap:2px}
.dw-fig-basic span{font:500 14px/22px Pretendard,sans-serif;color:#5D6474}

@media(max-width:1100px){.dw-fig-card{max-width:none;flex-basis:100%}.dw-fig-head.cu-header.cn-header{padding:32px 28px 24px!important}.dw-fig-content.cu-content{padding:0 28px 60px!important}.dw-fig-bottom{padding:16px 28px}}

.dw-fig-setrow{padding:23px}

/* ===================== v0.11 피그마 타이포 우선순위(.cu-app button{font:inherit} 보다 높게) ===================== */
.cu-app .dw-fig-textbtn,.cu-app .dw-fig-danger,.cu-app .dw-fig-seg button,.cu-app .dw-fig-guide>button{font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;font-size:13px;line-height:20px;font-weight:600}
