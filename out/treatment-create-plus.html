(function(){
  var FLU=[
    {id:178,n:'스카이셀플루 4가',t:'4가',reco:1,last:'45000'},
    {id:179,n:'테라텍트',t:'4가',reco:1,last:'42000'},
    {id:180,n:'비알플루텍I테트라',t:'4가',reco:1,last:'43000'},
    {id:181,n:'GC플루쿼드리밸런트',t:'4가',reco:1,last:'40000'},
    {id:182,n:'코박스플루 4가',t:'4가',reco:1,last:'41000'},
    {id:183,n:'플루아릭스테트라',t:'4가',reco:1,last:'44000'},
    {id:184,n:'박씨그리프테트라',t:'4가',reco:0,last:'38000'},
    {id:185,n:'보령플루Ⅴ테트라',t:'4가',reco:0,last:'39000'},
    {id:186,n:'보령플루Ⅷ테트라',t:'4가',reco:0,last:'39000'}
  ];
  var PRE={178:'45000',179:'42000'};/* 기존에 이미 등록돼 있는 독감 백신 — 상태 구분(등록됨/신규) 확인용 */
  var rows=FLU.map(function(f){var pre=PRE[f.id];return {id:f.id,name:f.n,type:f.t,reco:f.reco,on:!!pre,alias:f.n,price:pre||'',saved:!!pre,err:null};});
  var result=null, open=false;

  var won=function(v){return (v===''||v==null)?'':Number(v).toLocaleString('ko-KR');};
  var dig=function(s){return String(s==null?'':s).replace(/[^\d]/g,'');};
  var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');};
  var savedCount=function(){return rows.filter(function(r){return r.saved;}).length;};

  /* ── 배너 ── */
  function bannerHTML(){
    var c=savedCount();
    return '<span class="bx-i">💉</span><span><b>독감 백신 '+FLU.length+'종을 한 번에 등록할 수 있어요</b> — 제품별로 접종료만 넣으면 됩니다. '
      + (c? '현재 <b>'+c+'종</b> 등록됨' : '아직 등록된 제품이 없어요')
      + '</span><span class="bx-sp"><button class="bx-btn" id="bx-open">한 번에 등록하기</button></span>';
  }
  function mountBanner(){
    var list=document.querySelector('.tk-grid-ilist');
    if(!list) return;
    var b=list.querySelector('#bx-banner');
    if(!b){
      b=document.createElement('div');
      b.className='bx-banner'; b.id='bx-banner';
      list.insertBefore(b, list.firstChild);
    }
    var html=bannerHTML();
    if(b.dataset.h!==html){ b.innerHTML=html; b.dataset.h=html; }
    alignBanner(list,b);
  }
  /* 배너 좌우 여백을 목록 콘텐츠와 맞춘다.
     .tk-grid-ilist 자체에는 패딩이 없고 그룹 헤더·행이 각자 패딩을 갖고 있어서
     직계 자식으로 넣으면 배너만 가장자리에 붙는다. 형제의 실제 콘텐츠 박스를 재서 따라간다. */
  function alignBanner(list,b){
    try{
      var lr=list.getBoundingClientRect();
      if(!lr.width) return;
      var sibs=[].slice.call(list.children).filter(function(e){return e.id!=='bx-banner';});
      var best=null;
      sibs.slice(0,4).forEach(function(sib){
        var cand=[sib].concat([].slice.call(sib.querySelectorAll('*')).slice(0,12));
        cand.forEach(function(el){
          var r=el.getBoundingClientRect();
          if(r.width<160) return;
          var L=r.left-lr.left, R=lr.right-r.right;
          if(L<1||L>72||R<0||R>72) return;
          if(best===null||L<best.L) best={L:L,R:R};
        });
      });
      if(best) b.style.margin='0 '+Math.round(best.R)+'px 12px '+Math.round(best.L)+'px';
    }catch(e){}
  }

  /* ── 시트 ── */
  function rowHTML(r){
    var tag = r.saved? '<span class="bx-pill done">등록됨</span>' : (r.on? '<span class="bx-pill new">신규</span>' : '');
    return '<tr class="'+(r.on?'':'off')+(r.err?' bad':'')+'">'
      + '<td><button class="bx-chk '+(r.on?'':'no')+'" data-bx="chk" data-i="'+r.id+'"></button></td>'
      + '<td><b>'+r.name+'</b><div style="font:500 11.5px/17px Pretendard,sans-serif;color:#8B95A1">'+r.type+'</div></td>'
      + '<td><input class="bx-in" data-bx="alias" data-i="'+r.id+'" value="'+esc(r.alias)+'"'+(r.on?'':' disabled')+'></td>'
      + '<td><input class="bx-in num'+(r.err?' bad':'')+'" data-bx="price" data-i="'+r.id+'" value="'+won(r.price)+'" placeholder="'+(r.on?'1,000원 이상':'—')+'"'+(r.on?'':' disabled')+'>'
      + (r.err? '<div class="bx-err">'+r.err+'</div>':'') + '</td>'
      + '<td>'+tag+'</td></tr>';
  }
  function sheetHTML(){
    var on=rows.filter(function(r){return r.on;});
    var reco=rows.filter(function(r){return r.reco;}), rest=rows.filter(function(r){return !r.reco;});
    var head='<thead><tr><th style="width:44px">취급</th><th style="width:200px">제품</th><th>진료 항목명</th><th style="width:170px">접종료</th><th style="width:74px">상태</th></tr></thead>';
    return '<div class="bx-dim" data-bx="dim"><div class="bx-panel">'
      + '<div class="bx-h"><h2>독감 백신 일괄 등록</h2>'
      + '<p>취급하는 백신을 체크하고 접종료만 입력하면 됩니다. 소개·사진·키워드는 저장 후 상세에서 추가할 수 있어요.</p></div>'
      + '<div class="bx-note">분류 <b>예방접종 › 독감 백신</b> · 공통 단위 <b>회</b> · 기본 옵션 <b>1회</b> — 전 제품에 동일하게 적용돼요. '
      + '카카오톡 예약하기 노출은 <b>꺼진 상태</b>로 만들어지며 상세에서 켤 수 있어요.</div>'
      + (result? '<div class="bx-res '+(result.fail?'part':'ok')+'">'
          + (result.fail? '<b>'+result.ok+'건 저장 완료 · '+result.fail+'건 실패.</b> 실패한 행은 아래에 사유와 함께 남아 있어요. 입력값은 유지됩니다.'
                        : '<b>'+result.ok+'건 저장 완료.</b>')
          + '</div>' : '')
      + '<div class="bx-body">'
      + '<div class="bx-grp">추천 항목 · '+reco.length+'종</div>'
      + '<table class="bx-tbl">'+head+'<tbody>'+reco.map(rowHTML).join('')+'</tbody></table>'
      + '<div class="bx-grp">그 외 독감 백신 · '+rest.length+'종 <em>— 추천 칩에는 없는 제품</em></div>'
      + '<table class="bx-tbl">'+head+'<tbody>'+rest.map(rowHTML).join('')+'</tbody></table>'
      + '</div>'
      + '<div class="bx-f"><span class="bx-sum">'+on.length+'종 선택됨</span>'
      + '<span class="bx-sp"><button class="bx-btn2" data-bx="close">닫기</button>'
      + '<button class="bx-btn" data-bx="save"'+(on.length?'':' disabled')+'>'+on.length+'종 저장</button></span></div>'
      + '<div class="bx-lim">※ 이 시안의 일괄 등록은 목록과 동기화되지 않습니다(원본이 minified 번들이라 상태 주입 불가). 실서비스에서는 목록에 바로 반영됩니다.</div>'
      + '</div></div>';
  }
  function renderSheet(){
    var el=document.getElementById('bx-sheet');
    if(!el){ el=document.createElement('div'); el.id='bx-sheet'; document.body.appendChild(el); }
    var ae=document.activeElement, a=ae&&ae.dataset?ae.dataset.bx:null, i=ae&&ae.dataset?ae.dataset.i:null, pos=ae&&ae.selectionStart;
    el.innerHTML = open? sheetHTML() : '';
    if(open&&a){
      var t=el.querySelector('[data-bx="'+a+'"]'+(i!=null?'[data-i="'+i+'"]':''));
      if(t){ t.focus(); if(pos!=null&&t.setSelectionRange){ try{t.setSelectionRange(pos,pos);}catch(e){} } }
    }
    mountBanner();
  }
  function save(){
    var ok=0,fail=0;
    rows.forEach(function(r){
      r.err=null;
      if(!r.on) return;
      if(!r.alias.trim()){ r.err='진료 항목명을 입력해 주세요.'; fail++; return; }
      var v=Number(dig(r.price)||0);
      if(!v){ r.err='접종료를 입력해 주세요.'; fail++; return; }
      if(v<1000){ r.err='1,000원 이상 입력해 주세요.'; fail++; return; }
      r.saved=true; ok++;
    });
    result={ok:ok,fail:fail};
    renderSheet();
  }

  document.addEventListener('click', function(e){
    if(e.target.id==='bx-open'){ open=true; result=null; renderSheet(); return; }
    var b=e.target.closest?e.target.closest('[data-bx]'):null; if(!b) return;
    var a=b.dataset.bx;
    if(a==='dim'&&e.target!==b) return;
    if(a==='dim'||a==='close'){ open=false; renderSheet(); return; }
    if(a==='chk'){ var r=rows.filter(function(x){return x.id===+b.dataset.i;})[0]; r.on=!r.on; if(!r.on) r.err=null; renderSheet(); return; }
    if(a==='save'){ save(); return; }
  }, true);

  document.addEventListener('input', function(e){
    var el=e.target.closest?e.target.closest('[data-bx]'):null; if(!el) return;
    var a=el.dataset.bx, r=rows.filter(function(x){return x.id===+el.dataset.i;})[0];
    if(!r) return;
    if(a==='price'){ var d=dig(el.value); el.value = d? Number(d).toLocaleString('ko-KR'):''; r.price=d; r.err=null; }
    if(a==='alias'){ r.alias=el.value; }
  }, true);

  /* ── 분류·공통단위 드롭다운을 가격옵션과 같은 커스텀 컴포넌트로 교체 ──
     native <select>는 그대로 두고 숨긴 뒤, 값 변경은 native setter + change 이벤트로
     되돌려 React가 정상 인지하게 한다. 리렌더로 select가 갈리면 옵저버가 다시 붙인다. */
  var SEL_LABELS=['대분류','중분류','소분류','공통 단위'];
  var CARET='<svg class="rg-select-ic" viewBox="0 0 16 16" fill="none" aria-hidden="true">'
    +'<path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var nativeSet=Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype,'value').set;
  function closeAllMenus(except){
    document.querySelectorAll('.bx-sel-wrap').forEach(function(w){
      if(w===except) return;
      var m=w.querySelector('.rg-select-menu'); if(m) m.hidden=true;
      var b=w.querySelector('.rg-select'); if(b) b.classList.remove('open');
    });
  }
  function paint(wrap,sel){
    var btn=wrap.querySelector('.rg-select'), menu=wrap.querySelector('.rg-select-menu');
    var cur=sel.options[sel.selectedIndex];
    btn.firstChild.textContent = cur? cur.text : '';
    btn.disabled = sel.disabled;
    var html='';
    for(var i=0;i<sel.options.length;i++){
      var o=sel.options[i];
      if(o.disabled && o.value==='') { /* placeholder도 보여준다 */ }
      html+='<button type="button" class="rg-select-opt'+(i===sel.selectedIndex?' active':'')+'" data-i="'+i+'">'+esc(o.text)+'</button>';
    }
    if(menu.dataset.h!==html){ menu.innerHTML=html; menu.dataset.h=html; }
  }
  /* 분류를 하나라도 골랐는지 루트에 표시한다(추천 칩 노출 제어용). */
  function syncCatState(){
    var s=document.querySelector('select[aria-label="대분류"]');
    if(!s){ document.documentElement.removeAttribute('data-bx-cat'); return; }
    document.documentElement.setAttribute('data-bx-cat', s.value? 'set' : 'empty');
  }
  function enhanceSelects(){
    SEL_LABELS.forEach(function(lb){
      document.querySelectorAll('select[aria-label="'+lb+'"]').forEach(function(sel){
        var wrap=sel.nextElementSibling;
        if(!wrap || !wrap.classList || !wrap.classList.contains('bx-sel-wrap')){
          sel.dataset.bxEnh='1';
          wrap=document.createElement('div');
          wrap.className='rg-select-wrap bx-sel-wrap';
          wrap.setAttribute('data-bx-for', lb);
          wrap.innerHTML='<button type="button" class="rg-select"><span></span>'+CARET+'</button>'
                       + '<div class="rg-select-menu" hidden></div>';
          sel.parentNode.insertBefore(wrap, sel.nextSibling);
          wrap.querySelector('.rg-select').addEventListener('click', function(e){
            e.preventDefault(); e.stopPropagation();
            if(sel.disabled) return;
            var menu=wrap.querySelector('.rg-select-menu'), willOpen=menu.hidden;
            closeAllMenus(wrap);
            menu.hidden=!willOpen;
            wrap.querySelector('.rg-select').classList.toggle('open', willOpen);
          });
          wrap.querySelector('.rg-select-menu').addEventListener('click', function(e){
            var opt=e.target.closest('.rg-select-opt'); if(!opt) return;
            e.preventDefault(); e.stopPropagation();
            var i=+opt.dataset.i;
            nativeSet.call(sel, sel.options[i].value);
            sel.dispatchEvent(new Event('change',{bubbles:true}));
            closeAllMenus(null);
            syncCatState();
          });
        }
        paint(wrap, sel);
      });
    });
  }
  document.addEventListener('click', function(){ closeAllMenus(null); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeAllMenus(null); });

  var pending=false;
  var mo=new MutationObserver(function(){
    if(pending) return; pending=true;
    /* rAF는 탭이 숨겨져 있으면 실행되지 않는다. 그 경우 pending이 true로 고정돼
       옵저버가 영구히 죽으므로 setTimeout으로 디바운스한다. */
    setTimeout(function(){
      pending=false;
      try{ mountBanner(); }catch(e){}
      try{ enhanceSelects(); }catch(e){}
      try{ syncCatState(); }catch(e){}
    },0);
  });
  function boot(){
    var root=document.getElementById('root');
    if(!root){ return setTimeout(boot,120); }
    mo.observe(root,{childList:true,subtree:true});
    mountBanner(); enhanceSelects(); syncCatState();
  }
  boot();
})();
</script>
