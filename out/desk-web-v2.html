\uBCD1\uC6D0\uC740 \uBCF8 \uC57D\uAD00\uC5D0 \uB530\uB77C \uAD7F\uB2E5\uC5D0 \uB300\uD558\uC5EC \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30 \uC11C\uBE44\uC2A4 \uC785\uC810(\uC5F0\uB3D9)\uC5D0 \uAD00\uD55C \uAD8C\uD55C\uC744 \uC704\uC784\uD558\uACE0, \uC774\uC5D0 \uB530\uB77C \uAD7F\uB2E5\uC740 \uBCD1\uC6D0\uC744 \uC704\uD558\uC5EC \uC785\uC810(\uC5F0\uB3D9)\uC5D0 \uAD00\uD55C \uC5C5\uBB34\uB97C \uB300\uD589\uD569\uB2C8\uB2E4. \uAD7F\uB2E5\uC758 \uC785\uC810(\uC5F0\uB3D9) \uB300\uD589 \uAD8C\uD55C\uC5D0\uB294 \uB2E4\uC74C \uAC01 \uD638\uC758 \uB0B4\uC6A9\uC774 \uD3EC\uD568\uB429\uB2C8\uB2E4.
\u2460 \uBCD1\uC6D0\uC774 \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30 \uC5F0\uB3D9 \uC2E0\uCCAD\uC11C\uB97C \uD1B5\uD574 \uBCD1\uC6D0\uC758 \uCC44\uB110 \uAC80\uC0C9\uC6A9 ID\uB97C \uC81C\uACF5\uD558\uB294 \uACBD\uC6B0(\uBCD1\uC6D0\uC774 \uC774\uBBF8 \uAC1C\uC124\uD558\uC5EC \uC0AC\uC6A9 \uC911\uC778 \uBCD1\uC6D0 \uCE74\uCE74\uC624\uD1A1 \uCC44\uB110 \uC815\uBCF4\uB97C \uAD7F\uB2E5\uC5D0 \uC81C\uACF5\uD558\uB294 \uACBD\uC6B0), \uBCD1\uC6D0\uC740 \uAD7F\uB2E5\uC5D0 \uB300\uD558\uC5EC \uD574\uB2F9 \uCE74\uCE74\uC624\uD1A1 \uCC44\uB110 \uC815\uBCF4\uB97C \uD65C\uC6A9\uD558\uC5EC \uC785\uC810(\uC5F0\uB3D9)\uC744 \uB300\uB9AC\uD558\uC5EC \uC2E0\uCCAD\uD560 \uC218 \uC788\uB294 \uAD8C\uD55C \uBC0F \uC774\uB97C \uCCA0\uD68C\uD560 \uC218 \uC788\uB294 \uAD8C\uD55C\uC744 \uBD80\uC5EC\uD569\uB2C8\uB2E4.
\u2461 \uBCD1\uC6D0\uC774 \uAC1C\uC124\uD55C \uCE74\uCE74\uC624\uD1A1 \uCC44\uB110\uC774 \uC874\uC7AC\uD558\uC9C0 \uC54A\uB294 \uACBD\uC6B0, \uAD7F\uB2E5\uC740 \uBCD1\uC6D0\uC73C\uB85C\uBD80\uD130 \uC81C\uACF5\uBC1B\uC740 \uBCD1\uC6D0\uC758 \uC815\uBCF4\uB97C \uC774\uC6A9\uD558\uC5EC \uC2E0\uADDC\uB85C \uCE74\uCE74\uC624\uD1A1 \uCC44\uB110 \uC0DD\uC131 \uBC0F \uB9C8\uC2A4\uD130 \uAD8C\uD55C \uB4F1\uB85D\uC744 \uB300\uD589\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.

2. \uC785\uC810(\uC5F0\uB3D9) \uC644\uB8CC \uD6C4 \uAD8C\uD55C \uCC98\uB9AC
\uAD7F\uB2E5\uC774 \uBCD1\uC6D0\uC758 \uCE74\uCE74\uC624\uD1A1 \uCC44\uB110\uC744 \uC2E0\uADDC\uB85C \uC0DD\uC131\uD558\uC5EC \uC785\uC810(\uC5F0\uB3D9)\uC774 \uC644\uB8CC\uB41C \uC774\uD6C4 \uBCD1\uC6D0\uC740 \uCE74\uCE74\uC624\uD1A1 \uCC44\uB110\uC758 \uB9C8\uC2A4\uD130 \uAD8C\uD55C\uC744 \uBC1B\uAE30 \uC704\uD574 \uCE74\uCE74\uC624 \uBE44\uC988\uB2C8\uC2A4 \uACE0\uAC1D\uC13C\uD130\uC5D0 \uBB38\uC758\uD558\uC5EC \uAD8C\uD55C \uC774\uC804 \uC808\uCC28\uB97C \uC9C4\uD589\uD574\uC57C \uD569\uB2C8\uB2E4.

3. \uC785\uC810(\uC5F0\uB3D9) \uB300\uD589 \uAD8C\uD55C\uC758 \uBC94\uC704 \uBC0F \uC81C\uD55C
\u2460 \uAD7F\uB2E5\uC740 \uBCD1\uC6D0\uC73C\uB85C\uBD80\uD130 \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30 \uC11C\uBE44\uC2A4 \uC785\uC810(\uC5F0\uB3D9)\uC5D0 \uAD00\uD55C \uAD8C\uD55C\uB9CC\uC744 \uC704\uC784\uBC1B\uC544 \uC5C5\uBB34\uB97C \uB300\uD589\uD558\uBA70, \uAD7F\uB2E5\uC740 \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30 \uC11C\uBE44\uC2A4\uC758 \uC6B4\uC601\uC5D0 \uAD00\uC5EC\uD558\uC9C0 \uC544\uB2C8\uD558\uBBC0\uB85C \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30 \uC11C\uBE44\uC2A4\uC758 \uC6B4\uC601 \uB4F1\uC5D0 \uAD00\uD558\uC5EC \uC77C\uCCB4\uC758 \uCC45\uC784\uC744 \uBD80\uB2F4\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
\u2461 \uBCD1\uC6D0\uC740 \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30 \uC11C\uBE44\uC2A4\uC5D0 \uB300\uD558\uC5EC \uCE74\uCE74\uC624\uAC00 \uC81C\uC2DC\uD558\uB294 \uC774\uC6A9\uC57D\uAD00, \uC11C\uBE44\uC2A4 \uC0AC\uC6A9\uC548\uB0B4, \uC8FC\uC758\uC0AC\uD56D \uB4F1\uC744 \uC219\uC9C0\uD558\uACE0 \uC900\uC218\uD558\uC5EC\uC57C \uD569\uB2C8\uB2E4.
\u2462 \uAD7F\uB2E5\uC740 \uBCF8 \uC57D\uAD00\uC5D0 \uB530\uB77C \uBD80\uC5EC\uBC1B\uC740 \uC785\uC810(\uC5F0\uB3D9) \uB300\uD589 \uAD8C\uD55C\uC744 \uC624\uB85C\uC9C0 \uC785\uC810(\uC5F0\uB3D9)\uC744 \uC704\uD55C \uBAA9\uC801\uC5D0 \uD55C\uD558\uC5EC \uC0AC\uC6A9\uD560 \uC218 \uC788\uC73C\uBA70, \uCE74\uCE74\uC624\uD1A1 \uCC44\uB110 \uB0B4 \uAE30\uD0C0 \uBA54\uB274(\uD504\uB85C\uD544, \uBA54\uC2DC\uC9C0, \uC18C\uC2DD, \uBE44\uC988\uB2C8\uC2A4 \uB3C4\uAD6C \uB4F1)\uC758 \uBCC0\uACBD \uB610\uB294 \uC800\uC7A5 \uD589\uC704\uB97C \uC77C\uCCB4 \uD560 \uC218 \uC5C6\uC2B5\uB2C8\uB2E4.

4. \uC785\uC810(\uC5F0\uB3D9) \uB300\uD589 \uAD8C\uD55C\uC758 \uC704\uC784\uAE30\uAC04
\uBCD1\uC6D0\uC740 \uBCF8 \uC57D\uAD00\uC5D0 \uB3D9\uC758\uD558\uB294 \uC2DC\uC810\uBD80\uD130 \uAD7F\uB2E5\uC5D0 \uB300\uD558\uC5EC \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30 \uC11C\uBE44\uC2A4 \uC785\uC810(\uC5F0\uB3D9) \uB300\uD589 \uAD8C\uD55C\uC744 \uBD80\uC5EC\uD558\uBA70, \uBCF8 \uC57D\uAD00 \uC81C7\uC870 \uC81C1\uD56D\uC5D0 \uB530\uB77C \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30 \uC11C\uBE44\uC2A4 \uC785\uC810(\uC5F0\uB3D9)\uC5D0 \uAD00\uD55C \uACC4\uC57D\uC774 \uD574\uC9C0\uB420 \uACBD\uC6B0 \uC785\uC810(\uC5F0\uB3D9) \uB300\uD589 \uAD8C\uD55C\uB3C4 \uD568\uAED8 \uC18C\uBA78\uD569\uB2C8\uB2E4.

5. \uCE74\uCE74\uC624\uD1A1 \uCC44\uB110\uC5D0 \uAD00\uD55C \uAD8C\uB9AC
\uAD7F\uB2E5\uC740 \uCE74\uCE74\uC624\uD1A1 \uCC44\uB110 \uC0DD\uC131 \uBC0F \uACF5\uB3D9 \uB9C8\uC2A4\uD130 \uAD8C\uD55C\uC744 \uBCF4\uC720\uD558\uB354\uB77C\uB3C4, \uD574\uB2F9 \uCE74\uCE74\uC624\uD1A1 \uCC44\uB110\uC5D0 \uAD00\uD55C \uAD8C\uB9AC\uB294 \uBCD1\uC6D0\uC5D0 \uADC0\uC18D\uB429\uB2C8\uB2E4.

\uC81C4\uC870 (\uC81C3\uC790 \uC815\uBCF4 \uC81C\uACF5 \uB3D9\uC758) [\uD544\uC218]
1. \uAD7F\uB2E5\uC740 \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30 \uC11C\uBE44\uC2A4 \uC785\uC810 \uB300\uD589\uC744 \uC704\uD574 \uBCD1\uC6D0\uC758 \uC544\uB798 \uC815\uBCF4\uB97C \uCE74\uCE74\uC624\uC5D0 \uC81C\uACF5\uD560 \uC218 \uC788\uC73C\uBA70, \uBCD1\uC6D0\uC740 \uC774\uC5D0 \uB3D9\uC758\uD569\uB2C8\uB2E4.
- \uCC44\uB110 \uAC80\uC0C9 \uC544\uC774\uB514, \uBCD1\uC6D0\uBA85, \uB300\uD45C\uC790\uBA85, \uC0AC\uC5C5\uC790\uB4F1\uB85D\uBC88\uD638, \uC5C5\uC885/\uC5C5\uD0DC
- \uCE74\uCE74\uC624\uB9F5 \uAE30\uC900 \uC7A5\uC18C \uC815\uBCF4(\uC8FC\uC18C, \uC9C4\uB8CC\uACFC, \uCE74\uD14C\uACE0\uB9AC \uB4F1)
- \uC81C\uACF5 \uBAA9\uC801\uC774 \uB2EC\uC131\uB418\uBA74 \uC989\uC2DC \uD30C\uAE30\uD558\uBA70, \uBC95\uB839\uC0C1 \uBCF4\uC874\uC774 \uD544\uC694\uD55C \uACBD\uC6B0 \uD574\uB2F9 \uAE30\uAC04 \uB3D9\uC548\uB9CC \uBCF4\uAD00\uB429\uB2C8\uB2E4.
2. \uBCD1\uC6D0\uC740 \uC785\uC810 \uC2DC \uB178\uCD9C\uD558\uACE0\uC790 \uD558\uB294 \uC9C4\uB8CC\uC2E4 \uBC0F \uAE30\uB2A5(\uC811\uC218/\uC608\uC57D)\uC744 \uC9C1\uC811 \uC124\uC815\uD560 \uC218 \uC788\uC73C\uBA70, \uC774\uC5D0 \uD544\uC694\uD55C \uC815\uBCF4\uB97C \uAD7F\uB2E5\uC774 \uCE74\uCE74\uC624\uC5D0 \uC81C\uACF5\uD568\uC5D0 \uB3D9\uC758\uD569\uB2C8\uB2E4.

\uC81C5\uC870 (\uC678\uBD80 \uD50C\uB7AB\uD3FC EMR \uC5F0\uB3D9 \uB3D9\uC758) [\uD544\uC218]
1. \uBCD1\uC6D0\uC740 \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30\uB97C \uD1B5\uD574 \uC0DD\uC131\uB41C \uD658\uC790 \uC608\uC57D \uBC0F \uC811\uC218 \uC815\uBCF4\uB97C \uAD7F\uB2E5\uC774 \uBCD1\uC6D0\uC758 EMR \uCC28\uD2B8\uB85C \uC804\uB2EC\xB7\uC5F0\uB3D9\uD558\uB294 \uAC83\uC5D0 \uB3D9\uC758\uD569\uB2C8\uB2E4. 2. \uBCD1\uC6D0\uC740 \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30\uB97C \uD1B5\uD574 \uC785\uB825\uB41C \uD658\uC790\uC758 \uC774\uB984 \uBC0F \uC804\uD654\uBC88\uD638\uB97C \uC774\uC6A9\uD558\uC5EC, \uAD7F\uB2E5\uC774 \uBCD1\uC6D0\uC758 EMR \uCC28\uD2B8\uC5D0\uC11C \uD574\uB2F9 \uD658\uC790\uC758 \uC9C4\uB8CC\uAE30\uB85D\uC744 \uC870\uD68C\uD560 \uC218 \uC788\uC74C\uC5D0 \uB3D9\uC758\uD569\uB2C8\uB2E4.
3. \uBCD1\uC6D0\uC774 \uC0AC\uC6A9\uD558\uB294 EMR \uCC28\uD2B8\uC758 \uC5F0\uB3D9 \uC9C0\uC6D0 \uBC94\uC704\uC5D0 \uB530\uB77C \uC77C\uBD80 \uAE30\uB2A5\uC774 \uC81C\uD55C\uB420 \uC218 \uC788\uC73C\uBA70, \uC5F0\uB3D9 \uC804 \uAD7F\uB2E5\uC740 \uBCD1\uC6D0\uC774 \uC774\uB97C \uC778\uC9C0\uD560 \uC218 \uC788\uB3C4\uB85D \uC0AC\uC804 \uC548\uB0B4\uD569\uB2C8\uB2E4.

\uC81C6\uC870 (\uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30 \uC11C\uBE44\uC2A4 \uC785\uC810(\uC5F0\uB3D9)\uC5D0 \uAD00\uD55C \uACC4\uC57D \uD574\uC9C0 \uBC0F \uAC1C\uC778\uC815\uBCF4 \uCC98\uB9AC\uC5D0 \uB300\uD55C \uB3D9\uC758) [\uD544\uC218]
1. \uBCD1\uC6D0\uC740 \uC5B8\uC81C\uB4E0\uC9C0 \uAD7F\uB2E5\uC5D0 \uB300\uD558\uC5EC \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30 \uC11C\uBE44\uC2A4 \uC785\uC810(\uC5F0\uB3D9)\uC5D0 \uAD00\uD55C \uACC4\uC57D\uC758 \uD574\uC9C0\uB97C \uC694\uCCAD\uD560 \uC218 \uC788\uC73C\uBA70, \uAD7F\uB2E5\uC740 \uD2B9\uBCC4\uD55C \uC0AC\uC815\uC774 \uC5C6\uB294 \uD55C \uC774\uB97C \uC9C0\uCCB4 \uC5C6\uC774 \uCC98\uB9AC\uD569\uB2C8\uB2E4.
2. \uC804\uD56D\uC5D0 \uB530\uB77C \uACC4\uC57D\uC774 \uD574\uC9C0\uB418\uB294 \uACBD\uC6B0, EMR \uCC28\uD2B8\uC640 \uC5F0\uB3D9\uB41C \uC811\uC218 \uBC0F \uC608\uC57D \uAE30\uB2A5\uC740 \uB354 \uC774\uC0C1 \uC81C\uACF5\uB418\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uBCD1\uC6D0\uC740 \uACC4\uC57D \uD574\uC9C0\uC77C \uB3C4\uB798 \uC774\uC804\uAE4C\uC9C0 \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30 \uACE0\uAC1D\uC13C\uD130\uB97C \uD1B5\uD574 \uC9C1\uC811 \uC774\uAD00 \uC2E0\uCCAD\uC744 \uC9C4\uD589\uD558\uC5EC, \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30 \uC11C\uBE44\uC2A4 \uB0B4\uC5D0\uC11C \uBCD1\uC6D0 \uC815\uBCF4\uC640 \uC0C1\uD488 \uC815\uBCF4\uB97C \uAD00\uB9AC\uD560 \uC218 \uC788\uB3C4\uB85D \uC0AC\uC804\uC5D0 \uC870\uCE58\uD558\uC5EC\uC57C \uD558\uBA70, \uBCD1\uC6D0\uC774 \uC774\uAD00 \uC2E0\uCCAD\uC744 \uD558\uC9C0 \uC544\uB2C8\uD55C \uACBD\uC6B0 \uC774\uC5D0 \uB300\uD558\uC5EC \uAD7F\uB2E5\uC740 \uC5B4\uB5A0\uD55C \uCC45\uC784\uB3C4 \uBD80\uB2F4\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
3. \uACC4\uC57D \uD574\uC9C0\uC77C \uAE30\uC900\uC73C\uB85C \uAD7F\uB2E5\uC744 \uD1B5\uD574 \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30\uC640 \uC5F0\uB3D9\uB41C \uBCD1\uC6D0 \uC815\uBCF4\uAC00 \uB0A8\uC544 \uC788\uB294 \uACBD\uC6B0, \uAD7F\uB2E5\uC740 \uC774\uB97C \uC9C0\uCCB4 \uC5C6\uC774 \uD30C\uAE30 \uBC0F \uC0AD\uC81C\uD569\uB2C8\uB2E4. \uB2E4\uB9CC, \uAD00\uACC4 \uBC95\uB839\uC5D0 \uB530\uB77C \uC77C\uC815 \uAE30\uAC04 \uBCF4\uAD00\uC774 \uD544\uC694\uD55C \uC815\uBCF4\uB294 \uD574\uB2F9 \uAE30\uAC04 \uB3D9\uC548 \uBCF4\uAD00 \uD6C4 \uC989\uC2DC \uD30C\uAE30\uD569\uB2C8\uB2E4.
