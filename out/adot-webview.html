/* styles/connectShell.css */
/* =============================================================
   굿닥 커넥트 웹뷰 — 공통 셸 (디자인 토큰 + 윈도우 셸/사이드내비)
   여러 커넥트 화면(진료항목 등록, 예약 신청 내역 등)이 공유한다.
   - /Users/goodoc/test 프로토타입의 colors_and_type.css(:root)와
     connect.css의 셸 부분을 이식.
   - 전역 누수 방지를 위해 원본 body 레벨 스타일은 .cn-artboard 래퍼로
     한정했고 리셋도 .cn-artboard 하위로 스코프.
   - 클래스 접두사(cn-)가 고유해 다른 페이지와 충돌하지 않음.
   ============================================================= */

/* ---- Design tokens (colors_and_type.css :root, @font-face 제외) ---- */
:root {
  --gray-10:  #F9FAFB;
  --gray-15:  #F4F6F8;
  --gray-20:  #F2F4F6;
  --gray-30:  #E5E8EB;
  --gray-40:  #D1D6DB;
  --gray-50:  #B0B8C1;
  --gray-60:  #8B95A1;
  --gray-70:  #6B7684;
  --gray-80:  #4E5968;
  --gray-90:  #31353F;
  --gray-100: #191F28;

  --blue-30:  #B3D5FF;
  --blue-60:  #0073FA;
  --blue-70:  #0061DB;
  --blue-80:  #0050B5;

  --red-60:   #FA4655;
  --red-70:   #EC3847;
  --red-80:   #D52130;

  --green-70: #41D293;
  --green-80: #1FA972;
  --orange-60:#F79009;

  --white: #FFFFFF;
  --black: #000000;
  --transparent: transparent;

  --alpha-gray-05: rgba(128, 135, 153, 0.05);
  --alpha-gray-10: rgba(128, 135, 153, 0.10);
  --alpha-gray-15: rgba(128, 135, 153, 0.15);
  --alpha-gray-20: rgba(128, 135, 153, 0.20);
  --alpha-gray-40: rgba(128, 135, 153, 0.40);
  --alpha-gray-60: rgba(128, 135, 153, 0.60);

  --alpha-blue-05: rgba(0, 115, 250, 0.05);
  --alpha-blue-10: rgba(0, 115, 250, 0.10);
  --alpha-blue-15: rgba(0, 115, 250, 0.15);
  --alpha-blue-20: rgba(0, 115, 250, 0.20);

  --alpha-red-05: rgba(250, 70, 85, 0.05);
  --alpha-red-10: rgba(250, 70, 85, 0.10);
  --alpha-red-15: rgba(250, 70, 85, 0.15);
  --alpha-red-20: rgba(250, 70, 85, 0.20);

  --shadow-toast: 0 2px 1px rgba(22, 24, 29, 0.02), 0 2px 8px rgba(22, 24, 29, 0.10);
  --shadow-toggle-knob: 0 0 6px rgba(0, 0, 0, 0.25);

  --font-sans: 'Pretendard', 'Pretendard Variable', -apple-system,
    BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}

/* ---- Artboard backdrop (원본 connect.css의 body 스타일을 래퍼로 한정) ---- */
.cn-artboard {
  font-family: var(--font-sans);
  background: #e7e9ee;
  color: var(--gray-100);
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 24px;
}
.cn-artboard *,
.cn-artboard *::before,
.cn-artboard *::after { box-sizing: border-box; }

/* ---- App window (1280 x 832 rounded webview frame) ---- */
.cn-screen {
  width: 1280px;
  min-height: 832px;
  background: var(--white);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 12px 40px rgba(22, 24, 29, 0.12);
  position: relative;
}

/* ---- Title bar (windows-style) ---- */
.cn-titlebar {
  height: 32px;
  background: #f3f3f3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: none;
}
.cn-ci { display: flex; align-items: center; gap: 4px; padding: 0 8px; height: 100%; }
.cn-ci-mark { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
.cn-ci-mark svg { display: block; }
.cn-ci-name { font: 500 13px/16px var(--font-sans); color: rgba(0, 0, 0, 0.9); padding: 0 8px 2px 4px; }
.cn-winctrls { display: flex; height: 100%; }
.cn-winbtn {
  width: 46px; height: 32px;
  border: 0; background: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  color: rgba(0, 0, 0, 0.9); cursor: pointer;
}
.cn-winbtn:hover { background: rgba(0, 0, 0, 0.05); }
.cn-winbtn.close:hover { background: #e81123; color: #fff; }

/* ---- Body: nav + main ---- */
.cn-body { display: flex; align-items: stretch; flex: 1; min-height: 800px; }

/* ---- Side nav (250px) ---- */
.cn-nav { width: 250px; flex: none; background: #f2f4f7; position: relative; display: flex; flex-direction: column; }
.cn-nav-scroll { flex: 1; overflow: auto; }
.cn-nav-group { padding: 8px 0; display: flex; flex-direction: column; }
.cn-nav-header { height: 40px; display: flex; align-items: center; padding: 0 16px; font: 600 14px/20px var(--font-sans); color: rgba(0, 0, 0, 0.9); }
.cn-nav-item {
  height: 40px; width: 100%;
  border: 0; background: transparent;
  display: flex; align-items: center;
  padding: 0 16px; position: relative; cursor: pointer; text-align: left;
}
.cn-nav-item > .cn-nav-label { font: 400 14px/22px var(--font-sans); color: var(--gray-90); flex: 1; }
.cn-nav-item .cn-chevron { width: 12px; height: 12px; color: #808799; flex: none; display: inline-flex; align-items: center; justify-content: center; }
.cn-nav-item.sub { padding-left: 32px; }
.cn-nav-item.sub::before { content: ""; position: absolute; inset: 2px 4px; border-radius: 4px; pointer-events: none; }
.cn-nav-item.active::before { background: var(--alpha-gray-10); }
.cn-nav-item.active .cn-nav-label { color: var(--gray-90); }
.cn-nav-item:not(.active):not(.cn-nav-header):hover::before {
  content: ""; position: absolute; inset: 2px 4px;
  background: rgba(128, 135, 153, 0.06); border-radius: 4px; pointer-events: none;
}
.cn-nav-label-wrap { display: inline-flex; align-items: center; gap: 6px; flex: 1; }
.cn-beta {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 5px; border-radius: 4px;
  background: var(--alpha-blue-10);
  font: 600 12px/18px var(--font-sans);
  color: var(--blue-80, #115fd4);
}
.cn-nav-divider { padding: 4px 0; }
.cn-nav-divider span { display: block; height: 1px; background: var(--gray-30); }
.cn-nav-footer { background: #f2f4f7; padding-bottom: 8px; display: flex; flex-direction: column; }

/* ---- Main frame ---- */
.cn-main { flex: 1; min-width: 0; background: var(--white); display: flex; flex-direction: column; }
.cn-header { padding: 48px 64px 32px; }
.cn-header-title { font: 700 28px/36px var(--font-sans); color: #16181d; }
.cn-header-desc { font: 400 14px/22px var(--font-sans); color: #808799; margin-top: 6px; }


/* styles/prototypeChanges.css */

.pc-trigger {

}

/* 딤 제거: 우측 패널을 비모달로 (열어둔 채 본문 확인·조작 가능) */
.pc-scrim { display: none; }
.pc-drawer {

}

.pc-close { width: 32px; height: 32px; border-radius: 6px; color: var(--gray-70); font: 400 24px/30px var(--font-sans); cursor: pointer; }
.pc-close:hover, .pc-back:hover { background: var(--gray-10); }
.pc-back { height: 32px; padding: 0 8px; border-radius: 6px; color: var(--gray-80); font: 600 13px/32px var(--font-sans); cursor: pointer; }

.pc-drawer-title-wrap { padding: 22px 20px 16px; flex: none; }
.pc-drawer-title-wrap h2 { margin: 0; font: 700 22px/30px var(--font-sans); color: var(--gray-100); }
.pc-drawer-title-wrap p { margin: 7px 0 0; font: 400 13px/20px var(--font-sans); color: var(--gray-70); }
.pc-planned-filter { margin-top: 16px; padding: 12px 13px; border: 1px solid var(--gray-30); border-radius: 9px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pc-planned-filter > div { min-width: 0; display: flex; flex-direction: column; }

.pc-planned-filter span { color: var(--gray-60); font: 400 11px/17px var(--font-sans); }
.pc-switch { width: 40px; height: 24px; padding: 2px; border-radius: 999px; background: var(--gray-40); cursor: pointer; transition: background .15s; flex: none; }

.pc-planned-notice { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: rgba(247,144,9,.09); color: #9a5800; font: 500 11px/17px var(--font-sans); }

.pc-dev-marker-layer { position: fixed; inset: 0; z-index: 110; pointer-events: none; }
.pc-dev-marker-layer, .pc-dev-marker-layer *, .pc-dev-marker-layer *::before, .pc-dev-marker-layer *::after { box-sizing: border-box; }
.pc-dev-marker-shell { position: fixed; width: 30px; height: 30px; pointer-events: auto; }
.pc-dev-marker {

  background: #e0a600; color: var(--white); cursor: help; box-shadow: 0 3px 10px rgba(116,83,0,.30), 0 0 0 2px rgba(224,166,0,.18);

.pc-dev-marker-tooltip-head > div { min-width: 0; display: flex; flex-direction: column; }

.pc-document-body .pc-summary-source { margin-top: 0; }
.pc-document-body .pc-markdown { max-width: 760px; margin: 24px auto 0; }
.pc-document-body .pc-markdown h1 { font-size: 25px; line-height: 34px; }
.pc-document-body .pc-markdown h2 { margin-top: 28px; font-size: 18px; line-height: 27px; }
.pc-document-body .pc-markdown p, .pc-document-body .pc-md-li { font-size: 14px; line-height: 23px; }

.pc-summary-view { padding: 20px 20px 32px; overflow: auto; }
.pc-summary-meta { display: flex; align-items: center; gap: 7px; }
.pc-summary-release { margin-top: 10px; color: #9a5800; font: 600 12px/18px var(--font-sans); }
.pc-summary-source { margin-top: 10px; padding: 10px 12px; border-radius: 7px; background: var(--gray-10); color: var(--gray-60); font: 500 11px/17px var(--font-sans); word-break: break-all; }
.pc-markdown { margin-top: 18px; }
.pc-markdown h1 { margin: 0 0 16px; color: var(--gray-100); font: 700 21px/29px var(--font-sans); }
.pc-markdown h2 { margin: 22px 0 9px; color: var(--gray-100); font: 700 16px/24px var(--font-sans); }
.pc-markdown h3 { margin: 18px 0 8px; color: var(--gray-90); font: 700 14px/22px var(--font-sans); }
.pc-markdown p { margin: 0; color: var(--gray-70); font: 400 13px/21px var(--font-sans); }
.pc-markdown blockquote { margin: 0 0 16px; padding: 12px 14px; border-left: 3px solid var(--blue-60); background: var(--alpha-blue-05); color: var(--gray-80); font: 500 12px/20px var(--font-sans); }
.pc-markdown code { padding: 2px 5px; border-radius: 4px; background: var(--gray-20); color: var(--gray-80); font: 500 11px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-md-li { display: grid; grid-template-columns: 10px 1fr; gap: 5px; align-items: start; margin-top: 5px; }
.pc-md-li > span { color: var(--blue-60); font: 700 13px/21px var(--font-sans); }
.pc-md-gap { height: 6px; }

.pc-policy-highlight { animation: pc-policy-pulse 2.4s ease; outline: 3px solid var(--blue-60); outline-offset: 4px; border-radius: 8px; }
.pc-planned-row-badge { display: inline-flex; margin-left: 6px; padding: 1px 5px; border-radius: 4px; background: rgba(247,144,9,.12); color: #9a5800; vertical-align: 1px; font: 700 10px/15px var(--font-sans); }
@keyframes pc-policy-pulse {
  0%, 100% { outline-color: transparent; box-shadow: none; }
  15%, 70% { outline-color: var(--blue-60); box-shadow: 0 0 0 8px var(--alpha-blue-10); }
}

@media (max-width: 1100px) {
  .pc-drawer { width: min(392px, calc(100% - 24px)); }
  .pc-scrim { left: 0; }
  .pc-document-overlay { padding: 20px; }
  .pc-document-modal { width: calc(100vw - 40px); height: calc(100vh - 40px); }
  .pc-document-body { padding: 20px 22px 32px; }
}


/* styles/adotReservationReview.css */
.ar {
  --ar-background: #f4f7fb;
  --ar-ink: #161f31;
  --ar-muted: #56657a;
  --ar-line: #dee6f0;
  --ar-blue: #0073fa;
  --ar-blue-text: #005dc5;
  min-height: 100vh;
  background: var(--ar-background);
  color: var(--ar-ink);
  font-size: 14px;
  line-height: 1.5;
}
.ar :is(h1, h2, h3, p, dl, dd) { margin: 0; }
.ar button, .ar input { font: inherit; }
.ar button { color: inherit; cursor: pointer; }
.ar :is(button, a, input, summary):focus-visible { outline: 2px solid #145db6; outline-offset: 3px; }
.ar-header { background: #fff; border-bottom: 1px solid var(--ar-line); }
.ar-header-inner {
  max-width: 1120px; min-height: 58px; margin: auto; padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.ar-home { color: var(--ar-ink); font-size: 15px; font-weight: 750; }
.ar-status {
  color: #304764; border-radius: 6px; padding: 4px 9px;
  background: #eaf0f8; font-size: 12px; font-weight: 700;
}
.ar-shell { max-width: 1120px; margin: auto; padding: 35px 24px 32px; }
.ar-intro { margin-bottom: 26px; }
.ar-intro h1 { font-size: clamp(27px, 4vw, 36px); line-height: 1.18; letter-spacing: -.04em; font-weight: 760; }
.ar-intro p { margin-top: 9px; color: var(--ar-muted); font-size: 15px; }
.ar-grid { display: grid; grid-template-columns: minmax(168px, 226px) minmax(0, 1fr) minmax(205px, 260px); gap: 24px; align-items: start; }
.ar-panel { border: 1px solid var(--ar-line); background: #fff; border-radius: 12px; padding: 17px; }
.ar-panel h2 { font-size: 15px; margin-bottom: 11px; font-weight: 750; }
.ar-case, .ar-step { width: 100%; text-align: left; border-radius: 7px; }
.ar-case { display: grid; gap: 2px; padding: 9px 10px; border: 1px solid transparent; }
.ar-case + .ar-case { margin-top: 3px; }
.ar-case span { font-weight: 650; }
.ar-case small { font-size: 12px; color: var(--ar-muted); }
.ar-case:hover, .ar-step:hover { background: #f2f6fb; }
.ar-case[aria-pressed="true"], .ar-step[aria-current] { background: #eaf3ff; color: #0055b4; }
.ar-case[aria-pressed="true"] { border-color: #c8def9; }
.ar-steps { display: grid; gap: 3px; }
.ar-step { display: flex; align-items: center; gap: 9px; min-height: 38px; padding: 4px 7px; font-weight: 650; }
.ar-step span {
  display: grid; place-items: center; width: 22px; height: 22px; flex: 0 0 22px; border-radius: 50%;
  color: #526783; background: #edf1f7; font-size: 11px;
}
.ar-step[aria-current] span { color: #fff; background: #1269d3; }
.ar-review-note { margin-top: 15px; border-top: 1px solid var(--ar-line); padding: 14px 0 0; }
.ar-review-note h3 { font-size: 14px; font-weight: 750; }
.ar-review-note p { margin: 5px 0 0; font-size: 13px; color: var(--ar-muted); }
.ar-settings { margin-top: 14px; }
.ar-settings fieldset { display: flex; gap: 4px 10px; flex-wrap: wrap; margin: 0; border: 0; padding: 0; }
.ar-settings legend { padding: 0; margin-bottom: 4px; font-size: 13px; font-weight: 700; }
.ar-settings label { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #435168; }
.ar-settings input { margin: 0; min-width: 14px; min-height: 14px; accent-color: #0b6add; }
.ar-show-review { margin-top: 12px; }
.ar-preview { min-width: 0; }
.ar-phone {
  isolation: isolate; position: relative; overflow: hidden; display: flex; flex-direction: column;
  width: min(100%, 390px); height: 700px; margin: 0 auto;
  border: 6px solid #1b2332; border-radius: 32px;
  background: #f2f5fa; box-shadow: 0 12px 28px rgba(28, 50, 82, .12);
}
.ar-statusbar {
  min-height: 35px; background: #fff; padding: 8px 19px 3px;
  display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 750;
}
.ar-battery { width: 17px; height: 8px; border-radius: 2px; background: #172132; }
.ar-chat-header { display: flex; justify-content: space-between; align-items: center; background: #fff; border-bottom: 1px solid var(--ar-line); min-height: 50px; padding: 0 15px; }
.ar-chat-header strong { font-size: 18px; letter-spacing: -.025em; }
.ar-chat-header small { color: var(--ar-muted); font-size: 11px; }
.ar-chat { min-height: 0; flex: 1; overflow: auto; padding: 15px 13px 25px; display: flex; flex-direction: column; gap: 12px; }
.ar-message { display: flex; gap: 7px; align-items: start; max-width: 94%; }
.ar-message-user { align-self: flex-end; }
.ar-avatar {
  display: grid; place-items: center; flex: 0 0 25px; height: 25px;
  border-radius: 50%; background: #1b2435; color: #fff; font-size: 10px; font-weight: 750;
}
.ar-bubble { padding: 9px 11px; background: #fff; border-radius: 3px 11px 11px; font-size: 13px; }
.ar-message-user .ar-bubble { background: #1264ca; color: #fff; border-radius: 11px 3px 11px 11px; }
.ar-chat-card { margin-left: 32px; background: #fff; padding: 13px; border: 1px solid var(--ar-line); border-radius: 12px; }
.ar-chat-card h3 { font-size: 16px; line-height: 1.32; }
.ar-chat-card p { margin-top: 5px; color: var(--ar-muted); font-size: 13px; }
.ar-chat-card .ar-primary { margin-top: 10px; }
.ar :is(.ar-primary, .ar-secondary) {
  display: inline-flex; width: 100%; align-items: center; justify-content: center;
  min-height: 42px; padding: 8px; font-size: 14px; line-height: 1.3; font-weight: 700; border-radius: 7px;
}
.ar .ar-primary { color: #fff; background: var(--ar-blue); }
.ar .ar-primary:hover { background: #0066e0; }
.ar .ar-secondary { background: #eef3fa; color: #285076; }
.ar :is(.ar-primary, .ar-secondary):active { transform: translateY(1px); }
.ar .ar-result-replay { margin-top: 10px; font-size: 12px; }
.ar-result-tag { display: inline-block; margin-bottom: 8px; border-radius: 5px; padding: 3px 7px; background: #fff4dc; color: #744c00; font-size: 11px; font-weight: 750; }
.ar-result-tag-confirmed { background: #e3f7eb; color: #166344; }
.ar-preview-caption { text-align: center; color: var(--ar-muted); font-size: 12px; margin: 10px auto 0; max-width: 390px; }
.ar-dim { position: absolute; inset: 0; background: rgba(22, 28, 45, .40); z-index: 1; }
.ar-browser-bar {
  position: absolute; z-index: 2; top: 35px; inset-inline: 0;
  min-height: 42px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between;
  color: #202c42; background: #e5eaf2; font-weight: 650; font-size: 12px;
}
.ar-browser-bar button { display: grid; place-items: center; width: 36px; height: 34px; border-radius: 7px; background: #f4f7fc; font-size: 22px; }
.ar-sheet {
  position: absolute; z-index: 3; bottom: 0; inset-inline: 0; display: flex; flex-direction: column;
  min-height: 220px; max-height: calc(100% - 77px); overflow: hidden;
  border-radius: 24px 24px 0 0; background: #fff; color: #31353f;
}
.ar-sheet-header { display: flex; align-items: center; gap: 6px; min-height: 58px; padding: 12px 20px; flex: 0 0 auto; color: #0073fa; font-size: 18px; letter-spacing: -.025em; }
.ar-sheet-header img, .ar-details-button img, .ar-consent-label img, .ar-notice img { display: block; flex: 0 0 auto; }
.ar-sheet-body { min-height: 0; overflow: auto; padding: 10px 20px 17px; scrollbar-width: thin; scrollbar-color: #a9bad1 transparent; }
.ar-sheet-body::-webkit-scrollbar { display: block; width: 5px; }
.ar-sheet-body::-webkit-scrollbar-thumb { background: #a9bad1; border-radius: 6px; }
.ar-sheet-body h2, .ar-completion h2 { font-size: 21px; line-height: 1.35; letter-spacing: -.035em; font-weight: 760; }
.ar dl.ar-summary {
  display: grid; grid-template-columns: 68px 1fr; row-gap: 8px;
  background: #f4f5f7; border-radius: 6px; padding: 13px 14px;
  margin: 19px 0 0; font-size: 13px;
}
.ar-summary dt { color: #586276; }
.ar-summary dd { font-weight: 650; }
.ar-fields { margin-top: 23px; }
.ar-fields h3 { font-size: 15px; font-weight: 750; }
.ar-section-title { display: flex; gap: 7px; align-items: center; justify-content: space-between; }
.ar-section-title small { color: #374e68; background: #ecf2f9; border-radius: 4px; padding: 2px 5px; font-size: 11px; }
.ar .ar-mask { color: #4f5c72; font-size: 12px; display: flex; align-items: center; gap: 6px; }
.ar-id { display: grid; grid-template-columns: 1fr auto 1fr; gap: 7px; align-items: center; margin-top: 9px; }
.ar-id > :is(span:first-child, button) { border-radius: 6px; padding: 10px 7px; text-align: center; min-height: 41px; }
.ar-id > span:first-child { background: #f3f5f7; font-variant-numeric: tabular-nums; }
.ar-id > button { border: 1px solid #abb9cc; color: #3b536e; font-size: 12px; }
.ar p.ar-helper { margin: 9px 0 0; font-size: 12px; color: #56657a; line-height: 1.55; }
.ar-notice { margin: 7px 0 0; }
.ar-notice summary { display: flex; align-items: center; gap: 3px; list-style: none; width: fit-content; cursor: pointer; color: #405676; font-size: 12px; font-weight: 700; }
.ar-notice summary::-webkit-details-marker { display: none; }
.ar-notice[open] summary img { transform: rotate(90deg); }
.ar-consent-item { border-bottom: 1px solid #e8edf3; }
.ar-consent-row { display: flex; min-height: 38px; justify-content: space-between; gap: 5px; align-items: center; }
.ar-consent-label { position: relative; display: flex; align-items: center; gap: 7px; flex: 1; font-size: 12px; line-height: 1.38; color: #434d61; }
.ar-consent-label:has(input) { cursor: pointer; }
.ar-checkbox {
  display: grid; place-items: center; flex: 0 0 18px; height: 18px;
  border: 1px solid #acb7ca; border-radius: 4px; background: #fff;
}
.ar-consent-label input:checked + .ar-checkbox { border-color: var(--ar-blue); background: var(--ar-blue); }
.ar-consent-label input:checked + .ar-checkbox::after {
  content: ''; width: 8px; height: 5px; border: solid #fff; border-width: 0 0 2px 2px;
  transform: translateY(-1px) rotate(-45deg);
}
.ar-consent-label input { position: absolute; opacity: 0; width: 18px; height: 18px; margin: 0; }
.ar-consent-label:has(input:focus-visible) { outline: 2px solid #145db6; outline-offset: 2px; border-radius: 3px; }
.ar-all { padding: 8px 0 3px; font-weight: 700; }
.ar .ar-details-button { color: #45618a; display: flex; align-items: center; gap: 3px; min-height: 34px; flex: 0 0 auto; font-size: 11px; }
.ar-details-button[aria-expanded="true"] img { transform: rotate(180deg); }
.ar-disclosure { background: #f4f6f9; color: #415168; border-radius: 6px; font-size: 12px; line-height: 1.53; padding: 8px; margin: 6px 0; }
.ar-marketing { border-top: 1px solid var(--ar-line); padding-top: 13px; }
.ar-sheet-footer { flex: 0 0 auto; box-shadow: 0 -7px 12px rgba(255, 255, 255, .84); padding: 5px 20px 7px; }
.ar-sheet-footer .ar-primary { min-height: 46px; }
.ar .ar-error { color: #ad1631; font-size: 12px; margin-top: 5px; text-align: center; }
.ar-homebar { flex: 0 0 4px; width: 106px; margin: 7px auto 5px; background: #16181d; border-radius: 5px; }
.ar-completion { min-height: 250px; display: grid; align-content: center; justify-items: center; padding: 16px; text-align: center; }
.ar-completion-icon { display: grid; place-items: center; width: 47px; height: 47px; border-radius: 50%; background: #e8f3ff; font-size: 26px; color: #0067d9; font-weight: 740; margin-bottom: 12px; }
.ar-completion p { margin-top: 6px; color: #556179; font-size: 13px; }
.ar-completion p.ar-confirmed-time { color: var(--ar-blue-text); font-weight: 700; }
.ar-close-overlay { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; background: rgba(22, 28, 45, .40); padding: 17px; }
.ar-close-dialog { width: 100%; padding: 17px; background: #fff; border-radius: 12px; text-align: center; }
.ar-close-dialog h2 { font-size: 17px; }
.ar-close-dialog p { margin: 7px 0 13px; font-size: 13px; color: var(--ar-muted); }
.ar-close-dialog div { display: flex; gap: 7px; }

@media (max-width: 860px) {
  .ar-grid { gap: 14px; grid-template-columns: minmax(143px, 160px) minmax(0, 1fr) minmax(150px, 175px); }
  .ar-panel { padding: 12px; }
  .ar-shell { padding-inline: 16px; }
}
@media (max-width: 670px) {
  .ar-header-inner { min-height: 49px; padding-inline: 13px; }
  .ar-shell { padding: 22px 12px; }
  .ar-intro { margin-bottom: 15px; }
  .ar-intro p { font-size: 13px; margin-top: 5px; }
  .ar-grid { display: flex; flex-direction: column; gap: 12px; }
  .ar-grid > * { width: 100%; }
  .ar-scenarios { display: flex; gap: 5px; overflow: auto; scrollbar-width: thin; padding: 6px; }
  .ar-scenarios h2 { position: absolute; clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; }
  .ar-case { flex: 0 0 auto; width: auto; padding: 5px 8px; font-size: 12px; }
  .ar-case + .ar-case { margin-top: 0; }
  .ar-case small { font-size: 10px; }
  .ar-phone { height: 640px; border-width: 4px; border-radius: 22px; }
  .ar-steps { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .ar-step { display: grid; justify-items: center; text-align: center; gap: 3px; padding: 4px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  .ar :is(.ar-primary, .ar-secondary):active { transform: none; }
}
