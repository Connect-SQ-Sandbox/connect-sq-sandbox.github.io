/* styles/connectShell.css */
/* =============================================================
   굿닥 커넥트 웹뷰 — 공통 셸 (디자인 토큰 + 윈도우 셸/사이드내비)
   여러 커넥트 화면(진료항목 등록, 예약 신청 내역 등)이 공유한다.
   - /Users/goodoc/test 프로토타입의 colors_and_type.css(:root)와
     connect.css의 셸 부분을 이식.
   - 전역 누수 방지를 위해 원본 body 레벨 스타일은 .cn-artboard 래퍼로
     한정했고 리셋도 .cn-artboard 하위로 스코프.
   - 클래스 접두사(cn-)가 고유해 다른 페이지와 충돌하지 않음.
   ============================================================= */

/* ---- Design tokens (colors_and_type.css :root, @font-face 제외) ---- */
:root {
  --gray-10:  #F9FAFB;
  --gray-15:  #F4F6F8;
  --gray-20:  #F2F4F6;
  --gray-30:  #E5E8EB;
  --gray-40:  #D1D6DB;
  --gray-50:  #B0B8C1;
  --gray-60:  #8B95A1;
  --gray-70:  #6B7684;
  --gray-80:  #4E5968;
  --gray-90:  #31353F;
  --gray-100: #191F28;

  --blue-30:  #B3D5FF;
  --blue-60:  #0073FA;
  --blue-70:  #0061DB;
  --blue-80:  #0050B5;

  --red-60:   #FA4655;
  --red-70:   #EC3847;
  --red-80:   #D52130;

  --green-70: #41D293;
  --green-80: #1FA972;
  --orange-60:#F79009;

  --white: #FFFFFF;
  --black: #000000;
  --transparent: transparent;

  --alpha-gray-05: rgba(128, 135, 153, 0.05);
  --alpha-gray-10: rgba(128, 135, 153, 0.10);
  --alpha-gray-15: rgba(128, 135, 153, 0.15);
  --alpha-gray-20: rgba(128, 135, 153, 0.20);
  --alpha-gray-40: rgba(128, 135, 153, 0.40);
  --alpha-gray-60: rgba(128, 135, 153, 0.60);

  --alpha-blue-05: rgba(0, 115, 250, 0.05);
  --alpha-blue-10: rgba(0, 115, 250, 0.10);
  --alpha-blue-15: rgba(0, 115, 250, 0.15);
  --alpha-blue-20: rgba(0, 115, 250, 0.20);

  --alpha-red-05: rgba(250, 70, 85, 0.05);
  --alpha-red-10: rgba(250, 70, 85, 0.10);
  --alpha-red-15: rgba(250, 70, 85, 0.15);
  --alpha-red-20: rgba(250, 70, 85, 0.20);

  --shadow-toast: 0 2px 1px rgba(22, 24, 29, 0.02), 0 2px 8px rgba(22, 24, 29, 0.10);
  --shadow-toggle-knob: 0 0 6px rgba(0, 0, 0, 0.25);

  --font-sans: 'Pretendard', 'Pretendard Variable', -apple-system,
    BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}

/* ---- Artboard backdrop (원본 connect.css의 body 스타일을 래퍼로 한정) ---- */
.cn-artboard {
  font-family: var(--font-sans);
  background: #e7e9ee;
  color: var(--gray-100);
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 24px;
}
.cn-artboard *,
.cn-artboard *::before,
.cn-artboard *::after { box-sizing: border-box; }

/* ---- App window (1280 x 832 rounded webview frame) ---- */
.cn-screen {
  width: 1280px;
  min-height: 832px;
  background: var(--white);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 12px 40px rgba(22, 24, 29, 0.12);
  position: relative;
}

/* ---- Title bar (windows-style) ---- */
.cn-titlebar {
  height: 32px;
  background: #f3f3f3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: none;
}
.cn-ci { display: flex; align-items: center; gap: 4px; padding: 0 8px; height: 100%; }
.cn-ci-mark { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
.cn-ci-mark svg { display: block; }
.cn-ci-name { font: 500 13px/16px var(--font-sans); color: rgba(0, 0, 0, 0.9); padding: 0 8px 2px 4px; }
.cn-winctrls { display: flex; height: 100%; }
.cn-winbtn {
  width: 46px; height: 32px;
  border: 0; background: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  color: rgba(0, 0, 0, 0.9); cursor: pointer;
}
.cn-winbtn:hover { background: rgba(0, 0, 0, 0.05); }
.cn-winbtn.close:hover { background: #e81123; color: #fff; }

/* ---- Body: nav + main ---- */
.cn-body { display: flex; align-items: stretch; flex: 1; min-height: 800px; }

/* ---- Side nav (250px) ---- */
.cn-nav { width: 250px; flex: none; background: #f2f4f7; position: relative; display: flex; flex-direction: column; }
.cn-nav-scroll { flex: 1; overflow: auto; }
.cn-nav-group { padding: 8px 0; display: flex; flex-direction: column; }
.cn-nav-header { height: 40px; display: flex; align-items: center; padding: 0 16px; font: 600 14px/20px var(--font-sans); color: rgba(0, 0, 0, 0.9); }
.cn-nav-item {
  height: 40px; width: 100%;
  border: 0; background: transparent;
  display: flex; align-items: center;
  padding: 0 16px; position: relative; cursor: pointer; text-align: left;
}
.cn-nav-item > .cn-nav-label { font: 400 14px/22px var(--font-sans); color: var(--gray-90); flex: 1; }
.cn-nav-item .cn-chevron { width: 12px; height: 12px; color: #808799; flex: none; display: inline-flex; align-items: center; justify-content: center; }
.cn-nav-item.sub { padding-left: 32px; }
.cn-nav-item.sub::before { content: ""; position: absolute; inset: 2px 4px; border-radius: 4px; pointer-events: none; }
.cn-nav-item.active::before { background: var(--alpha-gray-10); }
.cn-nav-item.active .cn-nav-label { color: var(--gray-90); }
.cn-nav-item:not(.active):not(.cn-nav-header):hover::before {
  content: ""; position: absolute; inset: 2px 4px;
  background: rgba(128, 135, 153, 0.06); border-radius: 4px; pointer-events: none;
}
.cn-nav-label-wrap { display: inline-flex; align-items: center; gap: 6px; flex: 1; }
.cn-beta {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 5px; border-radius: 4px;
  background: var(--alpha-blue-10);
  font: 600 12px/18px var(--font-sans);
  color: var(--blue-80, #115fd4);
}
.cn-nav-divider { padding: 4px 0; }
.cn-nav-divider span { display: block; height: 1px; background: var(--gray-30); }
.cn-nav-footer { background: #f2f4f7; padding-bottom: 8px; display: flex; flex-direction: column; }

/* ---- Main frame ---- */
.cn-main { flex: 1; min-width: 0; background: var(--white); display: flex; flex-direction: column; }
.cn-header { padding: 48px 64px 32px; }
.cn-header-title { font: 700 28px/36px var(--font-sans); color: #16181d; }
.cn-header-desc { font: 400 14px/22px var(--font-sans); color: #808799; margin-top: 6px; }


/* styles/prototypeChanges.css */
/* 프로토타입 메타 UI: 실제 Connect 기능이 아니라 정책 변경 추적용 패널 */
.pc-trigger {
  position: fixed; top: 72px; right: 0; z-index: 105;
  height: 40px; padding: 0 12px 0 10px; border: 1px solid var(--gray-30); border-right: 0;
  border-radius: 8px 0 0 8px; background: var(--gray-100); color: var(--white);
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  font: 600 12px/18px var(--font-sans); box-shadow: 0 4px 16px rgba(22,24,29,.14);
}
.pc-trigger:hover { background: var(--gray-90); }
.pc-trigger-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-70); }
.pc-trigger-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: rgba(255,255,255,.16); font: 700 11px/18px var(--font-sans); }

/* 딤 제거: 우측 패널을 비모달로 (열어둔 채 본문 확인·조작 가능) */
.pc-scrim { display: none; }
.pc-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 120; width: 392px;
  background: var(--white); box-shadow: -12px 0 32px rgba(22,24,29,.14);
  display: flex; flex-direction: column; transform: translateX(102%); visibility: hidden;
  transition: transform .2s ease, visibility .2s;
}
.pc-drawer.open { transform: translateX(0); visibility: visible; }
.pc-drawer-head { min-height: 52px; padding: 0 18px; border-bottom: 1px solid var(--gray-20); display: flex; align-items: center; justify-content: space-between; flex: none; }
.pc-eyebrow { font: 700 11px/16px var(--font-sans); letter-spacing: .08em; color: var(--blue-70); }
.pc-close { width: 32px; height: 32px; border-radius: 6px; color: var(--gray-70); font: 400 24px/30px var(--font-sans); cursor: pointer; }
.pc-close:hover, .pc-back:hover { background: var(--gray-10); }
.pc-back { height: 32px; padding: 0 8px; border-radius: 6px; color: var(--gray-80); font: 600 13px/32px var(--font-sans); cursor: pointer; }

.pc-drawer-title-wrap { padding: 22px 20px 16px; flex: none; }
.pc-drawer-title-wrap h2 { margin: 0; font: 700 22px/30px var(--font-sans); color: var(--gray-100); }
.pc-drawer-title-wrap p { margin: 7px 0 0; font: 400 13px/20px var(--font-sans); color: var(--gray-70); }
.pc-planned-filter { margin-top: 16px; padding: 12px 13px; border: 1px solid var(--gray-30); border-radius: 9px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pc-planned-filter > div { min-width: 0; display: flex; flex-direction: column; }
.pc-planned-filter strong { color: var(--gray-90); font: 600 13px/19px var(--font-sans); }
.pc-planned-filter span { color: var(--gray-60); font: 400 11px/17px var(--font-sans); }
.pc-switch { width: 40px; height: 24px; padding: 2px; border-radius: 999px; background: var(--gray-40); cursor: pointer; transition: background .15s; flex: none; }
.pc-switch > span { display: block; width: 20px; height: 20px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 4px rgba(22,24,29,.18); transition: transform .15s; }
.pc-switch.on { background: #f79009; }
.pc-switch.on > span { transform: translateX(16px); }
.pc-planned-notice { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: rgba(247,144,9,.09); color: #9a5800; font: 500 11px/17px var(--font-sans); }
.pc-dev-filter { margin-top: 10px; border-color: rgba(234, 179, 8, .48); background: #fffdf2; }
.pc-dev-notice { margin-top: 8px; padding: 8px 10px; border: 1px solid rgba(234, 179, 8, .35); border-radius: 6px; background: #fff8cf; color: #745300; font: 600 11px/17px var(--font-sans); }
.pc-dev-marker-layer { position: fixed; inset: 0; z-index: 110; pointer-events: none; }
.pc-dev-marker-layer, .pc-dev-marker-layer *, .pc-dev-marker-layer *::before, .pc-dev-marker-layer *::after { box-sizing: border-box; }
.pc-dev-marker-shell { position: fixed; width: 30px; height: 30px; pointer-events: auto; }
.pc-dev-marker {
  position: relative; z-index: 2; width: 30px; height: 30px; border: 2px solid var(--white); border-radius: 50%;
  background: #e0a600; color: var(--white); cursor: help; box-shadow: 0 3px 10px rgba(116,83,0,.30), 0 0 0 2px rgba(224,166,0,.18);
  font: 800 12px/26px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center;
  transition: transform .14s ease, background .14s ease, box-shadow .14s ease;
}
.pc-dev-marker:hover, .pc-dev-marker:focus-visible { background: #c98e00; box-shadow: 0 5px 16px rgba(116,83,0,.38), 0 0 0 3px rgba(224,166,0,.22); outline: none; transform: scale(1.08); }
.pc-dev-marker-tooltip {
  position: absolute; z-index: 1; width: min(350px, calc(100vw - 24px)); max-height: min(420px, calc(100vh - 48px));
  padding: 13px 14px 14px; overflow: auto; border: 1px solid #e4b82f; border-radius: 12px; background: #fffdf1;
  color: #5f4700; box-shadow: 0 12px 32px rgba(72,54,0,.20); visibility: hidden; opacity: 0; pointer-events: none;
  transition: opacity .12s ease, transform .12s ease, visibility .12s;
}
.pc-dev-marker-shell.place-left .pc-dev-marker-tooltip { right: 0; }
.pc-dev-marker-shell.place-right .pc-dev-marker-tooltip { left: 0; }
.pc-dev-marker-shell.place-below .pc-dev-marker-tooltip { top: calc(100% + 9px); transform: translateY(-4px); }
.pc-dev-marker-shell.place-above .pc-dev-marker-tooltip { bottom: calc(100% + 9px); transform: translateY(4px); }
.pc-dev-marker-shell:hover .pc-dev-marker-tooltip,
.pc-dev-marker-shell:focus-within .pc-dev-marker-tooltip { visibility: visible; opacity: 1; pointer-events: auto; transform: translateY(0); }
.pc-dev-marker-tooltip-head { display: grid; grid-template-columns: 26px 1fr; gap: 9px; align-items: start; }
.pc-dev-marker-tooltip-head > span { width: 26px; height: 26px; border-radius: 50%; background: #e0a600; color: var(--white); font: 800 11px/26px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; }
.pc-dev-marker-tooltip-head > div { min-width: 0; display: flex; flex-direction: column; }
.pc-dev-marker-tooltip-head small { color: #9a6b00; font: 700 9px/14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
.pc-dev-marker-tooltip-head strong { margin-top: 1px; color: #4d3900; font: 700 13px/19px var(--font-sans); word-break: keep-all; }

.pc-dev-marker-tooltip li { margin-top: 5px; color: #5f4700; font: 500 11px/18px var(--font-sans); word-break: keep-all; }
.pc-dev-marker-tooltip li:first-child { margin-top: 0; }
.pc-dev-marker-tooltip code { padding: 1px 4px; border-radius: 4px; background: rgba(116,83,0,.10); color: #604700; font: 600 10px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-current-view { display: inline-flex; margin-top: 12px; padding: 5px 9px; border-radius: 6px; background: var(--alpha-blue-10); color: var(--blue-70); font: 600 12px/18px var(--font-sans); }
.pc-scope { margin: 0 20px; padding: 3px; border-radius: 8px; background: var(--gray-20); display: grid; grid-template-columns: 1fr 1fr; flex: none; }

.pc-change-list {

.pc-empty { padding: 40px 12px; text-align: center; color: var(--gray-60); font: 400 13px/20px var(--font-sans); }
.pc-change-card { flex: 0 0 auto; border: 1px solid var(--gray-30); border-radius: 10px; overflow: hidden; background: var(--white); transition: border-color .12s, box-shadow .12s; }
.pc-change-card:hover { border-color: var(--gray-50); box-shadow: 0 4px 16px rgba(22,24,29,.06); }

.pc-document-body .pc-summary-source { margin-top: 0; }
.pc-document-body .pc-markdown { max-width: 760px; margin: 24px auto 0; }
.pc-document-body .pc-markdown h1 { font-size: 25px; line-height: 34px; }
.pc-document-body .pc-markdown h2 { margin-top: 28px; font-size: 18px; line-height: 27px; }
.pc-document-body .pc-markdown p, .pc-document-body .pc-md-li { font-size: 14px; line-height: 23px; }

.pc-summary-view { padding: 20px 20px 32px; overflow: auto; }
.pc-summary-meta { display: flex; align-items: center; gap: 7px; }
.pc-summary-release { margin-top: 10px; color: #9a5800; font: 600 12px/18px var(--font-sans); }
.pc-summary-source { margin-top: 10px; padding: 10px 12px; border-radius: 7px; background: var(--gray-10); color: var(--gray-60); font: 500 11px/17px var(--font-sans); word-break: break-all; }
.pc-markdown { margin-top: 18px; }
.pc-markdown h1 { margin: 0 0 16px; color: var(--gray-100); font: 700 21px/29px var(--font-sans); }
.pc-markdown h2 { margin: 22px 0 9px; color: var(--gray-100); font: 700 16px/24px var(--font-sans); }
.pc-markdown h3 { margin: 18px 0 8px; color: var(--gray-90); font: 700 14px/22px var(--font-sans); }
.pc-markdown p { margin: 0; color: var(--gray-70); font: 400 13px/21px var(--font-sans); }
.pc-markdown blockquote { margin: 0 0 16px; padding: 12px 14px; border-left: 3px solid var(--blue-60); background: var(--alpha-blue-05); color: var(--gray-80); font: 500 12px/20px var(--font-sans); }
.pc-markdown code { padding: 2px 5px; border-radius: 4px; background: var(--gray-20); color: var(--gray-80); font: 500 11px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-md-li { display: grid; grid-template-columns: 10px 1fr; gap: 5px; align-items: start; margin-top: 5px; }
.pc-md-li > span { color: var(--blue-60); font: 700 13px/21px var(--font-sans); }
.pc-md-gap { height: 6px; }

.pc-policy-highlight { animation: pc-policy-pulse 2.4s ease; outline: 3px solid var(--blue-60); outline-offset: 4px; border-radius: 8px; }
.pc-planned-row-badge { display: inline-flex; margin-left: 6px; padding: 1px 5px; border-radius: 4px; background: rgba(247,144,9,.12); color: #9a5800; vertical-align: 1px; font: 700 10px/15px var(--font-sans); }
@keyframes pc-policy-pulse {
  0%, 100% { outline-color: transparent; box-shadow: none; }
  15%, 70% { outline-color: var(--blue-60); box-shadow: 0 0 0 8px var(--alpha-blue-10); }
}

@media (max-width: 1100px) {
  .pc-drawer { width: min(392px, calc(100% - 24px)); }
  .pc-scrim { left: 0; }
  .pc-document-overlay { padding: 20px; }
  .pc-document-modal { width: calc(100vw - 40px); height: calc(100vh - 40px); }
  .pc-document-body { padding: 20px 22px 32px; }
}


/* styles/connectRegister.css */
/* =============================================================
   굿닥 커넥트 웹뷰 — 진료항목 정보(등록) 화면 전용 전역 스타일
   /Users/goodoc/test 프로토타입(register.css)을 Next.js 프로젝트로 이식.
   - className은 프로토타입과 동일하게 유지(plain CSS).
   - 토큰/리셋/공통 셸(.cn-artboard, .cn-screen, 타이틀바, 사이드 내비)은
     connectShell.css에서 공유한다. 이 파일은 rg-* 화면 전용 스타일만 담는다.
   - 클래스 접두사(rg-)가 고유해 다른 페이지와 충돌하지 않음.
   ============================================================= */

/* ---- Main: 풋터 absolute 기준 ---- */
.rg-main { position: relative; }

/* 헤더 eyebrow */
.rg-eyebrow { font: 400 14px/22px var(--font-sans); color: #808799; margin-bottom: 6px; }

/* ---- 본문 2단 레이아웃 ---- */
.rg-container {
  display: flex;
  gap: 24px;
  align-items: flex-start;
  padding: 0 64px 124px;
}
.rg-form { flex: 1 0 0; min-width: 0; display: flex; flex-direction: column; gap: 24px; }

/* ---- 흰색 섹션 카드 ---- */
.rg-card {
  background: var(--white);
  border: 1px solid rgba(128, 135, 153, 0.2);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.rg-card.required { padding: 20px 0; }
.rg-card.extra { padding: 24px 0; }

/* 그룹 타이틀 */
.rg-group-title { font: 700 18px/26px var(--font-sans); color: #16181d; padding: 0 24px; }

/* ---- 필드 공통 ---- */
.rg-field { padding: 0 24px; display: flex; flex-direction: column; }
.rg-field-head { display: flex; flex-direction: column; gap: 2px; padding-bottom: 8px; }
.rg-label { font: 600 16px/26px var(--font-sans); color: #31353f; }
.rg-label.optional { color: #434956; }
.rg-optional { font-weight: 600; color: #808799; }
.rg-help { font: 400 12px/18px var(--font-sans); color: #5d6474; }

/* ---- 입력 (디자인 시스템 Input: border #caced8 / radius 6 / 40h / Medium 14) ---- */
.rg-input {
  width: 100%;
  height: 40px;
  border: 1px solid #caced8;
  border-radius: 6px;
  padding: 0 16px;
  background: var(--white);
  font: 500 14px/22px var(--font-sans);
  color: #16181d;
}
.rg-input::placeholder { color: #a8aebd; font-weight: 500; }
.rg-input:focus { outline: none; border-color: var(--blue-60, #0073fa); }
/* 유효성 실패 필드 — 빨간 테두리 + 하단 빨간 메시지 (실제 서비스 컨벤션) */
.rg-input.error, .rg-num.error { border-color: var(--red-60, #f5535f); }
.rg-input.error:focus, .rg-num.error:focus { border-color: var(--red-60, #f5535f); }
.rg-error { margin: 6px 0 0; font: 500 13px/18px var(--font-sans); color: var(--red-60, #f5535f); }

.rg-search { position: relative; }
.rg-search .rg-input { padding-right: 44px; }
.rg-search-ic {
  position: absolute; top: 50%; right: 16px; transform: translateY(-50%);
  width: 18px; height: 18px; color: #808799; pointer-events: none;
}

/* 글자 수 카운터 */
.rg-counter { margin-top: 8px; text-align: right; font: 500 13px/18px var(--font-sans); color: #808799; }
.rg-counter-num { font-weight: 600; color: #434956; }

/* ---- 가격 정보 필드: 공통 24px 거터 구조 ----
   필드 좌측 패딩(24px)을 제거하고 드래그 핸들(24px)이 그 거터를 대신한다.
   → 가격명 인풋의 좌측 엣지가 진료항목 인풋과 정확히 정렬되며,
     레이블/도움말만 24px 들여써서 콘텐츠-좌측 정렬을 유지. */
.rg-field.price { padding-left: 0; padding-right: 24px; }
.rg-field.price .rg-field-head { padding-left: 24px; }
.rg-price-list { display: flex; flex-direction: column; }

/* ---- 가격 옵션 행 (상태: 기본 / Hover / DND) ---- */
.rg-price-row {
  display: flex; align-items: flex-start;
  /* 좌측: 핸들(24px)이 거터 역할 / 우측: × 버튼 우측 엣지가 진료항목 인풋 우측과 정렬되도록 패딩 0 */
  padding: 8px 0;
  border-radius: 8px;
}
/* DND(드래그 중): 흰 배경 + 회색 테두리(ring) + 그림자 — 레이아웃 영향 없도록 box-shadow 사용 */
.rg-price-row.dragging {
  background: var(--white);
  box-shadow: 0 0 0 1px #a8aebd, 0 2px 0.5px rgba(22, 24, 29, 0.02), 0 2px 4px rgba(22, 24, 29, 0.1);
}
/* 드래그 핸들: 기본 숨김 → Hover/DND 시 노출 */
.rg-drag {
  width: 24px; flex: none;
  align-self: stretch; min-height: 40px;
  padding: 0 8px;
  display: flex; align-items: center; justify-content: center;
  color: #808799; opacity: 0; cursor: grab;
}
.rg-price-row:hover .rg-drag,
.rg-price-row.dragging .rg-drag { opacity: 1; }
.rg-price-row.dragging .rg-drag { cursor: grabbing; }
.rg-drag svg { width: 8px; height: 12px; }
.rg-price-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.rg-price-entry { display: flex; align-items: center; gap: 8px; }

/* 가격 타입 드롭다운 (button + 메뉴) */
.rg-select-wrap { position: relative; flex: none; }
.rg-select.open { border-color: var(--blue-60, #0073fa); }
.rg-select-menu {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 20;
  width: 140px; padding: 4px;
  background: var(--white); border: 1px solid #e3e6ed; border-radius: 8px;
  box-shadow: 0 2px 1px rgba(22, 24, 29, 0.02), 0 2px 8px rgba(22, 24, 29, 0.1);
  display: flex; flex-direction: column;
}
.rg-select-opt {
  height: 36px; border: 0; border-radius: 6px; background: transparent;
  padding: 0 12px; text-align: left; cursor: pointer;
  font: 500 14px/22px var(--font-sans); color: #31353f;
}
.rg-select-opt:hover { background: #f2f4f7; }
.rg-select-opt.active { background: var(--alpha-blue-10); color: var(--blue-60, #0073fa); font-weight: 600; }

/* 할인 가격: 정상가 → 판매가 화살표 */
.rg-price-arrow { flex: none; font: 500 14px/22px var(--font-sans); color: #808799; }

.rg-select {
  width: 140px; flex: none; height: 40px;
  border: 1px solid #caced8; border-radius: 6px;
  padding: 0 12px 0 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font: 500 14px/22px var(--font-sans); color: #31353f;
  background: var(--white); cursor: pointer;
}
.rg-select .rg-select-ic { width: 16px; height: 16px; color: #5d6474; flex: none; }
.rg-num {
  width: 128px; flex: none; height: 40px;
  border: 1px solid #caced8; border-radius: 6px;
  padding: 0 16px; text-align: right;
  font: 500 14px/22px var(--font-sans); color: #16181d;
  background: var(--white);
}
.rg-num::placeholder { color: #a8aebd; font-weight: 500; }
.rg-num:focus, .rg-select:focus { outline: none; border-color: var(--blue-60, #0073fa); }
.rg-unit {
  height: 40px; flex: none;
  display: flex; align-items: center;
  font: 500 14px/22px var(--font-sans); color: #16181d;
}
.rg-price-del {
  width: 40px; height: 40px; flex: none;
  border: 0; background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #16181d; border-radius: 4px;
}
.rg-price-del:hover { background: #f2f4f7; }
.rg-price-del svg { width: 16px; height: 16px; }

/* 가격 옵션 추가 버튼 */
.rg-add-wrap { padding: 16px 24px 0; }
.rg-add-btn {
  width: 100%; height: 40px;
  border: 0; border-radius: 6px;
  background: rgba(0, 115, 250, 0.1);
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font: 600 14px/22px var(--font-sans); color: var(--blue-60, #0073fa);
  cursor: pointer;
}
.rg-add-btn svg { width: 18px; height: 18px; }

/* ---- 사진 업로드 ---- */
.rg-upload {
  width: 96px; height: 96px;
  border: 1px dashed #caced8; border-radius: 6px;
  background: var(--white);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  cursor: pointer;
}
.rg-upload svg { width: 24px; height: 24px; color: #808799; }
.rg-upload-label { font: 500 13px/18px var(--font-sans); color: #808799; }

/* 회색 가이드 박스 */
.rg-guide-wrap { padding: 16px 24px 0; }
.rg-guide { background: #f6f7f9; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.rg-guide-li { display: flex; gap: 6px; font: 400 13px/20px var(--font-sans); color: #5d6474; }
.rg-guide-li::before { content: "\2022"; color: #808799; flex: none; }

/* 텍스트영역 */
.rg-textarea {
  width: 100%; height: 296px;
  border: 1px solid #caced8; border-radius: 6px;
  padding: 9px 16px; resize: none;
  font: 500 14px/22px var(--font-sans); color: #16181d;
  background: var(--white);
}
.rg-textarea::placeholder { color: #a8aebd; font-weight: 500; }
.rg-textarea:focus { outline: none; border-color: var(--blue-60, #0073fa); }

/* 상세 소개 사진 (다중 썸네일, 최대 5개) */
.rg-detail-imgs { display: flex; flex-wrap: wrap; gap: 8px; }
.rg-detail-thumb { position: relative; width: 96px; height: 96px; border-radius: 6px; background: linear-gradient(135deg, #dbeafe, #cfe0ff); }
.rg-detail-thumb-idx { position: absolute; left: 6px; bottom: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 5px; background: rgba(25,31,40,.55); color: #fff; font: 600 11px/18px var(--font-sans); text-align: center; }
.rg-detail-thumb-del { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border: 0; border-radius: 50%; background: rgba(25,31,40,.6); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.rg-detail-thumb-del svg { width: 12px; height: 12px; }
.rg-detail-add { width: 96px; height: 96px; border: 1px dashed #caced8; border-radius: 6px; background: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
.rg-detail-add svg { width: 24px; height: 24px; color: #808799; }
.rg-detail-add span { font: 500 13px/18px var(--font-sans); color: #808799; }

/* 키워드 태그 입력 */
.rg-tag-box {
  min-height: 80px; margin-top: 8px;
  background: var(--white); border: 1px solid #caced8; border-radius: 8px;
  padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start;
}
.rg-tag-empty { font: 400 14px/22px var(--font-sans); color: #a8aebd; }

/* 구분선 */
.rg-divider { height: 1px; background: #f2f4f7; margin: 0 24px; }

/* =========================================================
   우측 미리보기 (모바일 프레임)
   ========================================================= */
.rg-preview {
  width: 320px; flex: none; height: 640px;
  border: 4px solid #5d6474; border-radius: 24px;
  background: var(--white);
  padding: 4px 4px 24px;
  overflow: hidden;
}
.rg-pv-hero { height: 8px; border-radius: 6px; background: #f2f4f7; }
.rg-pv-basic { padding: 16px; }
.rg-pv-title { font: 700 18px/26px var(--font-sans); color: #a8aebd; }
.rg-pv-divider { height: 5px; background: #f2f4f7; }
.rg-pv-price { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.rg-pv-price-head { font: 700 16px/24px var(--font-sans); color: #31353f; }
.rg-pv-price-row { min-height: 48px; display: flex; align-items: center; justify-content: space-between; }
.rg-pv-price-name { font: 500 14px/22px var(--font-sans); color: #a8aebd; }
.rg-pv-price-val { font: 700 14px/22px var(--font-sans); color: #a8aebd; }

/* =========================================================
   하단 고정 풋터
   ========================================================= */
/* 하단 액션 바 — 뷰포트 최하단 스티키 고정. 전체너비 레이아웃(overflow:visible)이라 sticky가 window 기준으로 동작. */
.rg-footer {
  position: sticky; bottom: 0; z-index: 40;
  height: 64px;
  background: var(--white);
  border-top: 1px solid #e3e6ed;
  padding: 0 64px;
  display: flex; align-items: center; gap: 8px;
}
.rg-footer-left { flex: 1; display: flex; align-items: center; gap: 8px; }
.rg-btn-cancel {
  width: 80px; height: 40px;
  border: 1px solid rgba(128, 135, 153, 0.2); border-radius: 6px;
  background: var(--white); font: 700 14px/22px var(--font-sans); color: #5d6474; cursor: pointer;
}
.rg-btn-save {
  width: 80px; height: 40px;
  border: 0; border-radius: 6px;
  background: var(--blue-60, #0073fa); font: 700 14px/22px var(--font-sans); color: var(--white); cursor: pointer;
}
.rg-footer-right { display: flex; align-items: center; gap: 10px; }
.rg-footer-label { font: 400 14px/22px var(--font-sans); color: #5d6474; }
.rg-toggle { width: 36px; height: 20px; border-radius: 24px; background: var(--blue-60, #0073fa); position: relative; flex: none; cursor: pointer; transition: background 0.15s; }
.rg-toggle.off { background: #caced8; }
.rg-toggle-knob { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--white); transition: left 0.15s, right 0.15s; }
.rg-toggle.off .rg-toggle-knob { right: auto; left: 2px; }

/* 키워드 칩 */
.rg-tag {
  display: inline-flex; align-items: center; gap: 4px;
  height: 28px; padding: 0 6px 0 10px; border-radius: 6px;
  background: var(--alpha-blue-10); color: var(--blue-70, #0061db);
  font: 500 13px/20px var(--font-sans);
}
.rg-tag-del {
  border: 0; background: transparent; cursor: pointer;
  width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center;
  color: var(--blue-70, #0061db); font-size: 14px; line-height: 1;
}

/* 저장/취소 토스트 */
.rg-toast {
  position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%);
  z-index: 50; padding: 12px 20px; border-radius: 8px;
  background: rgba(25, 31, 40, 0.92); color: var(--white);
  font: 500 14px/22px var(--font-sans);
  box-shadow: var(--shadow-toast);
}


/* styles/connectAdminNonpayAug.css */
/* =============================================================
   진료항목 정보 기반 카카오 노출 (ti-kakao) — 신규 버전 전용 CSS
   폼/미리보기 기본 룩은 connectRegister.css(rg-*) 재사용.
   여기서는 목록·카카오 노출 섹션·라이브 미리보기 확장·검증만 담는다. (tk-*)
   ============================================================= */

.tk-main { position: relative; }

/* ============================ 프레임 제거: 실제 앱처럼 브라우저 전체 사용 ============================
   connectShell의 모의 OS 창(회색 배경 + 가운데 정렬된 1280×832 둥근 카드 + 타이틀바)을 걷어내고
   사이드바+본문이 뷰포트 전체를 채우게 한다. (connectTiKakao가 connectShell보다 나중 로드 → 오버라이드) */
.cn-artboard { display: block; padding: 0; background: var(--white); min-height: 100vh; }
.cn-screen { width: 100%; min-height: 100vh; border-radius: 0; box-shadow: none; overflow: visible; }
.cn-titlebar { display: none; }
.cn-body { flex: 1; min-height: 0; }
/* 좌측 LNB를 세로 스크롤과 무관히 고정 (뷰포트 상단 스티키, 전체 높이) */
.cn-nav { position: sticky; top: 0; align-self: flex-start; height: 100vh; }

/* 콘텐츠 최대 너비 1024 (실제 PageTemplate innerContainer max-width) — 좌우 64px 패딩 포함 1152, 본문 좌측 정렬.
   .cn-main(flex column)의 컨텐츠 블록을 캡해 넓은 화면에서 무한정 늘어나지 않게 한다. */
.cn-main .cn-header,
.cn-main .tk-list-body,
.cn-main .rg-container,
.cn-main .ap-body,
.cn-main .set-body { max-width: 1152px; }

/* ---- 공통 버튼 ---- */
.tk-btn-primary {
  height: 40px; padding: 0 16px; border: 0; border-radius: 6px;
  background: var(--blue-60); color: #fff; cursor: pointer;
  font: 700 14px/40px var(--font-sans); display: inline-flex; align-items: center; gap: 6px;
}
.tk-btn-primary svg { width: 16px; height: 16px; }
.tk-btn-primary:hover { background: var(--blue-70); }

.tk-back {
  display: inline-flex; align-items: center; gap: 2px; border: 0; background: none;
  font: 500 13px/18px var(--font-sans); color: #808799; cursor: pointer; padding: 0; margin-bottom: 10px;
}
.tk-back svg { width: 18px; height: 18px; }
.tk-back:hover { color: #31353f; }

/* ============================ 목록 (실제 TreatmentItemsView 재현) ============================ */
.tk-list-header { display: flex; align-items: flex-end; justify-content: space-between; }
.tk-list-sub { font: 400 14px/22px var(--font-sans); color: var(--gray-60); margin-top: 6px; }
.tk-form-header { padding-top: 28px; }
.tk-list-body { padding: 0 64px 64px; }

/* 2단 그리드 */
.tk-grid {
  display: grid;
  grid-template:
    'chead ihead' 56px
    'clist ilist' 1fr
    / 200px minmax(0, 1fr);
  min-height: 420px;
  background: var(--white);
  border: 1px solid var(--gray-30);
  border-radius: 8px;
}
.tk-grid-chead { grid-area: chead; padding: 16px 24px; border-right: 1px solid var(--gray-30); border-bottom: 1px solid var(--gray-30); display: flex; align-items: center; }
.tk-grid-ihead { grid-area: ihead; padding: 16px 24px; border-bottom: 1px solid var(--gray-30); display: flex; align-items: center; }
.tk-grid-title { font: 700 16px/24px var(--font-sans); color: var(--gray-100); }
.tk-grid-clist { grid-area: clist; border-right: 1px solid var(--gray-30); padding-bottom: 48px; }
.tk-grid-ilist { grid-area: ilist; padding: 8px 0; }

/* 좌측 카테고리 항목 */
.tk-cat {
  position: relative; display: flex; align-items: center;
  width: 100%; height: 48px; padding: 0 16px 0 0;
  text-align: left; cursor: pointer; background: var(--white); border: 0;
}
.tk-cat::after { content: ''; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: transparent; pointer-events: none; }
.tk-cat:hover { background: var(--gray-15); }
.tk-cat:hover .tk-cat-handle { opacity: 1; }
.tk-cat.sel { background: var(--alpha-blue-05); }
.tk-cat.sel::after { background: var(--blue-60); }
.tk-cat-handle { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 24px; height: 100%; color: var(--gray-60); opacity: 0; cursor: grab; transition: opacity .12s; }
.tk-cat-handle svg { width: 6px; height: 10px; }
.tk-cat-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 16px/24px var(--font-sans); color: var(--gray-90); }
.tk-cat.sel .tk-cat-name { font-weight: 600; color: var(--blue-70); }
.tk-cat-count { flex: none; font: 500 12px/16px var(--font-sans); color: var(--gray-60); }
.tk-cat.sel .tk-cat-count { font-weight: 700; color: var(--blue-60); }

/* master2 그룹 (Level2) */
.tk-l2 { display: flex; flex-direction: column; width: 100%; }
.tk-l2-head { display: flex; align-items: center; height: 32px; }
.tk-l2-head .tk-cat-handle { pointer-events: none; }
.tk-l2-head:hover .tk-cat-handle { opacity: 1; } /* 2뎁스 그룹 핸들 hover 노출 */
.tk-l2-name { font: 500 14px/22px var(--font-sans); color: var(--gray-70); }
.tk-l2-body { display: flex; flex-direction: column; }
.tk-l2-pad { height: 16px; }

/* 항목 행 (Level3) */
.tk-l3 { display: flex; align-items: center; width: 100%; height: 48px; border: 1px solid transparent; }
.tk-l3:hover { background: var(--gray-10); }
.tk-l3.dragging { border-color: var(--gray-50); border-radius: 8px; box-shadow: 0 2px 1px rgba(22,24,29,.02), 0 2px 8px rgba(22,24,29,.1); } /* 실제 [data-dragging] */
.tk-l3:hover .tk-l3-handle, .tk-l3:hover .tk-l3-del { opacity: 1; pointer-events: auto; } /* 3뎁스 항목 핸들 hover 노출 */
.tk-l3-handle { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 24px; height: 100%; color: var(--gray-60); opacity: 0; cursor: grab; transition: opacity .12s; }
.tk-l3-handle svg { width: 6px; height: 10px; }
.tk-l3-detail { display: flex; flex: 1; align-items: center; min-width: 0; height: 100%; text-align: left; cursor: pointer; background: none; border: 0; }
.tk-l3-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 16px/24px var(--font-sans); color: var(--gray-90); }
.tk-l3-price { display: inline-flex; flex: none; align-items: center; gap: 8px; padding-left: 2px; }
.tk-l3-price-text { font: 500 14px/21px var(--font-sans); color: var(--gray-90); }
.tk-l3-optcount { display: inline-flex; align-items: center; justify-content: center; padding: 2px 6px; border-radius: 3px; background: var(--alpha-gray-10); color: var(--gray-80); font: 500 12px/18px var(--font-sans); }
.tk-l3-thumb { position: relative; display: inline-flex; flex: none; align-items: center; justify-content: center; width: 36px; height: 36px; margin: 0 16px; border-radius: 6px; overflow: hidden; }
.tk-l3-thumb svg { width: 36px; height: 36px; }
.tk-l3-thumb-img { width: 36px; height: 36px; border-radius: 6px; background: linear-gradient(135deg, #dbeafe, #cfe0ff); box-shadow: inset 0 0 0 1px var(--alpha-gray-20); } /* 실제 :has(img)::after 테두리 */
.tk-l3-visible { flex: none; font: 600 14px/21px var(--font-sans); color: var(--gray-60); padding-right: 8px; }
.tk-l3-visible.on { color: var(--blue-70); }
.tk-l3 .rg-toggle { flex: none; margin-right: 4px; cursor: pointer; }
.tk-l3-del { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 36px; border: 0; background: transparent; cursor: pointer; color: var(--gray-60); opacity: 0; pointer-events: none; transition: opacity .12s; }
.tk-l3-del svg { width: 16px; height: 16px; }

/* 인입 채널 표기 — 굿닥/카카오 사각 뱃지 심볼 (Figma 진료항목_소분류_카카오추가 기준) */
.tk-chans { display: inline-flex; flex: none; align-items: center; gap: 4px; margin-right: 16px; } /* 실제 channelSlot: margin-right 16 */
.tk-chan { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 4px; overflow: hidden; }
.tk-chan svg { display: block; }
.tk-chan-gd { background: #0073fa; } /* 굿닥: 파란 사각 + 흰 글리프 */
.tk-chan-gd svg { height: 12px; width: auto; }
.tk-chan-kko svg { width: 18px; height: 18px; } /* 카카오: 노란 사각(심볼 자체가 배경) */
.tk-chan.dim { filter: grayscale(1); opacity: 0.3; } /* 미노출: 흐린 회색 */

/* ============================ 폼: 카카오 노출 섹션 ============================ */
/* 외부 플랫폼 정보 — Figma(node 12591:14445, 558px wide) 기준 */
.tk-platform-section { display: flex; flex-direction: column; align-items: stretch; gap: 20px; padding-top: 12px; }
.tk-platform-title { margin: 0; font: 700 18px/26px var(--font-sans); color: #16181d; }
.tk-kcard { padding: 0; overflow: hidden; border-color: #e3e6ed; gap: 0; }
.tk-khead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 24px; }
.tk-khead-left { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }
.tk-khead-text { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; } /* 좁아져도 텍스트가 정상 줄바꿈되도록 (0폭 붕괴 방지) */
.tk-khead-badge { width: 40px; height: 40px; flex: none; display: inline-flex; align-items: center; justify-content: center; } /* 실제: svg 하나가 40px를 꽉 채움(노란 사각이 곧 아이콘) */
.tk-khead-badge svg { width: 100%; height: 100%; display: block; }
.tk-khead-title { font: 600 16px/24px var(--font-sans); color: #16181d; word-break: keep-all; }
.tk-khead-desc { font: 400 14px/22px var(--font-sans); color: #5d6474; }
.tk-khead-right { display: inline-flex; align-items: center; gap: 10px; flex: none; }
.tk-khead-status { width: 85px; flex: none; text-align: right; font: 600 14px/22px var(--font-sans); color: #808799; }
.tk-khead-status.on { color: #066ae5; }
/* 카카오 전용 정보 — Figma: 이용 방법 144px, 유의사항·취소 유의사항 40px */
.tk-ktextarea { min-height: 142px; height: 142px; }
.tk-kdependency { margin: 0 24px 20px; display: flex; gap: 8px; align-items: flex-start; background: rgba(247,144,9,.08); border: 1px solid rgba(247,144,9,.28); border-radius: 8px; padding: 11px 13px; font: 500 13px/20px var(--font-sans); color: var(--orange-60); }
.tk-kdependency svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.rg-toggle.disabled { opacity: .4; cursor: not-allowed; }

/* 본문 — 헤더 밑 라인 없음, 항목 간 gap 24, 하단 24 */
.tk-kbody { padding: 0 24px 24px; display: flex; flex-direction: column; gap: 24px; }
/* 굿닥 노출 선행조건 안내 — Figma red guide banner */
.tk-kpolicy-alert {
  display: flex; align-items: center; gap: 8px; min-height: 54px; padding: 0 16px;
  border: 1px solid var(--alpha-red-10); border-radius: 8px; background: var(--alpha-red-05);
  color: var(--red-70); font: 600 14px/21px var(--font-sans);
}
.tk-kpolicy-alert-ic { display: inline-flex; width: 20px; height: 20px; flex: none; }
.tk-kpolicy-alert-ic svg { width: 20px; height: 20px; }
/* 구형 회색 안내 배너 — 다른 시나리오 호환 */
.tk-kauto {
  display: flex; gap: 8px; align-items: center; min-height: 54px;
  background: rgba(128,135,153,.05); border: 1px solid rgba(128,135,153,.1); border-radius: 8px;
  padding: 0 20px 0 16px;
}
.tk-kauto b { color: var(--blue-70); font-weight: 600; }
.tk-kauto-ic { flex: none; width: 20px; height: 20px; display: inline-flex; color: var(--gray-60); }
.tk-kauto-ic svg { width: 20px; height: 20px; }
.tk-kauto-txt { flex: 1; min-width: 0; font: 600 14px/21px var(--font-sans); color: var(--gray-80); } /* 텍스트를 한 문장으로 흐르게 */

/* 노출 캐스케이드 안내 (굿닥 노출 OFF → 카카오도 노출 안 됨) */
.tk-kcascade { display: flex; gap: 8px; align-items: flex-start; background: rgba(247,144,9,.08); border: 1px solid rgba(247,144,9,.28); border-radius: 8px; padding: 11px 13px; font: 500 13px/20px var(--font-sans); color: var(--orange-60); }
.tk-kcascade svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }

.tk-price-row .rg-price-fields { gap: 6px; }
/* 드래그 핸들: 실제 서비스(IconHandler) 크기 6×10로 (register 기본 8×12 override) */
.tk-price-row .rg-drag svg { width: 6px; height: 10px; }

/* 카카오 전용 정보 */
.tk-kextra { display: flex; flex-direction: column; gap: 24px; }
.tk-kdivider { width: 100%; height: 1px; background: #f2f4f7; } /* Figma node 1:947 — 예약 시 받을 정보 ↔ 이용 방법 사이 구분선 */
.tk-kfield { display: flex; flex-direction: column; gap: 8px; }
.tk-kextra > .tk-kfield:first-child { gap: 16px; }
.tk-kfield .rg-counter { margin-top: 0; }
.tk-klabel { font: 600 16px/24px var(--font-sans); color: #434956; } /* Figma body/1_600 · Gray/80 (하위 필드 타이틀) */
.tk-klabel-count { font: 500 13px/22px var(--font-sans); color: var(--gray-50); margin-left: 4px; }
.tk-q-row { display: flex; align-items: center; gap: 8px; }
.tk-q-row .rg-input { flex: 1; }
.tk-q-opt { flex: none; width: 64px; height: 40px; padding: 0; border: 1px solid rgba(128,135,153,.2); border-radius: 6px; background: #fff; cursor: pointer; font: 600 14px/38px var(--font-sans); color: #5d6474; text-align: center; }
.tk-q-opt.req { border-color: var(--blue-60); color: var(--blue-60); background: var(--alpha-blue-05); }
.tk-add-sm { align-self: flex-start; height: 36px; padding: 0 12px; border: 0; border-radius: 6px; background: var(--alpha-blue-10); color: var(--blue-60); font: 600 13px/36px var(--font-sans); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.tk-add-sm svg { width: 15px; height: 15px; }
.tk-add-sm:disabled { background: var(--gray-10); color: var(--gray-40); cursor: not-allowed; }
.tk-add-count { font-weight: 500; opacity: .8; }

/* 부가정보(질문) 3종: 주관식 / 단수 선택형 / 복수 선택형 */
.tk-q-item { display: flex; flex-direction: column; gap: 10px; padding: 0 20px; border: 1px solid var(--gray-30); border-radius: 8px; background: #fff; transition: border-color .12s; } /* Figma Container(node 9:2129): px-20, 상하 패딩 0(핸들 py-10·하단바 py-8이 세로여백 담당), gap-10 */
.tk-q-item:hover { border-color: var(--gray-50); }
/* Figma DND(node 9:3009): gray-50 테두리 + 그림자 (핑크 오버레이·반투명 없음). 핸들 press 시에도 즉시 체감되도록 :active 포함 */
.tk-q-item.dragging,
.tk-q-item:has(.tk-q-drag:active) { border-color: var(--gray-50); box-shadow: 0 2px 0.5px rgba(22,24,29,.02), 0 2px 4px rgba(22,24,29,.1); }
/* 상단 중앙 드래그 핸들 (네이버 폼 참고) */
.tk-q-drag { align-self: stretch; padding: 10px 0; display: flex; align-items: center; justify-content: center; color: var(--gray-40); cursor: grab; }
.tk-q-drag svg { width: 6px; height: 10px; transform: rotate(90deg); }
.tk-q-item:hover .tk-q-drag, .tk-q-item.dragging .tk-q-drag, .tk-q-drag:active { color: var(--gray-70); } /* Figma: hover·DND(press) 시 핸들 gray-40 → gray-70 */
.tk-q-item.dragging .tk-q-drag, .tk-q-drag:active { cursor: grabbing; }
/* 유형 드롭다운(객관식/주관식) */
.tk-q-typesel { align-self: flex-start; }
.tk-q-typebtn { width: 200px; }
.tk-q-typesel .rg-select-menu { min-width: 200px; }
/* 질문 입력 행 (답변 필수 시 * 표시) */
.tk-q-namefield { display: flex; flex-direction: column; gap: 4px; } /* Figma: 질문 입력 + 에러 문구 묶음(gap-4) */
.tk-q-qrow { display: flex; align-items: center; gap: 6px; }
/* 카드 내 유효성 문구 — Figma Error(node 9:2174): red-60 12/18, 해당 필드 바로 아래. 입력 테두리는 red-70 */
.tk-q-err { margin: 0; font: 500 12px/18px var(--font-sans); color: var(--red-60); }
.tk-q-item .rg-input.error { border-color: var(--red-70); }
.tk-q-qrow .rg-input { flex: 1; }
/* 하단 바: 답변 필수 / 복수 선택 토글 + 삭제 */
.tk-q-bar { display: flex; align-items: center; gap: 20px; padding: 8px 0; border-top: 1px solid var(--gray-20); } /* Figma 하단바(node 9:2159): border-t #f2f4f7 + py-8 */
.tk-q-switch { display: inline-flex; align-items: center; gap: 8px; font: 600 13px/20px var(--font-sans); color: var(--gray-80); cursor: pointer; white-space: nowrap; }
.tk-q-bar-spacer { flex: 1; }
/* 질문 추가 버튼 — Figma(node 1:892): 풀폭·높이40·패딩20·gap6·14px·가운데정렬 (tk-add-sm 오버라이드) */
.tk-q-addbtn { align-self: stretch; width: 100%; height: 40px; padding: 0 20px; gap: 6px; justify-content: center; font: 600 14px/22px var(--font-sans); }
.tk-q-addbtn svg { width: 18px; height: 18px; }
.tk-q-limit { color: var(--gray-70); font: 600 13px/20px var(--font-sans); }
.tk-q-choice { display: flex; flex-direction: column; gap: 8px; padding-left: 0; }
.tk-q-opts { display: flex; flex-direction: column; gap: 6px; }
/* 오류 문구가 붙어 행 높이가 늘어나도 마커·삭제 버튼은 입력칸(40px) 기준선에 맞춘다 */
.tk-q-optrow { display: flex; align-items: flex-start; gap: 8px; }
.tk-q-optrow > .tk-q-optmark { margin-top: 11px; } /* (입력 40 - 마커 18) / 2 */
.tk-q-optrow .rg-input { flex: 1; }
.tk-q-optfield { flex: 1; display: flex; flex-direction: column; gap: 4px; }
/* 세로 flex 래퍼 안에서는 .tk-q-optrow .rg-input의 flex:1이 '높이축'에 걸려 입력 높이가 찌그러진다 → 해제 */
.tk-q-optfield > .rg-input { flex: 0 0 auto; }
.tk-q-optfield .tk-q-err { padding-left: 2px; }
.tk-q-optmark { flex: none; width: 18px; height: 18px; border: 1.5px solid var(--gray-40); background: #fff; }
.tk-q-optmark.radio { border-radius: 50%; }
.tk-q-optmark.select { border-radius: 4px; }
.tk-add-xs { align-self: flex-start; height: 36px; padding: 0 16px; border: 0; border-radius: 4px; background: none; color: #5d6474; font: 600 13px/36px var(--font-sans); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tk-add-xs:hover { background: var(--gray-10); }
.tk-add-xs svg { width: 16px; height: 16px; }
/* 질문 행 삭제 아이콘: Figma 40×40 아이콘 버튼(18px) */
.tk-q-row .rg-price-del svg, .tk-q-optrow .rg-price-del svg { width: 18px; height: 18px; }
.tk-q-add { display: flex; flex-wrap: wrap; gap: 6px; }
.rg-price-del:disabled { opacity: .35; cursor: not-allowed; }

/* 대표 사진 썸네일 */
.tk-thumb {
  width: 96px; height: 96px; border-radius: 6px; position: relative;
  background: linear-gradient(135deg, #dbeafe, #cfe0ff);

.tk-pv-hero.has { background: linear-gradient(135deg, #dbeafe, #cfe0ff); color: #5d6474; }

.tk-pv-detail-imgs { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.tk-pv-detail-img { height: 140px; border-radius: 8px; background: linear-gradient(135deg, #dbeafe, #cfe0ff); display: flex; align-items: center; justify-content: center; font: 500 12px/17px var(--font-sans); color: #5d6474; }
.tk-pv-price-head { font: 700 16px/24px var(--font-sans); color: #31353f; margin-bottom: 4px; }
.tk-pv-price-row { min-height: 46px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #f6f7f9; }
.tk-pv-price-row:last-child { border-bottom: 0; }
.tk-pv-price-name { font: 500 14px/21px var(--font-sans); color: #31353f; }
.tk-pv-price-name.ph { color: #a8aebd; }

/* =============================================================
   [KAK-001] 카카오 유입 예약 자동 확정 예외 안내 (확정 전)
   설정 → 진료항목 상세 → 예약 신청 내역 세 지점에서 같은 정책을 안내한다.
   톤: 오류가 아닌 '주의 사항'이라 negative(red)가 아니라 info(blue).
   ============================================================= */

/* ① 운영 설정 — 설정 항목 자체의 적용 범위. 기본 설명 아래 줄로 붙는다(자동 확정 ON일 때만) */
.set-box-scope { display: block; margin-top: 2px; font: 600 14px/1.5 var(--font-sans); color: var(--blue-70); }

/* 수동 확정일 때만 노출하는 안내 블록 — 설정 박스 '안'에 들어간다.
   톤은 오류(red)가 아닌 주의(caution/orange). 닫기 버튼 없음. */
.set-notice {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 16px 20px;
  background: rgba(242, 102, 0, 0.05); border: 1px solid rgba(242, 102, 0, 0.16); border-radius: 8px;
}
.set-notice-ic { width: 20px; height: 20px; flex: none; margin-top: 1px; color: #f26600; display: inline-flex; }
.set-notice-ic svg { width: 20px; height: 20px; display: block; }
.set-notice-body { flex: 1; min-width: 0; }
.set-notice-title { margin: 0; font: 600 14px/22px var(--font-sans); color: #f26600; word-break: keep-all; }
.set-notice-list { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.set-notice-list li {
  position: relative; padding-left: 11px;
  font: 400 13px/20px var(--font-sans); color: var(--gray-80); word-break: keep-all;
}
.set-notice-list li::before {
  content: ''; position: absolute; left: 2px; top: 8px;
  width: 3px; height: 3px; border-radius: 50%; background: var(--gray-50);
}

/* 전환 확인 모달의 진행 버튼 (파괴적 동작이 아니므로 danger 아닌 solid blue) */
.set-modal-confirm {
  height: 44px; padding: 0 20px; border: 0; border-radius: 10px;
  background: var(--blue-60); color: #fff; cursor: pointer; font: 700 14px/44px var(--font-sans);
}
.set-modal-confirm:hover { background: var(--blue-70); }

/* ② 진료항목 상세 — 카카오 토글 설명 아래 한 줄 */
/* 안내가 붙어 텍스트 블록이 길어지면 채널 뱃지를 제목 줄에 맞춘다(가운데 정렬 시 뱃지가 본문 중간에 뜬다) */
.tk-khead-left:has(.tk-khead-note) { align-items: flex-start; }
.tk-khead-left:has(.tk-khead-note) .tk-khead-badge { margin-top: 2px; }
.tk-khead-note {
  margin-top: 4px;
  font: 600 13px/20px var(--font-sans); color: var(--blue-70); word-break: keep-all;
}


/* =============================================================
   예약 신청 내역 — staging 현행화 (apx-*)
   출처: receipt-web@origin/staging(c9252443)
   타이포 스케일(line-height 1.5 고정):
     heading4 20/30 · heading5 18/27 · body1 16/24 · body2 14/21
     caption1 13/19.5 · caption2 12/18 · caption3 10/15
   ============================================================= */

/* ---- 탭: 카운트 배지 없음, heading5_700(활성)/heading5_500 ---- */
.apx-tabs { display: flex; gap: 24px; align-items: center; }
.apx-tab {
  padding: 4px 0; border: 0; background: none; cursor: pointer;
  font: 500 18px/27px var(--font-sans); color: var(--gray-50);
}

/* ---- 검색 입력 에러 ---- */
.apx-search-field { display: flex; flex-direction: column; gap: 4px; }

.apx-search-error { margin: 0; font: 400 12px/18px var(--font-sans); color: var(--red-60); }

/* ---- 채널 뱃지 (실제 ChannelBadge와 동일 수치) ---- */
.apx-chan { display: inline-flex; flex: none; gap: 6px; align-items: center; }
.apx-chan-badge {
  display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center;
  width: 18px; height: 18px; overflow: hidden; border-radius: 4px;
}
.apx-chan-badge svg { display: block; }
.apx-chan-badge.goodoc { background: #0073fa; }
.apx-chan-badge.goodoc svg { width: auto; height: 12px; }
.apx-chan-badge.kakao svg { width: 18px; height: 18px; }
.apx-chan-label { font: 500 14px/21px var(--font-sans); color: var(--gray-80); }

/* ---- 상태 태그 (실제 Tag medium) ---- */
.apx-tag {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 48px; padding: 2px 6px; border-radius: 3px; white-space: nowrap;
  font: 500 12px/18px var(--font-sans);
}
.apx-tag.blue { color: var(--blue-80); background: var(--alpha-blue-10); }
.apx-tag.gray { color: var(--gray-80); background: var(--alpha-gray-10); }
.apx-tag.orange { color: #e25e00; background: rgb(226 94 0 / 8%); }
.apx-tag.green { color: #008a55; background: rgb(0 153 110 / 8%); }
.apx-tag.red { color: var(--red-70); background: rgb(236 56 71 / 8%); }

/* ---- 테이블: 실제 컬럼 폭(px) 그대로. 채널 열 84px가 첫 열로 붙는다 ---- */
.apx-table-scroll { overflow-x: auto; border: 1px solid var(--gray-30); border-radius: 8px; }
.apx-table { width: 886px; }
.apx-table.has-channel { width: 970px; }
.apx-tr {
  display: grid;
  grid-template-columns: 86px 180px 190px 131px 131px minmax(0, 1fr);
  align-items: center;
}
.apx-table.has-channel .apx-tr {
  grid-template-columns: 84px 86px 180px 190px 131px 131px minmax(0, 1fr);
}
.apx-tr > span { padding: 0 12px; min-width: 0; }
.apx-tr > span:first-child { padding-left: 20px; }
/* 채널·상태 컬럼 가운데 정렬 (헤더·셀 동일) */
.apx-tr > span[data-key='channel'],
.apx-tr > span[data-key='status'] { text-align: center; }
.apx-th {
  position: sticky; top: 0; z-index: 2;
  min-height: 44px; background: var(--white); border-bottom: 1px solid var(--gray-30);
  font: 600 13px/19.5px var(--font-sans); color: var(--gray-60);
}
.apx-row {
  position: relative; min-height: 64px; padding: 12px 0;
  border-bottom: 1px solid var(--gray-20); cursor: pointer;
}
.apx-row:last-child { border-bottom: 0; }
.apx-row:hover { background: var(--gray-10); }
.apx-2line { display: flex; flex-direction: column; min-width: 0; }
.apx-2line-p { font: 400 14px/21px var(--font-sans); color: var(--gray-90); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.apx-2line-s { font: 400 12px/18px var(--font-sans); color: var(--gray-60); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.apx-memo {
  font: 400 13px/19.5px var(--font-sans); color: var(--gray-90);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
/* 퀵 액션: hover 시에만 노출, 행 우측에 붙고 좌측 40px 페이드 (실제 RowQuickActions) */
.apx-row-actions {
  position: absolute; inset: 0 0 0 auto;
  display: flex; gap: 6px; align-items: center;
  padding-right: 20px; padding-left: 40px; white-space: nowrap;

  visibility: hidden;

.apx-qa-btn {
  height: 28px; padding: 0 10px; border: 0; border-radius: 6px; cursor: pointer;
  font: 600 13px/28px var(--font-sans);

.apx-qa-btn.primary { background: var(--alpha-blue-10); color: var(--blue-70); }

.apx-qa-btn.danger:hover { background: var(--alpha-red-15); }

.apx-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 60px 0; }
.apx-empty-ic { width: 32px; height: 32px; color: var(--gray-50); display: inline-flex; }

.apx-empty-msg { font: 400 16px/24px var(--font-sans); color: var(--gray-60); }

.apx-page { min-width: 28px; height: 28px; border: 0; border-radius: 6px; background: none; cursor: pointer; font: 500 13px/28px var(--font-sans); color: var(--gray-70); }

/* ---- 상세 모달: 섹션·카드·필드 (실제 ui/Section·ui/Field) ---- */
.apx-sections { display: flex; flex-direction: column; gap: 24px; }

.apx-field-label { font: 400 14px/21px var(--font-sans); color: var(--gray-60); }
.apx-field-val { font: 500 14px/21px var(--font-sans); color: var(--gray-90); overflow-wrap: break-word; }
.apx-birth { display: inline-flex; align-items: center; gap: 5px; }

.apx-rsv-head { display: flex; align-items: center; justify-content: space-between; }

.apx-rsv-main { font: 600 16px/24px var(--font-sans); color: var(--gray-90); }
.apx-rsv-sub { font: 400 12px/18px var(--font-sans); color: var(--gray-60); }

/* 요청사항 */
.apx-memo-box { max-width: 358px; font: 500 14px/21px var(--font-sans); color: var(--gray-90); white-space: pre-wrap; overflow-wrap: break-word; }

/* 카카오 추가 질문·답변 — 질문 1건 = 카드 1개 */
.apx-qa-list { display: flex; flex-direction: column; gap: 12px; }
.apx-qa-card { display: flex; flex-direction: column; gap: 8px; padding: 16px 20px; border: 1px solid var(--gray-30); border-radius: 8px; }
.apx-qa-row { display: flex; align-items: flex-start; gap: 8px; }
.apx-qa-mark {
  display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 5px; font: 700 12px/18px var(--font-sans);
}
.apx-qa-mark.q { background: var(--alpha-gray-10); color: var(--gray-60); }
.apx-qa-mark.a { background: var(--alpha-blue-10); color: #479dff; }
.apx-qa-q { flex: 1; min-width: 0; font: 400 14px/21px var(--font-sans); color: var(--gray-70); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.apx-qa-a { flex: 1; min-width: 0; font: 500 14px/21px var(--font-sans); color: var(--gray-80); white-space: pre-wrap; overflow-wrap: break-word; }

/* 진료 정보 */
.apx-treat { display: flex; flex-direction: column; gap: 12px; padding: 20px 20px 16px; }
.apx-treat-top { display: flex; justify-content: space-between; gap: 12px; }
.apx-treat-name { display: flex; flex-direction: column; min-width: 0; }
.apx-treat-tag { align-self: flex-start; padding: 1px 3px; border-radius: 3px; background: var(--gray-20); font: 500 10px/15px var(--font-sans); color: var(--gray-60); }
.apx-treat-title { margin: 4px 0 0; font: 500 16px/24px var(--font-sans); color: var(--gray-90); }
.apx-treat-desc { margin: 2px 0 8px; font: 400 12px/18px var(--font-sans); color: var(--gray-60); }
.apx-treat-thumb { flex-shrink: 0; width: 72px; height: 72px; object-fit: cover; border-radius: 4px; }
.apx-price-list { display: flex; flex-direction: column; gap: 4px; }
.apx-price-row { display: flex; justify-content: space-between; gap: 8px; }
.apx-price-name { font: 400 14px/21px var(--font-sans); color: var(--gray-70); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.apx-price-val { flex-shrink: 0; white-space: nowrap; font: 600 14px/21px var(--font-sans); color: var(--gray-90); }
.apx-divider { border-top: 1px solid var(--gray-20); }
.apx-total-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.apx-total-label { font: 500 16px/24px var(--font-sans); color: var(--gray-90); }
.apx-total-val { font: 600 18px/27px var(--font-sans); color: var(--gray-90); }
.apx-treat-footer { font: 400 13px/19.5px var(--font-sans); color: var(--gray-60); }

/* 상세 푸터 버튼 — 좌: 예약 취소 / 우: 닫기 + 확정·완료 */
.apx-detail-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 24px; }
.apx-detail-actions-left,
.apx-detail-actions-right { display: flex; gap: 8px; }
.apx-btn { height: 44px; padding: 0 20px; border: 0; border-radius: 10px; cursor: pointer; font: 700 14px/44px var(--font-sans); }
.apx-btn.primary { background: var(--blue-60); color: var(--white); }
.apx-btn.primary:hover { background: var(--blue-70); }
.apx-btn.secondary { background: var(--alpha-gray-10); color: var(--gray-80); }
.apx-btn.secondary:hover { background: var(--alpha-gray-15); }
.apx-btn.danger-smooth { background: var(--alpha-red-10); color: var(--red-70); }
.apx-btn.danger-smooth:hover { background: var(--alpha-red-15); }

/* =============================================================
   모달 버튼 규격 — 피그마 18510:890356 + 실제 Button(size="small")
     min-width 64 · height 40 · padding 9/22 · radius 6 · 700 14/21 · gap 8 · 우측 정렬
   styleType 매핑
     secondarySmooth  취소·닫기      GRAY_70          / ALPHA_GRAY_10  (hover 15)
     primarySolid     확정·저장      WHITE            / BLUE_60        (hover BLUE_70)
     dangerSolid      취소·중지 확정  WHITE            / RED_60         (hover RED_70)
     dangerSmooth     예약 취소      RED_60           / ALPHA_RED_10   (hover 15)
   ※ connectRegister.css는 ti-kakao(7월 기준선)와 공유하므로 수정하지 않고 여기서 덮는다.
   ※ 샌드박스 --gray-70(#6B7684)·--blue-70(#0061DB)이 실제 값과 달라 이 블록만 실제 값을 직접 쓴다.
      (실제 GRAY_70 #5D6474 · BLUE_70 #056BE1 — 피그마 Gray/70도 #5D6474)
   ============================================================= */
.rg-btn-cancel,
.rg-btn-save,
.set-modal-confirm,
.set-modal-danger,
.ap-btn-cancel-confirm,
.apx-btn {
  box-sizing: border-box;
  display: inline-flex; align-items: center; justify-content: center;
  width: auto; min-width: 64px; height: 40px; padding: 9px 22px;
  border: 0; border-radius: 6px; cursor: pointer;
  font: 700 14px/21px var(--font-sans); white-space: nowrap;
}

/* secondarySmooth — 취소 · 닫기 */
.rg-btn-cancel,
.apx-btn.secondary { background: var(--alpha-gray-10); color: #5d6474; }
.rg-btn-cancel:hover,
.apx-btn.secondary:hover { background: var(--alpha-gray-15); }

/* primarySolid — 확정 · 저장 */
.rg-btn-save,
.set-modal-confirm,
.apx-btn.primary { background: var(--blue-60); color: var(--white); }
.rg-btn-save:hover,
.set-modal-confirm:hover,
.apx-btn.primary:hover { background: #056be1; }

/* dangerSolid — 예약 취소 확정 · 예약 그만 받기 */
.set-modal-danger,
.ap-btn-cancel-confirm { background: var(--red-60); color: var(--white); }
.set-modal-danger:hover,
.ap-btn-cancel-confirm:hover { background: var(--red-70); }

/* dangerSmooth — 상세 모달의 예약 취소 */
.apx-btn.danger-smooth { background: var(--alpha-red-10); color: var(--red-60); }
.apx-btn.danger-smooth:hover { background: var(--alpha-red-15); }

/* disabled(solid) */
.ap-btn-cancel-confirm:disabled,
.rg-btn-save:disabled {
  background: var(--alpha-gray-05); color: var(--alpha-gray-40); cursor: not-allowed;
}

/* ---------- 분류 선택 모달 ----------
 * 폭·높이를 고정한다. 모드(좌우/트리/단계)나 목록 길이에 따라 모달이 늘었다 줄었다 하면
 * 형태 비교가 어렵고, 단계형에서 대분류(15개) → 중분류(1~12개)로 넘어갈 때 화면이 튄다.
 * 내용이 짧으면 아래가 비는데, 그 여백은 하단 바로 마감한다. */
.tc-modal {
  width: 680px;
  max-width: calc(100vw - 48px);
  height: 620px;
  max-height: calc(100vh - 96px);
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
}

  flex-shrink: 0;
  padding: 12px 18px;
  border-top: 1px solid #f2f4f7;
  background: #f9f9fb;
}

.tc-modal-foot-cur {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12.5px;
  color: #808799;
}

.tc-modal-foot-cur b {
  color: #16181d;
  font-weight: 700;
}

.tc-modal-foot-cur.none {
  color: #f26600;
}

.tc-modal-foot-btn {
  flex-shrink: 0;
  height: 36px;
  padding: 0 18px;
  border: 1px solid #e3e6ed;
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: #434956;
}

.tc-modal-foot-btn:hover {
  border-color: #a8aebd;
}

/* ---------- 단계형 중분류 행 (소분류 힌트 포함 2줄) ---------- */
.tc-pick-2line {
  align-items: flex-start;
}

.tc-pick-main {
  display: block;
  flex: 1;
  min-width: 0;
}

.tc-pick-name {
  display: block;
  font-size: 14px;
}

## \uD604\uC7AC \uD504\uB85C\uD1A0\uD0C0\uC785 \uBC18\uC601 \uAE30\uC900

- \uC9C4\uB8CC\uD56D\uBAA9 \uBAA9\uB85D\uC5D0\uC11C \uAD7F\uB2E5\uACFC \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30\uC758 \uB178\uCD9C \uC0C1\uD0DC\uB97C \uD568\uAED8 \uD655\uC778\uD569\uB2C8\uB2E4. \uBAA9\uB85D\uC758 \uCC44\uB110 \uC2EC\uBCFC\uC740 \uC77D\uAE30 \uC804\uC6A9 \uD604\uD669\uC774\uBA70 \uCE74\uCE74\uC624 \uB178\uCD9C \uC124\uC815\uC740 \uC0C1\uC138\uC5D0\uC11C \uBCC0\uACBD\uD569\uB2C8\uB2E4.
- \uCE74\uCE74\uC624 \uB178\uCD9C \uC5EC\uBD80\uC640 \uCE74\uCE74\uC624 \uC804\uC6A9 \uC815\uBCF4\uB294 \uC9C4\uB8CC\uD56D\uBAA9 \uC0C1\uC138\uC5D0\uC11C \uAD00\uB9AC\uD569\uB2C8\uB2E4. \uCE74\uCE74\uC624 \uCD94\uAC00 \uC815\uBCF4 \uD328\uB110\uC740 \uD1A0\uAE00\xB7\uC5F0\uB3D9 \uB370\uC774\uD130 \uC720\uBB34\uC640 \uAD00\uACC4\uC5C6\uC774 \uD56D\uC0C1 \uD3BC\uCCD0 \uD45C\uC2DC\uD569\uB2C8\uB2E4.
- \uC0C1\uD0DC \uC548\uB0B4\uB294 \uAD7F\uB2E5 \uBBF8\uB178\uCD9C \uC2DC \`\uAD7F\uB2E5\uC5D0 \uB178\uCD9C \uC911\uC778 \uC9C4\uB8CC\uD56D\uBAA9\uB9CC \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30\uC5D0\uB3C4 \uB178\uCD9C\uD560 \uC218 \uC788\uC5B4\uC694.\`, \uAD7F\uB2E5 \uB178\uCD9C\xB7\uCE74\uCE74\uC624 OFF \uC2DC \`\uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30\uC5D0 \uB178\uCD9C\uD558\uB824\uBA74 \u2018\uC6B0\uCE21 \uC0C1\uB2E8 \uC2A4\uC704\uCE58\u2019\uB97C \uCF1C\uC8FC\uC138\uC694.\`, \uCE74\uCE74\uC624 ON \uC2DC \`\uC704\uC5D0 \uC785\uB825\uD55C \uC9C4\uB8CC\uD56D\uBAA9 \uC815\uBCF4\uAC00 \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30\uC5D0\uB3C4 \uD568\uAED8 \uD45C\uC2DC\uB3FC\uC694.\`\uB97C \uD45C\uC2DC\uD569\uB2C8\uB2E4.
- V1\uC5D0\uC11C\uB294 \uAD7F\uB2E5\uC5D0 \uB178\uCD9C \uC911\uC778 \uC9C4\uB8CC\uD56D\uBAA9\uB9CC \uCE74\uCE74\uC624\uD1A1 \uC608\uC57D\uD558\uAE30\uC5D0\uB3C4 \uB178\uCD9C\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.
- \uAD7F\uB2E5 \uB178\uCD9C\uC744 \uB044\uBA74 \uCE74\uCE74\uC624 \uB178\uCD9C \uC758\uB3C4\uC640 \uC804\uC6A9\uC815\uBCF4\uB294 \uBCF4\uC874\uD558\uB418 \uC2E4\uC81C \uCE74\uCE74\uC624 \uC0C1\uD488\uC740 \uB178\uCD9C \uBCF4\uB958\uD569\uB2C8\uB2E4. \uAD7F\uB2E5\uC744 \uB2E4\uC2DC \uCF1C\uBA74 \uAE30\uC874 \uCE74\uCE74\uC624 \uB178\uCD9C \uC758\uB3C4\uAC00 ON\uC778 \uC0C1\uD488\uB9CC \uC678\uBD80 \uBC18\uC601 \uC131\uACF5 \uD6C4 \uBCF5\uC6D0\uD569\uB2C8\uB2E4.
- \uAD7F\uB2E5\uACFC \uCE74\uCE74\uC624 \uC608\uC57D\uC740 \uC608\uC57D \uC2E0\uCCAD \uB0B4\uC5ED\uC5D0\uC11C \uCC44\uB110\uC744 \uAD6C\uBD84\uD574 \uD568\uAED8 \uCC98\uB9AC\uD558\uBA70, \uCC44\uB110 \uC5F4\uC740 \uC9C4\uB8CC\uD56D\uBAA9\uACFC \uBC29\uBB38\uC790 \uC0AC\uC774\uC5D0 \uD45C\uC2DC\uD569\uB2C8\uB2E4.
- \uC608\uC57D \uCC44\uB110\uC740 \uD604\uC7AC \uC0C1\uD488 \uC0C1\uD0DC\uAC00 \uC544\uB2C8\uB77C \uD574\uB2F9 \uC608\uC57D\uC774 \uC2E4\uC81C\uB85C \uC720\uC785\uB41C \uCC44\uB110\uC744 \uAE30\uC900\uC73C\uB85C \uD45C\uC2DC\uD569\uB2C8\uB2E4.
- \uCE74\uCE74\uC624\uC5D0\uC11C \uC218\uC9D1\uB41C \uCD94\uAC00 \uC9C8\uBB38\xB7\uB2F5\uBCC0\uC774 \uC788\uB294 \uACBD\uC6B0, \uBAA8\uB4E0 \uC608\uC57D \uC0C1\uD0DC\uC758 \uAC1C\uBCC4 \uC0C1\uC138 \`\uC694\uCCAD\uC0AC\uD56D\` \uD558\uC704\uC5D0 \uC608\uC57D \uB2F9\uC2DC \uBB38\uAD6C\uC640 \uC21C\uC11C\uB300\uB85C \uD45C\uC2DC\uD569\uB2C8\uB2E4. \uB370\uC774\uD130\uAC00 \uC5C6\uC73C\uBA74 \uCD94\uAC00 \uC601\uC5ED\uC740 \uD45C\uC2DC\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
- \uBE44\uAE09\uC5EC \uC608\uC57D \uC6B4\uC601\uC744 \uC911\uC9C0\uD558\uBA74 \uC2E0\uADDC \uC608\uC57D \uC2AC\uB86F \uC81C\uACF5\uC744 \uC911\uB2E8\uD558\uC9C0\uB9CC \uB4F1\uB85D\uB41C \uC9C4\uB8CC\uD56D\uBAA9\uACFC \uAE30\uC874 \uC608\uC57D\uC740 \uC720\uC9C0\uD569\uB2C8\uB2E4.
- \uC0C1\uD488\uBCC4 \uB178\uCD9C \uC758\uB3C4, \uD604\uC7AC \uC608\uC57D \uAC00\uB2A5 \uC5EC\uBD80, \uC678\uBD80 \uC2E4\uC81C \uC0C1\uD0DC\uC640 \uB3D9\uAE30\uD654 \uC0C1\uD0DC\uB97C \uAD6C\uBD84\uD569\uB2C8\uB2E4. \uC678\uBD80 \uBC18\uC601 \uC804\uC5D0\uB294 \`\uB178\uCD9C \uC911\`\uC73C\uB85C \uD45C\uC2DC\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
- \uB178\uCD9C \uC758\uB3C4\uC640 \uC678\uBD80 \uBC18\uC601 \uC0C1\uD0DC\uB294 \uB0B4\uBD80\uC801\uC73C\uB85C \uAD6C\uBD84\uD558\uACE0 \uC2E4\uD328 \uC791\uC5C5\uB9CC \uC548\uC804\uD558\uAC8C \uC7AC\uCC98\uB9AC\uD569\uB2C8\uB2E4. \uC774\uB97C \uC870\uC791\uD558\uB294 \uC0C1\uD0DC \uC120\uD0DD\uAE30\uB098 \uAE30\uC220 \uC0C1\uD0DC\uD45C\uB294 \uBCD1\uC6D0 \uC81C\uD488 \uD654\uBA74\uC5D0 \uCD94\uAC00\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
- \uCE74\uCE74\uC624 \uCD94\uAC00 \uC815\uBCF4\uB294 \`\uC608\uC57D \uC2DC \uBC1B\uC744 \uC815\uBCF4\`, \uC774\uC6A9 \uBC29\uBC95(\uCD5C\uB300 2,000\uC790), \uC720\uC758\uC0AC\uD56D(\uCD5C\uB300 100\uC790), \uCDE8\uC18C \uC720\uC758\uC0AC\uD56D(\uCD5C\uB300 100\uC790)\uC73C\uB85C \uAD6C\uC131\uD569\uB2C8\uB2E4.
- \`\uC608\uC57D \uC2DC \uBC1B\uC744 \uC815\uBCF4\` \uC9C8\uBB38\uC740 \uAC1D\uAD00\uC2DD\xB7\uC8FC\uAD00\uC2DD\uC744 \uD569\uD574 0~10\uAC1C\uAE4C\uC9C0 \uC0DD\uC131\xB7\uC218\uC815\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uAC1D\uAD00\uC2DD \uC120\uD0DD\uC9C0 \uD3B8\uC9D1, \uD544\uC218 \uB2F5\uBCC0, \uBCF5\uC218 \uC120\uD0DD, \uC9C8\uBB38 \uC0AD\uC81C\xB7\uC815\uB82C\uC744 \uC9C0\uC6D0\uD558\uACE0 10\uAC1C\uAC00 \uB418\uBA74 \uC9C8\uBB38 \uCD94\uAC00 \uBC84\uD2BC \uB300\uC2E0 \`\uC9C8\uBB38\uC740 \uCD5C\uB300 10\uAC1C\uAE4C\uC9C0 \uCD94\uAC00\uD560 \uC218 \uC788\uC5B4\uC694.\`\uB97C \uD45C\uC2DC\uD569\uB2C8\uB2E4.
- \uCE74\uCE74\uC624 \uC0C1\uD488\uBA85\xB7\uC124\uBA85\xB7\uB300\uD45C \uC774\uBBF8\uC9C0\xB7\uC0C1\uC138 \uC774\uBBF8\uC9C0\xB7\uAC80\uC0C9 \uD0A4\uC6CC\uB4DC\uB294 \uACF5\uD1B5 \uC9C4\uB8CC\uD56D\uBAA9 \uC815\uBCF4\uB97C \uC0AC\uC6A9\uD558\uBBC0\uB85C \uBCC4\uB3C4 \uC785\uB825 \uD544\uB4DC\uB97C \uC81C\uACF5\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uACF5\uD1B5 \uB300\uD45C \uC774\uBBF8\uC9C0\uAC00 \uC5C6\uC73C\uBA74 \uCE74\uCE74\uC624 \uC7A5\uC18C \uC774\uBBF8\uC9C0\uB97C \uC0AC\uC6A9\uD569\uB2C8\uB2E4.
- V1 \uBCD1\uC6D0 \uD654\uBA74\uC5D0\uB294 \uD310\uB9E4\uAE30\uAC04, \uAC15\uC81C \uD488\uC808 \uD45C\uC2DC, \uC0C1\uD488 \uB178\uCD9C\uC21C\uC11C\uB97C \uC81C\uACF5\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uCE74\uCE74\uC624 \uC608\uC57D\uC5D0\uC11C \uC218\uC9D1\uB41C \uCD94\uAC00 \uC9C8\uBB38\xB7\uB2F5\uBCC0\uC740 \uC608\uC57D \uB2F9\uC2DC snapshot\uC73C\uB85C \uBCF4\uC874\uD574 \uC608\uC57D \uC0C1\uC138\uC5D0 \uC870\uAC74\uBD80 \uD45C\uC2DC\uD569\uB2C8\uB2E4.
- \uAD7F\uB2E5 \uAC00\uACA9 \uC635\uC158\uC744 \`[\uAC00\uACA9 \uC815\uBCF4] - \uAC00\uACA9 \uC124\uBA85\` \uD615\uC2DD\uC758 \uCE74\uCE74\uC624 \`Price.description\`\uC73C\uB85C \uBCC0\uD658\uD558\uBA70 \uCD5C\uC885 \uBB38\uAD6C\uAC00 100\uC790\uB97C \uB118\uC73C\uBA74 \uC800\uC7A5\uC744 \uB9C9\uC2B5\uB2C8\uB2E4. \uACE0\uC815\uAC00\uB294 \uACE0\uC815 \uAE08\uC561, \uD560\uC778\uAC00\uB294 \uD310\uB9E4\uAC00\uB9CC, \uC0C1\uB2F4 \uD6C4 \uACB0\uC815\uC740 \`\uC0C1\uB2F4 \uD6C4 \uACB0\uC815\`\uC744 \uC0AC\uC6A9\uD569\uB2C8\uB2E4. \uBCC4\uB3C4\uC758 \uCE74\uCE74\uC624 \uAC00\uACA9 \uC548\uB0B4 \uBBF8\uB9AC\uBCF4\uAE30\uB294 \uC81C\uACF5\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uC2E0\uADDC GCP-1 Product\uB294 \uAC00\uACA9 \uC635\uC158 \uC218\uC640 \uAD00\uACC4\uC5C6\uC774 \uD56D\uC0C1 \`priceDisplayType=SELECT\`\uB85C \uC0DD\uC131\uD558\uBA70 \uD65C\uC131 Price\uB294 1~50\uAC1C\uB9CC \uD5C8\uC6A9\uD569\uB2C8\uB2E4. 1\u2194N \uBCC0\uACBD\uC740 Product\uB97C \uC720\uC9C0\uD558\uACE0 Price\uB9CC \uC99D\uAC10\uD558\uBA70, \uD65C\uC131 Price\uAC00 0\uAC1C\uBA74 \uCE74\uCE74\uC624 \uB178\uCD9C\uC744 \uCC28\uB2E8\uD569\uB2C8\uB2E4.
- \uAD7F\uB2E5 \uC800\uC7A5 \uC131\uACF5\uACFC \uCE74\uCE74\uC624 \uBC18\uC601 \uC131\uACF5\uC744 \uBD84\uB9AC\uD558\uACE0 Product\xB7\uAE30\uC220 Item(\`\uC635\uC158\`)\xB7Price\xB7Schedule\uBCC4 \uC0C1\uD0DC\uC640 \uC2E4\uD328 \uC0AC\uC720\uB294 \uB0B4\uBD80 \uB3D9\uAE30\uD654\xB7\uAD00\uC81C \uC815\uBCF4\uB85C \uAD00\uB9AC\uD569\uB2C8\uB2E4.
- \uD65C\uC131 \uB610\uB294 \uBBF8\uB798 \uC608\uC57D\uC774 \uC788\uB294 \uC9C4\uB8CC\uD56D\uBAA9\uC740 \uBB3C\uB9AC \uC0AD\uC81C\uD558\uC9C0 \uC54A\uACE0 \uC6B4\uC601\uC744 \uC911\uC9C0\uD558\uBA70 \uAE30\uC874 \uC608\uC57D\uACFC \uC678\uBD80 \uB9E4\uD551\uC744 \uBCF4\uC874\uD569\uB2C8\uB2E4.
- \uBE44\uAE09\uC5EC \uC608\uC57D \uC804\uCCB4 OFF\uB294 \uC0C1\uD488\uBCC4 \uB178\uCD9C \uC758\uB3C4\uB97C \uBCF4\uC874\uD55C \uCC44 \uC678\uBD80 Product\xB7\uD5A5\uD6C4 Schedule\uC744 \uB178\uCD9C \uBCF4\uB958\uB85C \uC804\uD658\uD569\uB2C8\uB2E4. \uB2E4\uC2DC ON\uD558\uBA74 \uC720\uD6A8\uD55C \uC0C1\uD488\uB9CC \uC120\uBCC4\uD574 \uC678\uBD80 \uBC18\uC601 \uC131\uACF5 \uD6C4 \uBCF5\uC6D0\uD569\uB2C8\uB2E4.
- \uC790\uB3D9 \uD655\uC815\uACFC \uB2F9\uC77C \uC608\uC57D \uC124\uC815\uC740 \uC678\uBD80 \uC608\uC57D\uC5D0\uB3C4 \uC801\uC6A9\uD569\uB2C8\uB2E4. \uCE74\uCE74\uC624 \uC2E0\uADDC \uC608\uC57D\uC740 \uBCD1\uC6D0\uC758 \`\uC0C8 \uC608\uC57D \uC54C\uB9BC \uBC1B\uAE30\`\uAC00 ON\uC774\uBA74 \uAE30\uC874 \uAD7F\uB2E5 \uC9C4\uB8CC\uD56D\uBAA9 \uC608\uC57D\uACFC \uB3D9\uC77C\uD55C Windows OS \uD478\uC2DC\uB97C \uBCD1\uC6D0\uC5D0 \uBC1C\uC1A1\uD569\uB2C8\uB2E4. \uD658\uC790\uC5D0\uAC8C\uB294 \uAD7F\uB2E5 \uC2E0\uADDC \uC608\uC57D \uC54C\uB9BC\uC744 \uCD94\uAC00\uB85C \uBCF4\uB0B4\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
- \uC608\uC57D\uC5D0\uB294 \uB2F9\uC2DC \uC0C1\uD488\xB7\uAC00\uACA9\xB7\uCC44\uB110\xB7\uC790\uB3D9 \uD655\uC815 \uC124\uC815\uC744 \uBCF4\uC874\uD558\uACE0 \uC678\uBD80 \uC0C1\uD0DC \uBC18\uC601 \uC2E4\uD328\uB294 \uB0B4\uBD80 \uC7AC\uCC98\uB9AC\uD569\uB2C8\uB2E4. \uC678\uBD80 ID\xB7\uC801\uC6A9 \uBC84\uC804\xB7\uC54C\uB9BC \uBC1C\uD589 \uACB0\uACFC \uAC19\uC740 \uC9C4\uB2E8 \uC815\uBCF4\uB294 \uBCD1\uC6D0 \uD654\uBA74\uC5D0 \uCD94\uAC00\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.

## \uC678\uBD80 \uC608\uC57D \uD750\uB984

1. \uCE74\uCE74\uC624\uC5D0\uC11C \uC9C4\uB8CC\uD56D\uBAA9\uD615 \uC0C1\uD488, \uAC00\uACA9 \uC635\uC158\uACFC \uC77C\uC815\uC744 \uC120\uD0DD\uD569\uB2C8\uB2E4.
2. \uCE74\uCE74\uC624\uC5D0\uC11C \uC608\uC57D\uC790\xB7\uBC29\uBB38\uC790 \uAE30\uBCF8\uC815\uBCF4\uC640 \uB3D9\uC758\uB97C \uC785\uB825\uD569\uB2C8\uB2E4.
3. \uAD7F\uB2E5 \uC608\uC57D \uC6F9\uBDF0\uB85C \uC774\uB3D9\uD574 \uD544\uC694\uD55C \uCD94\uAC00\uC815\uBCF4\uB97C \uC785\uB825\uD569\uB2C8\uB2E4.
4. \uAD7F\uB2E5\uC774 \uBCD1\uC6D0 \uC6B4\uC601 \uAC00\uB2A5 \uC5EC\uBD80\uC640 \uACF5\uD1B5 \uC608\uC57D \uC2AC\uB86F\uC744 \uCD5C\uC885 \uD655\uC778\uD569\uB2C8\uB2E4.
5. \uC870\uAC74\uC744 \uB9CC\uC871\uD558\uBA74 \uD1B5\uD569 \uC608\uC57D \uC6D0\uC7A5\uC5D0 \uD55C \uBC88\uB9CC \uC0DD\uC131\uD558\uACE0, \uB9C8\uAC10 \uB610\uB294 \uC624\uB958\uC774\uBA74 \uC7AC\uC120\uD0DD \uC548\uB0B4\uB97C \uD45C\uC2DC\uD569\uB2C8\uB2E4.

\uAE30\uC220 \`Item(\uC635\uC158)\`\uC740 \uC678\uBD80 API \uAD6C\uC870\uB97C \uB9DE\uCD94\uB294 \uAC1D\uCCB4\uC774\uBA70 \uD658\uC790\uC5D0\uAC8C \uBCC4\uB3C4 \uC120\uD0DD \uB2E8\uACC4\uB85C \uC81C\uACF5\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.

## \uAC80\uD1A0 \uC911\uC778 \uD654\uBA74 \uB178\uCD9C \uC870\uAC74

> \uC544\uB798 \uD56D\uBAA9\uC740 \uCD5C\uC885 PRD\uC5D0 \uD655\uC815\uB41C \uC870\uAC74\uC774\uBA70, \uD504\uB85C\uD1A0\uD0C0\uC785\uC758 \`\uC608\uC815\uB41C \uB0B4\uC6A9\uB3C4 \uBCF4\uAE30\`\uB97C \uCF30\uC744 \uB54C \uD655\uC778\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.

- **\uBCD1\uC6D0 \uB2E8\uC704 \uCE74\uCE74\uC624 \uC5F0\uB3D9 \uC5EC\uBD80**\uB294 \uC9C4\uB8CC\uD56D\uBAA9 \uBAA9\uB85D\uC758 \uCE74\uCE74\uC624 \uCC44\uB110 \uC815\uBCF4, \uC9C4\uB8CC\uD56D\uBAA9 \uC0C1\uC138\uC758 \uCE74\uCE74\uC624 \uC124\uC815 \uC601\uC5ED, \uC608\uC57D \uC2E0\uCCAD \uB0B4\uC5ED\uC758 \uCC44\uB110 \uC5F4\uC744 \uD45C\uC2DC\uD560\uC9C0 \uACB0\uC815\uD569\uB2C8\uB2E4.
- **\uAC1C\uBCC4 \uC9C4\uB8CC\uD56D\uBAA9\uC758 \uCE74\uCE74\uC624 \uC5F0\uB3D9 \uC5EC\uBD80**\uB294 \uC704 \uC601\uC5ED\uB4E4\uC758 \uD45C\uC2DC \uC5EC\uBD80\uAC00 \uC544\uB2C8\uB77C \uD574\uB2F9 \uC0C1\uD488\uC758 \uCE74\uCE74\uC624 \uB178\uCD9C \uC0C1\uD0DC\uB97C \uACB0\uC815\uD569\uB2C8\uB2E4. \uCE74\uCE74\uC624 \uCD94\uAC00 \uC815\uBCF4 \uD328\uB110\uC740 \uD1A0\uAE00\uACFC \uBB34\uAD00\uD558\uAC8C \uD56D\uC0C1 \uD3BC\uCCD0 \uB461\uB2C8\uB2E4.
- \uBCD1\uC6D0\uC774 \uCE74\uCE74\uC624\uC5D0 \uC5F0\uB3D9\uB418\uC5B4 \uC788\uB2E4\uBA74 \uAC1C\uBCC4 \uC9C4\uB8CC\uD56D\uBAA9\uC774 \uC544\uC9C1 \uCE74\uCE74\uC624\uC5D0 \uB178\uCD9C\uB418\uC9C0 \uC54A\uC558\uB354\uB77C\uB3C4 \uBAA9\uB85D\uC758 \uCE74\uCE74\uC624 \uCC44\uB110 \uC815\uBCF4\uC640 \uC608\uC57D \uC2E0\uCCAD \uB0B4\uC5ED\uC758 \uCC44\uB110 \uC5F4\uC740 \uC720\uC9C0\uD569\uB2C8\uB2E4.
- \uBCD1\uC6D0\uC774 \uCE74\uCE74\uC624\uC5D0 \uC5F0\uB3D9\uB418\uC9C0 \uC54A\uC558\uB2E4\uBA74 \uC704 \uC138 \uD654\uBA74\uC758 \uCE74\uCE74\uC624 \uAD00\uB828 \uC601\uC5ED\uC744 \uD45C\uC2DC\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
