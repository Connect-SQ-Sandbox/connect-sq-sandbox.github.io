/* styles/connectShell.css */
/* =============================================================
   굿닥 커넥트 웹뷰 — 공통 셸 (디자인 토큰 + 윈도우 셸/사이드내비)
   여러 커넥트 화면(진료항목 등록, 예약 신청 내역 등)이 공유한다.
   - /Users/goodoc/test 프로토타입의 colors_and_type.css(:root)와
     connect.css의 셸 부분을 이식.
   - 전역 누수 방지를 위해 원본 body 레벨 스타일은 .cn-artboard 래퍼로
     한정했고 리셋도 .cn-artboard 하위로 스코프.
   - 클래스 접두사(cn-)가 고유해 다른 페이지와 충돌하지 않음.
   ============================================================= */

/* ---- Design tokens (colors_and_type.css :root, @font-face 제외) ---- */
:root {
  --gray-10:  #F9FAFB;
  --gray-15:  #F4F6F8;
  --gray-20:  #F2F4F6;
  --gray-30:  #E5E8EB;
  --gray-40:  #D1D6DB;
  --gray-50:  #B0B8C1;
  --gray-60:  #8B95A1;
  --gray-70:  #6B7684;
  --gray-80:  #4E5968;
  --gray-90:  #31353F;
  --gray-100: #191F28;

  --blue-30:  #B3D5FF;
  --blue-60:  #0073FA;
  --blue-70:  #0061DB;
  --blue-80:  #0050B5;

  --red-60:   #FA4655;
  --red-70:   #EC3847;
  --red-80:   #D52130;

  --green-70: #41D293;
  --green-80: #1FA972;
  --orange-60:#F79009;

  --white: #FFFFFF;
  --black: #000000;
  --transparent: transparent;

  --alpha-gray-05: rgba(128, 135, 153, 0.05);
  --alpha-gray-10: rgba(128, 135, 153, 0.10);
  --alpha-gray-15: rgba(128, 135, 153, 0.15);
  --alpha-gray-20: rgba(128, 135, 153, 0.20);
  --alpha-gray-40: rgba(128, 135, 153, 0.40);
  --alpha-gray-60: rgba(128, 135, 153, 0.60);

  --alpha-blue-05: rgba(0, 115, 250, 0.05);
  --alpha-blue-10: rgba(0, 115, 250, 0.10);
  --alpha-blue-15: rgba(0, 115, 250, 0.15);
  --alpha-blue-20: rgba(0, 115, 250, 0.20);

  --alpha-red-05: rgba(250, 70, 85, 0.05);
  --alpha-red-10: rgba(250, 70, 85, 0.10);
  --alpha-red-15: rgba(250, 70, 85, 0.15);
  --alpha-red-20: rgba(250, 70, 85, 0.20);

  --shadow-toast: 0 2px 1px rgba(22, 24, 29, 0.02), 0 2px 8px rgba(22, 24, 29, 0.10);
  --shadow-toggle-knob: 0 0 6px rgba(0, 0, 0, 0.25);

  --font-sans: 'Pretendard', 'Pretendard Variable', -apple-system,
    BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}

/* ---- Artboard backdrop (원본 connect.css의 body 스타일을 래퍼로 한정) ---- */
.cn-artboard {
  font-family: var(--font-sans);
  background: #e7e9ee;
  color: var(--gray-100);
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 24px;
}
.cn-artboard *,
.cn-artboard *::before,
.cn-artboard *::after { box-sizing: border-box; }

/* ---- App window (1280 x 832 rounded webview frame) ---- */
.cn-screen {
  width: 1280px;
  min-height: 832px;
  background: var(--white);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 12px 40px rgba(22, 24, 29, 0.12);
  position: relative;
}

/* ---- Title bar (windows-style) ---- */
.cn-titlebar {
  height: 32px;
  background: #f3f3f3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: none;
}
.cn-ci { display: flex; align-items: center; gap: 4px; padding: 0 8px; height: 100%; }
.cn-ci-mark { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
.cn-ci-mark svg { display: block; }
.cn-ci-name { font: 500 13px/16px var(--font-sans); color: rgba(0, 0, 0, 0.9); padding: 0 8px 2px 4px; }
.cn-winctrls { display: flex; height: 100%; }
.cn-winbtn {
  width: 46px; height: 32px;
  border: 0; background: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  color: rgba(0, 0, 0, 0.9); cursor: pointer;
}
.cn-winbtn:hover { background: rgba(0, 0, 0, 0.05); }
.cn-winbtn.close:hover { background: #e81123; color: #fff; }

/* ---- Body: nav + main ---- */
.cn-body { display: flex; align-items: stretch; flex: 1; min-height: 800px; }

/* ---- Side nav (250px) ---- */
.cn-nav { width: 250px; flex: none; background: #f2f4f7; position: relative; display: flex; flex-direction: column; }
.cn-nav-scroll { flex: 1; overflow: auto; }
.cn-nav-group { padding: 8px 0; display: flex; flex-direction: column; }
.cn-nav-header { height: 40px; display: flex; align-items: center; padding: 0 16px; font: 600 14px/20px var(--font-sans); color: rgba(0, 0, 0, 0.9); }
.cn-nav-item {
  height: 40px; width: 100%;
  border: 0; background: transparent;
  display: flex; align-items: center;
  padding: 0 16px; position: relative; cursor: pointer; text-align: left;
}
.cn-nav-item > .cn-nav-label { font: 400 14px/22px var(--font-sans); color: var(--gray-90); flex: 1; }
.cn-nav-item .cn-chevron { width: 12px; height: 12px; color: #808799; flex: none; display: inline-flex; align-items: center; justify-content: center; }
.cn-nav-item.sub { padding-left: 32px; }
.cn-nav-item.sub::before { content: ""; position: absolute; inset: 2px 4px; border-radius: 4px; pointer-events: none; }
.cn-nav-item.active::before { background: var(--alpha-gray-10); }
.cn-nav-item.active .cn-nav-label { color: var(--gray-90); }
.cn-nav-item:not(.active):not(.cn-nav-header):hover::before {
  content: ""; position: absolute; inset: 2px 4px;
  background: rgba(128, 135, 153, 0.06); border-radius: 4px; pointer-events: none;
}
.cn-nav-label-wrap { display: inline-flex; align-items: center; gap: 6px; flex: 1; }
.cn-beta {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 5px; border-radius: 4px;
  background: var(--alpha-blue-10);
  font: 600 12px/18px var(--font-sans);
  color: var(--blue-80, #115fd4);
}
.cn-nav-divider { padding: 4px 0; }
.cn-nav-divider span { display: block; height: 1px; background: var(--gray-30); }
.cn-nav-footer { background: #f2f4f7; padding-bottom: 8px; display: flex; flex-direction: column; }

/* ---- Main frame ---- */
.cn-main { flex: 1; min-width: 0; background: var(--white); display: flex; flex-direction: column; }
.cn-header { padding: 48px 64px 32px; }
.cn-header-title { font: 700 28px/36px var(--font-sans); color: #16181d; }
.cn-header-desc { font: 400 14px/22px var(--font-sans); color: #808799; margin-top: 6px; }


/* styles/prototypeChanges.css */
/* 프로토타입 메타 UI: 실제 Connect 기능이 아니라 정책 변경 추적용 패널 */
.pc-trigger {
  position: fixed; top: 72px; right: 0; z-index: 105;
  height: 40px; padding: 0 12px 0 10px; border: 1px solid var(--gray-30); border-right: 0;
  border-radius: 8px 0 0 8px; background: var(--gray-100); color: var(--white);
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  font: 600 12px/18px var(--font-sans); box-shadow: 0 4px 16px rgba(22,24,29,.14);
}
.pc-trigger:hover { background: var(--gray-90); }
.pc-trigger-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-70); }
.pc-trigger-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: rgba(255,255,255,.16); font: 700 11px/18px var(--font-sans); }

/* 딤 제거: 우측 패널을 비모달로 (열어둔 채 본문 확인·조작 가능) */
.pc-scrim { display: none; }
.pc-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 120; width: 392px;
  background: var(--white); box-shadow: -12px 0 32px rgba(22,24,29,.14);
  display: flex; flex-direction: column; transform: translateX(102%); visibility: hidden;
  transition: transform .2s ease, visibility .2s;
}
.pc-drawer.open { transform: translateX(0); visibility: visible; }
.pc-drawer-head { min-height: 52px; padding: 0 18px; border-bottom: 1px solid var(--gray-20); display: flex; align-items: center; justify-content: space-between; flex: none; }
.pc-eyebrow { font: 700 11px/16px var(--font-sans); letter-spacing: .08em; color: var(--blue-70); }
.pc-close { width: 32px; height: 32px; border-radius: 6px; color: var(--gray-70); font: 400 24px/30px var(--font-sans); cursor: pointer; }
.pc-close:hover, .pc-back:hover { background: var(--gray-10); }
.pc-back { height: 32px; padding: 0 8px; border-radius: 6px; color: var(--gray-80); font: 600 13px/32px var(--font-sans); cursor: pointer; }

.pc-drawer-title-wrap { padding: 22px 20px 16px; flex: none; }
.pc-drawer-title-wrap h2 { margin: 0; font: 700 22px/30px var(--font-sans); color: var(--gray-100); }
.pc-drawer-title-wrap p { margin: 7px 0 0; font: 400 13px/20px var(--font-sans); color: var(--gray-70); }
.pc-planned-filter { margin-top: 16px; padding: 12px 13px; border: 1px solid var(--gray-30); border-radius: 9px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pc-planned-filter > div { min-width: 0; display: flex; flex-direction: column; }
.pc-planned-filter strong { color: var(--gray-90); font: 600 13px/19px var(--font-sans); }
.pc-planned-filter span { color: var(--gray-60); font: 400 11px/17px var(--font-sans); }
.pc-switch { width: 40px; height: 24px; padding: 2px; border-radius: 999px; background: var(--gray-40); cursor: pointer; transition: background .15s; flex: none; }
.pc-switch > span { display: block; width: 20px; height: 20px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 4px rgba(22,24,29,.18); transition: transform .15s; }
.pc-switch.on { background: #f79009; }
.pc-switch.on > span { transform: translateX(16px); }
.pc-planned-notice { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: rgba(247,144,9,.09); color: #9a5800; font: 500 11px/17px var(--font-sans); }
.pc-dev-filter { margin-top: 10px; border-color: rgba(234, 179, 8, .48); background: #fffdf2; }
.pc-dev-notice { margin-top: 8px; padding: 8px 10px; border: 1px solid rgba(234, 179, 8, .35); border-radius: 6px; background: #fff8cf; color: #745300; font: 600 11px/17px var(--font-sans); }
.pc-dev-marker-layer { position: fixed; inset: 0; z-index: 110; pointer-events: none; }
.pc-dev-marker-layer, .pc-dev-marker-layer *, .pc-dev-marker-layer *::before, .pc-dev-marker-layer *::after { box-sizing: border-box; }
.pc-dev-marker-shell { position: fixed; width: 30px; height: 30px; pointer-events: auto; }
.pc-dev-marker {
  position: relative; z-index: 2; width: 30px; height: 30px; border: 2px solid var(--white); border-radius: 50%;
  background: #e0a600; color: var(--white); cursor: help; box-shadow: 0 3px 10px rgba(116,83,0,.30), 0 0 0 2px rgba(224,166,0,.18);
  font: 800 12px/26px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center;
  transition: transform .14s ease, background .14s ease, box-shadow .14s ease;
}
.pc-dev-marker:hover, .pc-dev-marker:focus-visible { background: #c98e00; box-shadow: 0 5px 16px rgba(116,83,0,.38), 0 0 0 3px rgba(224,166,0,.22); outline: none; transform: scale(1.08); }
.pc-dev-marker-tooltip {
  position: absolute; z-index: 1; width: min(350px, calc(100vw - 24px)); max-height: min(420px, calc(100vh - 48px));
  padding: 13px 14px 14px; overflow: auto; border: 1px solid #e4b82f; border-radius: 12px; background: #fffdf1;
  color: #5f4700; box-shadow: 0 12px 32px rgba(72,54,0,.20); visibility: hidden; opacity: 0; pointer-events: none;
  transition: opacity .12s ease, transform .12s ease, visibility .12s;
}
.pc-dev-marker-shell.place-left .pc-dev-marker-tooltip { right: 0; }
.pc-dev-marker-shell.place-right .pc-dev-marker-tooltip { left: 0; }
.pc-dev-marker-shell.place-below .pc-dev-marker-tooltip { top: calc(100% + 9px); transform: translateY(-4px); }
.pc-dev-marker-shell.place-above .pc-dev-marker-tooltip { bottom: calc(100% + 9px); transform: translateY(4px); }
.pc-dev-marker-shell:hover .pc-dev-marker-tooltip,
.pc-dev-marker-shell:focus-within .pc-dev-marker-tooltip { visibility: visible; opacity: 1; pointer-events: auto; transform: translateY(0); }
.pc-dev-marker-tooltip-head { display: grid; grid-template-columns: 26px 1fr; gap: 9px; align-items: start; }
.pc-dev-marker-tooltip-head > span { width: 26px; height: 26px; border-radius: 50%; background: #e0a600; color: var(--white); font: 800 11px/26px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; }
.pc-dev-marker-tooltip-head > div { min-width: 0; display: flex; flex-direction: column; }
.pc-dev-marker-tooltip-head small { color: #9a6b00; font: 700 9px/14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
.pc-dev-marker-tooltip-head strong { margin-top: 1px; color: #4d3900; font: 700 13px/19px var(--font-sans); word-break: keep-all; }
.pc-dev-marker-tooltip ul { margin: 10px 0 0; padding: 9px 0 0 17px; border-top: 1px solid rgba(224,166,0,.24); }
.pc-dev-marker-tooltip li { margin-top: 5px; color: #5f4700; font: 500 11px/18px var(--font-sans); word-break: keep-all; }
.pc-dev-marker-tooltip li:first-child { margin-top: 0; }
.pc-dev-marker-tooltip code { padding: 1px 4px; border-radius: 4px; background: rgba(116,83,0,.10); color: #604700; font: 600 10px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-current-view { display: inline-flex; margin-top: 12px; padding: 5px 9px; border-radius: 6px; background: var(--alpha-blue-10); color: var(--blue-70); font: 600 12px/18px var(--font-sans); }
.pc-scope { margin: 0 20px; padding: 3px; border-radius: 8px; background: var(--gray-20); display: grid; grid-template-columns: 1fr 1fr; flex: none; }

.pc-change-list {

  overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable;
  display: flex; flex-direction: column; gap: 12px;
}
.pc-empty { padding: 40px 12px; text-align: center; color: var(--gray-60); font: 400 13px/20px var(--font-sans); }
.pc-change-card { flex: 0 0 auto; border: 1px solid var(--gray-30); border-radius: 10px; overflow: hidden; background: var(--white); transition: border-color .12s, box-shadow .12s; }
.pc-change-card:hover { border-color: var(--gray-50); box-shadow: 0 4px 16px rgba(22,24,29,.06); }
.pc-change-card.planned { border-color: rgba(247,144,9,.36); background: linear-gradient(180deg, rgba(247,144,9,.035), var(--white) 40%); }
.pc-change-main { width: 100%; padding: 15px 15px 13px; text-align: left; cursor: pointer; }

.pc-document-body .pc-summary-source { margin-top: 0; }
.pc-document-body .pc-markdown { max-width: 760px; margin: 24px auto 0; }
.pc-document-body .pc-markdown h1 { font-size: 25px; line-height: 34px; }
.pc-document-body .pc-markdown h2 { margin-top: 28px; font-size: 18px; line-height: 27px; }
.pc-document-body .pc-markdown p, .pc-document-body .pc-md-li { font-size: 14px; line-height: 23px; }

.pc-summary-view { padding: 20px 20px 32px; overflow: auto; }
.pc-summary-meta { display: flex; align-items: center; gap: 7px; }
.pc-summary-release { margin-top: 10px; color: #9a5800; font: 600 12px/18px var(--font-sans); }
.pc-summary-source { margin-top: 10px; padding: 10px 12px; border-radius: 7px; background: var(--gray-10); color: var(--gray-60); font: 500 11px/17px var(--font-sans); word-break: break-all; }
.pc-markdown { margin-top: 18px; }
.pc-markdown h1 { margin: 0 0 16px; color: var(--gray-100); font: 700 21px/29px var(--font-sans); }
.pc-markdown h2 { margin: 22px 0 9px; color: var(--gray-100); font: 700 16px/24px var(--font-sans); }
.pc-markdown h3 { margin: 18px 0 8px; color: var(--gray-90); font: 700 14px/22px var(--font-sans); }
.pc-markdown p { margin: 0; color: var(--gray-70); font: 400 13px/21px var(--font-sans); }
.pc-markdown blockquote { margin: 0 0 16px; padding: 12px 14px; border-left: 3px solid var(--blue-60); background: var(--alpha-blue-05); color: var(--gray-80); font: 500 12px/20px var(--font-sans); }
.pc-markdown code { padding: 2px 5px; border-radius: 4px; background: var(--gray-20); color: var(--gray-80); font: 500 11px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-md-li { display: grid; grid-template-columns: 10px 1fr; gap: 5px; align-items: start; margin-top: 5px; }
.pc-md-li > span { color: var(--blue-60); font: 700 13px/21px var(--font-sans); }
.pc-md-gap { height: 6px; }

.pc-policy-highlight { animation: pc-policy-pulse 2.4s ease; outline: 3px solid var(--blue-60); outline-offset: 4px; border-radius: 8px; }
.pc-planned-row-badge { display: inline-flex; margin-left: 6px; padding: 1px 5px; border-radius: 4px; background: rgba(247,144,9,.12); color: #9a5800; vertical-align: 1px; font: 700 10px/15px var(--font-sans); }
@keyframes pc-policy-pulse {
  0%, 100% { outline-color: transparent; box-shadow: none; }
  15%, 70% { outline-color: var(--blue-60); box-shadow: 0 0 0 8px var(--alpha-blue-10); }
}

@media (max-width: 1100px) {
  .pc-drawer { width: min(392px, calc(100% - 24px)); }
  .pc-scrim { left: 0; }
  .pc-document-overlay { padding: 20px; }
  .pc-document-modal { width: calc(100vw - 40px); height: calc(100vh - 40px); }
  .pc-document-body { padding: 20px 22px 32px; }
}


/* styles/applicationUnified.css */
/* =============================================================
   application-unified — 통합 신청서(420 예약 · 420 미리접수 · 진료항목 예약)
   토큰·컴포넌트: goodoc-design (colors_and_type.css / goodoc-ui.css) 발췌.
   샌드박스 규칙상 emotion 불가 → plain CSS. 페이지 전용 클래스는 au-*.
   ============================================================= */

.au-root {
  --gray-10: #F9FAFB; --gray-15: #F4F6F8; --gray-20: #F2F4F6; --gray-30: #E5E8EB;
  --gray-40: #D1D6DB; --gray-50: #B0B8C1; --gray-60: #8B95A1; --gray-70: #6B7684;
  --gray-80: #4E5968; --gray-90: #31353F; --gray-100: #191F28;
  --blue-30: #B3D5FF; --blue-60: #0073FA; --blue-70: #0061DB; --blue-80: #0050B5;
  --red-60: #FA4655; --red-70: #EC3847; --green-70: #41D293; --green-80: #1FA972;
  --orange-60: #F79009;
  --alpha-gray-05: rgba(128,135,153,.05); --alpha-gray-10: rgba(128,135,153,.10);
  --alpha-gray-15: rgba(128,135,153,.15); --alpha-gray-20: rgba(128,135,153,.20);
  --alpha-gray-40: rgba(128,135,153,.40);
  --alpha-blue-05: rgba(0,115,250,.05); --alpha-blue-10: rgba(0,115,250,.10);
  --alpha-blue-15: rgba(0,115,250,.15); --alpha-blue-20: rgba(0,115,250,.20);
  --alpha-red-05: rgba(250,70,85,.05); --alpha-red-10: rgba(250,70,85,.10);
  --alpha-black-50: rgba(0,0,0,.50);
  --shadow-dropdown: 0 2px 8px rgba(17,23,35,.15);
  --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-family: var(--font-sans);
  color: var(--gray-100);
  font-size: 14px;
  line-height: 1.5;
  word-break: keep-all;
}
.au-root *, .au-root *::before, .au-root *::after { box-sizing: border-box; }
.au-root button { font-family: inherit; }

/* ---------- goodoc-ui 발췌 ---------- */
.au-root .gd-btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; font-weight:700;
  white-space:nowrap; cursor:pointer; border:1px solid transparent; transition:background-color .12s,color .12s; }
.au-root .gd-btn.lg { height:52px; padding:14px 36px; font-size:16px; line-height:24px; border-radius:8px; }
.au-root .gd-btn.sm { height:40px; padding:9px 16px; font-size:14px; line-height:21px; border-radius:6px; }
.au-root .gd-btn.xs { height:32px; padding:6px 12px; font-size:13px; line-height:19.5px; border-radius:4px; }
.au-root .gd-btn.primarySolid { color:#fff; background:var(--blue-60); }
.au-root .gd-btn.primarySolid:hover { background:var(--blue-70); }
.au-root .gd-btn.primarySolid:active { background:var(--blue-80); }
.au-root .gd-btn.primarySmooth { color:var(--blue-60); background:var(--alpha-blue-10); }
.au-root .gd-btn.primarySmooth:hover { background:var(--alpha-blue-15); }
.au-root .gd-btn.secondaryOutline { color:var(--gray-70); background:#fff; border-color:var(--alpha-gray-20); }
.au-root .gd-btn.secondaryOutline:hover { background:var(--alpha-gray-05); }
.au-root .gd-btn.primaryLinkText { height:auto; padding:0; font-weight:600; font-size:13px; color:var(--blue-60); background:transparent; }
.au-root .gd-btn:disabled.primarySolid { color:var(--alpha-gray-40); background:var(--alpha-gray-05); cursor:not-allowed; }

.au-root .gd-input { width:100%; height:48px; padding:0 16px; font-size:16px; color:var(--gray-90); background:#fff;
  border:1px solid var(--gray-40); border-radius:8px; outline:none; font-family:inherit; }
.au-root .gd-input::placeholder { color:var(--gray-50); }
.au-root .gd-input:focus { border-color:var(--gray-100); }
.au-root .gd-input.error { border-color:var(--red-60); }
.au-root .gd-input:read-only { background:var(--gray-10); color:var(--gray-70); }
.au-root .au-addr-search .gd-input:read-only { background:#fff; color:var(--gray-90); cursor:pointer; }

.au-root .gd-tag { display:inline-flex; align-items:center; justify-content:center; white-space:nowrap;
  padding:1px 6px; border-radius:4px; font-size:12px; font-weight:500; line-height:18px; }
.au-root .gd-tag.blue { color:var(--blue-80); background:var(--alpha-blue-10); }
.au-root .gd-tag.gray { color:var(--gray-80); background:var(--alpha-gray-10); }
.au-root .gd-tag.green { color:var(--green-80); background:rgba(65,210,147,.16); }
.au-root .gd-tag.red { color:var(--red-70); background:var(--alpha-red-10); }

.au-root .gd-check { width:20px; height:20px; border-radius:4px; border:1.5px solid var(--gray-40); background:#fff;
  display:inline-flex; align-items:center; justify-content:center; flex:none; }
.au-root .gd-check.on { background:var(--blue-60); border-color:var(--blue-60); }
.au-root .gd-check.on::after { content:""; width:5px; height:9px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg) translateY(-1px); }
.au-root .gd-radio { width:22px; height:22px; border-radius:50%; border:1.5px solid var(--gray-40); background:#fff; flex:none; display:inline-flex; align-items:center; justify-content:center; }
.au-root .gd-radio.on { border-color:var(--blue-60); }
.au-root .gd-radio.on::after { content:""; width:12px; height:12px; border-radius:50%; background:var(--blue-60); }

.au-root .gd-segment { display:flex; padding:3px; background:var(--gray-20); border:1px solid var(--gray-30); border-radius:6px; gap:2px; }
.au-root .gd-segment button { flex:1; border:none; background:transparent; cursor:pointer; padding:7px 10px;
  font-size:13px; font-weight:600; color:var(--gray-70); border-radius:4px; }
.au-root .gd-segment button.active { background:#fff; color:var(--gray-90); box-shadow:0 1px 2px rgba(0,0,0,.08); }

.au-root .gd-banner { display:flex; align-items:flex-start; gap:8px; padding:12px 14px; border-radius:8px; font-size:13px; line-height:1.5; }
.au-root .gd-banner.info { border:1px solid var(--alpha-blue-10); background:var(--alpha-blue-05); color:var(--blue-80); }
.au-root .gd-banner.basic { border:1px solid var(--alpha-gray-10); background:var(--alpha-gray-05); color:var(--gray-80); }
.au-root .gd-banner.negative { border:1px solid var(--alpha-red-10); background:var(--alpha-red-05); color:var(--red-70); }

/* 토스트 = 앱 라이브러리 mobile/SnackBar (2026-10-02): 335폭(좌우 20) · padding 16/20 · radius 8 · Gray/80 · body2_500 흰색 · 2줄까지 · 그림자 없음. bottom 은 tsx 에서 CTA·시트 푸터 위 12 로 계산 */
.au-root .gd-toast { position:absolute; left:20px; right:20px; bottom:20px; z-index:40; display:flex; align-items:center; gap:10px;
  padding:16px 20px; border-radius:8px; background:var(--gray-80); color:#fff; font-size:14px; font-weight:500; line-height:22px; text-align:left; }
.au-root .gd-toast.error { background:var(--red-60); }
.au-root .gd-toast-msg { flex:1; min-width:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:keep-all; }
.au-root .gd-toast-ic { position:relative; flex:none; width:20px; height:20px; border-radius:50%; }
.au-root .gd-toast.success .gd-toast-ic { background:var(--blue-60); }
.au-root .gd-toast.success .gd-toast-ic::after { content:''; position:absolute; left:7px; top:4px; width:5px; height:9px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
.au-root .gd-toast.error .gd-toast-ic { background:#fff; }
.au-root .gd-toast.error .gd-toast-ic::before, .au-root .gd-toast.error .gd-toast-ic::after { content:''; position:absolute; left:9px; top:4px; width:2px; height:12px; border-radius:1px; background:var(--red-60); transform:rotate(45deg); }
.au-root .gd-toast.error .gd-toast-ic::after { transform:rotate(-45deg); }

.au-root .gd-datepicker { width:100%; padding:8px 0 4px; background:#fff; border:none; border-radius:8px; display:flex; flex-direction:column; gap:8px; }
.au-root .gd-dp-header { display:flex; align-items:center; justify-content:space-between; margin:0 4px; }
.au-root .gd-dp-title { font-size:16px; font-weight:600; color:var(--gray-100); }
.au-root .gd-dp-navs { display:flex; gap:8px; }
.au-root .gd-dp-nav { width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--alpha-gray-20); background:#fff; cursor:pointer; color:var(--gray-70); border-radius:4px; }
.au-root .gd-dp-nav:disabled { color:var(--gray-40); cursor:not-allowed; }
.au-root .gd-dp-nav svg { width:16px; height:16px; }
.au-root .gd-dp-nav.prev svg { transform:rotate(90deg); }
.au-root .gd-dp-nav.next svg { transform:rotate(-90deg); }
.au-root .gd-dp-grid { display:grid; grid-template-columns:repeat(7,1fr); }
.au-root .gd-dp-dayname { display:flex; align-items:center; justify-content:center; height:36px; font-size:13px; font-weight:500; color:var(--gray-60); }
.au-root .gd-dp-dayname.sun { color:#FB8C97; }
.au-root .gd-dp-cell { display:flex; align-items:center; justify-content:center; height:42px; }
.au-root .gd-dp-day { width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; border:none; background:none;
  cursor:pointer; border-radius:6px; font-size:14px; color:var(--gray-90); }
.au-root .gd-dp-day:hover { background:var(--alpha-gray-05); }
.au-root .gd-dp-day.sun { color:#FB8C97; }
.au-root .gd-dp-day.today { background:var(--alpha-blue-10); color:var(--blue-60); font-weight:600; }
.au-root .gd-dp-day.selected { background:var(--blue-60); color:#fff; font-weight:600; }
.au-root .gd-dp-day:disabled { color:var(--gray-40); cursor:not-allowed; background:none; }
.au-root .gd-dp-day.today:disabled { background:none; }

/* ---------- 레이아웃 ---------- */
.au-lab { min-height:100vh; background:var(--gray-15); display:flex; justify-content:center; align-items:flex-start; gap:40px; padding:32px 24px; }
.au-panel { width:300px; flex:none; position:sticky; top:32px; }
.au-panel h1 { font-size:22px; line-height:1.35; font-weight:700; margin:0 0 8px; }
.au-panel p.lead { font-size:13px; color:var(--gray-70); margin:0 0 20px; }
.au-ctl { background:#fff; border:1px solid var(--gray-30); border-radius:8px; padding:16px; display:flex; flex-direction:column; gap:14px; }
.au-ctl + .au-ctl { margin-top:12px; }
.au-ctl-head { display:flex; flex-direction:column; gap:2px; padding-bottom:10px; border-bottom:1px solid var(--gray-20); }
.au-ctl-head strong { font-size:14px; font-weight:700; color:var(--gray-100); }
.au-ctl-head span { font-size:11px; color:var(--gray-60); }
.au-ctl-group > span { display:block; font-size:12px; font-weight:700; color:var(--gray-70); margin-bottom:6px; }
.au-ctl .gd-segment button { padding:6px 4px; font-size:12px; }
.au-ctl-note { font-size:12px; color:var(--gray-60); margin-top:12px; }

.au-phone { width:390px; height:min(844px, calc(100vh - 64px)); min-height:600px; background:#fff; border-radius:28px; border:1px solid var(--gray-30);
  box-shadow:0 12px 40px rgba(17,23,35,.10); position:relative; overflow:hidden; display:flex; flex-direction:column; flex:none; }
.au-topbar { height:52px; flex:none; display:flex; align-items:center; gap:4px; padding:0 8px; border-bottom:1px solid var(--gray-30); background:#fff; z-index:5; }
.au-topbar button { width:40px; height:40px; border:none; background:none; cursor:pointer; color:var(--gray-90); display:inline-flex; align-items:center; justify-content:center; }
.au-topbar strong { font-size:17px; font-weight:700; }
.au-scroll { flex:1; overflow-y:auto; overscroll-behavior:contain; padding-bottom:112px; background:var(--gray-15); }

.au-sec { background:#fff; padding:24px 20px; margin-bottom:8px; scroll-margin-top:8px; transition:box-shadow .2s; }
.au-sec.err { box-shadow:inset 3px 0 0 var(--red-60); }
.au-sec-head { display:flex; align-items:center; gap:6px; margin-bottom:14px; }
.au-sec-head h2 { font-size:17px; font-weight:700; margin:0; }
.au-sec-head .opt { font-size:12px; color:var(--gray-60); font-weight:500; }
.au-sec-head .req { font-size:12px; color:var(--red-60); font-weight:700; }
.au-sub { font-size:13px; font-weight:700; color:var(--gray-70); margin:18px 0 8px; display:flex; gap:4px; align-items:center; }
.au-sub .req { font-size:12px; color:var(--red-60); font-weight:700; }
.au-seg-err .gd-segment { border-color:var(--red-60); }
.au-err { margin-top:8px; font-size:12px; color:var(--red-60); }
.au-help { margin-top:8px; font-size:12px; color:var(--gray-60); }

.au-pick { width:100%; display:flex; align-items:center; gap:12px; padding:14px 16px; border:1px solid var(--gray-30); border-radius:8px; background:#fff;
  cursor:pointer; text-align:left; }
.au-pick:hover { border-color:var(--gray-50); }
.au-pick.err { border-color:var(--red-60); }
.au-pick.open { border-color:var(--gray-100); }
.au-pick-body { flex:1; min-width:0; }
.au-pick-title { font-size:15px; font-weight:600; color:var(--gray-100); }
.au-pick-sub { font-size:13px; color:var(--gray-60); margin-top:2px; }
.au-pick-ph { font-size:15px; color:var(--gray-50); }
.au-wrap { line-height:1.45; overflow-wrap:anywhere; }
.au-pick.au-pick-top { align-items:flex-start; }
.au-price-row { display:flex; justify-content:space-between; gap:12px; font-size:14px; color:var(--gray-70); padding:2px 0; }
.au-price-row strong { color:var(--gray-90); font-weight:600; white-space:nowrap; }
.au-price-val { display:flex; flex-direction:column; align-items:flex-end; flex:none; }
.au-price-val s { font-size:12px; color:var(--gray-50); }
.au-price-total { display:flex; justify-content:space-between; gap:12px; margin-top:8px; padding-top:8px; border-top:1px solid var(--gray-30); font-size:14px; color:var(--gray-90); }
.au-price-total strong { font-size:16px; font-weight:700; white-space:nowrap; }
.au-opt-price { display:flex; flex-direction:column; align-items:flex-end; flex:none; font-size:15px; }
.au-opt-price s { font-size:12px; color:var(--gray-50); }
.au-pick svg { width:18px; height:18px; color:var(--gray-60); flex:none; }
.au-pick.static { cursor:default; background:var(--gray-10); }

.au-chips { display:flex; flex-wrap:wrap; gap:8px; }
.au-chip { height:38px; padding:0 14px; border:1px solid var(--gray-30); border-radius:19px; background:#fff; font-size:14px; font-weight:500; color:var(--gray-80); cursor:pointer; }
.au-chip:hover { border-color:var(--gray-50); }
.au-chip.on { border-color:var(--blue-60); background:var(--alpha-blue-05); color:var(--blue-60); font-weight:600; }
.au-chip:disabled { color:var(--gray-40); background:var(--gray-10); cursor:not-allowed; border-color:var(--gray-20); }
.au-times { margin-top:14px; scroll-margin-top:8px; }
.au-times h4 { font-size:12px; font-weight:600; color:var(--gray-60); margin:10px 0 6px; }
.au-times .au-chips { gap:6px; }
.au-times .au-chip { height:36px; min-width:74px; padding:0 10px; border-radius:6px; }

.au-today { display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:8px; background:var(--gray-10); border:1px solid var(--gray-30); }
.au-today strong { font-size:15px; }
.au-today span { font-size:13px; color:var(--gray-60); display:block; margin-top:2px; }

.au-person-list { display:flex; flex-direction:column; gap:8px; }
.au-person-tag { display:inline-flex; align-items:center; height:30px; padding:0 10px; border-radius:15px; background:var(--alpha-blue-10); color:var(--blue-80); font-size:13px; font-weight:600; }

.au-field + .au-field { margin-top:12px; }
.au-field label { display:block; font-size:13px; font-weight:700; color:var(--gray-70); margin-bottom:6px; }
.au-row { display:flex; gap:8px; }
.au-row > * { flex:1; }
.au-addr-search { display:flex; gap:8px; }
.au-addr-search .gd-input { flex:1; }

.au-terms-all { display:flex; align-items:center; gap:10px; padding:14px 16px; border-radius:8px; background:var(--gray-10); cursor:pointer; border:1px solid transparent; width:100%; text-align:left; }
.au-terms-all strong { font-size:15px; }
.au-term { display:flex; align-items:center; gap:10px; padding:12px 4px; }
.au-term button.chk { display:flex; align-items:center; gap:10px; border:none; background:none; cursor:pointer; flex:1; text-align:left; padding:0; font-size:14px; color:var(--gray-90); }
.au-term .view { border:none; background:none; color:var(--gray-60); font-size:13px; text-decoration:underline; cursor:pointer; }

.au-cta { position:absolute; left:0; right:0; bottom:0; padding:12px 20px 24px; background:#fff; border-top:1px solid var(--gray-30); z-index:10; }
.au-cta .gd-btn { width:100%; }

/* ---------- 바텀시트 ---------- */
.au-dim { position:absolute; inset:0; background:var(--alpha-black-50); z-index:30; display:flex; align-items:flex-end; }
.au-sheet { width:100%; max-height:86%; background:#fff; border-radius:16px 16px 0 0; display:flex; flex-direction:column; }
.au-sheet-head { display:flex; align-items:center; justify-content:space-between; padding:20px 20px 8px; }
.au-sheet-head h3 { margin:0; font-size:18px; font-weight:700; }
.au-sheet-head button { border:none; background:none; cursor:pointer; color:var(--gray-60); width:32px; height:32px; font-size:22px; line-height:1; }
.au-sheet-body { overflow-y:auto; min-height:0; padding:8px 20px 16px; }
.au-sheet-foot { padding:12px 20px 24px; border-top:1px solid var(--gray-30); }
.au-sheet-foot .gd-btn { width:100%; }
.au-sheet h4 { font-size:13px; font-weight:700; color:var(--gray-70); margin:16px 0 8px; display:flex; justify-content:space-between; align-items:center; }
.au-sheet h4:first-child { margin-top:4px; }

.au-opt { width:100%; display:flex; align-items:center; gap:12px; padding:14px 16px; border:1px solid var(--gray-30); border-radius:8px; background:#fff; cursor:pointer; text-align:left; }
.au-opt + .au-opt { margin-top:8px; }

.rs-sheet-scroll { overflow-y:auto; min-height:0; }

.rs-rc-list { padding:0 20px 8px; border-top:1px solid var(--g20); }
.rs-sheet-dim .rs-alert-dim { z-index:60; }

.au-ctl-sub { font-size:11px; font-weight:500; color:var(--gray-60); margin-left:6px; flex:1; }

/* 콘텐츠가 적을 때 마지막 섹션이 CTA까지 흰색으로 채워지도록 */
.au-scroll { display:flex; flex-direction:column; padding-bottom:0; }
.au-scroll > * { flex-shrink:0; }
.au-scroll > .au-sec:last-of-type { flex-grow:1; margin-bottom:0; padding-bottom:136px; }
