/* styles/connectShell.css */
/* =============================================================
   굿닥 커넥트 웹뷰 — 공통 셸 (디자인 토큰 + 윈도우 셸/사이드내비)
   여러 커넥트 화면(진료항목 등록, 예약 신청 내역 등)이 공유한다.
   - /Users/goodoc/test 프로토타입의 colors_and_type.css(:root)와
     connect.css의 셸 부분을 이식.
   - 전역 누수 방지를 위해 원본 body 레벨 스타일은 .cn-artboard 래퍼로
     한정했고 리셋도 .cn-artboard 하위로 스코프.
   - 클래스 접두사(cn-)가 고유해 다른 페이지와 충돌하지 않음.
   ============================================================= */

/* ---- Design tokens (colors_and_type.css :root, @font-face 제외) ---- */
:root {
  --gray-10:  #F9FAFB;
  --gray-15:  #F4F6F8;
  --gray-20:  #F2F4F6;
  --gray-30:  #E5E8EB;
  --gray-40:  #D1D6DB;
  --gray-50:  #B0B8C1;
  --gray-60:  #8B95A1;
  --gray-70:  #6B7684;
  --gray-80:  #4E5968;
  --gray-90:  #31353F;
  --gray-100: #191F28;

  --blue-30:  #B3D5FF;
  --blue-60:  #0073FA;
  --blue-70:  #0061DB;
  --blue-80:  #0050B5;

  --red-60:   #FA4655;
  --red-70:   #EC3847;
  --red-80:   #D52130;

  --green-70: #41D293;
  --green-80: #1FA972;
  --orange-60:#F79009;

  --white: #FFFFFF;
  --black: #000000;
  --transparent: transparent;

  --alpha-gray-05: rgba(128, 135, 153, 0.05);
  --alpha-gray-10: rgba(128, 135, 153, 0.10);
  --alpha-gray-15: rgba(128, 135, 153, 0.15);
  --alpha-gray-20: rgba(128, 135, 153, 0.20);
  --alpha-gray-40: rgba(128, 135, 153, 0.40);
  --alpha-gray-60: rgba(128, 135, 153, 0.60);

  --alpha-blue-05: rgba(0, 115, 250, 0.05);
  --alpha-blue-10: rgba(0, 115, 250, 0.10);
  --alpha-blue-15: rgba(0, 115, 250, 0.15);
  --alpha-blue-20: rgba(0, 115, 250, 0.20);

  --alpha-red-05: rgba(250, 70, 85, 0.05);
  --alpha-red-10: rgba(250, 70, 85, 0.10);
  --alpha-red-15: rgba(250, 70, 85, 0.15);
  --alpha-red-20: rgba(250, 70, 85, 0.20);

  --shadow-toast: 0 2px 1px rgba(22, 24, 29, 0.02), 0 2px 8px rgba(22, 24, 29, 0.10);
  --shadow-toggle-knob: 0 0 6px rgba(0, 0, 0, 0.25);

  --font-sans: 'Pretendard', 'Pretendard Variable', -apple-system,
    BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}

/* ---- Artboard backdrop (원본 connect.css의 body 스타일을 래퍼로 한정) ---- */
.cn-artboard {
  font-family: var(--font-sans);
  background: #e7e9ee;
  color: var(--gray-100);
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 24px;
}
.cn-artboard *,
.cn-artboard *::before,
.cn-artboard *::after { box-sizing: border-box; }

/* ---- App window (1280 x 832 rounded webview frame) ---- */
.cn-screen {
  width: 1280px;
  min-height: 832px;
  background: var(--white);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 12px 40px rgba(22, 24, 29, 0.12);
  position: relative;
}

/* ---- Title bar (windows-style) ---- */
.cn-titlebar {
  height: 32px;
  background: #f3f3f3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: none;
}
.cn-ci { display: flex; align-items: center; gap: 4px; padding: 0 8px; height: 100%; }
.cn-ci-mark { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
.cn-ci-mark svg { display: block; }
.cn-ci-name { font: 500 13px/16px var(--font-sans); color: rgba(0, 0, 0, 0.9); padding: 0 8px 2px 4px; }
.cn-winctrls { display: flex; height: 100%; }
.cn-winbtn {
  width: 46px; height: 32px;
  border: 0; background: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  color: rgba(0, 0, 0, 0.9); cursor: pointer;
}
.cn-winbtn:hover { background: rgba(0, 0, 0, 0.05); }
.cn-winbtn.close:hover { background: #e81123; color: #fff; }

/* ---- Body: nav + main ---- */
.cn-body { display: flex; align-items: stretch; flex: 1; min-height: 800px; }

/* ---- Side nav (250px) ---- */
.cn-nav { width: 250px; flex: none; background: #f2f4f7; position: relative; display: flex; flex-direction: column; }
.cn-nav-scroll { flex: 1; overflow: auto; }
.cn-nav-group { padding: 8px 0; display: flex; flex-direction: column; }
.cn-nav-header { height: 40px; display: flex; align-items: center; padding: 0 16px; font: 600 14px/20px var(--font-sans); color: rgba(0, 0, 0, 0.9); }
.cn-nav-item {
  height: 40px; width: 100%;
  border: 0; background: transparent;
  display: flex; align-items: center;
  padding: 0 16px; position: relative; cursor: pointer; text-align: left;
}
.cn-nav-item > .cn-nav-label { font: 400 14px/22px var(--font-sans); color: var(--gray-90); flex: 1; }
.cn-nav-item .cn-chevron { width: 12px; height: 12px; color: #808799; flex: none; display: inline-flex; align-items: center; justify-content: center; }
.cn-nav-item.sub { padding-left: 32px; }
.cn-nav-item.sub::before { content: ""; position: absolute; inset: 2px 4px; border-radius: 4px; pointer-events: none; }
.cn-nav-item.active::before { background: var(--alpha-gray-10); }

.cn-nav-item:not(.active):not(.cn-nav-header):hover::before {
  content: ""; position: absolute; inset: 2px 4px;
  background: rgba(128, 135, 153, 0.06); border-radius: 4px; pointer-events: none;
}
.cn-nav-label-wrap { display: inline-flex; align-items: center; gap: 6px; flex: 1; }
.cn-beta {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 5px; border-radius: 4px;
  background: var(--alpha-blue-10);

  color: var(--blue-80, #115fd4);
}
.cn-nav-divider { padding: 4px 0; }
.cn-nav-divider span { display: block; height: 1px; background: var(--gray-30); }
.cn-nav-footer { background: #f2f4f7; padding-bottom: 8px; display: flex; flex-direction: column; }

/* ---- Main frame ---- */
.cn-main { flex: 1; min-width: 0; background: var(--white); display: flex; flex-direction: column; }
.cn-header { padding: 48px 64px 32px; }
.cn-header-title { font: 700 28px/36px var(--font-sans); color: #16181d; }
.cn-header-desc { font: 400 14px/22px var(--font-sans); color: #808799; margin-top: 6px; }


/* styles/prototypeChanges.css */

/* 딤 제거: 우측 패널을 비모달로 (열어둔 채 본문 확인·조작 가능) */

.pc-drawer-title-wrap { padding: 22px 20px 16px; flex: none; }

.pc-switch { width: 40px; height: 24px; padding: 2px; border-radius: 999px; background: var(--gray-40); cursor: pointer; transition: background .15s; flex: none; }

.pc-dev-marker-layer { position: fixed; inset: 0; z-index: 110; pointer-events: none; }
.pc-dev-marker-layer, .pc-dev-marker-layer *, .pc-dev-marker-layer *::before, .pc-dev-marker-layer *::after { box-sizing: border-box; }
.pc-dev-marker-shell { position: fixed; width: 30px; height: 30px; pointer-events: auto; }

.pc-dev-marker-tooltip-head > div { min-width: 0; display: flex; flex-direction: column; }

.pc-document-body .pc-markdown { max-width: 760px; margin: 24px auto 0; }
.pc-document-body .pc-markdown h1 { font-size: 25px; line-height: 34px; }
.pc-document-body .pc-markdown h2 { margin-top: 28px; font-size: 18px; line-height: 27px; }
.pc-document-body .pc-markdown p, .pc-document-body .pc-md-li { font-size: 14px; line-height: 23px; }

.pc-summary-view { padding: 20px 20px 32px; overflow: auto; }
.pc-summary-meta { display: flex; align-items: center; gap: 7px; }
.pc-summary-release { margin-top: 10px; color: #9a5800; font: 600 12px/18px var(--font-sans); }
.pc-summary-source { margin-top: 10px; padding: 10px 12px; border-radius: 7px; background: var(--gray-10); color: var(--gray-60); font: 500 11px/17px var(--font-sans); word-break: break-all; }
.pc-markdown { margin-top: 18px; }
.pc-markdown h1 { margin: 0 0 16px; color: var(--gray-100); font: 700 21px/29px var(--font-sans); }
.pc-markdown h2 { margin: 22px 0 9px; color: var(--gray-100); font: 700 16px/24px var(--font-sans); }
.pc-markdown h3 { margin: 18px 0 8px; color: var(--gray-90); font: 700 14px/22px var(--font-sans); }
.pc-markdown p { margin: 0; color: var(--gray-70); font: 400 13px/21px var(--font-sans); }
.pc-markdown blockquote { margin: 0 0 16px; padding: 12px 14px; border-left: 3px solid var(--blue-60); background: var(--alpha-blue-05); color: var(--gray-80); font: 500 12px/20px var(--font-sans); }
.pc-markdown code { padding: 2px 5px; border-radius: 4px; background: var(--gray-20); color: var(--gray-80); font: 500 11px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-md-li { display: grid; grid-template-columns: 10px 1fr; gap: 5px; align-items: start; margin-top: 5px; }
.pc-md-li > span { color: var(--blue-60); font: 700 13px/21px var(--font-sans); }
.pc-md-gap { height: 6px; }

.pc-policy-highlight { animation: pc-policy-pulse 2.4s ease; outline: 3px solid var(--blue-60); outline-offset: 4px; border-radius: 8px; }
.pc-planned-row-badge { display: inline-flex; margin-left: 6px; padding: 1px 5px; border-radius: 4px; background: rgba(247,144,9,.12); color: #9a5800; vertical-align: 1px; font: 700 10px/15px var(--font-sans); }
@keyframes pc-policy-pulse {
  0%, 100% { outline-color: transparent; box-shadow: none; }
  15%, 70% { outline-color: var(--blue-60); box-shadow: 0 0 0 8px var(--alpha-blue-10); }
}

@media (max-width: 1100px) {
  .pc-drawer { width: min(392px, calc(100% - 24px)); }
  .pc-scrim { left: 0; }
  .pc-document-overlay { padding: 20px; }
  .pc-document-modal { width: calc(100vw - 40px); height: calc(100vh - 40px); }
  .pc-document-body { padding: 20px 22px 32px; }
}


/* styles/adotWebview.css */
/* =============================================================
   adot-webview — SKT 에이닷 연동 굿닥 "예약 정보 확인" 인앱 웹뷰 케이스 전환형 프로토
   토큰: goodoc-design colors_and_type.css 발췌(피그마 Foundations 이름 1:1). plain CSS, 클래스 aw-*.
   ============================================================= */

.aw-root {
  --gray-10: #F9F9FB; --gray-15: #F6F7F9; --gray-20: #F2F4F7; --gray-30: #E3E6ED;
  --gray-40: #CACED8; --gray-50: #A8AEBD; --gray-60: #808799; --gray-70: #5D6474;
  --gray-80: #434956; --gray-90: #31353F; --gray-100: #16181D;
  --blue-20: #E5F2FF; --blue-30: #D1E8FF; --blue-50: #479DFF; --blue-60: #0073FA; --blue-70: #066AE5; --blue-80: #115FD4;
  --red-50: #FB7480; --red-60: #FA4655; --red-70: #EC3847;
  --green-60: #41D293; --green-70: #24C38C; --green-80: #00B280;
  --orange-30: #FED8BD; --orange-60: #FC7D22; --orange-80: #C2560A; --meta: #7C4DFF; /* orange-80·meta 는 프로토 메타 전용(Foundations 외) */
  --alpha-gray-05: rgba(128,135,153,.05); --alpha-gray-10: rgba(128,135,153,.10);
  --alpha-gray-15: rgba(128,135,153,.15); --alpha-gray-20: rgba(128,135,153,.20);
  --alpha-blue-10: rgba(0,115,250,.10); --alpha-red-10: rgba(250,70,85,.10);
  --alpha-green-20: rgba(37,187,122,.20); --alpha-orange-10: rgba(255,138,61,.12);
  --dim: rgba(22,24,29,.70);           /* 앱 Dim/Darker 70% — 알럿·시트 위 2차 딤 */
  --dim-adot: rgba(22,24,29,.38);      /* 피그잼 에이닷 화면 회색 딤(목업 수준) */
  --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; --radius-xl: 12px; --radius-2xl: 16px; --radius-3xl: 24px;
  --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-family: var(--font-sans);
  color: var(--gray-100);
  font-size: 14px;
  line-height: 1.5;
  word-break: keep-all;
  min-height: 100vh;
  background: var(--gray-20);
  display: grid;
  grid-template-columns: 360px 1fr;
}
.aw-root *, .aw-root *::before, .aw-root *::after { box-sizing: border-box; }
.aw-root button { font-family: inherit; cursor: pointer; }
.aw-root input { font-family: inherit; }

/* ---------- 좌측 케이스 패널 ---------- */
.aw-panel { background: #fff; border-right: 1px solid var(--gray-30); height: 100vh; overflow-y: auto; position: sticky; top: 0; }
.aw-panel-head { padding: 18px 18px 12px; border-bottom: 1px solid var(--gray-20); }
.aw-panel-head h1 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 700; }
.aw-panel-head p { margin: 4px 0 0; font-size: 12px; line-height: 18px; color: var(--gray-60); }
.aw-panel-toggle { display: none; }
.aw-legend { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.aw-group { padding: 12px 12px 4px; }
.aw-group-title { font-size: 12px; font-weight: 700; color: var(--gray-70); padding: 0 6px 6px; }
.aw-case { display: flex; width: 100%; text-align: left; gap: 8px; align-items: flex-start; padding: 8px 8px; border-radius: var(--radius-md);
  border: 1px solid transparent; background: transparent; color: var(--gray-90); }
.aw-case:hover { background: var(--gray-15); }
.aw-case.on { background: var(--blue-20); border-color: var(--blue-30); }
.aw-case-id { flex: none; min-width: 46px; font-size: 11px; font-weight: 700; color: var(--gray-60); line-height: 20px; font-variant-numeric: tabular-nums; }
.aw-case.on .aw-case-id { color: var(--blue-80); }
.aw-case-body { flex: 1; min-width: 0; }
.aw-case-label { font-size: 13px; line-height: 20px; font-weight: 500; }
.aw-case-badges { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }

.aw-badge { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: var(--radius-sm); font-size: 10.5px; font-weight: 600; white-space: nowrap; }
.aw-badge.fj { color: var(--blue-80); background: var(--alpha-blue-10); }
.aw-badge.doc { color: var(--gray-80); background: var(--alpha-gray-15); }
.aw-badge.code { color: var(--green-80); background: var(--alpha-green-20); }
.aw-badge.prop { color: var(--orange-80); background: var(--alpha-orange-10); border: 1px dashed var(--orange-60); }

.aw-section { border-top: 1px solid var(--gray-20); padding: 14px 18px; }
.aw-section h2 { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--gray-90); display: flex; align-items: center; gap: 6px; }
.aw-section h2 small { font-weight: 500; color: var(--gray-60); font-size: 11px; }
.aw-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; }
.aw-row-label { font-size: 12px; color: var(--gray-80); line-height: 18px; flex: 1; min-width: 0; }
.aw-row-label em { font-style: normal; color: var(--gray-50); font-size: 11px; display: block; }
.aw-seg { display: inline-flex; padding: 2px; background: var(--gray-20); border-radius: var(--radius-md); gap: 2px; flex: none; }
.aw-seg button { border: none; background: transparent; padding: 4px 8px; font-size: 11.5px; font-weight: 600; color: var(--gray-70); border-radius: var(--radius-sm); white-space: nowrap; }
.aw-seg button.on { background: #fff; color: var(--gray-100); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.aw-switch { width: 34px; height: 20px; border-radius: 10px; background: var(--gray-40); border: none; position: relative; flex: none; }
.aw-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .12s; }
.aw-switch.on { background: var(--blue-60); }
.aw-switch.on::after { left: 16px; }
.aw-note { font-size: 12px; line-height: 18px; color: var(--gray-70); background: var(--gray-15); border-radius: var(--radius-lg); padding: 10px 12px; }
.aw-note b { color: var(--gray-90); }
.aw-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.aw-mini-btn { height: 28px; padding: 0 10px; font-size: 12px; font-weight: 600; border-radius: var(--radius-md); border: 1px solid var(--gray-30); background: #fff; color: var(--gray-80); }
.aw-mini-btn:hover { background: var(--gray-15); }
.aw-select { height: 28px; font-size: 12px; border: 1px solid var(--gray-30); border-radius: var(--radius-md); padding: 0 6px; background: #fff; color: var(--gray-90); max-width: 170px; }

/* ---------- 우측 스테이지 ---------- */
.aw-stage { display: flex; flex-direction: column; align-items: center; padding: 28px 16px 40px; min-width: 0; }
.aw-stage-cap { font-size: 12px; color: var(--gray-70); margin-bottom: 12px; text-align: center; max-width: 520px; }
.aw-stage-cap b { color: var(--gray-100); }
.aw-phone-wrap { position: relative; }
.aw-phone { width: 375px; height: 812px; border-radius: 44px; overflow: hidden; position: relative; background: #fff;
  box-shadow: 0 0 0 10px var(--gray-100), 0 20px 40px rgba(17,23,35,.25); transform-origin: top left; }

/* 에이닷 목업(회색) */
.aw-adot { position: absolute; inset: 0; background: #fff; }
.aw-status { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font-size: 15px; font-weight: 700; color: var(--gray-100); position: relative; z-index: 3; }
.aw-status i { width: 22px; height: 10px; border-radius: 2px; background: var(--gray-100); display: inline-block; }
.aw-adot-head { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--gray-30); }
.aw-adot-head b { font-size: 22px; font-weight: 800; letter-spacing: -.2px; }
.aw-adot-head span { font-size: 13px; font-weight: 700; color: var(--gray-70); }
.aw-adot-chat { padding: 22px 20px; display: flex; flex-direction: column; gap: 10px; }
.aw-adot-chat .t1 { font-size: 14px; font-weight: 700; }
.aw-adot-chat .t2 { font-size: 14px; color: var(--gray-80); }
.aw-adot-chat .card { border: 1px solid var(--gray-30); border-radius: var(--radius-xl); padding: 14px 16px; font-size: 14px; color: var(--gray-80); }
.aw-adot-dim { position: absolute; inset: 0; background: var(--dim-adot); z-index: 4; }
.aw-meta-card { margin: 4px 0 0; border: 1.5px dashed var(--meta); background: rgba(124,77,255,.06); color: var(--gray-90); border-radius: var(--radius-xl); padding: 12px 14px; font-size: 12.5px; line-height: 19px; }
.aw-meta-card b { color: var(--meta); display: block; font-size: 11px; margin-bottom: 2px; }
.aw-meta-card .aw-mini-btn { margin-top: 8px; }

/* 굿닥 웹뷰 컨테이너 */
.aw-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; background: #fff; display: flex; flex-direction: column;
  border-radius: var(--radius-3xl) var(--radius-3xl) 0 0; max-height: calc(100% - 128px); }
.aw-sheet.full { top: 44px; max-height: none; border-radius: 0; }
.aw-sheet.kb { bottom: 268px; }
.aw-sheet.full.kb { top: 44px; }
.aw-sheet-head { flex: none; height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--gray-30); }
.aw-logo { display: inline-flex; align-items: center; gap: 4px; font-size: 20px; font-weight: 800; color: var(--gray-100); letter-spacing: -.3px; }
.aw-sheet-head .ttl { font-size: 15px; font-weight: 500; color: var(--gray-90); flex: 1; }
.aw-close { width: 44px; height: 44px; margin-right: -12px; display: inline-flex; align-items: center; justify-content: center; border: none; background: transparent; color: var(--gray-80); }
.aw-sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px 20px 16px; }
.aw-visitor { font-size: 13px; line-height: 20px; color: var(--gray-70); }
.aw-visit-info { font-size: 13px; line-height: 20px; color: var(--gray-70); margin-top: 2px; }
.aw-title { margin: 10px 0 0; font-size: 22px; line-height: 32px; font-weight: 700; color: var(--gray-100); white-space: pre-line; }
.aw-desc { margin-top: 10px; font-size: 13px; line-height: 21px; color: var(--gray-70); }
.aw-sec { margin-top: 22px; }
.aw-sec-title { font-size: 15px; line-height: 22px; font-weight: 700; color: var(--gray-100); display: flex; align-items: center; gap: 8px; }
.aw-sec-title .right { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--gray-70); background: none; border: none; padding: 0; }
.aw-sec-sub { font-size: 12px; line-height: 18px; color: var(--gray-60); margin-top: 2px; }
.aw-rrn { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.aw-field { position: relative; flex: 1; min-width: 0; }
.aw-input { width: 100%; height: 48px; padding: 0 14px; font-size: 16px; color: var(--gray-90); background: #fff; border: 1px solid var(--gray-30); border-radius: var(--radius-lg); outline: none; letter-spacing: .5px; }
.aw-input::placeholder { color: var(--gray-50); letter-spacing: 0; }
.aw-input:focus { border-color: var(--gray-100); }
.aw-input:disabled { background: var(--gray-10); color: var(--gray-60); cursor: not-allowed; }
.aw-consent-check:disabled, .aw-all:disabled, .aw-sec-title .right:disabled { opacity: .5; cursor: not-allowed; }
.aw-input.kbfocus { border-color: var(--gray-100); }
.aw-input.err, .aw-input.err:focus { border-color: var(--red-60); }
.aw-input.masked { color: transparent; caret-color: var(--blue-60); }
.aw-mask { position: absolute; left: 15px; top: 0; height: 48px; display: flex; align-items: center; font-size: 16px; color: var(--gray-90); letter-spacing: .5px; pointer-events: none; }
.aw-dash { font-size: 18px; font-weight: 700; color: var(--gray-80); flex: none; }
.aw-back1 { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.aw-back1 .aw-field { flex: 0 0 52px; }
.aw-back1 .aw-input { text-align: center; padding: 0; }
.aw-dots { font-size: 14px; letter-spacing: 3px; color: var(--gray-50); white-space: nowrap; min-width: 0; }
.aw-dots .aw-ga { display: inline-block; }
.aw-dots .aw-ga::after { display: block; width: fit-content; margin: 2px 0 0; top: 0; letter-spacing: 0; }
.aw-ga-off .aw-dots .aw-ga::after { display: none; }
.aw-helper { margin-top: 8px; font-size: 12px; line-height: 18px; color: var(--gray-60); }
.aw-err { margin-top: 8px; font-size: 14px; line-height: 22px; font-weight: 500; color: var(--red-60); }
.aw-consents { margin-top: 8px; }
.aw-consent-item { border-bottom: 1px solid var(--gray-20); }
.aw-consent { display: flex; align-items: flex-start; gap: 10px; padding: 13px 0; }
.aw-consent-body-wrap { position: relative; margin: 0 0 14px 30px; }
.aw-consent-fade { position: absolute; left: 0; right: 0; bottom: 0; height: 32px; border-radius: 0 0 var(--radius-lg) var(--radius-lg); background: linear-gradient(rgba(249,249,251,0), var(--gray-10)); pointer-events: none; } /* 내부 스크롤 표시(최소) */
.aw-consent-body { max-height: 240px; overflow-y: auto; overscroll-behavior: contain; margin: 0; padding: 12px 14px; background: var(--gray-10); border-radius: var(--radius-lg); font-size: 13px; line-height: 21px; color: var(--gray-80); white-space: pre-line; }
.aw-chev { display: inline-flex; vertical-align: -1px; transition: transform .15s; }
.aw-chev.up { transform: rotate(180deg); }
.aw-sheet-body.acc { padding-bottom: 28px; }
.aw-consent-check { flex: none; display: flex; align-items: flex-start; gap: 10px; background: none; border: none; padding: 0; text-align: left; flex: 1; min-width: 0; color: var(--gray-90); font-size: 14px; line-height: 21px; }
.aw-check { flex: none; width: 20px; height: 20px; margin-top: 0.5px; border-radius: 50%; border: 1px solid var(--gray-40); background: #fff; display: inline-flex; align-items: center; justify-content: center; }
.aw-check.on { background: var(--blue-60); border-color: var(--blue-60); }
.aw-check svg { display: block; }
.aw-view { flex: none; font-size: 13px; line-height: 21px; color: var(--gray-70); background: none; border: none; padding: 0 0 0 4px; white-space: nowrap; }
.aw-consent-foot { margin-top: 8px; font-size: 11.5px; line-height: 17px; color: var(--gray-60); }
.aw-all { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--gray-30); font-size: 14px; font-weight: 700; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; color: var(--gray-100); }
.aw-stack { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.aw-small-note { margin-top: 8px; font-size: 12px; line-height: 18px; color: var(--gray-60); }

.aw-foot { flex: none; padding: 12px 20px 0; background: #fff; }
.aw-cta { width: 100%; height: 48px; border-radius: var(--radius-lg); border: none; font-size: 15px; font-weight: 700; color: #fff; background: var(--blue-60); }
.aw-cta:active { background: var(--blue-70); }
.aw-cta:disabled { background: var(--blue-30); color: var(--gray-60); cursor: not-allowed; }
.aw-cta.busy { background: var(--blue-50); color: #fff; cursor: progress; }
.aw-cta.sub { background: var(--gray-20); color: var(--gray-70); }
.aw-foot-help { margin-top: 8px; font-size: 12px; line-height: 18px; text-align: center; color: var(--gray-60); }
.aw-home { height: 34px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; flex: none; }
.aw-home i { width: 134px; height: 5px; border-radius: 3px; background: var(--gray-100); }
.aw-btn-row { display: flex; gap: 8px; }
.aw-btn-row .aw-cta { flex: 1; }

/* 가운데 상태 화면(로딩·진입 에러·안내) */
.aw-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px 24px; min-height: 260px; }
.aw-state-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
.aw-state-icon.gray { background: var(--gray-20); color: var(--gray-60); }
.aw-state-icon.red { background: var(--alpha-red-10); color: var(--red-60); }
.aw-state-icon.blue { background: var(--blue-20); color: var(--blue-60); }
.aw-state h3 { margin: 0; font-size: 18px; line-height: 27px; font-weight: 700; color: var(--gray-100); white-space: pre-line; }
.aw-state p { margin: 6px 0 0; font-size: 14px; line-height: 22px; color: var(--gray-70); white-space: pre-line; }
.aw-spinner { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--gray-30); border-top-color: var(--blue-60); animation: aw-spin .8s linear infinite; margin-bottom: 16px; }
.aw-spin-sm { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); border-top-color: #fff; animation: aw-spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes aw-spin { to { transform: rotate(360deg); } }
.aw-countdown { margin-top: 8px; font-size: 13px; color: var(--gray-60); }

/* 오버레이(시트 위) */
.aw-ov { position: absolute; inset: 0; z-index: 20; background: var(--dim); display: flex; align-items: center; justify-content: center; }
.aw-ov.bottom { align-items: flex-end; }
.aw-alert { width: 315px; background: #fff; border-radius: var(--radius-xl); padding: 24px 20px 20px; }
.aw-alert h4 { margin: 0; font-size: 20px; line-height: 30px; font-weight: 700; color: var(--gray-100); }
.aw-alert p { margin: 16px 0 0; font-size: 14px; line-height: 22px; color: var(--gray-60); white-space: pre-line; }
.aw-alert .aw-btn-row { margin-top: 24px; }
.aw-alert .aw-cta { height: 48px; border-radius: var(--radius-md); font-size: 14px; }
.aw-msheet { width: 100%; background: #fff; border-radius: var(--radius-2xl) var(--radius-2xl) 0 0; padding: 28px 20px 0; }
.aw-msheet h4 { margin: 0; font-size: 20px; line-height: 30px; font-weight: 700; }
.aw-msheet p { margin: 10px 0 0; font-size: 14px; line-height: 22px; color: var(--gray-70); white-space: pre-line; }
.aw-msheet .aw-cta { margin-top: 24px; }

/* 약관 상세(풀페이지) */
.aw-detail { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; z-index: 15; background: #fff; display: flex; flex-direction: column; }
.aw-detail-head { flex: none; min-height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 20px; border-bottom: 1px solid var(--gray-20); }
.aw-detail-head h4 { flex: 1; margin: 0; font-size: 16px; line-height: 24px; font-weight: 700; padding: 10px 0; }
.aw-detail-body { flex: 1; overflow-y: auto; padding: 16px 20px 24px; font-size: 14px; line-height: 23px; color: var(--gray-80); white-space: pre-line; }

/* 숫자 키패드(키보드 시뮬레이션) */
.aw-kb { position: absolute; left: 0; right: 0; bottom: 0; height: 268px; z-index: 6; background: #D1D4DA; padding: 26px 6px 34px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.aw-kb button { border: none; border-radius: 6px; background: #fff; font-size: 22px; font-weight: 500; color: var(--gray-100); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.aw-kb button.fn { background: transparent; box-shadow: none; font-size: 15px; }
.aw-kb-cap { position: absolute; left: 0; right: 0; bottom: 250px; z-index: 7; text-align: center; font-size: 10.5px; color: var(--gray-60); pointer-events: none; }

/* 가안·제안 표기 */
.aw-ga { outline: 1px dashed var(--gray-50); outline-offset: 2px; border-radius: 2px; position: relative; }
.aw-ga::after { content: attr(data-tag); position: relative; top: -1px; margin-left: 4px; display: inline-block; padding: 0 3px; font-size: 9.5px; line-height: 14px; font-weight: 700; border-radius: 3px; color: var(--gray-70); background: var(--gray-20); vertical-align: middle; letter-spacing: 0; }
.aw-ga.prop { outline-color: var(--orange-60); }
.aw-ga.prop::after { color: var(--orange-80); background: var(--alpha-orange-10); }
.aw-ga-off .aw-ga { outline: none; }
.aw-ga-off .aw-ga::after { display: none; }

/* ---------- 반응형 ---------- */
@media (max-width: 900px) {
  .aw-root { grid-template-columns: 1fr; }
  .aw-panel { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--gray-30); }
  .aw-panel-toggle { display: inline-flex; margin-top: 10px; }
  .aw-panel.collapsed .aw-panel-rest { display: none; }
  .aw-stage { padding: 20px 16px 32px; }
}
