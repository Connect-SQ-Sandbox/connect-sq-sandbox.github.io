/* styles/connectShell.css */
/* Shared prototype styles. */

/* ---- Design tokens (colors_and_type.css :root, @font-face 제외) ---- */
:root {
  --gray-10:  #F9FAFB;
  --gray-15:  #F4F6F8;
  --gray-20:  #F2F4F6;
  --gray-30:  #E5E8EB;
  --gray-40:  #D1D6DB;
  --gray-50:  #B0B8C1;
  --gray-60:  #8B95A1;
  --gray-70:  #6B7684;
  --gray-80:  #4E5968;
  --gray-90:  #31353F;
  --gray-100: #191F28;

  --blue-30:  #B3D5FF;
  --blue-60:  #0073FA;
  --blue-70:  #0061DB;
  --blue-80:  #0050B5;

  --red-60:   #FA4655;
  --red-70:   #EC3847;
  --red-80:   #D52130;

  --green-70: #41D293;
  --green-80: #1FA972;
  --orange-60:#F79009;

  --white: #FFFFFF;
  --black: #000000;
  --transparent: transparent;

  --alpha-gray-05: rgba(128, 135, 153, 0.05);
  --alpha-gray-10: rgba(128, 135, 153, 0.10);
  --alpha-gray-15: rgba(128, 135, 153, 0.15);
  --alpha-gray-20: rgba(128, 135, 153, 0.20);
  --alpha-gray-40: rgba(128, 135, 153, 0.40);
  --alpha-gray-60: rgba(128, 135, 153, 0.60);

  --alpha-blue-05: rgba(0, 115, 250, 0.05);
  --alpha-blue-10: rgba(0, 115, 250, 0.10);
  --alpha-blue-15: rgba(0, 115, 250, 0.15);
  --alpha-blue-20: rgba(0, 115, 250, 0.20);

  --alpha-red-05: rgba(250, 70, 85, 0.05);
  --alpha-red-10: rgba(250, 70, 85, 0.10);
  --alpha-red-15: rgba(250, 70, 85, 0.15);
  --alpha-red-20: rgba(250, 70, 85, 0.20);

  --shadow-toast: 0 2px 1px rgba(22, 24, 29, 0.02), 0 2px 8px rgba(22, 24, 29, 0.10);
  --shadow-toggle-knob: 0 0 6px rgba(0, 0, 0, 0.25);

  --font-sans: 'Pretendard', 'Pretendard Variable', -apple-system,
    BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}

/* ---- Artboard backdrop (원본 connect.css의 body 스타일을 래퍼로 한정) ---- */
.cn-artboard {
  font-family: var(--font-sans);
  background: #e7e9ee;
  color: var(--gray-100);
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 24px;
}
.cn-artboard *,
.cn-artboard *::before,
.cn-artboard *::after { box-sizing: border-box; }

/* ---- App window (1280 x 832 rounded webview frame) ---- */
.cn-screen {
  width: 1280px;
  min-height: 832px;
  background: var(--white);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 12px 40px rgba(22, 24, 29, 0.12);
  position: relative;
}

/* ---- Title bar (windows-style) ---- */
.cn-titlebar {
  height: 32px;
  background: #f3f3f3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: none;
}
.cn-ci { display: flex; align-items: center; gap: 4px; padding: 0 8px; height: 100%; }
.cn-ci-mark { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
.cn-ci-mark svg { display: block; }
.cn-ci-name { font: 500 13px/16px var(--font-sans); color: rgba(0, 0, 0, 0.9); padding: 0 8px 2px 4px; }
.cn-winctrls { display: flex; height: 100%; }
.cn-winbtn {
  width: 46px; height: 32px;
  border: 0; background: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  color: rgba(0, 0, 0, 0.9); cursor: pointer;
}
.cn-winbtn:hover { background: rgba(0, 0, 0, 0.05); }
.cn-winbtn.close:hover { background: #e81123; color: #fff; }

/* ---- Body: nav + main ---- */
.cn-body { display: flex; align-items: stretch; flex: 1; min-height: 800px; }

/* ---- Side nav (250px) ---- */
.cn-nav { width: 250px; flex: none; background: #f2f4f7; position: relative; display: flex; flex-direction: column; }
.cn-nav-scroll { flex: 1; overflow: auto; }
.cn-nav-group { padding: 8px 0; display: flex; flex-direction: column; }
.cn-nav-header { height: 40px; display: flex; align-items: center; padding: 0 16px; font: 600 14px/20px var(--font-sans); color: rgba(0, 0, 0, 0.9); }
.cn-nav-item {
  height: 40px; width: 100%;
  border: 0; background: transparent;
  display: flex; align-items: center;
  padding: 0 16px; position: relative; cursor: pointer; text-align: left;
}
.cn-nav-item > .cn-nav-label { font: 400 14px/22px var(--font-sans); color: var(--gray-90); flex: 1; }
.cn-nav-item .cn-chevron { width: 12px; height: 12px; color: #808799; flex: none; display: inline-flex; align-items: center; justify-content: center; }
.cn-nav-item.sub { padding-left: 32px; }
.cn-nav-item.sub::before { content: ""; position: absolute; inset: 2px 4px; border-radius: 4px; pointer-events: none; }
.cn-nav-item.active::before { background: var(--alpha-gray-10); }
.cn-nav-item.active .cn-nav-label { color: var(--gray-90); }
.cn-nav-item:not(.active):not(.cn-nav-header):hover::before {
  content: ""; position: absolute; inset: 2px 4px;
  background: rgba(128, 135, 153, 0.06); border-radius: 4px; pointer-events: none;
}
.cn-nav-label-wrap { display: inline-flex; align-items: center; gap: 6px; flex: 1; }
.cn-beta {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 5px; border-radius: 4px;
  background: var(--alpha-blue-10);
  font: 600 12px/18px var(--font-sans);
  color: var(--blue-80, #115fd4);
}
.cn-nav-divider { padding: 4px 0; }
.cn-nav-divider span { display: block; height: 1px; background: var(--gray-30); }
.cn-nav-footer { background: #f2f4f7; padding-bottom: 8px; display: flex; flex-direction: column; }

/* ---- Main frame ---- */
.cn-main { flex: 1; min-width: 0; background: var(--white); display: flex; flex-direction: column; }
.cn-header { padding: 48px 64px 32px; }
.cn-header-title { font: 700 28px/36px var(--font-sans); color: #16181d; }
.cn-header-desc { font: 400 14px/22px var(--font-sans); color: #808799; margin-top: 6px; }


/* styles/prototypeChanges.css */
/* 프로토타입 메타 UI: 실제 Connect 기능이 아니라 정책 변경 추적용 패널 */
.pc-trigger {
  position: fixed; top: 72px; right: 0; z-index: 105;
  height: 40px; padding: 0 12px 0 10px; border: 1px solid var(--gray-30); border-right: 0;
  border-radius: 8px 0 0 8px; background: var(--gray-100); color: var(--white);
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  font: 600 12px/18px var(--font-sans); box-shadow: 0 4px 16px rgba(22,24,29,.14);
}
.pc-trigger:hover { background: var(--gray-90); }
.pc-trigger-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-70); }
.pc-trigger-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: rgba(255,255,255,.16); font: 700 11px/18px var(--font-sans); }

/* 딤 제거: 우측 패널을 비모달로 (열어둔 채 본문 확인·조작 가능) */
.pc-scrim { display: none; }
.pc-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 120; width: 392px;
  background: var(--white); box-shadow: -12px 0 32px rgba(22,24,29,.14);
  display: flex; flex-direction: column; transform: translateX(102%); visibility: hidden;
  transition: transform .2s ease, visibility .2s;
}
.pc-drawer.open { transform: translateX(0); visibility: visible; }
.pc-drawer-head { min-height: 52px; padding: 0 18px; border-bottom: 1px solid var(--gray-20); display: flex; align-items: center; justify-content: space-between; flex: none; }
.pc-eyebrow { font: 700 11px/16px var(--font-sans); letter-spacing: .08em; color: var(--blue-70); }
.pc-close { width: 32px; height: 32px; border-radius: 6px; color: var(--gray-70); font: 400 24px/30px var(--font-sans); cursor: pointer; }
.pc-close:hover, .pc-back:hover { background: var(--gray-10); }
.pc-back { height: 32px; padding: 0 8px; border-radius: 6px; color: var(--gray-80); font: 600 13px/32px var(--font-sans); cursor: pointer; }

.pc-drawer-title-wrap { padding: 22px 20px 16px; flex: none; }
.pc-drawer-title-wrap h2 { margin: 0; font: 700 22px/30px var(--font-sans); color: var(--gray-100); }
.pc-drawer-title-wrap p { margin: 7px 0 0; font: 400 13px/20px var(--font-sans); color: var(--gray-70); }
.pc-planned-filter { margin-top: 16px; padding: 12px 13px; border: 1px solid var(--gray-30); border-radius: 9px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pc-planned-filter > div { min-width: 0; display: flex; flex-direction: column; }
.pc-planned-filter strong { color: var(--gray-90); font: 600 13px/19px var(--font-sans); }
.pc-planned-filter span { color: var(--gray-60); font: 400 11px/17px var(--font-sans); }
.pc-switch { width: 40px; height: 24px; padding: 2px; border-radius: 999px; background: var(--gray-40); cursor: pointer; transition: background .15s; flex: none; }
.pc-switch > span { display: block; width: 20px; height: 20px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 4px rgba(22,24,29,.18); transition: transform .15s; }
.pc-switch.on { background: #f79009; }
.pc-switch.on > span { transform: translateX(16px); }
.pc-planned-notice { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: rgba(247,144,9,.09); color: #9a5800; font: 500 11px/17px var(--font-sans); }
.pc-dev-filter { margin-top: 10px; border-color: rgba(234, 179, 8, .48); background: #fffdf2; }
.pc-dev-notice { margin-top: 8px; padding: 8px 10px; border: 1px solid rgba(234, 179, 8, .35); border-radius: 6px; background: #fff8cf; color: #745300; font: 600 11px/17px var(--font-sans); }
.pc-dev-marker-layer { position: fixed; inset: 0; z-index: 110; pointer-events: none; }
.pc-dev-marker-layer, .pc-dev-marker-layer *, .pc-dev-marker-layer *::before, .pc-dev-marker-layer *::after { box-sizing: border-box; }
.pc-dev-marker-shell { position: fixed; width: 30px; height: 30px; pointer-events: auto; }
.pc-dev-marker {
  position: relative; z-index: 2; width: 30px; height: 30px; border: 2px solid var(--white); border-radius: 50%;
  background: #e0a600; color: var(--white); cursor: help; box-shadow: 0 3px 10px rgba(116,83,0,.30), 0 0 0 2px rgba(224,166,0,.18);
  font: 800 12px/26px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center;
  transition: transform .14s ease, background .14s ease, box-shadow .14s ease;
}
.pc-dev-marker:hover, .pc-dev-marker:focus-visible { background: #c98e00; box-shadow: 0 5px 16px rgba(116,83,0,.38), 0 0 0 3px rgba(224,166,0,.22); outline: none; transform: scale(1.08); }
.pc-dev-marker-tooltip {
  position: absolute; z-index: 1; width: min(350px, calc(100vw - 24px)); max-height: min(420px, calc(100vh - 48px));
  padding: 13px 14px 14px; overflow: auto; border: 1px solid #e4b82f; border-radius: 12px; background: #fffdf1;
  color: #5f4700; box-shadow: 0 12px 32px rgba(72,54,0,.20); visibility: hidden; opacity: 0; pointer-events: none;
  transition: opacity .12s ease, transform .12s ease, visibility .12s;
}
.pc-dev-marker-shell.place-left .pc-dev-marker-tooltip { right: 0; }
.pc-dev-marker-shell.place-right .pc-dev-marker-tooltip { left: 0; }
.pc-dev-marker-shell.place-below .pc-dev-marker-tooltip { top: calc(100% + 9px); transform: translateY(-4px); }
.pc-dev-marker-shell.place-above .pc-dev-marker-tooltip { bottom: calc(100% + 9px); transform: translateY(4px); }
.pc-dev-marker-shell:hover .pc-dev-marker-tooltip,
.pc-dev-marker-shell:focus-within .pc-dev-marker-tooltip { visibility: visible; opacity: 1; pointer-events: auto; transform: translateY(0); }
.pc-dev-marker-tooltip-head { display: grid; grid-template-columns: 26px 1fr; gap: 9px; align-items: start; }
.pc-dev-marker-tooltip-head > span { width: 26px; height: 26px; border-radius: 50%; background: #e0a600; color: var(--white); font: 800 11px/26px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; }
.pc-dev-marker-tooltip-head > div { min-width: 0; display: flex; flex-direction: column; }
.pc-dev-marker-tooltip-head small { color: #9a6b00; font: 700 9px/14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
.pc-dev-marker-tooltip-head strong { margin-top: 1px; color: #4d3900; font: 700 13px/19px var(--font-sans); word-break: keep-all; }
.pc-dev-marker-tooltip ul { margin: 10px 0 0; padding: 9px 0 0 17px; border-top: 1px solid rgba(224,166,0,.24); }
.pc-dev-marker-tooltip li { margin-top: 5px; color: #5f4700; font: 500 11px/18px var(--font-sans); word-break: keep-all; }
.pc-dev-marker-tooltip li:first-child { margin-top: 0; }
.pc-dev-marker-tooltip code { padding: 1px 4px; border-radius: 4px; background: rgba(116,83,0,.10); color: #604700; font: 600 10px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-current-view { display: inline-flex; margin-top: 12px; padding: 5px 9px; border-radius: 6px; background: var(--alpha-blue-10); color: var(--blue-70); font: 600 12px/18px var(--font-sans); }
.pc-scope { margin: 0 20px; padding: 3px; border-radius: 8px; background: var(--gray-20); display: grid; grid-template-columns: 1fr 1fr; flex: none; }
.pc-scope button { height: 34px; border-radius: 6px; color: var(--gray-70); cursor: pointer; font: 600 13px/34px var(--font-sans); }
.pc-scope button span { margin-left: 3px; color: var(--gray-50); }
.pc-scope button.active { background: var(--white); color: var(--gray-100); box-shadow: 0 1px 4px rgba(22,24,29,.08); }

.pc-change-list {
  flex: 1 1 auto; min-height: 0; padding: 16px 20px 28px;
  overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable;
  display: flex; flex-direction: column; gap: 12px;
}
.pc-empty { padding: 40px 12px; text-align: center; color: var(--gray-60); font: 400 13px/20px var(--font-sans); }
.pc-change-card { flex: 0 0 auto; border: 1px solid var(--gray-30); border-radius: 10px; overflow: hidden; background: var(--white); transition: border-color .12s, box-shadow .12s; }
.pc-change-card:hover { border-color: var(--gray-50); box-shadow: 0 4px 16px rgba(22,24,29,.06); }
.pc-change-card.planned { border-color: rgba(247,144,9,.36); background: linear-gradient(180deg, rgba(247,144,9,.035), var(--white) 40%); }
.pc-change-main { width: 100%; padding: 15px 15px 13px; text-align: left; cursor: pointer; }
.pc-change-meta { display: flex; align-items: center; gap: 6px; }
.pc-change-meta time { margin-left: auto; color: var(--gray-60); font: 500 11px/16px var(--font-sans); }
.pc-prd-id { display: inline-flex; padding: 3px 7px; border-radius: 5px; background: var(--alpha-blue-10); color: var(--blue-70); font: 700 11px/16px var(--font-sans); }
.pc-publish, .pc-source-status { display: inline-flex; padding: 3px 7px; border-radius: 5px; font: 600 11px/16px var(--font-sans); }
.pc-publish.baseline, .pc-source-status.review { background: rgba(247,144,9,.10); color: #b25f00; }
.pc-publish.approved, .pc-source-status.approved, .pc-source-status.final { background: rgba(31,169,114,.10); color: var(--green-80); }
.pc-publish.planned, .pc-source-status.draft { background: rgba(247,144,9,.12); color: #9a5800; }
.pc-change-main h3 { margin: 11px 0 12px; font: 700 15px/22px var(--font-sans); color: var(--gray-100); }

.pc-diff.before > span { background: var(--gray-20); color: var(--gray-60); }
.pc-diff.after > span { background: var(--alpha-blue-10); color: var(--blue-70); }
.pc-developer-details { margin-top: 12px; padding: 11px 12px; border: 1px solid #e9bd32; border-radius: 7px; background: #fff8cf; color: #5f4700; }
.pc-developer-details-head { display: flex; align-items: center; gap: 7px; }
.pc-developer-details-head > span { padding: 2px 5px; border-radius: 4px; background: #e0a600; color: #fff; font: 800 9px/14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
.pc-developer-details-head strong { font: 700 12px/18px var(--font-sans); }
.pc-developer-details ul { margin: 7px 0 0; padding-left: 17px; }
.pc-developer-details li { margin-top: 4px; font: 500 11px/18px var(--font-sans); word-break: keep-all; }

.pc-change-foot button:disabled { color: var(--gray-40); cursor: not-allowed; }

.pc-document-overlay { position: fixed; inset: 0; z-index: 220; padding: 40px; background: rgba(22,24,29,.54); display: flex; align-items: center; justify-content: center; }
.pc-document-modal { width: min(920px, calc(100vw - 48px)); height: min(820px, calc(100vh - 48px)); border-radius: 14px; background: var(--white); box-shadow: 0 24px 80px rgba(22,24,29,.30); overflow: hidden; display: flex; flex-direction: column; }
.pc-document-head { min-height: 104px; padding: 20px 24px; border-bottom: 1px solid var(--gray-20); display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex: none; }

.pc-document-head p { margin: 3px 0 0; color: var(--gray-60); font: 500 12px/18px var(--font-sans); }

.pc-document-body { padding: 24px 32px 40px; overflow: auto; }
.pc-document-body .pc-summary-source { margin-top: 0; }
.pc-document-body .pc-markdown { max-width: 760px; margin: 24px auto 0; }
.pc-document-body .pc-markdown h1 { font-size: 25px; line-height: 34px; }
.pc-document-body .pc-markdown h2 { margin-top: 28px; font-size: 18px; line-height: 27px; }
.pc-document-body .pc-markdown p, .pc-document-body .pc-md-li { font-size: 14px; line-height: 23px; }

.pc-summary-view { padding: 20px 20px 32px; overflow: auto; }
.pc-summary-meta { display: flex; align-items: center; gap: 7px; }
.pc-summary-release { margin-top: 10px; color: #9a5800; font: 600 12px/18px var(--font-sans); }
.pc-summary-source { margin-top: 10px; padding: 10px 12px; border-radius: 7px; background: var(--gray-10); color: var(--gray-60); font: 500 11px/17px var(--font-sans); word-break: break-all; }
.pc-markdown { margin-top: 18px; }
.pc-markdown h1 { margin: 0 0 16px; color: var(--gray-100); font: 700 21px/29px var(--font-sans); }
.pc-markdown h2 { margin: 22px 0 9px; color: var(--gray-100); font: 700 16px/24px var(--font-sans); }
.pc-markdown h3 { margin: 18px 0 8px; color: var(--gray-90); font: 700 14px/22px var(--font-sans); }
.pc-markdown p { margin: 0; color: var(--gray-70); font: 400 13px/21px var(--font-sans); }
.pc-markdown blockquote { margin: 0 0 16px; padding: 12px 14px; border-left: 3px solid var(--blue-60); background: var(--alpha-blue-05); color: var(--gray-80); font: 500 12px/20px var(--font-sans); }
.pc-markdown code { padding: 2px 5px; border-radius: 4px; background: var(--gray-20); color: var(--gray-80); font: 500 11px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
.pc-md-li { display: grid; grid-template-columns: 10px 1fr; gap: 5px; align-items: start; margin-top: 5px; }
.pc-md-li > span { color: var(--blue-60); font: 700 13px/21px var(--font-sans); }
.pc-md-gap { height: 6px; }

.pc-policy-highlight { animation: pc-policy-pulse 2.4s ease; outline: 3px solid var(--blue-60); outline-offset: 4px; border-radius: 8px; }
.pc-planned-row-badge { display: inline-flex; margin-left: 6px; padding: 1px 5px; border-radius: 4px; background: rgba(247,144,9,.12); color: #9a5800; vertical-align: 1px; font: 700 10px/15px var(--font-sans); }
@keyframes pc-policy-pulse {
  0%, 100% { outline-color: transparent; box-shadow: none; }
  15%, 70% { outline-color: var(--blue-60); box-shadow: 0 0 0 8px var(--alpha-blue-10); }
}

@media (max-width: 1100px) {
  .pc-drawer { width: min(392px, calc(100% - 24px)); }
  .pc-scrim { left: 0; }
  .pc-document-overlay { padding: 20px; }
  .pc-document-modal { width: calc(100vw - 40px); height: calc(100vh - 40px); }
  .pc-document-body { padding: 20px 22px 32px; }
}


/* styles/connectRegister.css */
/* Shared prototype styles. */

/* ---- Main: 풋터 absolute 기준 ---- */
.rg-main { position: relative; }

/* 헤더 eyebrow */
.rg-eyebrow { font: 400 14px/22px var(--font-sans); color: #808799; margin-bottom: 6px; }

/* ---- 본문 2단 레이아웃 ---- */
.rg-container {
  display: flex;
  gap: 24px;
  align-items: flex-start;
  padding: 0 64px 124px;
}
.rg-form { flex: 1 0 0; min-width: 0; display: flex; flex-direction: column; gap: 24px; }

/* ---- 흰색 섹션 카드 ---- */
.rg-card {
  background: var(--white);
  border: 1px solid rgba(128, 135, 153, 0.2);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.rg-card.required { padding: 20px 0; }
.rg-card.extra { padding: 24px 0; }

/* 그룹 타이틀 */
.rg-group-title { font: 700 18px/26px var(--font-sans); color: #16181d; padding: 0 24px; }

/* ---- 필드 공통 ---- */
.rg-field { padding: 0 24px; display: flex; flex-direction: column; }
.rg-field-head { display: flex; flex-direction: column; gap: 2px; padding-bottom: 8px; }
.rg-label { font: 600 16px/26px var(--font-sans); color: #31353f; }
.rg-label.optional { color: #434956; }
.rg-optional { font-weight: 600; color: #808799; }
.rg-help { font: 400 12px/18px var(--font-sans); color: #5d6474; }

/* ---- 입력 (디자인 시스템 Input: border #caced8 / radius 6 / 40h / Medium 14) ---- */
.rg-input {
  width: 100%;
  height: 40px;
  border: 1px solid #caced8;
  border-radius: 6px;
  padding: 0 16px;
  background: var(--white);
  font: 500 14px/22px var(--font-sans);
  color: #16181d;
}
.rg-input::placeholder { color: #a8aebd; font-weight: 500; }
.rg-input:focus { outline: none; border-color: var(--blue-60, #0073fa); }
/* 유효성 실패 필드 — 빨간 테두리 + 하단 빨간 메시지 (실제 서비스 컨벤션) */
.rg-input.error, .rg-num.error { border-color: var(--red-60, #f5535f); }
.rg-input.error:focus, .rg-num.error:focus { border-color: var(--red-60, #f5535f); }
.rg-error { margin: 6px 0 0; font: 500 13px/18px var(--font-sans); color: var(--red-60, #f5535f); }

.rg-search { position: relative; }
.rg-search .rg-input { padding-right: 44px; }
.rg-search-ic {
  position: absolute; top: 50%; right: 16px; transform: translateY(-50%);
  width: 18px; height: 18px; color: #808799; pointer-events: none;
}

/* 글자 수 카운터 */
.rg-counter { margin-top: 8px; text-align: right; font: 500 13px/18px var(--font-sans); color: #808799; }
.rg-counter-num { font-weight: 600; color: #434956; }

/* ---- 가격 정보 필드: 공통 24px 거터 구조 ----
   필드 좌측 패딩(24px)을 제거하고 드래그 핸들(24px)이 그 거터를 대신한다.
   → 가격명 인풋의 좌측 엣지가 진료항목 인풋과 정확히 정렬되며,
     레이블/도움말만 24px 들여써서 콘텐츠-좌측 정렬을 유지. */
.rg-field.price { padding-left: 0; padding-right: 24px; }
.rg-field.price .rg-field-head { padding-left: 24px; }
.rg-price-list { display: flex; flex-direction: column; }

/* ---- 가격 옵션 행 (상태: 기본 / Hover / DND) ---- */
.rg-price-row {
  display: flex; align-items: flex-start;
  /* 좌측: 핸들(24px)이 거터 역할 / 우측: × 버튼 우측 엣지가 진료항목 인풋 우측과 정렬되도록 패딩 0 */
  padding: 8px 0;
  border-radius: 8px;
}
/* DND(드래그 중): 흰 배경 + 회색 테두리(ring) + 그림자 — 레이아웃 영향 없도록 box-shadow 사용 */
.rg-price-row.dragging {
  background: var(--white);
  box-shadow: 0 0 0 1px #a8aebd, 0 2px 0.5px rgba(22, 24, 29, 0.02), 0 2px 4px rgba(22, 24, 29, 0.1);
}
/* 드래그 핸들: 기본 숨김 → Hover/DND 시 노출 */
.rg-drag {
  width: 24px; flex: none;
  align-self: stretch; min-height: 40px;
  padding: 0 8px;
  display: flex; align-items: center; justify-content: center;
  color: #808799; opacity: 0; cursor: grab;
}
.rg-price-row:hover .rg-drag,
.rg-price-row.dragging .rg-drag { opacity: 1; }
.rg-price-row.dragging .rg-drag { cursor: grabbing; }
.rg-drag svg { width: 8px; height: 12px; }
.rg-price-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.rg-price-entry { display: flex; align-items: center; gap: 8px; }

/* 가격 타입 드롭다운 (button + 메뉴) */
.rg-select-wrap { position: relative; flex: none; }
.rg-select.open { border-color: var(--blue-60, #0073fa); }
.rg-select-menu {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 20;
  width: 140px; padding: 4px;
  background: var(--white); border: 1px solid #e3e6ed; border-radius: 8px;
  box-shadow: 0 2px 1px rgba(22, 24, 29, 0.02), 0 2px 8px rgba(22, 24, 29, 0.1);
  display: flex; flex-direction: column;
}
.rg-select-opt {
  height: 36px; border: 0; border-radius: 6px; background: transparent;
  padding: 0 12px; text-align: left; cursor: pointer;
  font: 500 14px/22px var(--font-sans); color: #31353f;
}
.rg-select-opt:hover { background: #f2f4f7; }
.rg-select-opt.active { background: var(--alpha-blue-10); color: var(--blue-60, #0073fa); font-weight: 600; }

/* 할인 가격: 정상가 → 판매가 화살표 */
.rg-price-arrow { flex: none; font: 500 14px/22px var(--font-sans); color: #808799; }

.rg-select {
  width: 140px; flex: none; height: 40px;
  border: 1px solid #caced8; border-radius: 6px;
  padding: 0 12px 0 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font: 500 14px/22px var(--font-sans); color: #31353f;
  background: var(--white); cursor: pointer;
}
.rg-select .rg-select-ic { width: 16px; height: 16px; color: #5d6474; flex: none; }
.rg-num {
  width: 128px; flex: none; height: 40px;
  border: 1px solid #caced8; border-radius: 6px;
  padding: 0 16px; text-align: right;
  font: 500 14px/22px var(--font-sans); color: #16181d;
  background: var(--white);
}
.rg-num::placeholder { color: #a8aebd; font-weight: 500; }
.rg-num:focus, .rg-select:focus { outline: none; border-color: var(--blue-60, #0073fa); }
.rg-unit {
  height: 40px; flex: none;
  display: flex; align-items: center;
  font: 500 14px/22px var(--font-sans); color: #16181d;
}
.rg-price-del {
  width: 40px; height: 40px; flex: none;
  border: 0; background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #16181d; border-radius: 4px;
}
.rg-price-del:hover { background: #f2f4f7; }
.rg-price-del svg { width: 16px; height: 16px; }

/* 가격 옵션 추가 버튼 */
.rg-add-wrap { padding: 16px 24px 0; }
.rg-add-btn {
  width: 100%; height: 40px;
  border: 0; border-radius: 6px;
  background: rgba(0, 115, 250, 0.1);
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font: 600 14px/22px var(--font-sans); color: var(--blue-60, #0073fa);
  cursor: pointer;
}
.rg-add-btn svg { width: 18px; height: 18px; }

/* ---- 사진 업로드 ---- */
.rg-upload {
  width: 96px; height: 96px;
  border: 1px dashed #caced8; border-radius: 6px;
  background: var(--white);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  cursor: pointer;
}
.rg-upload svg { width: 24px; height: 24px; color: #808799; }
.rg-upload-label { font: 500 13px/18px var(--font-sans); color: #808799; }

/* 회색 가이드 박스 */
.rg-guide-wrap { padding: 16px 24px 0; }
.rg-guide { background: #f6f7f9; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.rg-guide-li { display: flex; gap: 6px; font: 400 13px/20px var(--font-sans); color: #5d6474; }
.rg-guide-li::before { content: "\2022"; color: #808799; flex: none; }

/* 텍스트영역 */
.rg-textarea {
  width: 100%; height: 296px;
  border: 1px solid #caced8; border-radius: 6px;
  padding: 9px 16px; resize: none;
  font: 500 14px/22px var(--font-sans); color: #16181d;
  background: var(--white);
}
.rg-textarea::placeholder { color: #a8aebd; font-weight: 500; }
.rg-textarea:focus { outline: none; border-color: var(--blue-60, #0073fa); }

/* 상세 소개 사진 (다중 썸네일, 최대 5개) */
.rg-detail-imgs { display: flex; flex-wrap: wrap; gap: 8px; }
.rg-detail-thumb { position: relative; width: 96px; height: 96px; border-radius: 6px; background: linear-gradient(135deg, #dbeafe, #cfe0ff); }
.rg-detail-thumb-idx { position: absolute; left: 6px; bottom: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 5px; background: rgba(25,31,40,.55); color: #fff; font: 600 11px/18px var(--font-sans); text-align: center; }
.rg-detail-thumb-del { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border: 0; border-radius: 50%; background: rgba(25,31,40,.6); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.rg-detail-thumb-del svg { width: 12px; height: 12px; }
.rg-detail-add { width: 96px; height: 96px; border: 1px dashed #caced8; border-radius: 6px; background: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
.rg-detail-add svg { width: 24px; height: 24px; color: #808799; }
.rg-detail-add span { font: 500 13px/18px var(--font-sans); color: #808799; }

/* 키워드 태그 입력 */
.rg-tag-box {
  min-height: 80px; margin-top: 8px;
  background: var(--white); border: 1px solid #caced8; border-radius: 8px;
  padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start;
}
.rg-tag-empty { font: 400 14px/22px var(--font-sans); color: #a8aebd; }

/* 구분선 */
.rg-divider { height: 1px; background: #f2f4f7; margin: 0 24px; }

/* =========================================================
   우측 미리보기 (모바일 프레임)
   ========================================================= */
.rg-preview {
  width: 320px; flex: none; height: 640px;
  border: 4px solid #5d6474; border-radius: 24px;
  background: var(--white);
  padding: 4px 4px 24px;
  overflow: hidden;
}
.rg-pv-hero { height: 8px; border-radius: 6px; background: #f2f4f7; }
.rg-pv-basic { padding: 16px; }
.rg-pv-title { font: 700 18px/26px var(--font-sans); color: #a8aebd; }
.rg-pv-divider { height: 5px; background: #f2f4f7; }
.rg-pv-price { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.rg-pv-price-head { font: 700 16px/24px var(--font-sans); color: #31353f; }
.rg-pv-price-row { min-height: 48px; display: flex; align-items: center; justify-content: space-between; }
.rg-pv-price-name { font: 500 14px/22px var(--font-sans); color: #a8aebd; }
.rg-pv-price-val { font: 700 14px/22px var(--font-sans); color: #a8aebd; }

/* =========================================================
   하단 고정 풋터
   ========================================================= */
/* 하단 액션 바 — 뷰포트 최하단 스티키 고정. 전체너비 레이아웃(overflow:visible)이라 sticky가 window 기준으로 동작. */
.rg-footer {
  position: sticky; bottom: 0; z-index: 40;
  height: 64px;
  background: var(--white);
  border-top: 1px solid #e3e6ed;
  padding: 0 64px;
  display: flex; align-items: center; gap: 8px;
}
.rg-footer-left { flex: 1; display: flex; align-items: center; gap: 8px; }
.rg-btn-cancel {
  width: 80px; height: 40px;
  border: 1px solid rgba(128, 135, 153, 0.2); border-radius: 6px;
  background: var(--white); font: 700 14px/22px var(--font-sans); color: #5d6474; cursor: pointer;
}
.rg-btn-save {
  width: 80px; height: 40px;
  border: 0; border-radius: 6px;
  background: var(--blue-60, #0073fa); font: 700 14px/22px var(--font-sans); color: var(--white); cursor: pointer;
}
.rg-footer-right { display: flex; align-items: center; gap: 10px; }
.rg-footer-label { font: 400 14px/22px var(--font-sans); color: #5d6474; }
.rg-toggle { width: 36px; height: 20px; border-radius: 24px; background: var(--blue-60, #0073fa); position: relative; flex: none; cursor: pointer; transition: background 0.15s; }
.rg-toggle.off { background: #caced8; }
.rg-toggle-knob { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--white); transition: left 0.15s, right 0.15s; }
.rg-toggle.off .rg-toggle-knob { right: auto; left: 2px; }

/* 키워드 칩 */
.rg-tag {
  display: inline-flex; align-items: center; gap: 4px;
  height: 28px; padding: 0 6px 0 10px; border-radius: 6px;
  background: var(--alpha-blue-10); color: var(--blue-70, #0061db);
  font: 500 13px/20px var(--font-sans);
}
.rg-tag-del {
  border: 0; background: transparent; cursor: pointer;
  width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center;
  color: var(--blue-70, #0061db); font-size: 14px; line-height: 1;
}

/* 저장/취소 토스트 */
.rg-toast {
  position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%);
  z-index: 50; padding: 12px 20px; border-radius: 8px;
  background: rgba(25, 31, 40, 0.92); color: var(--white);
  font: 500 14px/22px var(--font-sans);
  box-shadow: var(--shadow-toast);
}


/* styles/treatmentCreate.css */
/* TIM-1 draft. Shared Connect shell and form tokens remain the visual baseline. */
.tc-root { background:#e7e9ee; color:var(--gray-100); min-height:100vh; font:400 14px/1.5 var(--font-sans); }
.tc-root *, .tc-root *::before, .tc-root *::after { box-sizing:border-box; }
.tc-root h1,.tc-root h2,.tc-root h3,.tc-root p { margin:0; }
.tc-root button,.tc-root select,.tc-root input,.tc-root textarea { font-family:inherit; }
.tc-root button { cursor:pointer; }
.tc-root button:disabled { opacity:.4; cursor:not-allowed; }
.tc-root input:disabled,.tc-root select:disabled { background:var(--gray-20); color:var(--gray-60); cursor:not-allowed; }
.tc-root :is(button,input,select,textarea):focus-visible { outline:2px solid var(--blue-60); outline-offset:3px; }
.tc-reviewbar { max-width:1280px; margin:auto; min-height:62px; padding:10px 0; display:flex; justify-content:space-between; align-items:center; gap:20px; }
.tc-reviewbar strong { font-size:15px; font-weight:700; }.tc-reviewbar>div>span { margin-left:12px; color:var(--gray-70); font-size:12px; }
.tc-review-actions,.tc-review-toggle { display:flex; align-items:center; gap:10px; }
.tc-review-toggle { margin-right:12px; font-size:13px; font-weight:600; }
.tc-review-actions>button { border:1px solid #caced8; background:#fff; border-radius:6px; height:32px; padding:0 12px; color:#4e5968; font-size:12px; }
.tc-statusbar { max-width:1280px; margin:0 auto 12px; min-height:34px; border-radius:6px; background:#f4f6f8; color:var(--gray-70); font-size:12px; padding:8px 12px; display:flex; align-items:center; gap:7px; }
.tc-statusbar.planned { background:#fff5e5; color:#865400; }.tc-statusbar svg { flex:none; }
.tc-artboard { min-height:0; padding:0 20px 20px; }
.tc-artboard .cn-screen { min-height:0; height:calc(100vh - 128px); min-width:0; }
.tc-artboard .cn-body { min-height:0; overflow:hidden; }.tc-artboard .cn-nav { overflow:hidden; }.tc-artboard .cn-main { min-width:0; }
.tc-artboard .cn-nav-label { font-size:14px; line-height:22px; color:var(--gray-90); }
.tc-main { display:flex; flex-direction:column; overflow:hidden; }
.tc-scroll { overflow:auto; flex:1; min-height:0; scroll-padding:24px; }
.tc-scroll .cn-header { padding:32px 48px 28px; }.tc-scroll .cn-header-title { font-size:28px; line-height:36px; font-weight:700; }
.tc-back { display:flex; align-items:center; gap:8px; color:#808799; padding:0; border:0; background:transparent; font-size:14px; margin-bottom:8px; }
.tc-scroll .rg-container { padding:0 48px 40px; gap:24px; }.tc-scroll .rg-form { min-width:360px; }
.tc-scroll .rg-card { gap:24px; }.tc-scroll .rg-group-title { font-size:18px; }.tc-scroll .rg-divider { height:1px; background:#f2f4f6; margin:0 24px; }
.tc-search-wrap { position:relative; }.tc-results { position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:8; background:#fff; border:1px solid #d1d6db; border-radius:8px; box-shadow:0 6px 20px #16201d18; padding:6px; }
.tc-result-heading { font-size:11px; color:var(--gray-70); padding:5px 8px; }.tc-results>p { padding:16px 8px; color:#6b7684; }
.tc-results>button { display:flex; flex-direction:column; align-items:flex-start; width:100%; gap:3px; padding:10px; border:0; background:#fff; text-align:left; border-radius:5px; color:#31353f; }.tc-results>button:hover,.tc-results>button.selected { background:#f2f7ff; }.tc-results>button>strong { font-size:14px; font-weight:600; }.tc-results>button>span { display:flex; align-items:center; gap:3px; font-size:11px; color:#6b7684; }.tc-results>button.tc-direct { border-top:1px solid #e5e8eb; color:#0061db; flex-direction:row; align-items:center; gap:7px; font-size:13px; }

# \uC9C4\uB8CC\uD56D\uBAA9 \uB4F1\uB85D \uAC1C\uC120 \uC2DC\uC548

**PRD ID:** \`TIM-1\`

> \uBBF8\uC2B9\uC778 \uAC80\uD1A0\uC6A9 \uC2DC\uC548\uC785\uB2C8\uB2E4. \uD654\uBA74\uC758 \uD56D\uBAA9\xB7\uAC00\uACA9\uC740 \uC608\uC2DC\uC6A9 mock \uB370\uC774\uD130\uC774\uBA70 \uC2E4\uC81C \uBCD1\uC6D0 \uC815\uBCF4\uAC00 \uC544\uB2D9\uB2C8\uB2E4. \uC785\uB825\uD558\uAC70\uB098 \uC800\uC7A5\uD574\uB3C4 \uC2E4\uC81C \uC11C\uBE44\uC2A4\uC5D0 \uBC18\uC601\uB418\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uCD9C\uC2DC \uC5EC\uBD80\xB7\uC77C\uC815\xB7\uCD5C\uC885 \uBB38\uAD6C\uB294 \uBBF8\uC815\uC785\uB2C8\uB2E4.

## \uBAA9\uC801\uACFC \uD654\uBA74 \uBC94\uC704

- \uBCD1\uC6D0\uC774 \uC9C4\uB8CC\uD56D\uBAA9\uC744 \uC27D\uAC8C \uC785\uB825\uD558\uBA74\uC11C \uAC80\uC0C9\uACFC \uAC00\uACA9\uBE44\uAD50\uC5D0 \uD544\uC694\uD55C \uC815\uBCF4\uB97C \uC815\uD655\uD558\uAC8C \uC5F0\uACB0\uD558\uB3C4\uB85D \uB3D5\uC2B5\uB2C8\uB2E4.
- \uB300\uC0C1 \uD654\uBA74\uC740 \uCEE4\uB125\uD2B8 \uC6F9\uBDF0\uC758 \uC9C4\uB8CC\uD56D\uBAA9 \uC0DD\uC131\xB7\uC218\uC815 \uD3FC\uC785\uB2C8\uB2E4. \uAE30\uC874 \uC18C\uAC1C\xB7\uC0AC\uC9C4\xB7\uD0A4\uC6CC\uB4DC\xB7\uAC00\uACA9\uC635\uC158\uACFC \uB178\uCD9C \uC124\uC815\uC740 \uC720\uC9C0\uD558\uB294 \uBC29\uD5A5\uC785\uB2C8\uB2E4.
- \uAC1C\uC120\uC548\uC740 \uBBF8\uB9AC\uBCF4\uAE30\uB97C \uCF30\uC744 \uB54C\uB9CC \uD45C\uC2DC\uD569\uB2C8\uB2E4. \uB044\uBA74 \uD604\uC7AC \uD654\uBA74 \uAE30\uC900\uC73C\uB85C \uB3CC\uC544\uAC11\uB2C8\uB2E4.

## \uC785\uB825 \uC21C\uC11C

\uC0C1\uD488\uBA85 \u2192 \uD45C\uC900 \uC9C4\uB8CC\uD56D\uBAA9\xB7\uCE74\uD14C\uACE0\uB9AC \u2192 \uAC00\uACA9 \uC815\uBCF4 \u2192 \uCD94\uAC00 \uC815\uBCF4 \u2192 \uAC80\uC0C9 \uD65C\uC6A9 \uC815\uBCF4 \u2192 \uC678\uBD80 \uD50C\uB7AB\uD3FC \uC815\uBCF4 \uC21C\uC11C\uB85C \uD655\uC778\uD569\uB2C8\uB2E4.

## \uBD84\uB958 \uC5F0\uACB0

- \u2018\uD45C\uC900 \uC9C4\uB8CC\uD56D\uBAA9 (\uAC80\uC0C9\xB7\uBD84\uB958\uC6A9)\u2019 \uAC80\uC0C9\uACFC \uCD94\uCC9C \uC120\uD0DD\uC744 \uC6B0\uC120 \uC81C\uACF5\uD569\uB2C8\uB2E4. \uD45C\uC900 \uC18C\uBD84\uB958\uB97C \uC120\uD0DD\uD558\uBA74 \uAD00\uB828 \uBD84\uB958\uAC00 \uD568\uAED8 \uCC44\uC6CC\uC9D1\uB2C8\uB2E4.
- \uAC80\uC0C9 \uC606\uC758 \uBD84\uB958 \uD3BC\uCCD0\uBCF4\uAE30\uB85C \uB300\uBD84\uB958\uBD80\uD130 \uB2E8\uACC4\uC801\uC73C\uB85C \uCC3E\uC544\uBCFC \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uC0C1\uC704 \uBD84\uB958\uAC00 \uC5C6\uC73C\uBA74 \uD558\uC704 \uC120\uD0DD\uC740 \uBE44\uD65C\uC131\uD654\uD569\uB2C8\uB2E4.
- \uB9DE\uB294 \uD45C\uC900\uD56D\uBAA9\uC774 \uC5C6\uC73C\uBA74 \uC9C1\uC811\uC785\uB825\uD558\uACE0 \uC544\uB294 \uBD84\uB958\uAE4C\uC9C0\uB9CC \uB0A8\uAE38 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uBD80\uBD84 \uBD84\uB958\uC640 \uAC80\uD1A0 \uC694\uCCAD\uC740 \uD655\uC815 \uC5F0\uACB0\uACFC \uAD6C\uBD84\uD569\uB2C8\uB2E4.
- \uBCD1\uC6D0\uC5D0\uC11C \uC0AC\uC6A9\uD558\uB294 \uB178\uCD9C\uBA85\uC740 \uC720\uC9C0\uD569\uB2C8\uB2E4. \uAC80\uD1A0 \uC694\uCCAD\uB9CC\uC73C\uB85C \uAC80\uC0C9 \uBC18\uC601\uC774\uB098 \uB178\uCD9C \uC21C\uC704\uB97C \uBCF4\uC7A5\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
- \uC6A9\uC5B4 \uAD8C\uACE0: \u2018\uBBF8\uC9C0\uC815\u2019\uC740 \uD45C\uC900 \uBD84\uB958\uC758 \uD55C \uC885\uB958\uAC00 \uC544\uB2C8\uB77C \uC544\uC9C1 \uC5F0\uACB0\uB418\uC9C0 \uC54A\uC740 \uC0C1\uD0DC\uC785\uB2C8\uB2E4. \uC54C\uACE0 \uC788\uB294 \uC0C1\uC704 \uBD84\uB958\uB294 \uC720\uC9C0\uD558\uBA70 \u2018\uAE30\uD0C0\u2019\uB85C \uC77C\uAD04 \uC5F0\uACB0\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uBA85\uD655\uD558\uAC8C \uC815\uC758\uB41C \u2018\uAE30\uD0C0\u2019 \uBD84\uB958\uAC00 \uD544\uC694\uD55C\uC9C0\uB294 \uBCC4\uB3C4\uB85C \uAC80\uD1A0\uD569\uB2C8\uB2E4.

## \uD658\uC790\uC5D0\uAC8C \uBCF4\uC774\uB294 \uC0C1\uD488\uBA85

- \uAE30\uBCF8 \uC815\uBCF4 \uB9E8 \uC704\uC5D0\uC11C \uC0C1\uD488\uBA85\uC744 \uBA3C\uC800 \uC785\uB825\uD558\uACE0, \uADF8 \uC544\uB798\uC5D0\uC11C \uD45C\uC900\uD56D\uBAA9\xB7\uCE74\uD14C\uACE0\uB9AC\uB97C \uC5F0\uACB0\uD569\uB2C8\uB2E4. \u2018\uBCC4\uCE6D\u2019\uC774 \uC544\uB2C8\uB77C \uC2E4\uC81C \uD658\uC790 \uB178\uCD9C\uBA85\uC784\uC744 \uBA85\uD655\uD558\uAC8C \uC548\uB0B4\uD569\uB2C8\uB2E4.
- \uD45C\uC900 \uC18C\uBD84\uB958\uC640 \uBCD1\uC6D0 \uC0C1\uD488\uBA85\uC740 \uB2E4\uB97C \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uC608: \uD45C\uC900\uD56D\uBAA9 \u2018\uAC00\uB2E4\uC2E4 9\uAC00\u2019, \uC0C1\uD488\uBA85 \u2018\uAC00\uB2E4\uC2E4 9\uAC00 \uC608\uBC29\uC811\uC885\u2019.
- \uD45C\uC900 \uAC80\uC0C9\uC5B4\uB97C \uC785\uB825\uD558\uAC70\uB098 \uBD84\uB958\uB97C \uBCC0\uACBD\uD574\uB3C4 \uC774\uBBF8 \uC785\uB825\uD55C \uC0C1\uD488\uBA85\uC740 \uC720\uC9C0\uD569\uB2C8\uB2E4.
- \uC0C1\uD488\uBA85\uC744 \uBE44\uC6B0\uBA74 \uAE30\uC874 \uD56D\uBAA9\uBA85\uC73C\uB85C \uD45C\uC2DC\uD558\uBA70 \uC2E4\uC81C \uB300\uCCB4 \uC774\uB984\uC744 \uC548\uB0B4\uD569\uB2C8\uB2E4. \uD45C\uC900\uB3C4 \uAE30\uBCF8 \uC774\uB984\uB3C4 \uC5C6\uB294 \uC2E0\uADDC \uC9C1\uC811\uC785\uB825\uC740 \uC0C1\uD488\uBA85\uC774 \uD544\uC694\uD569\uB2C8\uB2E4.
- \uAE30\uC874 \uC774\uB984\uC744 \uD45C\uC900\uBA85\uC73C\uB85C \uB36E\uC5B4\uC4F0\uAC70\uB098 \uB2E4\uB978 \uD544\uB4DC\uB85C \uC77C\uAD04 \uC62E\uAE30\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uC0C1\uD488\uBA85 \uC218\uC815\uB9CC\uC73C\uB85C \uAC80\uC0C9 \uBC18\uC601\uC744 \uBCF4\uC7A5\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.

## \uAC00\uACA9 \uB2E8\uC704\uC640 \uD3EC\uD568\uBE44\uC6A9

- \uC9C4\uB8CC\uD56D\uBAA9\uC5D0 \uACF5\uD1B5 \uB2E8\uC704 \uD558\uB098\uB97C \uC120\uD0DD\uD558\uACE0 \uAC00\uACA9\uC635\uC158\uBCC4 \uC218\uB7C9\xB7\uAE08\uC561\xB7\uD3EC\uD568\uBE44\uC6A9\uC744 \uC785\uB825\uD569\uB2C8\uB2E4.
- \uB2E8\uC704 \uC5C6\uC74C\uC740 \uC218\uB7C9 \uC785\uB825\uC744 \uBE44\uD65C\uC131\uD654\uD558\uBA70 0\uD68C \uB610\uB294 0\uC6D0\uC73C\uB85C \uBC14\uAFB8\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uB2E8\uC704 \uBCC0\uACBD \uC2DC \uAE30\uC874 \uC218\uB7C9\uC744 \uB2E4\uB978 \uB2E8\uC704\uB85C \uC790\uB3D9 \uD574\uC11D\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
- \uACE0\uC815 \uAC00\uACA9\xB7\uD560\uC778 \uAC00\uACA9\xB7\uC0C1\uB2F4 \uD6C4 \uACB0\uC815 \uAD6C\uBD84\uC744 \uC720\uC9C0\uD558\uBA70 \uBB34\uB8CC \uD0C0\uC785\uC744 \uC81C\uC548\uD569\uB2C8\uB2E4. \uC0C1\uB2F4 \uD6C4 \uACB0\uC815\uC740 \uBB34\uB8CC\uAC00 \uC544\uB2D9\uB2C8\uB2E4.
- \uC800\uC7A5 \uAC00\uB2A5 \uC5EC\uBD80\uC640 \uAC00\uACA9\uBE44\uAD50 \uC900\uBE44 \uC5EC\uBD80\uB97C \uB098\uB215\uB2C8\uB2E4. \uB3D9\uC77C \uD56D\uBAA9\xB7\uADDC\uACA9, \uC720\uD6A8\uD55C \uB2E8\uC704\xB7\uC218\uB7C9\xB7\uAE08\uC561, \uD3EC\uD568\uBE44\uC6A9\uC774 \uD655\uC778\uB3FC\uC57C \uBE44\uAD50 \uC900\uBE44\uAC00 \uB41C \uAC83\uC73C\uB85C \uC548\uB0B4\uD569\uB2C8\uB2E4.

## \uBBF8\uB9AC\uBCF4\uAE30\uC5D0\uC11C \uD655\uC778\uD560 \uAC83

- \uD56D\uBAA9\uBA85\xB7\uB178\uCD9C\uBA85\xB7\uC635\uC158\uBA85\xB7\uC18C\uAC1C\uC640 \uC785\uB825\uD55C \uAC00\uACA9\uC774 \uC77C\uAD00\uB418\uAC8C \uBCF4\uC774\uB294\uC9C0 \uD655\uC778\uD569\uB2C8\uB2E4.
- \uC5EC\uB7EC \uD68C \uC635\uC158\uC740 \uC218\uB7C9\uACFC \uCD1D\uC561\uC744 \uD568\uAED8 \uD45C\uC2DC\uD569\uB2C8\uB2E4. \uD328\uD0A4\uC9C0 \uAE08\uC561\uC744 \uB098\uB208 \uAC12\uC744 \uD55C \uBC88\uB9CC \uAD6C\uB9E4\uD560 \uB54C\uC758 \uAC00\uACA9\uCC98\uB7FC \uBCF4\uC5EC\uC8FC\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
- \uC900\uBE44 \uC0C1\uD0DC\uB294 \uC774 \uC2DC\uC548 \uC548\uC5D0\uC11C \uC785\uB825\uC815\uBCF4\uB97C \uC810\uAC80\uD55C \uACB0\uACFC\uC785\uB2C8\uB2E4. \uC2E4\uC81C \uC571 \uAC80\uC0C9\xB7\uAC00\uACA9\uBE44\uAD50 \uB178\uCD9C\uC774\uB098 \uC608\uC57D \uAC00\uB2A5 \uC5EC\uBD80\uB97C \uB73B\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.

## \uBB34\uB8CC \uC9C0\uC6D0 \uC870\uAC74

- \uAC00\uACA9\uC635\uC158\uC5D0\uC11C \uBB34\uB8CC\uB97C \uC120\uD0DD\uD558\uBA74 \uB300\uC0C1\xB7\uC0AC\uC5C5\uBA85\xB7\uC9C0\uC6D0 \uADFC\uAC70\xB7\uAE30\uAC04\xB7\uC9C0\uC5ED\xB7\uCD94\uAC00\uBE44\uC6A9\uC744 \uC785\uB825\uD569\uB2C8\uB2E4. \uCC98\uC74C\uBD80\uD130 \uC804\uCCB4 \uB300\uC0C1\uC774 \uC120\uD0DD\uB418\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
- \uC5B4\uB9B0\uC774\xB7\uC5B4\uB974\uC2E0\xB7\uC784\uC2E0\uBD80 \uB4F1\uC740 \uAC80\uC0C9\uC6A9 \uAD6C\uBD84\uC785\uB2C8\uB2E4. \uC0C1\uC138 \uC870\uAC74\uACFC \uAE30\uAC04\uC740 \uBCC4\uB3C4\uB85C \uC548\uB0B4\uD558\uBA70 \uAC1C\uC778 \uC790\uACA9\uC744 \uC790\uB3D9 \uD655\uC815\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
- \uC720\uB8CC \uC635\uC158\uACFC \uBB34\uB8CC \uC635\uC158\uC744 \uD568\uAED8 \uB458 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uC870\uAC74\uBD80 \uBB34\uB8CC\uB97C \uBAA8\uB4E0 \uD658\uC790\uC758 \uCD5C\uC800\uAC00 0\uC6D0\uC73C\uB85C \uC11E\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
- \uBB34\uB8CC \uC9C0\uC6D0 \uC608\uC2DC\uB294 \uC2E4\uC81C \uC9C0\uC6D0 \uAE30\uC900\uC774 \uC544\uB2D9\uB2C8\uB2E4. \uC678\uBD80 \uB178\uCD9C\uACFC \uCE74\uCE74\uC624 \uC9C0\uC6D0 \uBC29\uC2DD\uC740 \uBCC4\uB3C4 \uAC80\uD1A0\uAC00 \uD544\uC694\uD569\uB2C8\uB2E4.

## \uAC80\uC0C9 \uD65C\uC6A9 \uC815\uBCF4

- \uC18C\uAC1C\xB7\uC0AC\uC9C4 \uC544\uB798\uC5D0 \uAD00\uB828 \uC9C4\uB8CC\uACFC, \uAC80\uC0C9 \uD0A4\uC6CC\uB4DC, \uAD00\uB828 \uC99D\uC0C1\uC9C8\uD658\uC744 \uAC19\uC740 \uB2E8\uACC4\uB85C \uBC30\uCE58\uD569\uB2C8\uB2E4.
- \uCD94\uCC9C \uD0A4\uC6CC\uB4DC\uB294 \uAC19\uC740 \uC18C\uBD84\uB958 \uC6B0\uC120, \uC5C6\uC73C\uBA74 \uAD00\uB828 \uCE74\uD14C\uACE0\uB9AC\uC758 \uB2E4\uB978 \uBCD1\uC6D0 \uC0AC\uC6A9 \uC21C\uC73C\uB85C \uCD5C\uB300 6\uAC1C\uB97C \uBCF4\uC5EC\uC8FC\uB294 \uC548\uC785\uB2C8\uB2E4.
- \uC99D\uC0C1\uC9C8\uD658\uC740 \uC790\uB3D9\uC644\uC131\uC5D0\uC11C \uC120\uD0DD\uD558\uBA70 \uC77C\uBC18 \uAC80\uC0C9\uC5B4\uC640 \uBCC4\uB3C4 \uAC1C\uB150\uC73C\uB85C \uBCF4\uAD00\uD569\uB2C8\uB2E4. \uCD94\uCC9C\uC740 \uAC19\uC740 \uC18C\uBD84\uB958\uC758 \uAC80\uD1A0\uB41C \uC5F0\uAD00\uC5B4 \uC548\uC5D0\uC11C \uC81C\uACF5\uD569\uB2C8\uB2E4.
- \uC774\uBBF8 \uC120\uD0DD\uD55C \uAC12\uC740 \uC81C\uC678\uD569\uB2C8\uB2E4. \uCD94\uCC9C \uB370\uC774\uD130\uAC00 \uC5C6\uC73C\uBA74 \uCD94\uCC9C \uC601\uC5ED\uC744 \uC228\uAE30\uBA70 \uC785\uB825\xB7\uC800\uC7A5\uC740 \uACC4\uC18D\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.
- \uCD94\uCC9C\uC740 \uD654\uBA74 \uC124\uBA85\uC6A9 \uAC00\uC0C1 \uB370\uC774\uD130\uC785\uB2C8\uB2E4. \uC2E4\uC81C \uC778\uAE30 \uC21C\uC704\uB098 \uC758\uD559\uC801 \uC5F0\uAD00\uC131\uC744 \uC99D\uBA85\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.

## \uC804\uCCB4 \uD398\uC774\uC9C0 \uAC80\uD1A0

- \u2018\uBB34\uB8CC \uC9C0\uC6D0 \uC608\uC2DC \uCC44\uC6B0\uAE30\u2019\uB85C \uC804\uCCB4 \uD3FC\uC744 \uD3BC\uCCD0 \uBCFC \uC218 \uC788\uC2B5\uB2C8\uB2E4. \u2018\uD55C \uD398\uC774\uC9C0\uB85C \uBCF4\uAE30\u2019\uB294 \uC2DC\uC548 \uAC80\uD1A0\uC6A9\uC774\uBA70 \uC6B4\uC601 \uC81C\uD488 \uAE30\uB2A5\uC774 \uC544\uB2D9\uB2C8\uB2E4.
- \uBB34\uB8CC \uC785\uB825\xB7\uD0A4\uC6CC\uB4DC \uCD94\uAC00\xB7\uCD94\uCC9C \uC120\uD0DD\xB7\uC99D\uC0C1\uC9C8\uD658 \uC790\uB3D9\uC644\uC131\xB7\uB370\uC774\uD130 \uC5C6\uC74C \uB3D9\uC791\uC740 \uBE0C\uB77C\uC6B0\uC800 \uBA54\uBAA8\uB9AC\uC5D0\uC11C\uB9CC \uC2E4\uD589\uB429\uB2C8\uB2E4.

## \uC774\uBC88 \uC2DC\uC548\uC5D0\uC11C \uBC14\uAFB8\uC9C0 \uC54A\uB294 \uAC83

- \uCE74\uCE74\uC624 \uB178\uCD9C\xB7\uC608\uC57D \uC815\uCC45, EMR \uCC28\uD2B8 \uC5F0\uB3D9, \uBB34\uB8CC\uC9C0\uC6D0 \uC790\uACA9 \uD310\uC815\uC740 \uBCC0\uACBD\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.
- \uC571\uC758 \uC0C8\uB85C\uC6B4 \uAC80\uC0C9\xB7\uAC00\uACA9\uBE44\uAD50 \uD654\uBA74\uACFC \uC77C\uBC18\uC9C4\uB8CC \uC608\uC57D \uD655\uB300\uB294 \uC774\uBC88 \uD654\uBA74 \uBC94\uC704\uAC00 \uC544\uB2D9\uB2C8\uB2E4.
- \uAC1C\uC778\uC815\uBCF4\uB97C \uC785\uB825\uD558\uC9C0 \uB9C8\uC138\uC694. \uC11C\uBC84 \uD1B5\uC2E0\xB7\uC2E4\uC81C \uC800\uC7A5\xB7\uC608\uC57D \uC0DD\uC131\uC740 \uD558\uC9C0 \uC54A\uB294 \uD654\uBA74 \uAC80\uD1A0\uC6A9\uC785\uB2C8\uB2E4.
